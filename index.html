    data.forEach((d, i) => { const p = barPath(x(i), y(0), bw, y(Math.max(0, d.v))); if (p) s += `<path d="${p}" class="ch-bar${d.dim ? ' is-dim' : ''}" data-i="${i}"/>`; });
    if (o.avg) {
      const pts = o.avg.map((a, i) => a == null ? null : `${(x(i) + bw / 2).toFixed(1)},${y(a).toFixed(1)}`).filter(Boolean);
      if (pts.length > 1) s += `<polyline points="${pts.join(' ')}" class="ch-line ch-line--avg"/>`;
    }
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" class="ch-base"/>`;
    // eje X: días
    const every = Math.max(1, Math.ceil(n / Math.max(4, Math.floor(iw / (44 * k)))));
    data.forEach((d, i) => { if (i % every === 0 || (i === n - 1 && (n - 1) % every >= every * 0.6)) s += `<text x="${x(i) + bw / 2}" y="${H - 8 * k}" class="ch-ax" text-anchor="middle">${U.esc(d.xl)}</text>`; });
    s += `<line class="ch-cross" x1="0" x2="0" y1="${mt}" y2="${mt + ih}" visibility="hidden"/>`;
    data.forEach((d, i) => { s += `<rect x="${ml + i * band}" y="${mt}" width="${band}" height="${ih}" fill="transparent" class="ch-hit" data-i="${i}" tabindex="-1"/>`; });
    s += '</svg>';
    el.innerHTML = s;
    const svg = el.firstChild, cross = svg.querySelector('.ch-cross');
    const showI = (i, ev) => {
      const d = data[i]; if (!d) return;
      const cx = x(i) + bw / 2; cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      svg.querySelectorAll('.ch-bar.is-hot').forEach(b => b.classList.remove('is-hot'));
      const b = svg.querySelector(`.ch-bar[data-i="${i}"]`); if (b) b.classList.add('is-hot');
      const r = svg.getBoundingClientRect();
      CH.tip.show(o.tooltip(d, i), ev ? ev.clientX : r.left + cx, ev ? ev.clientY : r.top + y(d.v));
    };
    svg.addEventListener('pointermove', ev => { const t = ev.target.closest('.ch-hit'); if (t) showI(+t.dataset.i, ev); });
    svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); svg.querySelectorAll('.is-hot').forEach(b => b.classList.remove('is-hot')); CH.tip.hide(); });
    el.tabIndex = 0;
    el.onkeydown = ev => {
      if (!['ArrowLeft', 'ArrowRight'].includes(ev.key)) return;
      el._i = U.clamp((el._i ?? n - 1) + (ev.key === 'ArrowRight' ? 1 : -1), 0, n - 1); showI(el._i); ev.preventDefault();
    };
    el.onblur = () => { CH.tip.hide(); cross.setAttribute('visibility', 'hidden'); };
  });

  // ============================================================
  //  Línea acumulada con proyección (punteada = proyección)
  // ============================================================
  CH.cumulative = (el, o) => CH.mount(el, (W) => {
    const k = CH.k();
    const H = Math.round((o.height || 220) * k), ml = 56 * k, mr = 16, mt = 16 * k, mb = 28 * k;
    const iw = W - ml - mr, ih = H - mt - mb;
    const pts = o.points; const n = o.totalDays || pts.length;
    const maxV = Math.max(1, ...pts.map(p => p.v), o.proj ? o.proj.v : 0, o.meta || 0);
    const sc = CH.niceTicks(0, maxV, 4);
    const x = i => ml + (n <= 1 ? 0 : i / (n - 1) * iw);
    const y = v => mt + ih - (v - sc.lo) / (sc.hi - sc.lo) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="ch" role="img" aria-label="${U.esc(o.aria || '')}">`;
    for (const t of sc.ticks) s += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" class="ch-grid"/><text x="${ml - 8}" y="${y(t) + 4 * k}" class="ch-ax" text-anchor="end">${U.esc(o.fmtAxis(t))}</text>`;
    const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    s += `<polygon points="${x(0)},${y(0)} ${line} ${x(pts.length - 1)},${y(0)}" class="ch-area"/>`;
    s += `<polyline points="${line}" class="ch-line"/>`;
    const last = pts[pts.length - 1], li = pts.length - 1;
    if (o.proj && n > pts.length) {
      s += `<line x1="${x(li)}" y1="${y(last.v)}" x2="${x(n - 1)}" y2="${y(o.proj.v)}" class="ch-line ch-line--proj"/>`;
      s += `<circle cx="${x(n - 1)}" cy="${y(o.proj.v)}" r="4" class="ch-dot ch-dot--hollow"/>`;
      s += `<text x="${Math.min(x(n - 1), W - mr - 4)}" y="${y(o.proj.v) - 10 * k}" class="ch-lab" text-anchor="end">${U.esc(o.proj.label)}</text>`;
    }
    s += `<circle cx="${x(li)}" cy="${y(last.v)}" r="4.5" class="ch-dot"/>`;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" class="ch-base"/>`;
    const every = Math.max(1, Math.ceil(n / Math.max(4, Math.floor(iw / (48 * k)))));
    for (let i = 0; i < n; i += every) s += `<text x="${x(i)}" y="${H - 8 * k}" class="ch-ax" text-anchor="middle">${U.esc(o.xLabel(i))}</text>`;
    s += `<line class="ch-cross" x1="0" x2="0" y1="${mt}" y2="${mt + ih}" visibility="hidden"/><rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent" class="ch-hit"/></svg>`;
    el.innerHTML = s;
    const svg = el.firstChild, cross = svg.querySelector('.ch-cross');
    svg.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width);
      const i = U.clamp(Math.round((px - ml) / iw * (n - 1)), 0, pts.length - 1);
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
      CH.tip.show(o.tooltip(pts[i], i), ev.clientX, ev.clientY);
    });
    svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); CH.tip.hide(); });
  });

  // ============================================================
  //  Dispersión: demanda (x) vs margen (y), tamaño = ganancia
  // ============================================================
  CH.scatter = (el, o) => CH.mount(el, (W) => {
    const k = CH.k();
    const H = Math.round((o.height || 320) * k), ml = 48 * k, mr = 18, mt = 16 * k, mb = 40 * k;
    const iw = W - ml - mr, ih = H - mt - mb;
    const P = o.points;
    const maxX = Math.max(1, ...P.map(p => p.x));
    const ys = P.map(p => p.y);
    const minY = Math.min(o.yRef - 0.06, ...ys), maxY = Math.max(o.yRef + 0.06, ...ys);
    const scX = CH.niceTicks(0, maxX, 4), scY = CH.niceTicks(Math.max(-0.5, Math.floor(minY * 20) / 20), Math.ceil(maxY * 20) / 20, 4);
    const x = v => ml + (v - scX.lo) / (scX.hi - scX.lo) * iw;
    const y = v => mt + ih - (v - scY.lo) / (scY.hi - scY.lo) * ih;
    const maxR = Math.max(1, ...P.map(p => Math.abs(p.r || 0)));
    const rad = p => 5 + Math.sqrt(Math.abs(p.r || 0) / maxR) * 15;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="ch" role="img" aria-label="${U.esc(o.aria || '')}">`;
    // cuadrantes
    const yr = y(o.yRef), xr = x(o.xRef);
    s += `<rect x="${xr}" y="${mt}" width="${ml + iw - xr}" height="${yr - mt}" class="ch-quad ch-quad--good"/>`;
    for (const t of scY.ticks) s += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" class="ch-grid"/><text x="${ml - 8}" y="${y(t) + 4 * k}" class="ch-ax" text-anchor="end">${U.esc(U.fmtPct(t, 0))}</text>`;
    for (const t of scX.ticks) s += `<text x="${x(t)}" y="${mt + ih + 18 * k}" class="ch-ax" text-anchor="middle">${U.fmtInt(t)}</text>`;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${yr}" y2="${yr}" class="ch-ref"/>`;
    s += `<line x1="${xr}" x2="${xr}" y1="${mt}" y2="${mt + ih}" class="ch-ref"/>`;
    s += `<text x="${ml + iw / 2}" y="${H - 4 * k}" class="ch-ax" text-anchor="middle">unidades vendidas</text>`;
    const orden = P.map((p, i) => ({ p, i })).sort((a, b) => rad(b.p) - rad(a.p));
    // color: el mismo semáforo de la tabla (p.tone) o, si no viene, abajo/arriba del objetivo
    for (const { p, i } of orden) s += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="${rad(p)}" class="ch-bub${p.hl ? ' is-hl' : ''}${p.tone ? ' tone-' + p.tone : (p.y < o.yRef ? ' is-low' : '')}" data-i="${i}"/>`;
    // etiquetas: las más grandes, sin pisarse entre ellas ni con otros círculos
    const circles = orden.map(({ p }) => ({ cx: x(p.x), cy: y(p.y), r: rad(p) }));
    const hitsCircle = (b, self) => circles.some((c, j) => j !== self && c.cx + c.r > b.x1 && c.cx - c.r < b.x2 && c.cy + c.r > b.y1 && c.cy - c.r < b.y2);
    const placed = [];
    const hitsBox = b => placed.some(q => !(b.x2 < q.x1 || b.x1 > q.x2 || b.y2 < q.y1 || b.y1 > q.y2));
    const dentro = b => b.x1 >= ml && b.x2 <= W - mr && b.y1 >= mt && b.y2 <= mt + ih;
    // etiquetas fijas (línea de objetivo y cuadrante bueno): se ubican donde no tapen burbujas
    const fija = (txt, cands) => {
      const w = txt.length * 6.9 * k, h = 14 * k; // 6,9 px por letra: Figtree de 12 px en negrita (2.6.0 «E»), por el factor de tamaño
      for (const cd of cands(w, h)) {
        const b = { x1: cd.x1, x2: cd.x1 + w, y1: cd.y1, y2: cd.y1 + h };
        if (!dentro(b) || hitsBox(b) || hitsCircle(b, -1)) continue;
        placed.push(b);
        s += `<text x="${b.x1.toFixed(1)}" y="${(b.y1 + 10.5 * k).toFixed(1)}" class="ch-lab ch-lab--muted">${U.esc(txt)}</text>`;
        return true;
      }
      return false;
    };
    const objTxt = `objetivo ${U.fmtPct(o.yRef, 0)}`;
    if (!fija(objTxt, (w, h) => [
      { x1: ml + 6, y1: yr - h - 3 }, { x1: ml + 6, y1: yr + 3 },
      { x1: ml + iw / 2 - w / 2, y1: yr - h - 3 }, { x1: ml + iw / 2 - w / 2, y1: yr + 3 },
      { x1: W - mr - 6 - w, y1: yr - h - 3 }, { x1: W - mr - 6 - w, y1: yr + 3 },
    ])) {
      // sin lugar libre dentro del gráfico: va pegada al eje, como una marca más
      s += `<text x="${ml - 8}" y="${yr - 6 * k}" class="ch-lab ch-lab--muted" text-anchor="end">obj.</text>`;
    }
    fija('mucha venta y buen margen', (w, h) => [
      { x1: W - mr - 4 - w, y1: mt + 3 }, { x1: Math.max(xr + 6, ml), y1: mt + 3 }, { x1: W - mr - 4 - w, y1: yr - h - 22 },
    ]);
    // ojo: el índice se llama j; k es el factor del control «Tamaño» (si se llamaran igual, la primera etiqueta medía 0 y pisaba todo)
    orden.slice(0, o.maxLabels || 8).forEach(({ p }, j) => {
      const c = circles[j];
      const txt = U.esc(p.short || p.label);
      const w = (p.short || p.label).length * 6.9 * k, h = 14 * k;
      const cands = [
        { x1: c.cx + c.r + 4, y1: c.cy - h / 2, anchor: 'start' },
        { x1: c.cx - c.r - 4 - w, y1: c.cy - h / 2, anchor: 'end' },
        { x1: c.cx - w / 2, y1: c.cy - c.r - h - 3, anchor: 'middle' },
        { x1: c.cx - w / 2, y1: c.cy + c.r + 3, anchor: 'middle' },
        // si no entra en ninguno (por ejemplo, la burbuja más grande pegada al borde), arriba o abajo corrida hacia adentro
        { x1: c.cx + c.r * 0.7 - w, y1: c.cy - c.r - h - 3, anchor: 'end' },
        { x1: c.cx - c.r * 0.7, y1: c.cy - c.r - h - 3, anchor: 'start' },
        { x1: c.cx + c.r * 0.7 - w, y1: c.cy + c.r + 3, anchor: 'end' },
        { x1: c.cx - c.r * 0.7, y1: c.cy + c.r + 3, anchor: 'start' },
      ];
      for (const cd of cands) {
        const b = { x1: cd.x1, x2: cd.x1 + w, y1: cd.y1, y2: cd.y1 + h };
        if (b.x1 < ml || b.x2 > W - mr || b.y1 < mt || b.y2 > mt + ih) continue;
        if (hitsBox(b) || hitsCircle(b, j)) continue;
        placed.push(b);
        const tx = cd.anchor === 'start' ? b.x1 : cd.anchor === 'end' ? b.x2 : (b.x1 + b.x2) / 2;
        s += `<text x="${tx.toFixed(1)}" y="${(b.y1 + 10.5 * k).toFixed(1)}" class="ch-lab" text-anchor="${cd.anchor}">${txt}</text>`;
        break;
      }
    });
    for (const { p, i } of orden) s += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="${Math.max(12, rad(p) + 3)}" fill="transparent" class="ch-hit" data-i="${i}"/>`;
    s += '</svg>';
    el.innerHTML = s;
    const svg = el.firstChild;
    svg.addEventListener('pointermove', ev => { const t = ev.target.closest('.ch-hit'); if (!t) { CH.tip.hide(); return; } CH.tip.show(o.tooltip(P[+t.dataset.i]), ev.clientX, ev.clientY); });
    svg.addEventListener('pointerleave', () => CH.tip.hide());
    svg.addEventListener('click', ev => { const t = ev.target.closest('.ch-hit'); if (t && o.onClick) o.onClick(P[+t.dataset.i]); });
  });

  // ============================================================
  //  Puntos en el tiempo: el precio de cada venta (detalle de producto)
  // ============================================================
  CH.timeDots = (el, o) => CH.mount(el, (W) => {
    const k = CH.k();
    const H = Math.round((o.height || 190) * k), ml = 56 * k, mr = 14, mt = 16 * k, mb = 26 * k;
    const iw = Math.max(10, W - ml - mr), ih = H - mt - mb;
    const P = o.points || [];
    const t0 = +o.desde, t1 = Math.max(+o.hasta, t0 + 86400000);
    const refs = (o.refs || []).filter(r => r.y != null && isFinite(r.y));
    const ys = P.map(p => p.y).concat(refs.map(r => r.y));
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = (hi - lo) * 0.15 || hi * 0.05 || 1;
    const sc = CH.niceTicks(Math.max(0, lo - pad), hi + pad, 4);
    const x = t => ml + (t - t0) / (t1 - t0) * iw;
    const y = v => mt + ih - (v - sc.lo) / (sc.hi - sc.lo) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="ch" role="img" aria-label="${U.esc(o.aria || '')}">`;
    for (const t of sc.ticks) s += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" class="ch-grid"/><text x="${ml - 8}" y="${y(t) + 4 * k}" class="ch-ax" text-anchor="end">${U.esc(o.fmtAxis(t))}</text>`;
    for (const r of refs) s += `<line x1="${ml}" x2="${W - mr}" y1="${y(r.y)}" y2="${y(r.y)}" class="ch-ref"/><text x="${W - mr - 2}" y="${y(r.y) - 5 * k}" class="ch-lab ch-lab--muted" text-anchor="end">${U.esc(r.label)}</text>`;
    const dias = Math.round((t1 - t0) / 86400000);
    const paso = Math.max(1, Math.ceil(dias / Math.max(3, Math.floor(iw / (72 * k)))));
    for (let d = 0; d < dias; d += paso) {
      const f = new Date(t0 + d * 86400000), px = x(+f);
      s += `<text x="${px}" y="${H - 8 * k}" class="ch-ax" text-anchor="${px < ml + 16 ? 'start' : px > W - mr - 24 ? 'end' : 'middle'}">${U.esc(U.fmtDate(f))}</text>`;
    }
    s += `<line x1="${ml}" x2="${W - mr}" y1="${mt + ih}" y2="${mt + ih}" class="ch-base"/>`;
    P.forEach((p, i) => { s += `<circle cx="${x(+p.t).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="${p.u > 1 ? 6 : 4.5}" class="ch-dotp${p.tone ? ' tone-' + p.tone : ''}" data-i="${i}"/>`; });
    P.forEach((p, i) => { s += `<circle cx="${x(+p.t).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="11" fill="transparent" class="ch-hit" data-i="${i}"/>`; });
    s += '</svg>';
    el.innerHTML = s;
    const svg = el.firstChild;
    svg.addEventListener('pointermove', ev => { const t = ev.target.closest('.ch-hit'); if (!t) { CH.tip.hide(); return; } CH.tip.show(o.tooltip(P[+t.dataset.i]), ev.clientX, ev.clientY); });
    svg.addEventListener('pointerleave', () => CH.tip.hide());
  });

  // ============================================================
  //  HTML: barras horizontales rankeadas
  // ============================================================
  CH.hbars = (rows, o = {}) => {
    const max = o.max || Math.max(1, ...rows.map(r => Math.abs(r.value)));
    return `<div class="hb" role="list">${rows.map(r => `
      <div class="hb-row${r.action ? ' is-link' : ''}" role="listitem" ${r.action ? `data-action="${U.esc(r.action)}" data-key="${U.esc(r.key || '')}" tabindex="0"` : ''} title="${U.esc(r.title || r.label)}">
        <div class="hb-label">${r.dot ? `<span class="dot" style="background:${r.dot}"></span>` : ''}<span class="hb-name">${U.esc(r.label)}</span>${r.sub ? `<span class="hb-sub">${U.esc(r.sub)}</span>` : ''}</div>
        <div class="hb-track"><span class="hb-bar${r.tone ? ' tone-' + r.tone : ''}" style="width:${Math.max(0.8, Math.abs(r.value) / max * 100).toFixed(2)}%"></span></div>
        <div class="hb-val">${r.valueLabel != null ? U.esc(r.valueLabel) : U.esc(String(r.value))}</div>
      </div>`).join('')}</div>`;
  };

  // ============================================================
  //  HTML: cascada horizontal (de la facturación a la ganancia)
  // ============================================================
  CH.waterfall = (rows, fmt) => {
    let acc = 0; const segs = [];
    let lo = 0, hi = 0;
    for (const r of rows) {
      if (r.kind === 'start' || r.kind === 'subtotal' || r.kind === 'end') { segs.push({ r, a: 0, b: r.value }); acc = r.value; }
      else { segs.push({ r, a: acc, b: acc + r.value }); acc += r.value; }
      lo = Math.min(lo, segs[segs.length - 1].a, segs[segs.length - 1].b); hi = Math.max(hi, segs[segs.length - 1].a, segs[segs.length - 1].b);
    }
    const span = (hi - lo) || 1;
    const pos = v => (v - lo) / span * 100;
    return `<div class="wf" role="table" aria-label="Cascada de la plata">${segs.map(({ r, a, b }) => {
      const left = pos(Math.min(a, b)), width = Math.max(0.5, Math.abs(pos(b) - pos(a)));
      const tone = r.kind === 'delta' ? (r.value < 0 ? 'neg' : 'pos') : (r.kind === 'end' ? 'end' : 'tot');
      return `<div class="wf-row wf-${r.kind}" role="row" ${r.hint ? `title="${U.esc(r.hint)}"` : ''}>
        <div class="wf-label" role="cell">${U.esc(r.label)}${r.hint ? ' <span class="info-i" aria-hidden="true">i</span>' : ''}</div>
        <div class="wf-track" role="cell" aria-hidden="true"><span class="wf-zero" style="left:${pos(0)}%"></span><span class="wf-bar tone-${tone}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%"></span></div>
        <div class="wf-val ${r.kind === 'delta' ? (r.value < 0 ? 'is-neg' : 'is-pos') : ''}" role="cell">${r.kind === 'delta' ? U.fmtMoneySigned(r.value) : fmt(r.value)}</div>
      </div>`;
    }).join('')}</div>`;
  };

  // ============================================================
  //  HTML: barra segmentada alta ("de cada $100")
  // ============================================================
  CH.segbar = (parts, o = {}) => {
    const tot = U.sum(parts, p => Math.max(0, p.value)) || 1;
    return `<div class="seg ${o.thin ? 'seg--thin' : ''}" role="img" aria-label="${U.esc(o.aria || parts.map(p => p.label + ' ' + U.fmtPct(p.value / tot, 0)).join(', '))}">${parts.filter(p => p.value > 0).map(p => {
      const sh = p.value / tot;
      return `<span class="seg-part" style="flex-grow:${(sh * 1000).toFixed(0)};background:${p.color}" title="${U.esc(p.label)}: ${U.fmtPct(sh, 0)}" tabindex="0">${!o.thin && sh > 0.07 ? `<b style="color:${p.ink || '#fff'}">${U.fmtPct(sh, 0)}</b>` : ''}</span>`;
    }).join('')}</div>`;
  };

  // ============================================================
  //  HTML: mapa de calor (día x franja horaria)
  // ============================================================
  CH.heatmap = (matrix, o) => {
    const max = Math.max(1, ...matrix.flat());
    const cols = o.cols, rows = o.rows;
    let h = `<div class="hm" style="--cols:${cols.length}" role="table" aria-label="${U.esc(o.aria || '')}"><div class="hm-row hm-head" role="row"><span role="columnheader"><span class="sr">Día</span></span>${cols.map(c => `<span class="hm-col" role="columnheader">${U.esc(c)}</span>`).join('')}</div>`;
    matrix.forEach((r, i) => {
      h += `<div class="hm-row" role="row"><span class="hm-rl" role="rowheader">${U.esc(rows[i])}</span>${r.map((v, j) => {

        ? `${U.plural(c.ventas, 'venta', 'ventas')}${c.desde ? ` · ${U.fmtDate(c.desde)} al ${U.fmtDate(c.hasta)}` : ''}${c.mp.length ? ' · con cobros MP' : ''}`
        : c.mp.length ? 'Tiene cobros de MP; falta el Excel de ventas' : 'Sin cargar · tocá para elegir su Excel';
      const tags = (c.compartida.length ? `<span class="tag" title="También la usa ${esc(RV.app.listaY(c.compartida))}">compartida</span>` : '')
        + (!c.enPerfil ? '<span class="tag">de otro perfil</span>' : '') + (c.extra ? '<span class="tag">agregada</span>' : '');
      const tip = c.tieneVentas ? (c.incluida ? 'Incluida: tocá para sacarla del reporte' : 'Afuera: tocá para sumarla al reporte') : 'Elegir el Excel de esta cuenta';
      return `<div class="acct${c.incluida ? ' is-on' : ''}${c.tieneVentas ? '' : ' is-empty'}">
        <button type="button" class="acct-btn" data-action="toggle-cuenta" data-cuenta="${esc(c.cuenta)}" ${c.tieneVentas ? `aria-pressed="${c.incluida}"` : ''} title="${esc(tip + (c.col ? ` · gastos grupales: columnas ${c.col}` : ''))}">
          <span class="acct-box" aria-hidden="true">${c.tieneVentas ? icon('i-check') : icon('i-up')}</span>
          <span class="acct-txt"><span class="acct-n">${esc(c.cuenta)}${tags}</span><span class="acct-s">${esc(sub)}</span></span>
        </button>
        ${c.extra && !c.ml.length && !c.mp.length ? `<button type="button" class="acct-del" data-action="borrar-cuenta" data-cuenta="${esc(c.cuenta)}" aria-label="Quitar la cuenta ${esc(c.cuenta)}" title="Quitar esta cuenta">×</button>` : ''}
      </div>`;
    };
    const puede = perfil.cuentas.length < C.MAX_CUENTAS;
    const extra = st.agregando
      ? `<form class="acct-form" data-form="cuenta" autocomplete="off">
          <label class="sr" for="nueva-cuenta">Nombre de la cuenta nueva</label>
          <input id="nueva-cuenta" maxlength="24" placeholder="Nombre de la cuenta (como figura en Meli)">
          <button class="btn btn-sm btn-primary" type="submit">Agregar</button>
          <button class="btn btn-sm btn-ghost" type="button" data-action="cancelar-cuenta">Cancelar</button>
          <span class="acct-err small" role="alert"></span>
          <span class="small muted acct-note">Queda guardada en este navegador para ${esc(perfil.nombre)}.</span>
        </form>`
      : puede ? `<button type="button" class="acct-add" data-action="agregar-cuenta">+ Agregar cuenta</button>` : '';
    const nota = conVentas.length ? `${incluidas.length} de ${conVentas.length} en el reporte` : U.plural(perfil.cuentas.length, 'cuenta', 'cuentas');
    return `<section class="paso"><p class="paso-num" aria-hidden="true">4</p><div class="paso-c"><h2>Cuentas del reporte</h2><p class="step-note">${esc(nota)}</p>
      <div class="accts" role="group" aria-label="Cuentas de ${esc(perfil.nombre)}">${estado.map(card).join('')}${extra}</div>
      ${conVentas.length > 1 ? '<p class="small muted acct-help">Tocá una cuenta para sacarla del reporte o volver a sumarla. Los gastos grupales siguen a las cuentas que quedan.</p>' : ''}</div></section>`;
  };

  // Panel «Conectar en vivo» (web): instalación del Apps Script de solo lectura, una sola vez
  // (o su actualización, si ya existe y la última lectura falló)
  const arregloVivo = (ve) => {
    const leer = `<div class="share-actions"><button class="btn btn-primary" type="button" data-action="recargar-planilla">${icon('i-refresh')}Volver a leer</button></div>`;
    if (['viejo', 'servicio', 'alcance'].includes(ve.code)) return `<p>Se arregla en unos 2 minutos, actualizando el código en script.google.com (la URL y el link del equipo no cambian).</p>
      <div class="share-actions"><button class="btn btn-primary" type="button" data-action="vivo-codigo">Ver cómo actualizarla</button></div>`;
    if (ve.code === 'permiso') return `<p><b>Cómo se arregla</b> (elegí una):</p>
      <ol class="pasos-cortos">
        <li><b>Compartir ANALISIS con esa cuenta</b>: abrí ANALISIS DE PRODUCTOS con una cuenta que la edite → <b>Compartir</b> → escribí el mail de la cuenta con la que creaste la conexión (la que aparecía en la pantalla de permisos de Google) → <b>Lector</b> → <b>Enviar</b>. Compartir no cambia nada del contenido de la planilla.</li>
        <li><b>O crear la conexión desde una cuenta que ya abra ANALISIS</b>: tocá «Ver el código y los pasos» y seguí «Crearla de cero».</li>
      </ol>${leer}`;
    if (ve.code === 'cuota') return `<p>Esperá unos minutos y volvé a leer.</p>${leer}`;
    return `<p>Para ver qué pasa: en <a href="https://script.google.com/home" target="_blank" rel="noopener noreferrer">script.google.com</a> abrí el proyecto, arriba elegí la función <b>probar</b> y tocá <b>Ejecutar</b> (Run). Abajo, en el registro, dice si pudo leer y qué hacer.</p>${leer}`;
  };
  R_.conexion = (st) => {
    const cx = st.conexion, ve = RV.app.vivoFallo && RV.app.vivoFallo() ? st.vivoError : null;
    const h = `<div class="drawer-h"><div><div class="small muted">ANALISIS DE PRODUCTOS · solo lectura</div><h3 id="drawer-title">${cx ? 'Conexión en vivo' : 'Conectar en vivo'}</h3></div>
      <button class="icon-btn" type="button" data-action="cerrar-drawer" aria-label="Cerrar">${icon('i-x')}</button></div>`;
    if (cx && !st.verCodigo) {
      const m = st.model;
      const estado = ve
        ? `<div class="err-box" role="alert"><b>La última lectura falló.</b> ${esc(ve.msg)}${ve.detalle ? `<details class="small" style="margin-top:.375rem"><summary>Lo que dice Google</summary><span class="mono">${esc(ve.detalle)}</span></details>` : ''}</div>${arregloVivo(ve)}`
        : `<div class="ok-box">${icon('i-check')}<span>Este navegador lee ANALISIS DE PRODUCTOS en vivo${m && m.origen === 'vivo' ? ` (última lectura ${esc(U.relTime(m.leidaEn || m.fetchedAt))})` : ''}.</span></div>`;
      return h + `<div class="drawer-b" tabindex="0" data-panel="conexion">
        ${estado}
        <div><div class="card-h" style="margin-bottom:.375rem"><h3 style="font-size:.875rem">Link para el equipo</h3></div>
          <p class="small muted">Mandalo por WhatsApp a quien tenga que usar la página. Al abrirlo, su navegador queda conectado (no necesita cuenta de Google ni subir nada). Es privado: el que tenga el link puede leer la planilla.${ve ? ' Cuando arregles la conexión, el mismo link sigue sirviendo.' : ''}</p>
          <input class="field mono" id="link-equipo" readonly value="${esc(RV.app.linkInvitacion())}" aria-label="Link para el equipo">
          <div class="share-actions"><button class="btn${ve ? '' : ' btn-primary'}" type="button" data-action="copiar" data-que="link">${icon('i-copy')}Copiar link</button>
          <a class="btn" href="https://wa.me/?text=${encodeURIComponent('Link del reporte de ventas (conectado a ANALISIS): ' + RV.app.linkInvitacion())}" target="_blank" rel="noopener noreferrer">Mandar por WhatsApp</a></div></div>
        <div class="rows">
          <div><span>Volver a leer la planilla ahora</span><span class="r-v"><button class="btn btn-sm" type="button" data-action="recargar-planilla">${icon('i-refresh')}Leer</button></span></div>
          ${m && m.conexionVersion ? `<div><span>Programa de conexión</span><span class="r-v">versión ${esc(String(m.conexionVersion))}</span></div>` : ''}
          <div><span>Ver el código y los pasos otra vez</span><span class="r-v"><button class="btn btn-sm" type="button" data-action="vivo-codigo">Ver</button></span></div>
          <div><span>Desconectar este navegador</span><span class="r-v"><button class="btn btn-sm btn-ghost" type="button" data-action="vivo-desconectar">Desconectar</button></span></div>
        </div>
        <p class="small muted">Para cortar el acceso de todos: en script.google.com cambiá la clave del código, creá una versión nueva y mandá el link nuevo.</p>
      </div>`;
    }
    const clave = cx ? cx.clave : st.claveEnCurso;
    const paso = (n, html) => `<li><span class="paso-n">${n}</span><div>${html}</div></li>`;
    const codigo = `<div class="share-actions"><button class="btn btn-sm btn-primary" type="button" data-action="copiar" data-que="codigo">${icon('i-copy')}Copiar código</button></div>
          <details class="code-det"><summary>Ver el código</summary><pre class="code">${esc(RV.app.codigoConexion(clave))}</pre></details>`;
    const manifiesto = `<div class="share-actions"><button class="btn btn-sm" type="button" data-action="copiar" data-que="manifest">${icon('i-copy')}Copiar appsscript.json</button></div>
          <details class="code-det"><summary>Ver appsscript.json</summary><pre class="code">${esc(RV.CODIGO_CONEXION ? RV.CODIGO_CONEXION.manifest : '')}</pre></details>`;
    const verManifiesto = 'Si no aparece en la lista de archivos: engranaje <b>Configuración del proyecto</b> (Project Settings) → marcá «Mostrar el archivo de manifiesto "appsscript.json" en el editor» y volvé al editor <b>(&lt;&gt;)</b>.';
    const probar = 'Arriba, al lado de «Depurar» (Debug), elegí la función <b>probar</b> y tocá <b>Ejecutar</b> (Run). Abajo, en el <b>registro de ejecución</b>, tiene que decir «OK: la conexión puede leer…». Si dice «NO PUDO LEER», ahí mismo dice qué hacer.';
    const permiso = 'Si Google pide permiso: elegí la cuenta; si aparece «Google no verificó esta app» (Google hasn’t verified this app), tocá <b>Configuración avanzada</b> (Advanced) → <b>Ir a Reporte de Ventas – lectura (no seguro)</b> → <b>Permitir</b> (Allow). Tiene que pedir <b>solo</b> «Ver todas tus hojas de cálculo» (See all your Google Sheets spreadsheets); si pide editar, el appsscript.json no es el de acá.';
    const form = (boton) => `<form class="vivo-form" data-form="vivo" autocomplete="off">
            <label class="sr" for="vivo-url">URL de la aplicación web</label>
            <input class="field mono" id="vivo-url" placeholder="https://script.google.com/macros/s/…/exec" value="${cx ? esc(cx.url) : ''}" required>
            <button class="btn btn-primary" type="submit">${boton}</button>
            <span class="vivo-msg small" role="status"></span>
          </form>`;
    if (cx) {
      // Ya existe: actualizar el mismo proyecto (misma URL, misma clave, mismo link del equipo)
      return h + `<div class="drawer-b" tabindex="0" data-panel="conexion">
      <p><b>Actualizar la conexión</b> (2 minutos). Se hace en el mismo proyecto de Google: la URL, la clave y el link del equipo quedan iguales.</p>
      <ol class="pasos">
        ${paso(1, 'Entrá a <a href="https://script.google.com/home" target="_blank" rel="noopener noreferrer">script.google.com</a> con la cuenta con la que creaste la conexión y abrí el proyecto <b>«Reporte de Ventas – lectura»</b>.')}
        ${paso(2, `En <span class="mono">Código.gs</span>: borrá todo y pegá el código nuevo (ya trae la misma clave):${codigo}`)}
        ${paso(3, `En <span class="mono">appsscript.json</span>: borrá todo y pegá este (sigue siendo <b>solo lectura</b> y activa «Google Sheets API»). ${verManifiesto}${manifiesto}`)}
        ${paso(4, `Guardá (ícono del disquete). ${probar} ${permiso}`)}
        ${paso(5, '<b>Implementar</b> (Deploy) → <b>Gestionar implementaciones</b> (Manage deployments) → tocá el lápiz <b>Editar</b> (Edit) → en «Versión» elegí <b>Nueva versión</b> (New version) → <b>Implementar</b> (Deploy). Guardar el código solo no alcanza: lo que usa la página es la versión implementada.')}
        ${paso(6, `Volvé acá y probá:${form('Probar de nuevo')}`)}
      </ol>
      <details class="code-det"><summary>Crearla de cero (por ejemplo, desde otra cuenta)</summary>
        <p class="small">Hacé lo mismo en un <b>proyecto nuevo</b> (<a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener noreferrer">crear proyecto</a>) con una cuenta que pueda abrir ANALISIS, y en el paso 5 usá <b>Implementar → Nueva implementación</b>: tipo <b>Aplicación web</b>, Ejecutar como: <b>Yo</b>, Quién tiene acceso: <b>Cualquier usuario</b>. Después pegá la URL nueva en el paso 6 y mandá el link del equipo otra vez.</p>
      </details>
      <p class="small muted">Si algo falla, también podés seguir soltando ANALISIS en .xlsx: la página guarda la última copia.</p>
    </div>`;
    }
    return h + `<div class="drawer-b" tabindex="0" data-panel="conexion">
      <p>Se hace <b>una sola vez</b> (5 minutos) desde una cuenta de Google que pueda abrir ANALISIS DE PRODUCTOS. Después la página la lee sola cada vez que se abre, y el resto del equipo solo abre un link.</p>
      <p class="small muted">Es un pequeño programa de Google (Apps Script) que queda en <b>tu</b> Google Drive. Tiene permiso solo para <b>ver</b> hojas de cálculo: no puede modificar, borrar ni compartir nada.</p>
      <ol class="pasos">
        ${paso(1, 'Entrá a <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener noreferrer">script.google.com</a> con una cuenta que pueda abrir ANALISIS DE PRODUCTOS (la cuenta activa se ve arriba a la derecha) y creá un <b>proyecto nuevo</b>. Ponele de nombre «Reporte de Ventas – lectura».')}
        ${paso(2, `Borrá lo que viene escrito en <span class="mono">Código.gs</span> y pegá este código (ya tiene la clave de tu conexión):${codigo}`)}
        ${paso(3, `Abrí <span class="mono">appsscript.json</span> y reemplazá todo por esto (le da permiso <b>solo de lectura</b> y activa «Google Sheets API»). ${verManifiesto}${manifiesto}`)}
        ${paso(4, `Guardá (ícono del disquete). ${probar} ${permiso}`)}
        ${paso(5, 'Arriba a la derecha: <b>Implementar → Nueva implementación</b> (Deploy → New deployment). En el engranaje de «Seleccionar tipo» elegí <b>Aplicación web</b>. Ejecutar como: <b>Yo</b>. Quién tiene acceso: <b>Cualquier usuario</b> (no el que dice «con cuenta de Google»: así el resto del equipo no necesita iniciar sesión). Tocá <b>Implementar</b>.')}
        ${paso(6, `Copiá la <b>URL de la aplicación web</b> (termina en <span class="mono">/exec</span>) y pegala acá:${form('Probar y guardar')}`)}
      </ol>
      <p class="small muted">Si algo falla, también podés seguir soltando ANALISIS en .xlsx: la página guarda la última copia.</p>
    </div>`;
  };

  // Panel «Guía de uso»: el texto sale de src/guia.md (build.py lo convierte y lo embebe en RV.GUIA)
  R_.guia = () => {
    const G = RV.GUIA || { html: '', secciones: [] };
    const toc = G.secciones.map(([id, t]) => `<button type="button" class="guia-toc-a" data-go="${esc(id)}">${esc(t)}</button>`).join('');
    return `<div class="drawer-h"><div><div class="small muted">Reporte de Ventas · versión ${esc(RV.VERSION)}</div><h3 id="drawer-title">Guía de uso</h3></div>
      <button class="icon-btn" type="button" data-action="cerrar-drawer" aria-label="Cerrar">${icon('i-x')}</button></div>
      <div class="drawer-b guia" tabindex="0" data-panel="guia">
        <nav class="guia-toc" aria-label="Partes de la guía">${toc}</nav>
        <div class="guia-txt">${G.html}</div>
        <p class="small muted">Esta guía es de la versión ${esc(RV.VERSION)} y se actualiza con cada versión. <button class="link-btn" type="button" data-action="novedades">Ver novedades</button></p>
      </div>`;
  };

  // Panel «Novedades»: todas las versiones, la más nueva primero (sale de version.js)
  R_.novedades = () => {
    const fecha = f => { const [y, m, d] = String(f).split('-').map(Number); return `${d} de ${U.MESES_NOMBRE[m - 1]} de ${y}`; };
    const items = (RV.CAMBIOS || []).map((c, i) => `<li class="nov${i === 0 ? ' is-actual' : ''}">
        <div class="nov-h"><span class="nov-v">${esc(c.v)}</span><span class="nov-tipo t-${esc(c.tipo)}">${esc((RV.TIPOS_VERSION || {})[c.tipo] || c.tipo)}</span><span class="small muted">${esc(fecha(c.fecha))}</span>${i === 0 ? '<span class="tag">la que estás usando</span>' : ''}</div>
        <div class="nov-t">${esc(c.titulo)}</div>
        <ul>${c.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      </li>`).join('');
    return `<div class="drawer-h"><div><div class="small muted">Reporte de Ventas · versión ${esc(RV.VERSION)}</div><h3 id="drawer-title">Novedades</h3></div>
      <button class="icon-btn" type="button" data-action="cerrar-drawer" aria-label="Cerrar">${icon('i-x')}</button></div>
      <div class="drawer-b" tabindex="0" data-panel="novedades">
        <p class="small muted">Cada versión tiene tres números: el primero cambia cuando cambia la forma de usar la página, el segundo cuando se suma algo nuevo y el tercero cuando se arregla algo.</p>
        <ol class="novedades">${items}</ol>
        <p class="small muted">La versión 1 es la página anterior, la de Surak.</p>
      </div>`;
  };

  R_.origenTxt = (m) => {
    if (!m) return '';
    const base = m.origen === 'demo' ? 'Datos de ejemplo' : m.tipo === 'analisis' ? 'ANALISIS DE PRODUCTOS' : 'Planilla auxiliar';
    if (m.restaurado) return base + ' · copia guardada';
    const via = m.origen === 'vivo' ? 'en vivo' : m.origen === 'drive' ? 'Google Drive' : m.origen === 'upload' ? 'archivo subido' : '';
    return base + (via ? ' · ' + via : '');
  };

  // ============================================================
  //  REPORTE
  // ============================================================
  R_.sectionList = (R) => [
    ['resumen', 'Resumen'], ['plata', 'La plata'], ['evolucion', 'Día a día'], ['productos', 'Productos'],
    ['stock', 'Stock'], ['envios', 'Envíos'], ['cobros', 'Cobros'], ['terceros', 'Terceros y gastos'],
    ['alertas', 'Alertas', R.alertas.filter(a => a.nivel !== 'info').length], ['metodo', 'Cómo se calcula'],
  ];
  R_.secnav = (R) => R_.sectionList(R).map(([id, t, n]) => `<a href="#${id}" data-sec="${id}">${esc(t)}${n ? `<span class="count">${n}</span>` : ''}</a>`).join('');

  R_.report = (R, st) => {
    return [R_.resumen(R, st), R_.plata(R), R_.evolucion(R, st), R_.productos(R, st), R_.stock(R, st), R_.envios(R), R_.cobros(R), R_.tercerosGastos(R, st), R_.alertas(R), R_.metodo(R)].join('');
  };

  // «de cada $100»: $24 si no hay decimales que mostrar, $21,9 si los hay
  const pesos100 = (share) => { const n = share * 100; return U.fmtDec(n, Math.abs(n - Math.round(n)) < 0.05 ? 0 : 1); };
  const periodoTxt = (R) => {
    const { desde, hasta, dias } = R.periodo;
    if (!desde) return '';
    const mismoMes = desde.getMonth() === hasta.getMonth() && desde.getFullYear() === hasta.getFullYear();
    const t = mismoMes ? `${desde.getDate()} al ${hasta.getDate()} de ${U.MESES_NOMBRE[hasta.getMonth()]} ${hasta.getFullYear()}` : `${U.fmtDateLong(desde)} al ${U.fmtDateLong(hasta)} ${hasta.getFullYear()}`;
    return `${t} · ${U.plural(dias, 'día', 'días')}`;
  };
  R_.periodoTxt = periodoTxt;

  // ---------- Resumen ----------
  R_.resumen = (R, st) => {
    const K = R.kpis, op = R.opciones;
    const tone = K.margen == null ? 'ok' : K.margen < op.rojo ? 'crit' : K.margen < op.verde ? 'warn' : 'ok';
    const g = R.gastos;
    const parcialGastos = g && R.periodo.parcial;
    const modoTxt = [R.modo.mp ? 'Meli + Mercado Pago' : 'Solo Meli', R.modo.flexZona ? 'flex por zona' : 'sin tarifario de flex', R.modo.stock ? 'con stock' : null].filter(Boolean);
    const ins = R.insights.slice(0, 4);
    const insHTML = (i) => `<div class="ins t-${i.tono}" ${i.ir ? `data-go="${esc(i.ir)}" role="link" tabindex="0"` : ''}>${R_.sev(i.tono)}<div class="ins-t">${esc(i.titulo)}</div><div class="ins-x">${esc(i.texto)}</div>${i.ir ? icon('i-chev', 'ins-go') : ''}</div>`;
    const ultimo = R.modo.mp ? { ic: 'i-clock', l: 'Por liberar en MP', v: $(R.cobros.pendiente.total), s: (() => { const p = R.cobros.calendarioLista.find(e => !e.vencida); return p ? `próxima: ${U.fmtDate(p.fecha)} · ${$c(p.monto)}` : 'sin fechas futuras'; })() }
      : { ic: 'i-undo', l: 'Cancelaciones y devoluciones', v: U.fmtInt(K.cancelaciones + K.devoluciones), s: `${pct(K.tasaProblemas)} de las ventas` };
    const tiles = [
      { ic: 'i-cash', l: 'Facturación de tus cuentas', v: $(K.facturacion), s: K.facturacionTerceros ? `tuyo ${$c(K.facturacionMia)} · terceros ${$c(K.facturacionTerceros)}` : 'todo de tus productos', sp: R.diario.map(d => d.facturacion) },
      { ic: 'i-box', l: 'Unidades vendidas', v: U.fmtInt(K.unidades), s: `${U.plural(K.pedidos, 'pedido', 'pedidos')} · ${U.fmtDec(K.ritmoDiario ? K.ritmoDiario.unidades : 0, 1)} por día`, sp: R.diario.map(d => d.unidades) },
      { ic: 'i-tag', l: 'Ticket promedio', v: $(K.ticket), s: `precio por unidad ${$c(K.precioUnidad)}` },
      { ic: 'i-bank', l: 'Te deposita Meli (todas las ventas)', v: $(K.depositaMeliTodas), s: `Meli se queda el ${pct(K.facturacion ? 1 - K.depositaMeliTodas / K.facturacion : 0)}` },
      { ic: 'i-stack', l: 'Costo de mercadería', v: $(K.cogs), s: `${pct(K.factMiaConCosto ? K.cogs / K.factMiaConCosto : 0)} de lo que facturaste` },
      ultimo,
    ];
    const soloAlgunas = R.perfil.cuentas.length > 1 && R.perfil.cuentas.some(c => !R.cuentas.some(k => k.cuenta === c));
    const nCtas = R.cuentas.map(c => c.cuenta);
    // Medidor del margen: forma de semicírculo con las zonas del semáforo y la raya del objetivo
    const medidor = K.margen == null || !isFinite(K.margen)
      ? `<div class="medidor"><p class="lab">Margen de tus productos</p><p class="nota">Sin costos cargados no se puede calcular el margen.</p></div>`
      : (() => {
        const dif = K.margen - op.objetivo, pts = U.fmtDec(Math.abs(dif) * 100, 1);
        const txt = Math.abs(dif) < 0.0005 ? 'Justo en el objetivo' : `${pts} puntos ${dif < 0 ? 'abajo' : 'arriba'} del objetivo`;
        return `<div class="medidor"><p class="lab">Margen de tus productos</p>
          ${CH.gauge(K.margen, { objetivo: op.objetivo, rojo: op.rojo, verde: op.verde, max: Math.max(0.4, K.margen + 0.05) })}
          ${R_.sev(tone === 'crit' ? 'malo' : tone === 'warn' ? 'atencion' : 'bueno', txt)}
          <p class="nota">Rojo, menos de ${pct(op.rojo, 0)}. Amarillo, de ${pct(op.rojo, 0)} a ${pct(op.verde, 0)}. Verde, ${pct(op.verde, 0)} o más.</p></div>`;
      })();
    const cuatro = [
      ['Ganancia de productos', $(K.gananciaBruta)],
      g ? [`Gastos grupales${g.esPromedio ? ' (estimado)' : ''}`, U.fmtMoneySigned(-K.gastos)] : null,
      ['Devoluciones', U.fmtMoneySigned(K.impactoDevoluciones)],
      R.terceros.length ? ['A transferir a terceros', $(K.transferirTerceros)] : null,
    ].filter(Boolean);
    const cmp = RV.historial.comparar(R, RV.historial.anterior(R));
    const chip = (l, c, pts) => c == null ? '' : `<span class="cmp-i"><span class="delta ${c >= 0 ? 'up' : 'down'}">${icon(c >= 0 ? 'i-up-tr' : 'i-dn-tr')}${pts ? esc(U.fmtPctPts(c)) : esc(RV.historial.fmtCambio(c))}</span> ${esc(l)}</span>`;
    const meta = R_.meta(R, st);
    const tres = [
      K.ritmoDiario ? `<div><h3>Ritmo</h3><p class="hero-pace"><b>${$c(K.ritmoDiario.facturacion)}</b> de facturación y <b>${$c(K.ritmoDiario.ganancia)}</b> de ganancia de productos por día${K.proyeccion ? `. A este ritmo, ${esc(K.proyeccion.mes)} cierra en unos <b>${$c(K.proyeccion.facturacion)}</b>` : ''}.</p></div>` : '',
      cmp ? `<div><h3>Contra ${esc(cmp.etiqueta)}</h3><p class="hero-cmp">${[chip('de ganancia neta por día', cmp.netaDia.cambio), chip('de facturación por día', cmp.factDia.cambio), chip('de margen', cmp.margen.pts, true)].filter(Boolean).join('')}</p></div>` : '',
      // sin meta puesta, el bloque es solo el botón para ponerla: no sale en la impresión
      meta ? `<div${/^<(p class="meta-line"|form class="meta-form")/.test(meta.trim()) ? ' class="no-print"' : ''}><h3>Meta de ganancia</h3>${meta}</div>` : '',
    ].filter(Boolean);
    return `<section class="section wrap" id="resumen" aria-labelledby="h-resumen">
      <div class="hero-grid">
        <div class="hero reveal">
          <h2 class="hero-label" id="h-resumen">Ganancia neta de ${esc(R.perfil.nombre)}${soloAlgunas ? ` <span class="muted">(solo ${esc(RV.app.listaY(nCtas))})</span>` : ''}</h2>
          <p class="hero-num ${K.gananciaNeta < 0 ? 'is-neg' : ''}">${$(K.gananciaNeta)}</p>
          <p class="hero-sub">${K.gananciaNeta < 0
            ? `Con ${$(K.factMiaConCosto)} facturados de tus productos, después de Meli, envíos, mercadería${g ? ', gastos grupales' : ''} y devoluciones el mes quedó en negativo: ${pct(K.margenNeto)}.`
            : `Te quedó el ${pct(K.margenNeto)} de los ${$(K.factMiaConCosto)} que facturaste con tus productos, después de Meli, envíos, mercadería${g ? ', gastos grupales' : ''} y devoluciones.`}</p>
          <p class="hero-meta">${periodoTxt(R) ? esc(periodoTxt(R)) + '. ' : ''}${nCtas.length === 1 ? 'Cuenta' : 'Cuentas'} ${esc(RV.app.listaY(nCtas))}. ${esc(U.capitalize(modoTxt.join(', ')))}.</p>
          <div class="hero-g">
            ${medidor}
            <dl class="cuatro">${cuatro.map(([l, v]) => `<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
          </div>
          ${tres.length ? `<div class="tres">${tres.join('')}</div>` : ''}
          ${parcialGastos ? `<div class="hero-controls no-print"><span>Gastos grupales:</span><div class="segc" role="group" aria-label="Gastos grupales">
            <button type="button" data-action="gastos" data-modo="proporcional" aria-pressed="${R.opciones.gastosModo !== 'completo'}">Proporcional (${R.periodo.meses.map(m => m.diasCubiertos + '/' + m.diasEnMes).join(' + ')} días)</button>
            <button type="button" data-action="gastos" data-modo="completo" aria-pressed="${R.opciones.gastosModo === 'completo'}">Mes completo</button></div></div>` : ''}
        </div>
        <div class="insights reveal">
          <div class="ins-h"><h3>Lo más importante</h3>${R.insights.length > 4 ? `<button class="link-btn" type="button" data-action="todos-insights">Ver los ${R.insights.length}</button>` : ''}</div>
          ${ins.length ? ins.map(insHTML).join('') : `<div class="ok-box">${icon('i-check')}Nada para destacar este período.</div>`}
          <div id="ins-more" hidden>${R.insights.slice(4).map(insHTML).join('')}</div>
        </div>
      </div>
      <div class="tiles">${tiles.map(t => `<div class="card tile"><div class="tile-top"><span class="tile-ic" aria-hidden="true">${icon(t.ic)}</span><div class="tile-l">${esc(t.l)}</div></div><div class="tile-v" title="${esc(t.v)}">${esc(t.v)}</div><div class="tile-s">${esc(t.s)}</div>${t.sp ? CH.spark(t.sp, { w: 160, h: 26 }) : ''}</div>`).join('')}</div>
    </section>`;
  };
  // Etiqueta de gravedad: forma + palabra + color (nunca solo color)
  const SEV = { malo: ['crit', '▼', 'Alerta'], atencion: ['warn', '◆', 'Atención'], bueno: ['ok', '▲', 'Bien'], neutro: ['info', '●', 'Dato'] };
  R_.sev = (tono, texto) => { const s = SEV[tono] || SEV.neutro; return `<span class="sev sev-${s[0]}"><span aria-hidden="true">${s[1]}</span>${esc(texto || s[2])}</span>`; };

  // ---------- La plata ----------
  R_.plata = (R) => {
    const d = R.de100;
    const gan = d.find(x => x.id === 'gan');
    const hayGan = gan && isFinite(gan.share) && gan.share > 0;
    return `<section class="section wrap" id="plata" aria-labelledby="h-plata">
      <div class="opener">
        <h2 class="op-l" id="h-plata">Adónde se va la plata</h2>
        ${hayGan ? `<p class="op-n">$${pesos100(gan.share)}</p>
        <p class="op-f">de cada $100 que vendiste te quedan de ganancia. <span class="muted">El resto se va en mercadería, Meli, envíos, cupones e impuestos.</span></p>`
        : '<p class="op-f">De lo que facturaste con tus productos hasta lo que te queda en el bolsillo, paso por paso.</p>'}
      </div>
      <div class="grid g-12">
        <div class="card span-7">
          <div class="card-h"><div><h3>De la facturación a la ganancia, paso por paso</h3><div class="sub">Solo tus productos con costo cargado: ${U.plural(R.mias.filter(v => v.ganancia != null).length, 'venta', 'ventas')}. Lo gris es lo que se descuenta.</div></div></div>
          ${CH.waterfall(R.waterfall, $)}
          <div class="chart-legend"><span><i class="k-bar"></i>subtotales</span><span><i class="k-desc"></i>lo que se descuenta</span><span><i class="k-good"></i>lo que suma</span><span><i class="k-end"></i>ganancia</span></div>
        </div>
        <div class="card span-5">
          <div class="card-h"><div><h3>De cada $100 que vendiste</h3><div class="sub">Cada cuadradito es $1. Antes de gastos grupales y devoluciones.</div></div></div>
          ${CH.cien(hayGan ? gan.share : 0, { aria: `De cada $100 que vendiste: ${hayGan ? '$' + pesos100(gan.share) : '$0'} de ganancia (en naranja) y el resto (en celeste) se va en ${d.filter(x => x.id !== 'gan').map(x => x.label.toLowerCase()).join(', ')}` })}
          <div class="legend">${d.map(x => `<div class="lg-row"><span class="lg-sw${x.id === 'gan' ? ' is-gan' : ''}"></span><span>${esc(x.label)}</span><span class="lg-v">${$(x.value)}</span><span class="lg-p">${pct(x.share, 1)}</span></div>`).join('')}</div>
          ${R.kpis.unidadPromedio ? (() => { const u = R.kpis.unidadPromedio; return `<div class="unit-box"><div class="unit-h">Una unidad promedio</div><div class="rows">
            <div><span>Precio de venta</span><span class="r-v">${$(u.precio)}</span></div>
            <div><span>Comisión de Meli</span><span class="r-v">${U.fmtMoneySigned(-u.comision)}</span></div>
            <div><span>Envío (correo o flex, neto de bonificación)</span><span class="r-v">${U.fmtMoneySigned(-u.envios)}</span></div>
            <div><span>Cupones e impuestos</span><span class="r-v">${U.fmtMoneySigned(-u.cuponesImp)}</span></div>
            <div><span>Mercadería</span><span class="r-v">${U.fmtMoneySigned(-u.mercaderia)}</span></div>
            <div><span class="r-total">Te queda</span><span class="r-v r-total">${$(u.ganancia)}</span></div></div></div>`; })() : ''}
          ${R.kpis.margenFormula != null ? `<p class="small muted" style="margin-top:1rem">Con la fórmula de TITULARES (15% + ${$(C.PLANILLA_ENVIO_FIJO)} de envío) estos mismos precios darían <b class="ink2">${pct(R.kpis.margenFormula)}</b> de margen; el real fue <b class="ink2">${pct(R.kpis.margen)}</b>.</p>` : ''}
        </div>
        ${R.porCuenta.length > 1 ? R_.porCuenta(R) : ''}
      </div>
    </section>`;
  };

  // ---------- Meta del mes (ganancia neta), guardada en este navegador ----------
  R_.meta = (R, st) => {
    const P = R.periodo;
    if (!P.desde || P.meses.length !== 1) return '';
    const m = P.meses[0];
    const meta = st && !st.demo ? RV.app.metaDe(R.perfil.id) : (R.historialDemo ? 2800000 : null);
    if (st && st.editandoMeta) return `<form class="meta-form" data-form="meta" autocomplete="off">
        <label for="meta-in">Meta de ganancia neta para ${esc(m.nombre)}</label>
        <input id="meta-in" class="field" inputmode="numeric" placeholder="Ej.: 3.000.000" value="${meta ? esc(U.fmtInt(meta)) : ''}">
        <button class="btn btn-sm btn-primary" type="submit">Guardar</button>
        ${meta ? '<button class="btn btn-sm btn-ghost" type="button" data-action="meta-borrar">Quitar meta</button>' : ''}
        <button class="btn btn-sm btn-ghost" type="button" data-action="meta-cancelar">Cancelar</button>
      </form>`;
    if (!meta) return st && !st.demo ? `<p class="meta-line"><button type="button" class="link-btn" data-action="meta-editar">Ponerte una meta de ganancia para ${esc(m.nombre)}</button></p>` : '';
    const K = R.kpis;
    // Cierre estimado: ganancia de productos al ritmo actual por los días del mes, menos los gastos del mes completo
    const gMes = RV.engine.gastosGrupales(R.model.gastos, R.perfil, R.cuentas.map(c => c.cuenta), P.meses, 'completo');
    const proy = K.gananciaBruta / P.dias * m.diasEnMes + K.impactoDevoluciones - (gMes ? gMes.total : 0);
    const hecho = K.gananciaBruta + K.impactoDevoluciones - (gMes ? gMes.total : 0);
    const quedan = m.diasEnMes - m.diasCubiertos;
    const falta = meta - hecho;
    const avance = U.clamp(hecho / meta, 0, 1);
    const llega = proy >= meta;
    const txt = quedan > 0
      ? (llega ? `a este ritmo cerrás en ~<b>${$c(proy)}</b>: llegás` : `a este ritmo cerrás en ~<b>${$c(proy)}</b>; para llegar necesitás <b>${$c(falta / quedan)}</b> de ganancia por día los ${quedan} días que quedan`)
      : (hecho >= meta ? 'cumplida' : `te faltaron ${$c(falta)}`);
    return `<div class="meta-box ${llega || hecho >= meta ? 'ok' : 'warn'}">
      <div class="meta-h"><span>Meta de ${esc(m.nombre)}: <b>${$(meta)}</b></span>${st && !st.demo ? '<button type="button" class="link-btn" data-action="meta-editar">cambiar</button>' : ''}</div>
      <div class="meta-track" role="img" aria-label="Avance de la meta ${pct(avance, 0)}"><span style="width:${(avance * 100).toFixed(1)}%"></span></div>
      <div class="meta-s">Vas ${pct(avance, 0)} (${$c(hecho)} contando los gastos del mes completo) · ${txt}.</div>
    </div>`;
  };

  // ---------- Mes a mes (historial guardado en este navegador) ----------
  R_.mesAMes = (R) => {
    const H = RV.historial;
    const lista = H.paraReporte(R).slice(-12);
    if (lista.length < 2) return `<div class="card span-12 hist-empty"><div class="card-h"><div><h3>Mes a mes</h3><div class="sub">Cada reporte que armás queda guardado en este navegador. El mes que viene vas a ver acá cómo te fue contra este.</div></div></div></div>`;
    const maxN = Math.max(1, ...lista.map(e => Math.abs(e.neta / (e.dias || 1))));
    const filas = lista.slice().reverse().map(e => `<tr class="${e.actual ? 'is-now' : ''}"><td class="l"><b>${esc(H.etiqueta(e))}</b>${e.actual ? ' <span class="tag acc">este</span>' : ''}</td>
      <td class="hide-sm">${U.fmtInt(e.dias)}</td><td>${$(e.facturacion)}</td><td>${$(e.neta)}</td>
      <td><span class="cell-bar ${e.neta < 0 ? 'neg' : ''}" style="--w:${(Math.abs(e.neta / (e.dias || 1)) / maxN * 100).toFixed(0)}%">${$c(e.neta / (e.dias || 1))}</span></td>
      <td>${R_.pillMargen(e.margen, R.opciones, true)}</td><td class="hide-sm">${U.fmtInt(e.unidades)}</td></tr>`).join('');
    return `<div class="card span-12">
      <div class="card-h"><div><h3>Mes a mes</h3><div class="sub">${R.historialDemo ? 'Ejemplo: meses anteriores inventados.' : 'Guardado en este navegador cada vez que armás un reporte (mismo perfil y mismas cuentas).'} Ganancia neta con gastos grupales proporcionales; «por día» compara bien meses de distinto largo.</div></div>
        ${R.historialDemo ? '' : '<div class="card-tools"><button type="button" class="btn btn-sm btn-ghost" data-action="borrar-historial">Borrar historial</button></div>'}</div>
      <div class="chart" id="ch-meses"></div>
      <div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabla mes a mes"><table class="tbl"><thead><tr><th class="l">Período</th><th class="hide-sm">Días</th><th>Facturación</th><th>Ganancia neta</th><th>Neta por día</th><th>Margen</th><th class="hide-sm">Unidades</th></tr></thead><tbody>${filas}</tbody></table></div>
    </div>`;
  };

  // ---------- Por cuenta ----------
  R_.porCuenta = (R) => {
    const L = R.porCuenta;
    const maxF = Math.max(1, ...L.map(c => c.facturacion));
    const totF = U.sum(L, c => c.facturacion) || 1;
    const conMP = L.some(c => c.tieneMP);
    const terc = L.some(c => c.facturacionTerceros > 0);
    return `<div class="card span-12"><div class="card-h"><div><h3>Por cuenta</h3><div class="sub">Cuánto vendió cada cuenta y qué te dejaron tus productos en ella</div></div></div>
      <div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabla por cuenta"><table class="tbl"><thead><tr><th class="l">Cuenta</th><th>Pedidos</th><th class="hide-sm">Unidades</th><th>Facturación</th><th class="hide-sm">Parte</th>${terc ? '<th class="hide-sm">De terceros</th>' : ''}<th>Ganancia (tus productos)</th><th>Margen</th>${conMP ? '<th class="hide-sm">Por liberar en MP</th>' : ''}</tr></thead><tbody>
      ${L.map(c => `<tr><td class="l"><b>${esc(c.cuenta)}</b></td><td>${U.fmtInt(c.pedidos)}</td><td class="hide-sm">${U.fmtInt(c.unidades)}</td>
        <td>${$(c.facturacion)}</td>
        <td class="hide-sm"><span class="cell-bar" style="--w:${(c.facturacion / maxF * 100).toFixed(0)}%">${pct(c.facturacion / totF, 0)}</span></td>
        ${terc ? `<td class="hide-sm">${c.facturacionTerceros ? $(c.facturacionTerceros) : '—'}</td>` : ''}
        <td>${$(c.ganancia)}</td><td>${R_.pillMargen(c.margen, R.opciones, true)}</td>
        ${conMP ? `<td class="hide-sm">${c.pendiente != null ? $(c.pendiente) : '<span class="muted">sin reporte de MP</span>'}</td>` : ''}</tr>`).join('')}
      </tbody></table></div></div>`;
  };

  // ---------- Día a día ----------
  R_.evolucion = (R, st) => {
    const met = st.metrica || 'facturacion';
    const sem = R.semanas;
    return `<section class="section wrap" id="evolucion" aria-labelledby="h-evo">
      <div class="section-h"><div><h2 id="h-evo">Día a día</h2><p>Cómo vino el período: cada día, el acumulado y en qué momentos te compran.</p></div></div>
      <div class="grid g-12">
        <div class="card span-12">
          <div class="card-h"><div><h3>Ventas por día</h3><div class="sub">Todas las ventas válidas de tus cuentas</div></div>
            <div class="card-tools"><div class="segc" role="group" aria-label="Qué medir">
              ${[['facturacion', 'Facturación'], ['unidades', 'Unidades'], ['ganancia', 'Ganancia']].map(([k, t]) => `<button type="button" data-action="metrica" data-k="${k}" aria-pressed="${met === k}">${t}</button>`).join('')}
            </div></div></div>
          <div class="chart" id="ch-diario" aria-label="Ventas por día"></div>
          <div class="chart-legend"><span><i class="k-bar"></i>por día</span><span><i class="k-line"></i>promedio de 7 días</span><span><i class="k-wknd"></i>fin de semana</span></div>
        </div>
        <div class="card span-7">
          <div class="card-h"><div><h3>Facturación acumulada</h3><div class="sub">${R.kpis.proyeccion ? `La línea punteada proyecta el mes completo al ritmo actual (${$c(R.kpis.ritmoDiario.facturacion)} por día)` : 'Suma día a día del período'}</div></div></div>
          <div class="chart" id="ch-acum"></div>
        </div>
        <div class="card span-5">
          <div class="card-h"><div><h3>¿Cuándo te compran?</h3><div class="sub">Ventas por día de la semana y franja horaria</div></div></div>
          <div id="heat"></div>
        </div>
        ${R_.mesAMes(R)}
        ${R.porMes ? `<div class="card span-12"><div class="card-h"><div><h3>Por mes</h3><div class="sub">El período cruza meses</div></div></div>
          <div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabla por mes"><table class="tbl"><thead><tr><th>Mes</th><th>Días</th><th>Pedidos</th><th>Unidades</th><th>Facturación</th><th>Ganancia (tus productos)</th><th>Margen</th></tr></thead><tbody>
          ${R.porMes.map(m => `<tr><td>${esc(U.capitalize(m.nombre))} ${m.anio}</td><td>${m.dias}</td><td>${U.fmtInt(m.pedidos)}</td><td>${U.fmtInt(m.unidades)}</td><td>${$(m.facturacion)}</td><td>${$(m.ganancia)}</td><td>${RV.render.pillMargen(m.margen, R.opciones)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
        <div class="card span-12">
          <div class="card-h"><div><h3>Por semana</h3></div></div>
          <div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabla por semana"><table class="tbl"><thead><tr><th>Semana</th><th class="hide-sm">Pedidos</th><th class="hide-sm">Unidades</th><th>Facturación</th><th>Ganancia<span class="hide-sm"> (tus productos)</span></th><th class="hide-tab">Promedio por día</th></tr></thead>
          <tbody>${sem.map((s, i) => `<tr><td>${esc(U.fmtDate(s.desde))} al ${esc(U.fmtDate(s.hasta))}${s.dias < 7 ? ` <span class="tag">${s.dias} ${s.dias === 1 ? 'día' : 'días'}</span>` : ''}</td><td class="hide-sm">${U.fmtInt(s.pedidos)}</td><td class="hide-sm">${U.fmtInt(s.unidades)}</td><td>${$(s.facturacion)}</td><td>${$(s.ganancia)}</td><td class="hide-tab">${$(s.facturacion / s.dias)}</td></tr>`).join('')}</tbody></table></div>
        </div>
      </div>
    </section>`;
  };

  // ---------- Productos ----------
  R_.productos = (R, st) => {
    const scope = st.scope || 'mios';
    const op = R.opciones;
    const stock = R.stock ? new Map(R.stock.filas.map(f => [f.key, f])) : null;
    let lista = R.productos.filter(p => scope === 'todos' ? true : scope === 'terceros' ? !p.esMio : p.esMio);
    const q = U.normPlain(st.busqueda || '');
    if (q) lista = lista.filter(p => U.normPlain(p.nombre).includes(q));
    const sk = st.orden || 'ganancia', dir = st.ordenDir || -1;
    const val = (p, k) => k === 'nombre' ? p.nombre : (p[k] == null ? -Infinity : p[k]);
    lista = lista.slice().sort((a, b) => { const x = val(a, sk), y = val(b, sk); return (typeof x === 'string' ? x.localeCompare(y) : (x - y)) * dir; });
    const maxG = Math.max(1, ...lista.map(p => Math.abs(p.ganancia || 0)));
    const th = (k, t, cls = '') => `<th data-sort="${k}" class="${cls} ${sk === k ? 'is-sorted' + (dir > 0 ? ' asc' : '') : ''}" scope="col">${t}</th>`;
    const tot = { u: U.sum(lista, p => p.unidades), f: U.sum(lista, p => p.facturacion), g: U.sum(lista, p => p.ganancia || 0) };
    const factC = U.sum(lista.filter(p => p.ganancia != null), p => p.facturacion);
    const nMios = R.productos.filter(p => p.esMio).length, nTer = R.productos.length - nMios;
    const rows = lista.map(p => {
      const s = stock && stock.get(p.key);
      return `<tr class="is-link" data-action="producto" data-key="${esc(p.key)}" data-dueno="${esc(p.dueño)}" tabindex="0">
        <td class="t-name"><div class="t-name-main">${esc(p.nombre)}</div><div class="t-name-sub">${CH.miniBars(p.serie, { w: 84, h: 18 })}${!p.esMio ? `<span class="tag">de ${esc(RV.engine.perfilDe(p.dueño).nombre)}</span>` : ''}${p.flex ? `<span class="tag">${U.fmtInt(p.flex)} flex</span>` : ''}${p.ads ? `<span class="tag">${U.fmtInt(p.ads)} por publi</span>` : ''}</div></td>
        <td>${U.fmtInt(p.unidades)}</td>
        <td>${$(p.precioProm)}${p.precioMin && p.precioMax && p.precioMax - p.precioMin > 1 ? `<div class="small muted nw">${$c(p.precioMin)}–${$c(p.precioMax)}</div>` : ''}</td>
        <td class="hide-md">${$(p.netoU)}</td>
        <td class="hide-md">${$(p.costoU)}${p.costoFuente === 'pedido' ? '<div class="small muted">último pedido</div>' : ''}</td>
        <td>${$(p.gananciaU)}</td>
        <td>${RV.render.pillMargen(p.margen, op, true)}</td>
        <td><span class="cell-bar ${p.ganancia < 0 ? 'neg' : ''}" style="--w:${(Math.abs(p.ganancia || 0) / maxG * 100).toFixed(0)}%">${$(p.ganancia)}</span></td>
        ${stock ? `<td>${s ? `${pillStock(s.estado)}<div class="small muted">${s.total != null ? U.fmtInt(s.total) + ' u' : ''}${s.cobertura != null ? ' · ' + U.fmtDec(s.cobertura, 0) + ' días' : ''}</div>` : '<span class="muted">—</span>'}</td>` : ''}
      </tr>`;
    }).join('');
    const cards = lista.map(p => {
      const s = stock && stock.get(p.key);
      return `<div class="pcard" data-action="producto" data-key="${esc(p.key)}" data-dueno="${esc(p.dueño)}" tabindex="0">
        <div class="pcard-h"><div class="pcard-n">${esc(p.nombre)}${!p.esMio ? ` <span class="tag">de ${esc(RV.engine.perfilDe(p.dueño).nombre)}</span>` : ''}</div>${RV.render.pillMargen(p.margen, op)}</div>
        <div class="pcard-g"><div><span>Unidades</span><b>${U.fmtInt(p.unidades)}</b></div><div><span>Precio prom.</span><b>${$c(p.precioProm)}</b></div><div><span>Ganancia</span><b>${$c(p.ganancia)}</b></div>
        ${s ? `<div><span>Stock</span><b>${s.total != null ? U.fmtInt(s.total) : '—'}</b></div><div><span>Cobertura</span><b>${s.cobertura != null ? U.fmtDec(s.cobertura, 0) + ' d' : '—'}</b></div><div><span>Estado</span><b>${esc(labelStock(s.estado))}</b></div>` : ''}</div>
      </div>`;
    }).join('');
    const ajustar = R.productos.filter(p => p.esMio && p.margen != null && p.margen < op.verde && p.precioObjetivo).sort((a, b) => b.unidades - a.unidades).slice(0, 6);
    // Apertura: el producto que más te dejó y qué parte de tu ganancia es
    const top = R.productos.filter(p => p.esMio && p.ganancia != null && isFinite(p.ganancia) && p.ganancia > 0).sort((a, b) => b.ganancia - a.ganancia)[0];
    const topShare = top && R.kpis.gananciaBruta > 0 ? top.ganancia / R.kpis.gananciaBruta : null;
    return `<section class="section wrap" id="productos" aria-labelledby="h-prod">
      <div class="opener">
        <h2 class="op-l" id="h-prod">Productos</h2>
        ${top ? `<p class="op-n">${$(top.ganancia)}</p>
        <p class="op-f">te dejó ${esc(top.nombre)}${topShare != null && topShare <= 1 ? `: el ${pct(topShare, 0)} de tu ganancia de productos` : ''}, con ${U.plural(top.unidades, 'unidad', 'unidades')}. <span class="muted">Rentabilidad con el costo vigente a la fecha de cada venta. Tocá un producto para ver su detalle.</span></p>`
        : '<p class="op-f">Rentabilidad por producto con el costo vigente a la fecha de cada venta. <span class="muted">Tocá un producto para ver su detalle.</span></p>'}
      </div>
      <div class="grid g-12">
        <div class="card span-12">
          <div class="card-h">
            <div class="tbl-tools">
              <div class="segc" role="group" aria-label="Qué productos ver">
                <button type="button" data-action="scope" data-k="mios" aria-pressed="${scope === 'mios'}">Tuyos (${nMios})</button>
                ${nTer ? `<button type="button" data-action="scope" data-k="terceros" aria-pressed="${scope === 'terceros'}">De terceros (${nTer})</button><button type="button" data-action="scope" data-k="todos" aria-pressed="${scope === 'todos'}">Todos</button>` : ''}
              </div>
              <input class="search" id="prod-search" type="search" placeholder="Buscar producto" value="${esc(st.busqueda || '')}" aria-label="Buscar producto">
            </div>
          </div>
          ${lista.length ? `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabla de productos"><table class="tbl can-swap" id="tbl-prod">
            <thead><tr>${th('nombre', 'Producto')}${th('unidades', 'Unid.')}${th('precioProm', 'Precio prom.')}${th('netoU', 'Neto por u.', 'hide-md')}${th('costoU', 'Costo por u.', 'hide-md')}${th('gananciaU', 'Ganancia por u.')}${th('margen', 'Margen')}${th('ganancia', 'Ganancia total')}${stock ? '<th scope="col">Stock</th>' : ''}</tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr><td>${U.plural(lista.length, 'producto', 'productos')}</td><td>${U.fmtInt(tot.u)}</td><td>${$(tot.u ? tot.f / tot.u : null)}</td><td class="hide-md"></td><td class="hide-md"></td><td></td><td>${factC ? RV.render.pillMargen(tot.g / factC, op) : ''}</td><td>${$(tot.g)}</td>${stock ? '<td></td>' : ''}</tr></tfoot>
          </table></div><div class="pcards can-swap">${cards}</div>
          <p class="nota" style="margin-top:.875rem">${esc(R_.semaforoTxt(op))}<span class="hide-tab"> La raya en cada barrita es el objetivo, ${pct(op.objetivo, 0)}.</span></p>` : `<p class="muted">No hay productos para mostrar${q ? ' con esa búsqueda' : ''}.</p>`}
        </div>
        <div class="card span-7">
          <div class="card-h"><div><h3>Demanda contra margen</h3><div class="sub">Cada círculo es un producto tuyo; el tamaño es la ganancia. Arriba a la derecha, los que conviene empujar.</div></div></div>
          <div class="chart" id="ch-matriz"></div>
          <div class="chart-legend"><span><i class="k-neg"></i>margen menor a ${pct(op.rojo, 0)}</span><span><i class="k-warn"></i>${pct(op.rojo, 0)} a ${pct(op.verde, 0)}</span><span><i class="k-good"></i>${pct(op.verde, 0)} o más</span><span>raya punteada: objetivo ${pct(op.objetivo, 0)}</span></div>
        </div>
        <div class="card span-5">
          <div class="card-h"><div><h3>Dónde ajustar el precio</h3><div class="sub">Precio aproximado para llegar al objetivo, con la misma estructura de costos del período</div></div></div>
          ${ajustar.length ? `<div class="rows rows-precio">${ajustar.map(p => `<div class="is-link" data-action="producto" data-key="${esc(p.key)}" data-dueno="${esc(p.dueño)}" style="cursor:pointer" tabindex="0"><span><b>${esc(p.nombre)}</b><br><span class="small muted">hoy ${$(p.precioProm)} · ${pct(p.margen)}</span></span><span class="r-v">${$(p.precioObjetivo)}<br><span class="small muted">para ${pct(op.objetivo, 0)}${p.precioVerde ? ' · ' + $c(p.precioVerde) + ' para ' + pct(op.verde, 0) : ''}</span></span></div>`).join('')}</div>`
            : `<div class="ok-box">${icon('i-check')}Todos tus productos están en verde.</div>`}
        </div>
      </div>
    </section>`;
  };

  // ---------- Stock ----------
  R_.stock = (R, st) => {
    const S = R.stock;
    const head = `<div class="section-h"><div><h2 id="h-stock">Stock y reposición</h2><p>Cuántos días te dura cada producto al ritmo de venta de este período, y cómo armar el pedido.</p></div></div>`;
    const reponer = S ? S.filas.filter(f => f.estado === 'SIN STOCK' || f.estado === 'PEDIR YA') : [];
    const nombresRep = reponer.slice(0, 3).map(f => f.nombre + (f.estado === 'SIN STOCK' ? ', sin stock' : f.cobertura != null ? `, que te alcanza para ${U.plural(Math.max(0, Math.round(f.cobertura)), 'día', 'días')}` : ''));
    const opener = S ? `<div class="opener">
        <h2 class="op-l" id="h-stock">Stock y reposición</h2>
        <p class="op-n">${U.fmtInt(S.sinStock + S.pedirYa)}</p>
        <p class="op-f">${S.sinStock + S.pedirYa === 1 ? 'producto para reponer ya' : 'productos para reponer ya'}${nombresRep.length ? ': ' + esc(nombresRep.join('; ')) + (reponer.length > 3 ? `; y ${reponer.length - 3} más` : '') + '.' : `. <span class="muted">Ninguno se queda sin stock en menos de ${U.fmtDec(C.STOCK_PEDIR_YA_DIAS, 1)} días al ritmo de este período.</span>`}</p>
      </div>` : head;
    if (!S) {
      const enClaude = RV.app && RV.app.puedeDrive && RV.app.puedeDrive();
      return `<section class="section wrap" id="stock" aria-labelledby="h-stock">${head}
        <div class="empty"><h3>Falta el stock</h3>
          <p>El stock sale de la pestaña «Consulta stock» de ANALISIS DE PRODUCTOS, y la planilla que se está usando no la trae.</p>
          <p>${enClaude ? '<b>Acá en Claude:</b> tocá «Leer ANALISIS DE PRODUCTOS desde Drive» en la carga de archivos.' : '<b>En vivo:</b> tocá «Conectar en vivo» en la carga de archivos (se hace una sola vez y lee toda la planilla, stock incluido).'}</p>
          <p><b>A mano:</b> bajá ANALISIS DE PRODUCTOS como Excel (Archivo → Descargar → Microsoft Excel) y soltala junto con tus reportes: queda guardada para la próxima.</p>
        </div></section>`;
    }
    const res = RV.pedido.armar(R, st && st.pedido);
    const tiles = [
      { l: 'Unidades en stock', v: U.fmtInt(S.unidades), s: S.ultimaAct ? `según la planilla al ${S.ultimaAct}` : `según ${S.fuente}` },
      { l: 'Valor a costo', v: $(S.valorARS), s: S.valorUSD ? `≈ ${U.fmtUSD(S.valorUSD)} en Paraguay` : '' },
      { l: 'Para reponer ya', v: U.fmtInt(S.sinStock + S.pedirYa), s: `${S.sinStock} sin stock · ${S.pedirYa} con menos de ${U.fmtDec(C.STOCK_PEDIR_YA_DIAS, 1)} días`, cls: (S.sinStock + S.pedirYa) ? 'is-crit' : '' },
    ];
    const maxCob = 45;
    const venta = (f) => {
      const pl = f.ventaMesPlanilla > 0 ? `${U.fmtDec(f.ventaMesPlanilla, 0)}/mes` : 'sin dato';
      return `planilla: ${pl} · reporte: ${U.fmtDec(f.ventaMesReal, 0)}/mes`;
    };
    const rows = S.filas.map(f => {
      const cob = f.cobertura;
      const w = cob == null ? 0 : U.clamp(cob / maxCob, 0, 1) * 100;
      const tone = f.estado === 'OK' ? '' : f.estado === 'REVISAR' ? 'warn' : 'crit';
      return `<tr class="${f.vendidas ? 'is-link' : ''}" ${f.vendidas ? `data-action="producto" data-key="${esc(f.key)}" tabindex="0"` : ''}>
        <td class="t-name"><div class="t-name-main">${esc(f.nombre)}</div><div class="small muted">${esc(venta(f))}</div><div class="only-sm">${pillStock(f.estado)}</div></td>
        <td>${f.total != null ? U.fmtInt(f.total) : '—'}${f.camino ? `<div class="small muted">${U.fmtInt(f.camino)} en camino</div>` : ''}</td>
        <td class="hide-sm">${U.fmtInt(f.vendidas)}</td>
        <td class="hide-md">${U.fmtDec(f.ventaDia * 7, 1)}</td>
        <td><span class="cov"><span class="cov-track"><span class="cov-fill ${tone}" style="width:${w.toFixed(0)}%"></span><span class="cov-mark" style="left:${(C.STOCK_PEDIR_YA_DIAS / maxCob * 100).toFixed(1)}%"></span><span class="cov-mark" style="left:${(C.STOCK_REVISAR_DIAS / maxCob * 100).toFixed(1)}%"></span></span><span>${cob == null ? (f.vendidas ? '0' : '—') : cob > 365 ? '+1 año' : U.fmtDec(cob, 0) + ' d'}</span></span></td>
        <td class="hide-sm">${pillStock(f.estado)}</td>
      </tr>`;
    }).join('');
    return `<section class="section wrap" id="stock" aria-labelledby="h-stock">${opener}
      <div class="stats" style="margin-bottom:1rem">${tiles.map(t => `<div class="stat ${t.cls || ''}"><div class="stat-l">${esc(t.l)}</div><div class="stat-v">${esc(t.v)}</div><div class="stat-s">${esc(t.s)}</div></div>`).join('')}
        <div class="stat is-link" data-go="pedido" id="ped-tile" role="link" tabindex="0" title="Ir a «Armá el pedido»">${R_.pedidoTile(res)}</div></div>
      <div class="card">
        <div class="card-h"><div><h3>Cuánto te alcanza cada producto</h3><div class="sub">Cobertura = stock ÷ venta diaria del período (lo que da este reporte).<span class="only-lg"> La barra va de 0 a ${maxCob} días: la raya roja marca ${U.fmtDec(C.STOCK_PEDIR_YA_DIAS, 1)} días y la otra, ${C.STOCK_REVISAR_DIAS} (mismo criterio que «Consulta stock»).</span></div></div></div>
        ${S.cuentasFuera && S.cuentasFuera.length ? `<p class="note-warn">${icon('i-alert')}<span>La venta diaria sale solo de las cuentas de este reporte. Si también vendés estos productos en ${esc(RV.app.listaY(S.cuentasFuera))}, la cobertura real es menor: sumá esas cuentas para verla completa.</span></p>` : ''}
        <div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabla de cobertura de stock"><table class="tbl"><thead><tr><th>Producto</th><th>Stock</th><th class="hide-sm">Vendidas</th><th class="hide-md">Por semana</th><th>Cobertura</th><th class="hide-sm">Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>
      ${R_.pedidoCard(R, st, res)}
    </section>`;
  };

  // ---------- Pedido: tarjeta con los controles + resultado ----------
  R_.pedidoTile = (res) => {
    const o = res.opciones, M = RV.pedido.MODOS[o.modo];
    return `<div class="stat-l">Pedido ${esc(M.corto)} (${o.dias} días)</div><div class="stat-v">${res.faltaTope ? '—' : res.usd ? esc(U.fmtUSD(res.usd)) : res.unidades ? esc(U.plural(res.unidades, 'unidad', 'unidades')) : 'Nada'}</div><div class="stat-s">${res.faltaTope ? 'cargá cuánto querés gastar' : res.unidades ? `${esc(U.plural(res.unidades, 'unidad', 'unidades'))} · armalo abajo ↓` : 'no hace falta pedir · armalo abajo ↓'}</div>`;
  };
  R_.pedidoCard = (R, st, res) => {
    const o = res.opciones;
    const dolar = res.dolar;
    const boton = (k) => {
      const M = RV.pedido.MODOS[k], rm = res.resumenModos[k];
      const sub = k === 'tope' ? 'vos ponés el máximo' : rm.usd ? U.fmtUSD(rm.usd) : rm.unidades ? U.plural(rm.unidades, 'unidad', 'unidades') : 'nada';
      return `<button type="button" data-action="ped-modo" data-k="${k}" id="ped-m-${k}" aria-pressed="${o.modo === k}"><b>${esc(M.nombre)}</b><span class="ped-m-sub">${esc(sub)}</span></button>`;
    };
    return `<div class="card ped" id="pedido">
      <div class="card-h"><div><h3>Armá el pedido</h3><div class="sub">La venta mensual de cada producto sale de un balance entre la de la planilla («Consulta stock») y la de este reporte. Elegí cómo lo querés armar.</div></div></div>
      <div class="segc ped-modos" role="group" aria-label="Tipo de pedido">${RV.pedido.ORDEN_MODOS.map(boton).join('')}</div>
      <p class="ped-desc" id="ped-desc">${esc(RV.pedido.descripcion(o, res.diasMin))}</p>
      <div class="ped-fields">
        <label class="ped-f ped-peso"><span>Venta mensual a usar</span>
          <span class="ped-range"><span class="small muted">Reporte</span><input type="range" id="ped-peso" min="0" max="100" step="10" value="${Math.round(o.peso * 100)}" aria-describedby="ped-peso-txt"><span class="small muted">Planilla</span></span>
          <span class="small" id="ped-peso-txt">${esc(RV.pedido.pesoTxt(o.peso))}</span></label>
        <label class="ped-f ped-dias"><span>Días a cubrir</span><input class="field" type="number" id="ped-dias" inputmode="numeric" min="7" max="180" step="1" value="${o.dias}"></label>
        <label class="ped-f ped-tope" ${o.modo === 'tope' ? '' : 'hidden'}><span>Máximo a gastar</span>
          <span class="ped-tope-in"><input class="field" type="number" id="ped-tope" inputmode="decimal" min="0" step="10" placeholder="${o.moneda === 'ARS' ? 'en pesos' : 'en dólares'}" value="${o.tope != null ? o.tope : ''}">
          <select class="field" id="ped-moneda" aria-label="Moneda del tope"><option value="USD" ${o.moneda === 'USD' ? 'selected' : ''}>US$</option>${dolar ? `<option value="ARS" ${o.moneda === 'ARS' ? 'selected' : ''}>$ (pesos)</option>` : ''}</select></span></label>
      </div>
      <div id="ped-res" aria-live="polite">${R_.pedidoRes(R, res)}</div>
    </div>`;
  };
  R_.pedidoRes = (R, res) => {
    const o = res.opciones;
    if (res.faltaTope) return `<div class="ok-box ped-vacio">${icon('i-info')}Cargá arriba cuánto querés gastar como máximo y la página arma el mejor pedido posible con esa plata.${!res.dolar && o.moneda === 'ARS' ? ' (Sin dólar en la planilla, el tope va en US$.)' : ''}</div>`;
    const cobTxt = c => c == null ? '—' : c > 365 ? '+1 año' : U.fmtDec(c, 0) + ' d';
    const ventaTxt = l => l.fuente === 'balance' ? `planilla ${U.fmtDec(l.mesPlanilla, 0)} · reporte ${U.fmtDec(l.mesReporte, 0)}` : l.fuente === 'planilla' ? 'solo planilla' : l.fuente === 'reporte' ? 'solo reporte' : 'sin ventas';
    const fila = (l) => `<tr class="${l.qty ? '' : 'is-dim'}">
        <td class="t-name"><div class="t-name-main">${esc(l.nombre)}</div>${(() => {
          const n = [l.nota, l.faltaOptimo ? (l.qty ? `faltan ${U.plural(l.faltaOptimo, 'unidad', 'unidades')} para el óptimo` : `no entró en el tope (el óptimo pedía ${U.plural(l.faltaOptimo, 'unidad', 'unidades')})`) : ''].filter(Boolean);
          return n.length ? `<div class="small muted">${esc(n.join(' · '))}</div>` : ''; })()}</td>
        <td class="hide-sm">${l.stock != null ? U.fmtInt(l.stock) : '—'}</td>
        <td class="hide-sm">${U.fmtDec(l.mes, 1)}<div class="small muted">${esc(ventaTxt(l))}</div></td>
        <td class="hide-md">${cobTxt(l.cobertura)}</td>
        <td class="ped-q">${l.qty ? U.fmtInt(l.qty) : '—'}</td>
        <td>${l.costoUSD ? U.fmtUSD(l.costoUSD) : l.qty ? '<span class="small muted">sin costo</span>' : '—'}</td>
        <td class="hide-sm">${l.qty ? cobTxt(l.coberturaDespues) : '—'}</td>
        ${res.hayPlanilla ? `<td class="hide-md ped-pl">${l.planilla ? U.fmtInt(l.planilla) : '—'}</td>` : ''}
      </tr>`;
    const tabla = (lineas) => `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Productos del pedido"><table class="tbl ped-tbl"><thead><tr><th>Producto</th><th class="hide-sm">Stock</th><th class="hide-sm">Venta por mes</th><th class="hide-md">Cubre hoy</th><th>Pedir</th><th>Costo</th><th class="hide-sm">Cubre después</th>${res.hayPlanilla ? '<th class="hide-md ped-pl" title="«Cantidad a Comprar» de la pestaña Consulta stock">En la planilla</th>' : ''}</tr></thead><tbody>${lineas.map(fila).join('')}</tbody></table></div>`;
    const msgs = [];
    if (o.modo === 'tope') {
      msgs.push(`Tope <b>${U.fmtUSD(res.topeUSD)}</b>${o.moneda === 'ARS' ? ` (${$(o.tope)})` : ''}: usás <b>${U.fmtUSD(res.usd)}</b> y sobran ${U.fmtUSD(res.sobrante || 0)}.`);
      const rm = res.resumenModos, faltan = `Para el óptimo harían falta ${U.fmtUSD(rm.optimo.usd)} y para el completo ${U.fmtUSD(rm.completo.usd)}.`;
      msgs.push({
        nada: `<span class="err-txt">No alcanza ni para lo urgente: faltan unos ${U.fmtUSD(res.falto || 0)}.</span> ${faltan}`,
        urgente: `Alcanza para lo urgente (lo que se queda sin stock en menos de ${U.fmtDec(res.diasUrg, 1)} días), pero no para el mínimo de todos. ${faltan}`,
        minimo: `Alcanza para el mínimo de todos (${res.diasMin} días), pero no para el óptimo. ${faltan}`,
        optimo: `Alcanza para el óptimo, pero no para el completo (${U.fmtUSD(rm.completo.usd)}).`,
        todo: `Alcanza para el pedido completo de ${o.dias} días.`,
      }[res.alcanza] || '');
    }
    if (res.cortos.length && res.conPedido.length) msgs.push(`${U.plural(res.cortos.length, 'producto queda', 'productos quedan')} con menos de ${res.diasMin} días después del pedido.`);
    if (res.sinCosto.length) msgs.push(`${U.plural(res.sinCosto.length, 'producto no tiene', 'productos no tienen')} costo en dólares (precio PY en la planilla) y no ${o.modo === 'tope' ? 'entran en el tope' : 'suman en el total'}: ${esc(res.sinCosto.map(l => l.nombre).join(', '))}.`);
