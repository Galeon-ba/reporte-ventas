        mesFacturacion: txt(fila, 'mesFact'), ads: U.normPlain(txt(fila, 'ads')) === 'si',
        sku: txt(fila, 'sku').replace(/\.0$/, ''), publicacion: txt(fila, 'pub'), titulo, variante: txt(fila, 'variante'),
        precioPublicacion: U.num(g(fila, 'precioPub')), cuotasAgregadas: U.normPlain(txt(fila, 'cuotasAgregadas')) === 'si',
        negocio: U.normPlain(txt(fila, 'negocio')) === 'si', condIva: txt(fila, 'condIva'),
        ciudad: txt(fila, 'ciudad'), provincia: txt(fila, 'provincia'),
        cp: (() => { const c = txt(fila, 'cp'); const n = parseInt(c, 10); return isNaN(n) ? '' : String(n); })(),
        entrega: txt(fila, 'entrega'), enCaminoTxt: txt(fila, 'enCamino'), entregadoTxt: txt(fila, 'entregado'),
        transportista: txt(fila, 'transportista'), envioId: txt(fila, 'seguimiento'),
        devForma: txt(fila, 'devForma'), devResultado: txt(fila, 'devResultado'), devMotivo: txt(fila, 'devMotivo'),
        reclamo: U.normPlain(txt(fila, 'reclamoAbierto')) === 'si', mediacion: U.normPlain(txt(fila, 'mediacion')) === 'si',
        esCabeceraPaquete,
      };
      // Componente que Meli no detalla en columnas (cupones de descuento, costos de reclamos, etc.)
      const comp = v.ingresos + v.cargo + v.costoFijo + v.costoCuotas + v.ingresosEnvio + v.costoEnvio + v.envioMedidas +
        v.difMedidas + v.impuestos + v.bonif + v.anulaciones;
      v.noDetallado = U.round(v.total - comp, 2);
      if (Math.abs(v.noDetallado) < 0.5) v.noDetallado = 0;
      v.fechaEnCamino = U.parseFechaSinAnio(v.enCaminoTxt, v.fecha);
      v.fechaEntregado = U.parseFechaSinAnio(v.entregadoTxt, v.fecha);
      if (esCabeceraPaquete) {
        const n = (titulo.match(/^paquete de (\d+)/i) || [])[1];
        paqueteActual = { id, fecha, n: n ? +n : null, fila: v, hijos: [] };
        v.hijos = paqueteActual.hijos;
      } else if (hijoDe) { hijoDe.hijos.push(v); v.paqueteDe = hijoDe.id; }
      else paqueteActual = null;
      ventas.push(v);
    }

    // Paquetes: si la cabecera trae la plata y los productos no, se reparte por precio x unidades;
    // si los productos ya traen su plata, la cabecera no se suma (evita contar dos veces);
    // si no hay detalle, la cabecera queda como una venta más (cuenta en la plata, sin producto).
    const avisos = [];
    for (const v of ventas.filter(x => x.esCabeceraPaquete)) {
      const hijos = v.hijos || [];
      delete v.hijos;
      const hijosSinPlata = hijos.filter(h => !h.ingresos && !h.total);
      if (hijos.length && hijosSinPlata.length === hijos.length) {
        const base = U.sum(hijos, h => (h.precioPublicacion || 1) * (h.unidades || 1));
        for (const h of hijos) {
          const w = ((h.precioPublicacion || 1) * (h.unidades || 1)) / base;
          for (const k of ['ingresos', 'cargo', 'costoFijo', 'costoCuotas', 'ingresosEnvio', 'costoEnvio', 'envioMedidas', 'difMedidas', 'impuestos', 'bonif', 'anulaciones', 'total', 'noDetallado']) h[k] = U.round(v[k] * w, 2);
          if (!h.estado) h.estado = v.estado;
          if (!h.entrega) h.entrega = v.entrega;
          if (!h.envioId) h.envioId = v.envioId;
        }
      } else if (!hijos.length) {
        avisos.push({ id: v.id, texto: `La venta ${v.id} es un «${v.titulo || 'paquete'}» sin el detalle de productos: entra en la plata, pero no se sabe qué productos tenía.` });
        v.esCabeceraPaquete = false; v.paqueteSinDetalle = true;
        continue;
      }
      for (const h of hijos) { if (!h.entrega) h.entrega = v.entrega; if (!h.envioId) h.envioId = v.envioId; }
      v.descartar = true;
    }
    const finales = ventas.filter(v => !v.descartar);
    if (!finales.length) throw new Error('No hay ventas debajo del encabezado en este archivo.');
    const fechas = finales.map(v => v.fecha).filter(Boolean);
    return {
      ventas: finales, generado, avisos,
      desde: fechas.length ? new Date(Math.min(...fechas)) : null,
      hasta: fechas.length ? new Date(Math.max(...fechas)) : null,
      tieneFormaEntrega: idx.entrega !== -1,
    };
  };

  // ============================================================
  //  Reporte de Mercado Pago (liberaciones "settlement" o "cobros")
  // ============================================================
  P.mpMovimientos = (aoa, filename) => {
    let hRow = 0;
    for (let i = 0; i < Math.min(10, aoa.length); i++) {
      const r = (aoa[i] || []).map(U.normPlain);
      if (r.includes('tipo de operacion') || r.includes('estado de la operacion (status)')) { hRow = i; break; }
    }
    const H = (aoa[hRow] || []).map(c => String(c == null ? '' : c).trim());
    const c = (...al) => colByAlias(H, al);
    const idx = {
      tipo: c('TIPO DE OPERACIÓN'), estadoCobros: c('Estado de la operación (status)'), tipoCobros: c('Tipo de operación (operation_type)'),
      canal: c('CANAL DE VENTA'), valor: c('VALOR DE LA COMPRA', 'Valor del producto (transaction_amount)'),
      comisiones: c('COMISIONES + IVA'), comisionML: c('COMISIÓN DE MERCADO LIBRE + IVA', 'Comisión de Mercado Libre (marketplace_fee)'),
      neto: c('MONTO NETO DE LA OPERACIÓN', 'Monto recibido (net_received_amount)'),
      iibb: c('IMPUESTOS COBRADOS POR RETENCIONES DE IIBB'), detalleImp: c('DETALLE DE IMPUESTOS'), impDesagregados: c('IMPUESTOS DESAGREGADOS'),
      cupon: c('CUPÓN DE DESCUENTO', 'Descuento (coupon_amount)'), envio: c('COSTO DE ENVÍO', 'Costo de envío (shipping_cost)'),
      cuotas: c('CUOTAS', 'Cuotas (installments)'), medio: c('MEDIO DE PAGO', 'Medio de pago (payment_type)'),
      sku: c('CÓDIGO DE PRODUCTO SKU', 'SKU Producto (seller_custom_field)'),
      numId: c('NÚMERO DE IDENTIFICACIÓN'), orden: c('ID DE LA ORDEN', 'Número de venta en Mercado Libre (order_id)'),
      paquete: c('ID DEL PAQUETE', 'Pack ID (pack_id)'),
      liberacion: c('FECHA CORTA DE LIBERACIÓN DE DINERO', 'Fecha de liberación del pago (date_released_short)', 'FECHA DE LIQUIDACIÓN DEL DINERO'),
      origen: c('FECHA DE ORIGEN', 'Fecha de compra (date_created)'),
      liquidado: c('LIQUIDADO'), pagador: c('PAGADOR'), segmento: c('DETALLE DEL SEGMENTO'),
      cuenta: c('CÓDIGO DE LA CUENTA DEL VENDEDOR'),
    };
    if (idx.neto === -1) throw new Error('Al archivo de Mercado Pago le falta la columna del monto neto.');
    const formato = idx.tipo !== -1 ? 'liberaciones' : 'cobros';
    const g = (f, k) => idx[k] === -1 ? '' : f[idx[k]];
    const t = (f, k) => { const v = g(f, k); return U.isEmpty(v) ? '' : String(v).trim().replace(/^"+|"+$/g, ''); };
    const idTxt = v => { if (U.isEmpty(v)) return ''; const s = String(v).trim(); return /^\d+(\.0+)?$/.test(s) ? s.replace(/\.0+$/, '') : s; };

    let generado = P.fechaDesdeNombre(filename);
    let sellerId = P.sellerIdFromName(filename);
    const movs = [];
    for (let i = hRow + 1; i < aoa.length; i++) {
      const f = aoa[i] || [];
      if (!f.some(x => !U.isEmpty(x))) continue;
      let tipo = t(f, 'tipo');
      const canal = t(f, 'canal');
      if (formato === 'cobros') {
        const st = U.normPlain(t(f, 'estadoCobros'));
        if (st === 'rejected' || st === 'cancelled') continue;
        const op = U.normPlain(t(f, 'tipoCobros'));
        tipo = op === 'regular_payment' ? 'Pago aprobado' : (op || 'Otro');
      }
      const tn = U.normPlain(tipo);
      const pagador = U.normPlain(t(f, 'pagador'));
      const seg = U.normPlain(t(f, 'segmento'));
      let clase = 'otro';
      const esML = U.normPlain(canal) === 'mercado libre' || (formato === 'cobros' && !U.isEmpty(g(f, 'orden')));
      if (tn.startsWith('cashback cancel')) clase = 'cashback_cancelado';
      else if (tn.startsWith('cashback')) clase = 'cashback';
      else if (tn === 'reclamo') clase = esML ? 'reclamo' : 'otro';
      else if (tn === 'pago aprobado' && esML) clase = 'venta';
      else if (tn === 'payouts') clase = 'retiro';
      else if (tn === 'propina') clase = 'pago';
      else if (seg.includes('intra mp') || seg.includes('transfer')) clase = 'transferencia';
      else if (['qr', 'nfc', 'bill payments', 'point'].some(x => seg.includes(x)) || seg.startsWith('transport') || seg.startsWith('wallet')) clase = 'pago';
      const neto = U.num(g(f, 'neto'));
      if (clase === 'otro' && tn === 'pago aprobado') clase = neto < 0 ? 'pago' : 'ingreso';
      const liqTxt = U.normPlain(t(f, 'liquidado'));
      const cuenta = t(f, 'cuenta');
      if (cuenta) sellerId = cuenta;
      const origen = U.parseFechaFlexible(g(f, 'origen'));
      movs.push({
        clase, tipo, canal,
        valor: U.num(g(f, 'valor')), comisiones: U.num(g(f, 'comisiones')), comisionML: U.num(g(f, 'comisionML')),
        neto, iibb: U.num(g(f, 'iibb')), detalleImp: t(f, 'detalleImp'),
        iibbPorEntidad: (() => {
          const raw = g(f, 'impDesagregados');
          if (U.isEmpty(raw)) return null;
          try {
            const arr = JSON.parse(String(raw));
            if (!Array.isArray(arr) || !arr.length) return null;
            return arr.map(x => ({ entidad: String(x.financial_entity || ''), monto: U.num(x.amount) })).filter(x => x.monto);
          } catch (e) { return null; }
        })(),
        cupon: U.num(g(f, 'cupon')), envio: U.num(g(f, 'envio')),
        cuotas: parseInt(t(f, 'cuotas'), 10) || null, medio: t(f, 'medio'),
        sku: t(f, 'sku'), numId: idTxt(g(f, 'numId')), orden: idTxt(g(f, 'orden')), paquete: idTxt(g(f, 'paquete')),
        liberacion: U.parseFechaFlexible(g(f, 'liberacion')),
        liquidado: liqTxt === 'true' ? true : liqTxt === 'false' ? false : null,
        origen, esFlexBonif: clase.startsWith('cashback') && pagador.includes('flex'),
      });
    }
    if (!generado) {
      const fs = movs.map(m => m.origen).filter(Boolean);
      generado = fs.length ? new Date(Math.max(...fs)) : null;
    }
    return { movs, formato, generado, sellerId };
  };

  // ============================================================
  //  Pestañas de la planilla (ANALISIS DE PRODUCTOS / AUXILIAR)
  // ============================================================
  const filasConEncabezado = (aoa, claves) => {
    // Encabezado: primera fila (de las primeras 10) que tenga alguna de las claves
    let h = 0;
    for (let i = 0; i < Math.min(10, aoa.length); i++) {
      const r = (aoa[i] || []).map(U.normPlain);
      if (claves.some(k => r.includes(U.normPlain(k)))) { h = i; break; }
    }
    return { H: (aoa[h] || []).map(x => String(x == null ? '' : x).trim()), filas: aoa.slice(h + 1) };
  };

  P.titulares = (aoa) => {
    const { H, filas } = filasConEncabezado(aoa, ['PRODUCTO']);
    const c = (...al) => colByAlias(H, al);
    const i = {
      producto: c('PRODUCTO'), costo: c('COSTO PESOS TOTAL', 'PRECIO PARAGUAI  + SERGIO PY', 'PRECIO PARAGUAI + SERGIO PY'),
      vendedor: c('Vendedor', 'Vendedores', 'Dueño', 'Titular'), dolar: c('Dolar hoy'), precioPY: c('Precio PY $'),
      precioPub: c('PRECIO PUBILCADO', 'PRECIO PUBLICADO'), stock: c('Stock'), estado: c('Estado'), volumen: c('Volumen ventas'),
      margen: c('Margen final de venta'), score: c('Score IA'), link: c('Link PY'), fecha: c('FECHA inclusion', 'Fecha inclusión'),
    };
    if (i.producto === -1) throw new Error('No encontramos la columna PRODUCTO en TITULARES.');
    let dolar = null;
    const productos = [];
    for (const f of filas) {
      if (i.dolar !== -1 && dolar == null) { const d = U.numOrNull(f[i.dolar]); if (d) dolar = d; }
      const nombre = U.isEmpty(f[i.producto]) ? '' : String(f[i.producto]).replace(/[\r\n]+/g, ' ').trim();
      if (!nombre) continue;
      productos.push({
        nombre, key: U.norm(nombre),
        costo: i.costo !== -1 ? U.numOrNull(f[i.costo]) : null,
        vendedor: i.vendedor !== -1 && !U.isEmpty(f[i.vendedor]) ? String(f[i.vendedor]).trim().toUpperCase() : null,
        precioPY: i.precioPY !== -1 ? U.numOrNull(f[i.precioPY]) : null,
        precioPublicado: i.precioPub !== -1 ? U.numOrNull(f[i.precioPub]) : null,
        stock: i.stock !== -1 ? U.numOrNull(f[i.stock]) : null,
        estadoStock: i.estado !== -1 && !U.isEmpty(f[i.estado]) ? String(f[i.estado]).trim() : null,
        volumen: i.volumen !== -1 && !U.isEmpty(f[i.volumen]) ? String(f[i.volumen]).trim() : null,
        margenPlanilla: i.margen !== -1 ? U.numOrNull(f[i.margen]) : null,
        score: i.score !== -1 ? U.numOrNull(f[i.score]) : null,
        linkPY: i.link !== -1 && !U.isEmpty(f[i.link]) ? String(f[i.link]).trim() : null,
        fechaInclusion: i.fecha !== -1 ? U.parseFechaFlexible(f[i.fecha]) : null,
      });
    }
    return { productos, dolar, columnas: { stock: i.stock !== -1, precioPY: i.precioPY !== -1, precioPublicado: i.precioPub !== -1 } };
  };

  P.mapping = (aoa) => {
    const { H, filas } = filasConEncabezado(aoa, ['NOMBRE MELI', 'Título de la publicación']);
    const iT = colByAlias(H, ['NOMBRE MELI', 'Título de la publicación']);
    const iO = colByAlias(H, ['PRODUCTO ORIGINAL', 'titulo_original', 'Producto']);
    if (iT === -1 || iO === -1) throw new Error('No se encontraron las columnas de MAPPING (PRODUCTO ORIGINAL / NOMBRE MELI).');
    const map = new Map();
    for (const f of filas) {
      if (U.isEmpty(f[iT]) || U.isEmpty(f[iO])) continue;
      map.set(U.norm(f[iT]), String(f[iO]).replace(/[\r\n]+/g, ' ').trim());
    }
    return map;
  };

  P.excepciones = (aoa) => {
    const { H, filas } = filasConEncabezado(aoa, ['Vendedor']);
    const iD = colByAlias(H, ['Fecha desde', 'Desde']), iH = colByAlias(H, ['Fecha hasta', 'Hasta']);
    const iV = colByAlias(H, ['Vendedor']), iA = colByAlias(H, ['Articulo', 'Artículo', 'Producto original', 'Producto']);
    if (iV === -1 || iA === -1) return [];
    const out = [];
    for (const f of filas) {
      if (U.isEmpty(f[iV]) || U.isEmpty(f[iA])) continue;
      const desde = iD !== -1 ? U.parseFechaFlexible(f[iD]) : null;
      const hasta = iH !== -1 ? U.parseFechaFlexible(f[iH]) : null;
      out.push({ producto: U.norm(f[iA]), vendedor: String(f[iV]).trim().toUpperCase(), desde,
        hasta: hasta ? new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate(), 23, 59, 59) : null });
    }
    return out;
  };

  // PEDIDOS: historial de compras. En AUXILIAR viene con "Costo" (ARS); en ANALISIS viene
  // "Precio PY $" + "Cantidad" y el costo se calcula igual que la planilla: precio x 1,1 x dólar.
  P.pedidos = (aoa, dolar, anioRef) => {
    const { H, filas } = filasConEncabezado(aoa, ['PRODUCTO']);
    const c = (...al) => colByAlias(H, al);
    const i = { fecha: c('Fecha'), producto: c('PRODUCTO'), costo: c('Costo'), precio: c('Precio PY $'), cantidad: c('Cantidad'),
      vendedor: c('Vendedor'), proveedor: c('Proveedor'), estado: c('Estado') };
    if (i.fecha === -1 || i.producto === -1) return [];
    const out = [];
    for (const f of filas) {
      if (U.isEmpty(f[i.producto])) continue;
      const fecha = U.parseFechaCortaConAnio(f[i.fecha], anioRef);
      if (!fecha) continue;
      const precio = i.precio !== -1 ? U.numOrNull(f[i.precio]) : null;
      let costo = i.costo !== -1 ? U.numOrNull(f[i.costo]) : null;
      if (costo == null && precio != null && dolar) costo = precio * 1.1 * dolar;
      if (costo == null) continue;
      out.push({ fecha, producto: U.norm(f[i.producto]), nombre: String(f[i.producto]).trim(), costo, precioPY: precio,
        cantidad: i.cantidad !== -1 ? U.numOrNull(f[i.cantidad]) : null,
        vendedor: i.vendedor !== -1 && !U.isEmpty(f[i.vendedor]) ? String(f[i.vendedor]).trim().toUpperCase() : null,
        proveedor: i.proveedor !== -1 && !U.isEmpty(f[i.proveedor]) ? String(f[i.proveedor]).trim() : null });
    }
    return out;
  };

  // GASTOS GRUPALES: Miembro, Mes, "<categoría> C1|C2|C3"
  P.gastosGrupales = (aoa) => {
    const { H, filas } = filasConEncabezado(aoa, ['Miembro']);
    const iM = colByAlias(H, ['Miembro']), iMes = colByAlias(H, ['Mes']);
    if (iM === -1 || iMes === -1) return null;
    const cols = [];
    H.forEach((h, k) => {
      const m = U.normPlain(h).match(/^(.*)\s+c(\d{1,2})$/);
      if (m) cols.push({ k, categoria: m[1].trim(), slot: +m[2] - 1 });
    });
    if (!cols.length) return null;
    const out = {}; // miembro -> mes -> [{categoria, slot, monto}]
    for (const f of filas) {
      if (U.isEmpty(f[iM]) || U.isEmpty(f[iMes])) continue;
      const miembro = String(f[iM]).trim().toUpperCase();
      const mes = U.normPlain(f[iMes]);
      const items = cols.map(c => ({ categoria: c.categoria, slot: c.slot, monto: U.num(f[c.k]) })).filter(x => x.monto);
      (out[miembro] = out[miembro] || {})[mes] = items;
    }
    return out;
  };

  // "Consulta stock" (o una pestaña STOCK espejo): stock físico, en camino, rotos, venta mensual
  P.stock = (aoa) => {
    const { H, filas } = filasConEncabezado(aoa, ['PRODUCTO']);
    const c = (...al) => colByAlias(H, al);
    const i = {
      fecha: c('Fecha'), vendedor: c('Vendedor'), producto: c('PRODUCTO'), fisico: c('Stock Fisico', 'Stock físico'),
      camino: colByPrefix(H, 'Stock en Camino'), total: c('Stock TOTAL'), precioCompra: c('Precio compra final'),
      rotos: c('Rotos en stock'), ventaMensual: c('Venta mensual promedio'), estado: c('Estado de STOCK'),
      aComprar: c('Cantidad a Comprar'),
    };
    if (i.producto === -1 || (i.fisico === -1 && i.total === -1)) return null;
    const caminoHeader = i.camino !== -1 ? H[i.camino] : '';
    let ultimaAct = null;
    const items = [];
    for (const f of filas) {
      const prod = U.isEmpty(f[i.producto]) ? '' : String(f[i.producto]).trim();
      if (!prod) continue;
      const m = prod.match(/ultima act\.?\s*(\d{1,2})[-/](\d{1,2})/i);
      if (m) { ultimaAct = ultimaAct || `${m[1].padStart(2, '0')}/${m[2].padStart(2, '0')}`; continue; }
      if (/ultimo analisis|último análisis/i.test(prod)) continue;
      if (i.vendedor !== -1 && U.isEmpty(f[i.vendedor]) && U.isEmpty(f[i.fisico])) continue;
      const fisico = i.fisico !== -1 ? U.numOrNull(f[i.fisico]) : null;
      const camino = i.camino !== -1 ? U.numOrNull(f[i.camino]) : null;
      let total = i.total !== -1 ? U.numOrNull(f[i.total]) : null;
      if (total == null) total = (fisico || 0) + (camino || 0);
      items.push({
        producto: U.norm(prod), nombre: prod,
        vendedor: i.vendedor !== -1 && !U.isEmpty(f[i.vendedor]) ? String(f[i.vendedor]).trim().toUpperCase() : null,
        fisico, camino, total, rotos: i.rotos !== -1 ? U.numOrNull(f[i.rotos]) : null,
        precioCompraUSD: i.precioCompra !== -1 ? U.numOrNull(f[i.precioCompra]) : null,
        ventaMensualPlanilla: i.ventaMensual !== -1 ? U.numOrNull(f[i.ventaMensual]) : null,
        estadoPlanilla: i.estado !== -1 && !U.isEmpty(f[i.estado]) ? String(f[i.estado]).trim() : null,
        aComprarPlanilla: i.aComprar !== -1 ? U.numOrNull(f[i.aComprar]) : null,
      });
    }
    return { items, ultimaAct, caminoHeader };
  };

  // CUOTAS (ANALISIS): precio contado, en cuántas cuotas se publica y el mínimo para ganar lo mismo en cuotas
  P.cuotas = (aoa) => {
    const { H, filas } = filasConEncabezado(aoa, ['Producto']);
    const c = (...al) => colByAlias(H, al);
    const i = { prod: c('Producto'), contado: c('Precio CONTADO'), rent: c('Rentabilidad precio contado%', 'Rentabilidad precio contado'),
      cuotas: c('CUOTAS'), minimo: c('MINIMO PARA MISMA RENT EN CUOTAS', 'Mínimo para misma rent en cuotas') };
    if (i.prod === -1 || i.cuotas === -1) return new Map();
    const out = new Map();
    for (const f of filas) {
      if (U.isEmpty(f[i.prod])) continue;
      const cuotas = String(f[i.cuotas] || '').trim();

    // Mapeo por SKU: si un título no está en MAPPING pero su SKU ya apareció mapeado, es el mismo producto
    const skuAProducto = new Map();
    for (const v of ventas) if (v.producto && v.sku) skuAProducto.set(v.sku, v.productoNombre);
    for (const v of ventas) if (!v.producto && v.sku && skuAProducto.has(v.sku)) {
      v.productoNombre = skuAProducto.get(v.sku); v.producto = U.norm(v.productoNombre); v.mapeo = 'sku';
    }
    // Dueño, costo, ganancia
    for (const v of ventas) {
      v.dueño = null; v.dueñoFuente = null; v.costoU = null; v.costoFuente = null;
      if (v.producto) {
        const d = dueñoPara(model, v.producto, v.fecha, perfil.id);
        v.dueño = d.dueño; v.dueñoFuente = d.fuente;
        const c = costoParaFecha(model, v.producto, v.fecha);
        v.costoU = c.costo; v.costoFuente = c.fuente; v.costoFecha = c.fecha;
      }
      v.esMia = v.dueño === perfil.id;
    }
    // Precio $0 por falla del export (no cancelada): promedio del mismo producto+dueño
    const preciosCorregidos = [];
    const grupos = U.groupBy(ventas.filter(v => !v.excluida && v.producto && !v.esCabeceraPaquete), v => v.producto + '|' + v.dueño);
    // Se completan TODOS los componentes con el promedio por unidad del producto (comisión, envío, impuestos…),
    // así la cascada «facturación → te deposita Meli» sigue cerrando con estas ventas.
    const COMP = ['ingresos', 'cargo', 'costoFijo', 'costoCuotas', 'ingresosEnvio', 'costoEnvio', 'envioMedidas', 'difMedidas', 'impuestos', 'bonif', 'anulaciones', 'noDetallado', 'total'];
    for (const arr of grupos.values()) {
      const con = arr.filter(v => v.ingresos > 0), sin = arr.filter(v => v.ingresos === 0 && v.unidades > 0);
      if (!sin.length || !con.length) continue;
      const u = U.sum(con, v => v.unidades);
      const prom = {}; for (const k of COMP) prom[k] = U.sum(con, v => v[k] || 0) / u;
      for (const v of sin) {
        for (const k of COMP) v[k] = prom[k] * v.unidades;
        v.precioCorregido = true;
        preciosCorregidos.push(v);
      }
    }
    for (const v of ventas) {
      v.neto = v.total - v.flex;                  // lo que queda después de Meli y del flex
      v.ganancia = (v.producto && v.costoU != null && !v.esCabeceraPaquete) ? v.neto - v.costoU * v.unidades : null;
      v.margen = (v.ganancia != null && v.ingresos) ? v.ganancia / v.ingresos : null;
    }

    const validas = ventas.filter(v => !v.excluida && !v.esCabeceraPaquete);
    const excluidas = ventas.filter(v => v.excluida && !v.esCabeceraPaquete);
    const mias = validas.filter(v => v.esMia);
    const miasConCosto = mias.filter(v => v.ganancia != null);
    const terceras = validas.filter(v => !v.esMia && v.dueño);
    const sinProducto = validas.filter(v => !v.producto);

    // ---------- 2. Período ----------
    const fechas = ventas.map(v => v.fecha).filter(Boolean);
    const desde = fechas.length ? U.startOfDay(new Date(Math.min(...fechas))) : null;
    const hasta = fechas.length ? U.startOfDay(new Date(Math.max(...fechas))) : null;
    const dias = desde ? U.daysBetween(desde, hasta) + 1 : 0;
    const meses = [];
    if (desde) {
      let cur = new Date(desde.getFullYear(), desde.getMonth(), 1);
      while (cur <= hasta) {
        const y = cur.getFullYear(), m = cur.getMonth(), dim = U.daysInMonth(y, m);
        const ini = new Date(Math.max(cur, desde)), fin = new Date(Math.min(new Date(y, m, dim), hasta));
        const cubiertos = U.daysBetween(ini, fin) + 1;
        meses.push({ anio: y, mes: m, nombre: U.MESES_NOMBRE[m], diasCubiertos: cubiertos, diasEnMes: dim, proporcion: Math.min(1, cubiertos / dim) });
        cur = new Date(y, m + 1, 1);
      }
    }
    const parcial = meses.some(m => m.proporcion < 0.999);

    // ---------- 3. Totales ----------
    const S = (arr, k) => U.sum(arr, v => v[k]);
    const facturacion = S(validas, 'ingresos');
    const facturacionMia = S(mias, 'ingresos');
    const facturacionTerceros = S(terceras, 'ingresos');
    const facturacionSinProducto = S(sinProducto, 'ingresos');
    const facturacionFinal = U.sum(ventas.filter(v => v.tipoEstado !== 'cancelada' && !v.esCabeceraPaquete), v => v.ingresos);
    const unidades = S(validas, 'unidades');
    const pedidos = validas.length;

    // Cascada (solo tus productos con costo)
    const base = miasConCosto;
    const fact = S(base, 'ingresos');
    const comision = S(base, 'cargo') + S(base, 'costoFijo') + S(base, 'costoCuotas');
    const enviosME = S(base, 'costoEnvio') + S(base, 'envioMedidas') + S(base, 'difMedidas') + S(base, 'ingresosEnvio');
    const noDetallado = S(base, 'noDetallado');
    const impuestos = S(base, 'impuestos');
    const bonif = S(base, 'bonif');
    const anul = S(base, 'anulaciones');
    const depositaMeli = S(base, 'total');
    const flexMio = S(base, 'flex');
    const cogs = U.sum(base, v => v.costoU * v.unidades);
    const gananciaBruta = depositaMeli - flexMio - cogs;

    // Devoluciones / cancelaciones (de tus productos)
    const excMias = excluidas.filter(v => v.esMia);
    const impactoFinalizadas = U.sum(excMias.filter(v => v.tipoEstado !== 'devolucion_curso'), v => v.total - v.flex);
    const flexEnCurso = U.sum(excMias.filter(v => v.tipoEstado === 'devolucion_curso'), v => v.flex);
    const enSuspenso = U.sum(excMias.filter(v => v.tipoEstado === 'devolucion_curso'), v => v.total);
    const impactoDevoluciones = impactoFinalizadas - flexEnCurso;

    // ---------- 4. Gastos grupales ----------
    const gastos = E.gastosGrupales(model.gastos, perfil, cuentas.map(c => c.cuenta), meses, op.gastosModo);
    const gastosTotal = gastos ? gastos.total : 0;
    const gananciaNeta = gananciaBruta + impactoDevoluciones - gastosTotal;

    // Cobros MP (si hay) — también nos da el detalle exacto de cupones
    const cobros = E.cobros(cuentas, ventas, perfil);

    const waterfall = [
      { id: 'fact', label: 'Facturación de tus productos', value: fact, kind: 'start' },
      { id: 'com', label: 'Comisión de Meli', value: comision, kind: 'delta' },
      { id: 'env', label: 'Envíos cobrados por Meli', value: enviosME, kind: 'delta' },
    ];
    if (cobros && cobros.cuponesMios) {
      waterfall.push({ id: 'cup', label: 'Cupones de descuento', value: cobros.cuponesMios, kind: 'delta', hint: 'Cupones que pagás vos (según Mercado Pago)' });
      const resto = noDetallado - cobros.cuponesMios;
      if (Math.abs(resto) >= 1) waterfall.push({ id: 'otros', label: 'Reclamos y otros ajustes', value: resto, kind: 'delta' });
    } else if (Math.abs(noDetallado) >= 1) {
      waterfall.push({ id: 'cup', label: 'Cupones y otros descuentos', value: noDetallado, kind: 'delta', hint: 'Diferencia que Meli no detalla en columnas. Con el reporte de Mercado Pago se separan los cupones.' });
    }
    waterfall.push({ id: 'imp', label: 'Impuestos retenidos (IIBB)', value: impuestos, kind: 'delta' });
    if (bonif) waterfall.push({ id: 'bon', label: 'Bonificación flex de Meli', value: bonif, kind: 'delta' });
    if (Math.abs(anul) >= 1) waterfall.push({ id: 'anu', label: 'Anulaciones y reembolsos', value: anul, kind: 'delta' });
    waterfall.push({ id: 'dep', label: 'Te deposita Meli', value: depositaMeli, kind: 'subtotal' });
    if (flexMio) waterfall.push({ id: 'flex', label: 'Flex (logística)', value: -flexMio, kind: 'delta' });
    waterfall.push({ id: 'cogs', label: 'Mercadería (costo)', value: -cogs, kind: 'delta' });
    waterfall.push({ id: 'gb', label: 'Ganancia de tus productos', value: gananciaBruta, kind: 'subtotal' });
    if (Math.abs(impactoDevoluciones) >= 1) waterfall.push({ id: 'dev', label: 'Devoluciones y cancelaciones', value: impactoDevoluciones, kind: 'delta' });
    if (gastos) waterfall.push({ id: 'gas', label: gastos.esPromedio ? 'Gastos grupales (estimado)' : 'Gastos grupales', value: -gastosTotal, kind: 'delta' });
    waterfall.push({ id: 'neta', label: 'Ganancia neta', value: gananciaNeta, kind: 'end' });

    const de100 = fact > 0 ? [
      { id: 'gan', label: 'Ganancia', value: gananciaBruta },
      { id: 'merc', label: 'Mercadería', value: cogs },
      { id: 'com', label: 'Comisión Meli', value: -comision },
      { id: 'env', label: 'Envíos', value: -(enviosME + bonif) + flexMio },
      { id: 'imp', label: 'Cupones e impuestos', value: -(noDetallado + impuestos + anul) },
    ].map(x => Object.assign(x, { share: x.value / fact })) : [];

    // ---------- 5. Productos ----------
    const productos = E.productos(validas, model, perfil, op, desde, hasta, dias);

    // ---------- 6. Terceros ----------
    const terceros = [];
    for (const [dueño, arr] of U.groupBy(terceras, v => v.dueño)) {
      const prods = [];
      for (const [k, a] of U.groupBy(arr, v => v.producto)) {
        prods.push({ nombre: a[0].productoNombre, ventas: a.length, unidades: S(a, 'unidades'), facturacion: S(a, 'ingresos'), transferir: S(a, 'neto') });
      }
      prods.sort((a, b) => b.transferir - a.transferir);
      terceros.push({ dueño, nombre: perfilDe(dueño).nombre, ventas: arr.length, unidades: S(arr, 'unidades'), facturacion: S(arr, 'ingresos'), transferir: S(arr, 'neto'), productos: prods });
    }
    terceros.sort((a, b) => b.transferir - a.transferir);

    // ---------- 7. Series ----------
    const diario = [];
    if (desde) {
      const idx = new Map();
      for (let i = 0; i < dias; i++) {
        const d = U.addDays(desde, i);
        const o = { fecha: d, key: U.dayKey(d), pedidos: 0, unidades: 0, facturacion: 0, ganancia: 0, cancel: 0 };
        diario.push(o); idx.set(o.key, o);
      }
      for (const v of validas) { const o = v.fecha && idx.get(U.dayKey(v.fecha)); if (!o) continue; o.pedidos++; o.unidades += v.unidades; o.facturacion += v.ingresos; if (v.esMia && v.ganancia != null) o.ganancia += v.ganancia; }
      for (const v of excluidas) { const o = v.fecha && idx.get(U.dayKey(v.fecha)); if (o) o.cancel++; }
      let acF = 0, acG = 0;
      for (const o of diario) { acF += o.facturacion; acG += o.ganancia; o.acumFact = acF; o.acumGan = acG; }
    }
    const heat = Array.from({ length: 7 }, () => Array(24).fill(0));
    for (const v of validas) if (v.fecha) heat[v.fecha.getDay()][v.fecha.getHours()]++;
    const semanas = [];
    for (let i = 0; i < diario.length; i += 7) {
      const tramo = diario.slice(i, i + 7);
      semanas.push({ desde: tramo[0].fecha, hasta: tramo[tramo.length - 1].fecha, dias: tramo.length,
        pedidos: U.sum(tramo, d => d.pedidos), unidades: U.sum(tramo, d => d.unidades), facturacion: U.sum(tramo, d => d.facturacion), ganancia: U.sum(tramo, d => d.ganancia) });
    }

    // Una fila por cada cuenta incluida (aunque no haya tenido ventas válidas)
    const porCuenta = cuentas.map(cta => {
      const arr = validas.filter(v => v.cuenta === cta.cuenta);
      const mias = arr.filter(v => v.esMia), conC = mias.filter(v => v.ganancia != null);
      const fC = S(conC, 'ingresos'), g = S(conC, 'ganancia');
      const mp = cobros && cobros.porCuenta ? cobros.porCuenta.get(cta.cuenta) || { liberado: 0, pendiente: 0 } : null;
      return {
        cuenta: cta.cuenta, tieneMP: !!(cta.mp && cta.mp.movs && cta.mp.movs.length),
        pedidos: arr.length, unidades: S(arr, 'unidades'), facturacion: S(arr, 'ingresos'),
        facturacionMia: S(mias, 'ingresos'), facturacionTerceros: S(arr.filter(v => !v.esMia), 'ingresos'),
        deposita: S(arr, 'total'), flex: S(arr, 'flex'), ganancia: g, margen: fC ? g / fC : null,
        liberado: mp && cta.mp ? mp.liberado : null, pendiente: mp && cta.mp ? mp.pendiente : null,
      };
    }).sort((a, b) => b.facturacion - a.facturacion);
    const porMes = meses.length > 1 ? meses.map(m => {
      const arr = validas.filter(v => v.fecha && v.fecha.getMonth() === m.mes && v.fecha.getFullYear() === m.anio);
      const conC = arr.filter(v => v.esMia && v.ganancia != null);
      const f = U.sum(conC, v => v.ingresos);
      return { nombre: m.nombre, anio: m.anio, dias: m.diasCubiertos, pedidos: arr.length, unidades: S(arr, 'unidades'), facturacion: S(arr, 'ingresos'), ganancia: U.sum(conC, v => v.ganancia), margen: f ? U.sum(conC, v => v.ganancia) / f : null };
    }) : null;

    // ---------- 8. Envíos ----------
    const envios = E.envios(validas, excluidas, model);

    // ---------- 9. Stock ----------
    const stock = E.stock(model, validas, perfil, op, dias, cuentas.map(c => c.cuenta));

    // ---------- 10. KPIs ----------
    const ritmoDiario = dias ? { facturacion: facturacion / dias, ganancia: gananciaBruta / dias, unidades: unidades / dias } : null;
    let proyeccion = null;
    if (parcial && meses.length === 1 && dias) {
      const m = meses[0];
      proyeccion = { mes: m.nombre, diasEnMes: m.diasEnMes, facturacion: facturacion / dias * m.diasEnMes, gananciaBruta: gananciaBruta / dias * m.diasEnMes,
        unidades: unidades / dias * m.diasEnMes };
    }
    const kpis = {
      facturacion, facturacionMia, facturacionTerceros, facturacionSinProducto, facturacionFinal, unidades, pedidos,
      ticket: pedidos ? facturacion / pedidos : null, precioUnidad: unidades ? facturacion / unidades : null,
      depositaMeliTodas: S(validas, 'total'), flexTodas: S(validas, 'flex'), netoTodas: S(validas, 'neto'),
      costoOperativo: facturacion ? (facturacion - S(validas, 'neto')) / facturacion : null,
      gananciaBruta, cogs, margen: fact ? gananciaBruta / fact : null, gananciaNeta, margenNeto: fact ? gananciaNeta / fact : null,
      gastos: gastosTotal, impactoDevoluciones, enSuspenso, transferirTerceros: U.sum(terceros, t => t.transferir),
      cancelaciones: excluidas.filter(v => v.tipoEstado === 'cancelada').length,
      devoluciones: excluidas.filter(v => v.tipoEstado !== 'cancelada').length,
      tasaProblemas: ventas.length ? excluidas.length / ventas.filter(v => !v.esCabeceraPaquete).length : 0,
      ads: validas.filter(v => v.ads).length, ritmoDiario, proyeccion,
      factMiaConCosto: fact,
      unidadPromedio: base.length ? (() => { const u = U.sum(base, v => v.unidades) || 1; return { precio: fact / u, comision: -comision / u, envios: (-(enviosME + bonif) + flexMio) / u, cuponesImp: -(noDetallado + impuestos + anul) / u, mercaderia: cogs / u, ganancia: gananciaBruta / u }; })() : null,
      margenFormula: (() => { const fc = base.filter(v => v.costoU != null && v.unidades); const f = U.sum(fc, v => v.ingresos); if (!f) return null;
        return U.sum(fc, v => v.ingresos * (1 - C.PLANILLA_COMISION) - C.PLANILLA_ENVIO_FIJO * v.unidades - v.costoU * v.unidades) / f; })(),
    };

    const R = {
      perfil, cuentas: cuentas.map(c => ({ cuenta: c.cuenta, sellerId: c.sellerId, tieneMP: !!c.mp, ventas: c.ventas.length, generado: c.generado })),
      periodo: { desde, hasta, dias, meses, parcial }, opciones: op, model,
      modo: { mp: !!cobros, flexZona: !!model.tarifa, stock: !!stock, planilla: model.tipo, origen: model.origen },
      ventas, validas, excluidas, mias, terceras, sinProducto, preciosCorregidos,
      kpis, waterfall, de100, productos, terceros, gastos, diario, semanas, heat, envios, stock, cobros, porCuenta, porMes,
      devoluciones: { lista: excluidas.slice().sort((a, b) => (b.fecha || 0) - (a.fecha || 0)), devueltasCobradas: validas.filter(v => v.devueltaCobrada),
        impactoFinalizadas, flexEnCurso, enSuspenso, impacto: impactoDevoluciones },
      repetidas, avisos,
    };
    R.alertas = E.alertas(R);
    R.insights = RV.insights ? RV.insights.build(R) : [];
    return R;
  };

  // ============================================================
  E.gastosGrupales = (gastos, perfil, cuentasIncluidas, meses, modo) => {
    if (!gastos) return null;
    const fila = gastos[perfil.id];
    if (!fila) return null;
    // Columna C1, C2… de cada cuenta del perfil (por su orden) y si entra en este reporte
    const slots = perfil.cuentas.map(c => cuentasIncluidas.includes(c));
    if (!slots.some(Boolean)) slots[0] = true;
    const cuentasGastos = perfil.cuentas.map((c, i) => ({ cuenta: c, col: 'C' + (i + 1), incluida: slots[i] }));
    const sumMes = (items) => {
      const porCat = {};
      for (const it of items || []) if (slots[it.slot]) porCat[it.categoria] = (porCat[it.categoria] || 0) + it.monto;
      return porCat;
    };
    const conDatos = Object.entries(fila).map(([mes, items]) => ({ mes, porCat: sumMes(items) }))
      .filter(x => U.sum(Object.values(x.porCat)) > 0);
    const promedio = {};
    if (conDatos.length) {
      for (const x of conDatos) for (const [k, v] of Object.entries(x.porCat)) promedio[k] = (promedio[k] || 0) + v / conDatos.length;
    }
    const porCat = {}; let esPromedio = false; const detalleMeses = [];
    for (const m of meses) {
      const prop = modo === 'completo' ? 1 : m.proporcion;
      const datos = sumMes(fila[U.normPlain(m.nombre)]);
      const tiene = U.sum(Object.values(datos)) > 0;
      const fuente = tiene ? datos : promedio;
      if (!tiene) esPromedio = true;
      for (const [k, v] of Object.entries(fuente)) porCat[k] = (porCat[k] || 0) + v * prop;
      detalleMeses.push({ nombre: m.nombre, proporcion: prop, diasCubiertos: m.diasCubiertos, diasEnMes: m.diasEnMes, estimado: !tiene, total: U.sum(Object.values(fuente)) * prop });
    }
    const nombreCat = k => ({ 'insumos': 'Insumos', 'gastos externos': 'Gastos externos de Meli', 'roturas en pedidos': 'Roturas en pedidos',
      'contador': 'Contador', 'mono': 'Monotributo', 'ingresos brutos': 'Ingresos brutos' }[k] || U.capitalize(k));
    const items = Object.entries(porCat).map(([k, v]) => ({ categoria: nombreCat(k), monto: v })).filter(x => x.monto > 0).sort((a, b) => b.monto - a.monto);
    const total = U.sum(items, x => x.monto);
    if (!total && !conDatos.length) return null;
    return { total, items, esPromedio, meses: detalleMeses, modo, cuentas: cuentasGastos };
  };

  // ============================================================
  E.productos = (validas, model, perfil, op, desde, hasta, dias) => {
    const out = [];
    const grupos = U.groupBy(validas.filter(v => v.producto), v => v.producto + '|' + v.dueño);
    const totalFact = U.sum(validas, v => v.ingresos) || 1;
    for (const [, arr] of grupos) {
      const v0 = arr[0];
      const u = U.sum(arr, v => v.unidades) || 0;
      const fact = U.sum(arr, v => v.ingresos);
      const neto = U.sum(arr, v => v.neto);
      const conCosto = arr.filter(v => v.costoU != null);
      const uC = U.sum(conCosto, v => v.unidades);
      const costoU = uC ? U.sum(conCosto, v => v.costoU * v.unidades) / uC : null;
      const ganancia = conCosto.length ? U.sum(conCosto, v => v.ganancia) : null;
      const factC = U.sum(conCosto, v => v.ingresos);
      const margen = (ganancia != null && factC) ? ganancia / factC : null;
      // Estructura de costos por unidad para el precio sugerido
      const ing = fact || 1;
      const tasaCom = -U.sum(arr, v => v.cargo + v.costoFijo + v.costoCuotas) / ing;
      const tasaImp = -U.sum(arr, v => v.impuestos) / ing;
      const tasaCup = -U.sum(arr, v => v.noDetallado + v.anulaciones) / ing;
      const envioU = u ? (-U.sum(arr, v => v.costoEnvio + v.envioMedidas + v.difMedidas + v.ingresosEnvio + v.bonif) + U.sum(arr, v => v.flex)) / u : 0;
      const precioPara = (m) => {
        if (costoU == null) return null;
        const den = 1 - tasaCom - tasaImp - tasaCup - m;
        return den > 0.05 ? (costoU + envioU) / den : null;
      };
      const precios = arr.map(v => v.unidades ? v.ingresos / v.unidades : null).filter(x => x);
      const ordenadas = arr.slice().sort((a, b) => a.fecha - b.fecha);
      const ult = ordenadas[ordenadas.length - 1];
      const serie = [];
      if (desde) { for (let i = 0; i < dias; i++) serie.push(0); for (const v of arr) if (v.fecha) { const k = U.daysBetween(desde, v.fecha); if (k >= 0 && k < dias) serie[k] += v.unidades; } }
      const p = model.productos.get(v0.producto) || {};
      out.push({
        key: v0.producto, nombre: v0.productoNombre, dueño: v0.dueño, esMio: v0.esMia,
        ventas: arr.length, unidades: u, facturacion: fact, share: fact / totalFact,
        precioProm: u ? fact / u : null, precioMin: precios.length ? Math.min(...precios) : null, precioMax: precios.length ? Math.max(...precios) : null,
        precioUlt: ult && ult.unidades ? ult.ingresos / ult.unidades : null,
        netoU: u ? neto / u : null, costoU, gananciaU: (u && costoU != null) ? neto / u - costoU : null, ganancia, margen,
        costoFuente: conCosto.some(v => v.costoFuente === 'pedido') ? 'pedido' : (conCosto.length ? 'titulares' : null),
        precioObjetivo: precioPara(op.objetivo), precioVerde: precioPara(op.verde),
        margenFormula: (costoU != null && u && fact) ? ((fact / u) * (1 - C.PLANILLA_COMISION) - C.PLANILLA_ENVIO_FIJO - costoU) / (fact / u) : null,
        porPublicacion: [...U.groupBy(arr, v => v.titulo).entries()].map(([t, a]) => ({ titulo: t, ids: U.uniq(a.map(v => v.publicacion).filter(Boolean)), unidades: U.sum(a, v => v.unidades), facturacion: U.sum(a, v => v.ingresos) })).sort((a, b) => b.unidades - a.unidades),
        tasaCom, tasaImp, tasaCup, envioU,
        flex: arr.filter(v => v.esFlex).length, ads: arr.filter(v => v.ads).length, sinCosto: arr.length - conCosto.length,
        serie, precioPublicadoPlanilla: p.precioPublicado || null, margenPlanilla: p.margenPlanilla != null ? p.margenPlanilla : null,
        precioPY: p.precioPY || null, volumen: p.volumen || null, linkPY: p.linkPY || null,
        cuentas: U.uniq(arr.map(v => v.cuenta)), publicaciones: U.uniq(arr.map(v => v.titulo)),
        ventasLista: ordenadas,
      });
    }
    out.sort((a, b) => (b.ganancia || 0) - (a.ganancia || 0) || b.unidades - a.unidades);
    return out;
  };

  // ============================================================
  E.envios = (validas, excluidas, model) => {
    const flex = validas.filter(v => v.esFlex), correo = validas.filter(v => !v.esFlex);
    const horas = arr => arr.map(v => (v.fechaEntregado && v.fecha) ? (v.fechaEntregado - v.fecha) / 3600000 : null).filter(x => x != null && x >= 0 && x < 24 * 40);
    const porProvincia = [];
    for (const [prov, arr] of U.groupBy(validas, v => v.provincia || 'Sin dato')) porProvincia.push({ provincia: prov, ventas: arr.length, unidades: U.sum(arr, v => v.unidades), facturacion: U.sum(arr, v => v.ingresos) });
    porProvincia.sort((a, b) => b.ventas - a.ventas);
    const porZona = [];
    // Por zona se cuentan ENVÍOS (dos ventas que viajaron juntas pagan un solo flex), igual que en el total
    for (const [z, arr] of U.groupBy(flex.filter(v => v.flexZona), v => v.flexZona)) porZona.push({ zona: z, ventas: arr.length, envios: arr.filter(v => v.flex > 0).length, costo: U.sum(arr, v => v.flex) });
    porZona.sort((a, b) => b.envios - a.envios || b.ventas - a.ventas);
    const sinTarifa = [];
    for (const v of validas.concat(excluidas)) if (v.esFlex && v.flexFuente === 'promedio') sinTarifa.push(v);
    const transportistas = [];
    for (const [t, arr] of U.groupBy(correo.filter(v => v.transportista), v => v.transportista)) transportistas.push({ nombre: t, ventas: arr.length });
    transportistas.sort((a, b) => b.ventas - a.ventas);
    const hF = horas(flex), hC = horas(correo);
    return {
      flex: { ventas: flex.length, envios: flex.filter(v => v.flex > 0).length, compartidos: flex.filter(v => v.flexCompartido).length,
        costo: U.sum(flex, v => v.flex), bonif: U.sum(flex, v => v.bonif), prom: flex.some(v => v.flex > 0) ? U.sum(flex, v => v.flex) / flex.filter(v => v.flex > 0).length : null,
        horasMediana: U.median(hF), mismoDia: hF.length ? hF.filter(h => h <= 14).length / hF.length : null, entregadas: hF.length },
      correo: { ventas: correo.length, costo: -U.sum(correo, v => v.costoEnvio + v.envioMedidas + v.difMedidas), prom: correo.length ? -U.sum(correo, v => v.costoEnvio + v.envioMedidas + v.difMedidas) / correo.length : null,
        horasMediana: U.median(hC), entregadas: hC.length },
      porProvincia, porZona, sinTarifa, sinTarifaCPs: U.uniq(sinTarifa.map(v => v.cp).filter(Boolean)), transportistas,
      tarifaFuente: model.tarifaFuente,
    };
  };

  // ============================================================
  E.stock = (model, validas, perfil, op, dias, incluidas) => {
    if (!model.stock) return null;
    const cuentasFuera = incluidas ? perfil.cuentas.filter(c => !incluidas.includes(c)) : [];
    const vendidas = new Map();
    for (const v of validas) if (v.producto) vendidas.set(v.producto, (vendidas.get(v.producto) || 0) + v.unidades);
    const filas = [];
    const claves = new Set();
    for (const [k, it] of model.stock) {
      const p = model.productos.get(k) || {};
      const dueño = it.vendedor || p.vendedor;
      if (dueño !== perfil.id) continue;
      claves.add(k);
    }
    // también productos tuyos vendidos que no están en la hoja de stock
    for (const v of validas) if (v.esMia && v.producto && !model.stock.has(v.producto)) claves.add(v.producto);
    for (const k of claves) {
      const it = model.stock.get(k) || null;
      const p = model.productos.get(k) || {};
      const total = it ? (it.total != null ? it.total : (it.fisico || 0) + (it.camino || 0)) : null;
      const u = vendidas.get(k) || 0;
      const vDia = dias ? u / dias : 0;
      const cobertura = (total != null && vDia > 0) ? total / vDia : null;
      let estado;
      if (total == null) estado = 'SIN DATO';
      else if (total <= 0 && vDia > 0) estado = 'SIN STOCK';
      else if (total <= 0) estado = 'AGOTADO';
      else if (vDia === 0) estado = 'QUIETO';
      else if (cobertura < C.STOCK_PEDIR_YA_DIAS) estado = 'PEDIR YA';
      else if (cobertura < C.STOCK_REVISAR_DIAS) estado = 'REVISAR';
      else estado = 'OK';
      // Costo de compra por unidad en dólares: precio en Paraguay + el recargo de Sergio PY
      // (si no hay precio PY, el costo en pesos de la planilla pasado a dólares)
      const precioPY = p.precioPY || (it && it.precioCompraUSD ? it.precioCompraUSD / (1 + C.RECARGO_SERGIO_PY) : null);
      const costoUSDu = precioPY ? precioPY * (1 + C.RECARGO_SERGIO_PY) : (p.costo && model.dolar ? p.costo / model.dolar : null);
      filas.push({
        key: k, nombre: (it && it.nombre) || p.nombre || k, fisico: it ? it.fisico : null, camino: it ? it.camino : null, total,
        rotos: it ? it.rotos : null, vendidas: u, ventaDia: vDia, ventaMesReal: vDia * 30, ventaMesPlanilla: it ? it.ventaMensualPlanilla : null,
        cobertura, estado, estadoPlanilla: it ? it.estadoPlanilla : (p.estadoStock || null), costoUSDu,
        aComprarPlanilla: it && it.aComprarPlanilla > 0 ? it.aComprarPlanilla : null, // «Cantidad a Comprar» de Consulta stock (referencia)
        valorARS: (total != null && p.costo != null) ? Math.max(0, total) * p.costo : null,
        valorUSD: (total != null && costoUSDu != null) ? Math.max(0, total) * costoUSDu : null,
      });
    }
    const orden = { 'SIN STOCK': 0, 'PEDIR YA': 1, 'REVISAR': 2, 'OK': 3, 'QUIETO': 4, 'AGOTADO': 5, 'SIN DATO': 6 };
    filas.sort((a, b) => (orden[a.estado] - orden[b.estado]) || ((a.cobertura ?? 1e9) - (b.cobertura ?? 1e9)) || b.vendidas - a.vendidas);
    const cuenta = e => filas.filter(f => f.estado === e).length;
    return {
      filas, fuente: model.stockFuente, ultimaAct: model.stockUltimaAct,
      unidades: U.sum(filas, f => Math.max(0, f.total || 0)), valorARS: U.sum(filas, f => f.valorARS || 0), valorUSD: U.sum(filas, f => f.valorUSD || 0),
      sinStock: cuenta('SIN STOCK'), pedirYa: cuenta('PEDIR YA'), revisar: cuenta('REVISAR'), quietos: filas.filter(f => f.estado === 'QUIETO'),
      cuentasFuera,
    };
  };

  // ============================================================
  E.cobros = (cuentas, ventas, perfil) => {
    const conMP = cuentas.filter(c => c.mp && c.mp.movs && c.mp.movs.length);
    if (!conMP.length) return null;
    const porId = new Map();
    for (const v of ventas) if (!v.esCabeceraPaquete) porId.set(v.id, v);
    const out = {
      generado: null, porVenta: new Map(), liberado: { mio: 0, terceros: {}, total: 0 }, pendiente: { mio: 0, terceros: {}, total: 0 },
      calendario: new Map(), vencidas: [], cashbackFlex: { liberado: 0, pendiente: 0, n: 0 }, cashbackOtros: 0,
      otrosPeriodos: { n: 0, monto: 0 }, iibb: new Map(), cuotas: new Map(), medios: new Map(), otrosMovs: new Map(),
      cuponesMios: 0, cuponesTotal: 0, diferencias: [], formato: conMP[0].mp.formato, tieneLiquidado: false,
      porCuenta: new Map(), // cuenta -> { liberado, pendiente } (ventas y reclamos)
    };
    const vencPorVenta = new Map();
    const provNombre = s => {
      const m = U.normPlain(s).match(/iibb_(.*)/);
      if (!m) return s || 'Otra';
      return m[1].split('_').map(w => w === 'de' || w === 'del' ? w : U.capitalize(w)).join(' ')
        .replace('Cordoba', 'Córdoba').replace('Entre Rios', 'Entre Ríos').replace('Tucuman', 'Tucumán').replace('Neuquen', 'Neuquén').replace('Rio Negro', 'Río Negro')
        .replace('Buenos Aires', 'Buenos Aires').replace('Caba', 'CABA').replace('Capital Federal', 'CABA');
    };
    for (const c of conMP) {
      const gen = c.mp.generado;
      if (gen && (!out.generado || gen > out.generado)) out.generado = gen;
      const corte = gen || new Date();
      for (const m of c.mp.movs) {
        if (m.liquidado !== null) out.tieneLiquidado = true;
        const liberada = m.liquidado !== null ? m.liquidado : (m.liberacion ? m.liberacion <= corte : true);
        if (m.clase === 'cashback' || m.clase === 'cashback_cancelado') {
          if (m.esFlexBonif) { out.cashbackFlex.n += m.clase === 'cashback' ? 1 : -1; if (liberada) out.cashbackFlex.liberado += m.neto; else out.cashbackFlex.pendiente += m.neto; }
          else out.cashbackOtros += m.neto;
          continue;
        }
        if (m.clase === 'venta' || m.clase === 'reclamo') {
          const v = porId.get(m.numId) || porId.get(m.orden) || porId.get(m.paquete);
          if (!v) { out.otrosPeriodos.n++; out.otrosPeriodos.monto += m.neto; continue; }
          let pv = out.porVenta.get(v.id);
          if (!pv) { pv = { neto: 0, cupon: 0, iibb: 0, liberado: 0, pendiente: 0, fechas: [], cuotas: null, medio: null }; out.porVenta.set(v.id, pv); }
          pv.neto += m.neto; pv.cupon += m.cupon; pv.iibb += m.iibb;
          if (m.clase === 'venta') { pv.cuotas = pv.cuotas || m.cuotas; pv.medio = pv.medio || m.medio; }
          const dueño = v.dueño || perfil.id;
          const bolsa = liberada ? out.liberado : out.pendiente;
          if (liberada) pv.liberado += m.neto; else { pv.pendiente += m.neto; if (m.liberacion) pv.fechas.push(m.liberacion); }
          if (dueño === perfil.id) bolsa.mio += m.neto; else bolsa.terceros[dueño] = (bolsa.terceros[dueño] || 0) + m.neto;
          bolsa.total += m.neto;
          const pc = out.porCuenta.get(c.cuenta) || { liberado: 0, pendiente: 0 };
          if (liberada) pc.liberado += m.neto; else pc.pendiente += m.neto;
          out.porCuenta.set(c.cuenta, pc);
          if (!liberada && m.liberacion) {
            const k = U.dayKey(m.liberacion);
            const e = out.calendario.get(k) || { fecha: U.startOfDay(m.liberacion), monto: 0, ventas: new Set(), vencida: false };
            e.monto += m.neto; e.ventas.add(v.id); e.vencida = e.vencida || (gen && m.liberacion < U.startOfDay(gen));
            out.calendario.set(k, e);
            // Vencido = fecha de liberación anterior al reporte y sin liquidar. Se junta por venta (venta + reclamo),
            // así el total coincide con los días en amarillo del calendario.
            if (gen && m.liberacion < U.startOfDay(gen) && m.liquidado === false) {
              const x = vencPorVenta.get(v.id) || { venta: v, monto: 0, fecha: m.liberacion, reclamo: false };
              x.monto += m.neto; if (m.liberacion < x.fecha) x.fecha = m.liberacion; if (m.clase === 'reclamo') x.reclamo = true;
              vencPorVenta.set(v.id, x);
            }
          }
          if (m.iibbPorEntidad && m.iibbPorEntidad.length) {
            for (const x of m.iibbPorEntidad) { const p = provNombre('iibb_' + x.entidad); out.iibb.set(p, (out.iibb.get(p) || 0) + x.monto); }
          } else if (m.iibb) { const p = provNombre(m.detalleImp); out.iibb.set(p, (out.iibb.get(p) || 0) + m.iibb); }
          continue;
        }
        const k = m.clase;
        const e = out.otrosMovs.get(k) || { clase: k, n: 0, entra: 0, sale: 0 };
        e.n++; if (m.neto >= 0) e.entra += m.neto; else e.sale += m.neto;
        out.otrosMovs.set(k, e);
      }
    }
    for (const [id, pv] of out.porVenta) {
      const v = porId.get(id);
      v.mp = pv;
      out.cuponesTotal += pv.cupon;
      if (v.esMia && !v.excluida && v.ganancia != null) out.cuponesMios += pv.cupon;
      if (!v.excluida) {
        if (pv.cuotas) out.cuotas.set(pv.cuotas, (out.cuotas.get(pv.cuotas) || 0) + 1);
        if (pv.medio) out.medios.set(pv.medio, (out.medios.get(pv.medio) || 0) + 1);
        const dif = (v.total - v.bonif) - pv.neto;
        if (Math.abs(dif) > 1 && Math.abs(v.total - pv.neto) > 1) out.diferencias.push({ venta: v, meli: v.total - v.bonif, mp: pv.neto, dif });
      }
    }
    out.sinMP = ventas.filter(v => !v.esCabeceraPaquete && !v.excluida && !out.porVenta.has(v.id) && conMP.some(c => c.cuenta === v.cuenta));
    out.calendarioLista = [...out.calendario.values()].sort((a, b) => a.fecha - b.fecha).map(e => Object.assign(e, { ventas: e.ventas.size }));
    out.vencidas = [...vencPorVenta.values()].filter(x => x.monto > 0.5).sort((a, b) => a.fecha - b.fecha);
    out.iibbLista = [...out.iibb.entries()].map(([provincia, monto]) => ({ provincia, monto })).sort((a, b) => a.monto - b.monto);
    out.cuotasLista = [...out.cuotas.entries()].map(([cuotas, n]) => ({ cuotas, n })).sort((a, b) => a.cuotas - b.cuotas);
    out.mediosLista = [...out.medios.entries()].map(([medio, n]) => ({ medio, n })).sort((a, b) => b.n - a.n);
    const nombresClase = { retiro: 'Retiros a tu banco', transferencia: 'Transferencias a otras cuentas', pago: 'Pagos con QR, tarjeta y servicios', ingreso: 'Otros ingresos', otro: 'Otros' };
    out.otrosLista = [...out.otrosMovs.values()].map(e => Object.assign(e, { nombre: nombresClase[e.clase] || e.clase, neto: e.entra + e.sale })).sort((a, b) => a.neto - b.neto);
    return out;
  };

  // ============================================================
  E.alertas = (R) => {
    const A = [];
    const sinMapeo = U.groupBy(R.sinProducto, v => v.titulo);
    if (sinMapeo.size) {
      const prods = [...R.model.productos.values()];
      const items = [...sinMapeo.entries()].map(([t, arr]) => {
        let best = null;
        for (const p of prods) { const s = U.similarity(t, p.nombre); if (!best || s > best.s) best = { s, p }; }
        return { titulo: t, ventas: arr.length, facturacion: U.sum(arr, v => v.ingresos), sugerido: best && best.s >= 0.45 ? best.p.nombre : null, confianza: best ? best.s : 0 };
      }).sort((a, b) => b.facturacion - a.facturacion);
      A.push({ nivel: 'critico', id: 'sinmapeo', titulo: `${U.plural(sinMapeo.size, 'publicación', 'publicaciones')} sin mapear`,

    }
    if (R.repetidas && R.repetidas.length) {
      const pares = U.uniq(R.repetidas.map(x => x.cuentas.join(' y ')));

    if (R.avisos && R.avisos.length) A.push({ nivel: 'atencion', id: 'paquetes', titulo: `${U.plural(R.avisos.length, 'venta en paquete', 'ventas en paquete')} sin detalle de productos`,

    if (R.cobros) {

        items: R.cobros.vencidas.map(x => ({ titulo: (x.venta.productoNombre || x.venta.titulo), extra: `${U.fmtMoney(x.monto)} · liberaba el ${U.fmtDate(x.fecha)} · venta ${x.venta.id}${x.reclamo ? ' · con reclamo' : ''}` })) });
    }

    if (asumidos.length) A.push({ nivel: 'atencion', id: 'sindueño', titulo: `${U.plural(asumidos.length, 'producto', 'productos')} sin vendedor en TITULARES`, detalle: `Se tomaron como tuyos (${R.perfil.nombre}). Si son de otra persona, cargá el vendedor.`, items: asumidos.map(n => ({ titulo: n })) });

      detalle: 'Con el precio de este período quedaron en rojo. Abajo, el precio aproximado para llegar al objetivo.',

    const sinCuenta = files.some(f => (f.kind === 'ml' || f.kind === 'mp') && !f.cuenta && !f.error && f.parsed);
    const ayuda = !st.perfil ? 'Elegí tu perfil y cargá al menos el Excel de ventas.'
      : sinCuenta ? 'Elegí de qué cuenta es cada archivo.'
      : estado.some(c => c.tieneVentas) && !incluidas.length ? 'Marcá al menos una cuenta.'
      : !listo ? 'Falta el Excel de ventas de Meli.'
      : `Con ${incluidas.length === 1 ? 'la cuenta' : 'las cuentas'} ${RV.app.listaY(incluidas.map(c => c.cuenta))}.`;
    return `<div class="loader-grid">
      <div>
        <div class="loader-intro">
          <h1>${hayReporte ? 'Cambiá archivos o perfil' : 'Tu mes en Mercado Libre, de punta a punta'}</h1>
          <p class="lede">Soltá el Excel de ventas de Meli y, si querés, el de Mercado Pago del mismo período. Se cruzan solos con la planilla: costos, dueños, flex y stock.</p>
        </div>
        <div class="step-label"><b>1</b>¿Quién sos?</div>
        <div class="profiles" role="group" aria-label="Perfil">${perfilesHTML}</div>
        <div class="step-label"><b>2</b>Tus reportes</div>
        <label class="dropzone" id="dropzone">
          <span class="dz-icon">${icon('i-up')}</span>
          <span><span class="dz-title">Arrastrá acá los Excel (podés soltar varios juntos)</span><span class="dz-sub" style="display:block">Ventas de Meli de una o varias cuentas · Cobros de Mercado Pago (opcional) · .xlsx</span></span>
          <input type="file" id="file-input" accept=".xlsx,.xls" multiple aria-label="Elegir archivos de Excel">
        </label>
        <details class="ayuda-archivos">
          <summary>¿De dónde saco cada archivo?</summary>
          <ul>
            <li><b>Ventas de Meli</b> (obligatorio): el Excel de ventas que bajás desde «Ventas» en Mercado Libre, uno por cuenta y del mismo período. Se llama parecido a <span class="mono">…Ventas_AR_Mercado_Libre…xlsx</span>. No lo abras ni lo edites antes de soltarlo.</li>
            <li><b>Cobros de Mercado Pago</b> (opcional): en Mercado Pago, «Informes y facturación» → «Reportes de ventas y extractos de cuenta» → «Liquidaciones» → «Crear reporte», con el mismo período. Te avisa por mail cuando está listo; se llama <span class="mono">settlement_v2-…xlsx</span>.</li>
            <li><b>Planilla de costos y stock</b>: no hace falta si ANALISIS DE PRODUCTOS está conectada (cuadro de la derecha). Si no, bajala de Google Sheets como Excel y soltala acá.</li>
          </ul>
        </details>
        ${files.length ? `<div class="files">${files.map(fileRow).join('')}</div>` : ''}
        ${perfil ? R_.cuentasBloque(st, perfil, estado) : ''}
        ${st.error ? `<div class="err-box" role="alert">${esc(st.error)}</div>` : ''}
        <div class="loader-actions">
          <button class="btn btn-primary" type="button" data-action="generar" ${listo ? '' : 'disabled'}>${hayReporte ? 'Actualizar reporte' : 'Ver mi reporte'}</button>
          ${hayReporte ? '<button class="btn btn-ghost" type="button" data-action="cerrar-carga">Cancelar</button>' : ''}
          <span class="small muted">${esc(ayuda)}</span>
        </div>
      </div>
      <div class="loader-side">
        <div class="card side-card">
          <h3>Planilla de costos y stock</h3>
          ${planilla}
          ${vivoMal && st.modelStatus === 'ok' ? `<p class="small" style="margin-top:10px;color:var(--warn-ink)">${icon('i-alert')} ${esc(st.vivoError.msg)}</p>` : ''}
          <div class="loader-actions" style="margin-top:12px">
            ${vivoMal ? `<button class="btn btn-sm btn-primary" type="button" data-action="conectar-vivo">${icon('i-link')}Arreglar la conexión</button>` : ''}
            ${RV.app.puedeDrive() && st.driveState !== 'granted'
              ? `<button class="btn btn-sm" type="button" data-action="conectar-drive">${icon('i-link')}Leer ANALISIS DE PRODUCTOS desde Drive</button>`
              : RV.app.puedeVivo() && !st.conexion
                ? `<button class="btn btn-sm btn-primary" type="button" data-action="conectar-vivo">${icon('i-link')}Conectar en vivo</button><span class="small muted">o soltá la planilla .xlsx</span>`
                : `<button class="btn btn-sm" type="button" data-action="recargar-planilla">${icon('i-refresh')}Volver a leer</button>`}
            ${RV.app.puedeVivo() && st.conexion && !vivoMal ? `<button class="btn btn-sm btn-ghost" type="button" data-action="conectar-vivo">${icon('i-link')}Conexión en vivo</button>` : ''}
          </div>
        </div>
        <div class="card side-card">
          <h3>Qué archivos sirven</h3>
          <ul>
            <li><b>Ventas de Meli</b>: el Excel que bajás de Ventas (se llama <span class="mono">Ventas_AR_…_NÚMERO.xlsx</span>).</li>
            <li><b>Mercado Pago</b>: el reporte <span class="mono">settlement_v2-NÚMERO-….xlsx</span> del mismo período. Suma liberado, por liberar, cupones e IIBB.</li>
            <li><b>ANALISIS DE PRODUCTOS</b>: ${RV.app.puedeVivo() ? 'con la conexión en vivo no hace falta; si no, bajala como .xlsx (Archivo → Descargar) y soltala una vez: queda guardada.' : 'se lee sola por Drive; si no, bajala como .xlsx y soltala.'}</li>
          </ul>
        </div>
      </div>
    </div>`;
  };

  // Tarjetas de cuentas del perfil: se marca/desmarca cuáles entran en el reporte
  R_.cuentasBloque = (st, perfil, estado) => {
    const conVentas = estado.filter(c => c.tieneVentas);
    const incluidas = estado.filter(c => c.incluida);
    const card = c => {
      const sub = c.tieneVentas
        ? `${U.plural(c.ventas, 'venta', 'ventas')}${c.desde ? ` · ${U.fmtDate(c.desde)} al ${U.fmtDate(c.hasta)}` : ''}${c.mp.length ? ' · con cobros MP' : ''}`
        : c.mp.length ? 'Tiene cobros de MP; falta el Excel de ventas' : 'Sin cargar · tocá para elegir su Excel';
      const tags = (c.compartida.length ? `<span class="tag" title="También la usa ${esc(RV.app.listaY(c.compartida))}">compartida</span>` : '')
        + (!c.enPerfil ? '<span class="tag">de otro perfil</span>' : '') + (c.extra ? '<span class="tag">agregada</span>' : '');
      const tip = c.tieneVentas ? (c.incluida ? 'Incluida: tocá para sacarla del reporte' : 'Afuera: tocá para sumarla al reporte') : 'Elegir el Excel de esta cuenta';
      return `<div class="acct${c.incluida ? ' is-on' : ''}${c.tieneVentas ? '' : ' is-empty'}">
        <button type="button" class="acct-btn" data-action="toggle-cuenta" data-cuenta="${esc(c.cuenta)}" ${c.tieneVentas ? `aria-pressed="${c.incluida}"` : ''} title="${esc(tip + (c.col ? ` · gastos grupales: columnas ${c.col}` : ''))}">
          <span class="acct-box" aria-hidden="true">${c.tieneVentas ? icon('i-check') : icon('i-up')}</span>
          <span class="acct-txt"><span class="acct-n">${esc(c.cuenta)}${tags}</span><span class="acct-s">${esc(sub)}</span></span>
        </button>
        ${c.extra && !c.ml.length && !c.mp.length ? `<button type="button" class="acct-del" data-action="borrar-cuenta" data-cuenta="${esc(c.cuenta)}" aria-label="Quitar la cuenta ${esc(c.cuenta)}" title="Quitar esta cuenta">×</button>` : ''}
      </div>`;
    };
    const puede = perfil.cuentas.length < C.MAX_CUENTAS;
    const extra = st.agregando
      ? `<form class="acct-form" data-form="cuenta" autocomplete="off">
          <label class="sr" for="nueva-cuenta">Nombre de la cuenta nueva</label>
          <input id="nueva-cuenta" maxlength="24" placeholder="Nombre de la cuenta (como figura en Meli)">
          <button class="btn btn-sm btn-primary" type="submit">Agregar</button>
          <button class="btn btn-sm btn-ghost" type="button" data-action="cancelar-cuenta">Cancelar</button>
          <span class="acct-err small" role="alert"></span>
          <span class="small muted acct-note">Queda guardada en este navegador para ${esc(perfil.nombre)}.</span>
        </form>`
      : puede ? `<button type="button" class="acct-add" data-action="agregar-cuenta">+ Agregar cuenta</button>` : '';
    const nota = conVentas.length ? `${incluidas.length} de ${conVentas.length} en el reporte` : U.plural(perfil.cuentas.length, 'cuenta', 'cuentas');
    return `<div class="step-label"><b>3</b>Cuentas del reporte<span class="step-note">${esc(nota)}</span></div>
      <div class="accts" role="group" aria-label="Cuentas de ${esc(perfil.nombre)}">${estado.map(card).join('')}${extra}</div>
      ${conVentas.length > 1 ? '<p class="small muted acct-help">Tocá una cuenta para sacarla del reporte o volver a sumarla. Los gastos grupales siguen a las cuentas que quedan.</p>' : ''}`;
  };

  // Panel «Conectar en vivo» (web): instalación del Apps Script de solo lectura, una sola vez
  // (o su actualización, si ya existe y la última lectura falló)
  const arregloVivo = (ve) => {
    const leer = `<div class="share-actions"><button class="btn btn-primary" type="button" data-action="recargar-planilla">${icon('i-refresh')}Volver a leer</button></div>`;
    if (['viejo', 'servicio', 'alcance'].includes(ve.code)) return `<p>Se arregla en unos 2 minutos, actualizando el código en script.google.com (la URL y el link del equipo no cambian).</p>
      <div class="share-actions"><button class="btn btn-primary" type="button" data-action="vivo-codigo">Ver cómo actualizarla</button></div>`;
    if (ve.code === 'permiso') return `<p><b>Cómo se arregla</b> (elegí una):</p>
      <ol class="pasos-cortos">
        <li><b>Compartir ANALISIS con esa cuenta</b>: abrí ANALISIS DE PRODUCTOS con una cuenta que la edite → <b>Compartir</b> → escribí el mail de la cuenta con la que creaste la conexión (la que aparecía en la pantalla de permisos de Google) → <b>Lector</b> → <b>Enviar</b>. Compartir no cambia nada del contenido de la planilla.</li>
        <li><b>O crear la conexión desde una cuenta que ya abra ANALISIS</b>: tocá «Ver el código y los pasos» y seguí «Crearla de cero».</li>
      </ol>${leer}`;
    if (ve.code === 'cuota') return `<p>Esperá unos minutos y volvé a leer.</p>${leer}`;
    return `<p>Para ver qué pasa: en <a href="https://script.google.com/home" target="_blank" rel="noopener noreferrer">script.google.com</a> abrí el proyecto, arriba elegí la función <b>probar</b> y tocá <b>Ejecutar</b> (Run). Abajo, en el registro, dice si pudo leer y qué hacer.</p>${leer}`;
  };
  R_.conexion = (st) => {
    const cx = st.conexion, ve = RV.app.vivoFallo && RV.app.vivoFallo() ? st.vivoError : null;
    const h = `<div class="drawer-h"><div><div class="small muted">ANALISIS DE PRODUCTOS · solo lectura</div><h3 id="drawer-title">${cx ? 'Conexión en vivo' : 'Conectar en vivo'}</h3></div>
      <button class="icon-btn" type="button" data-action="cerrar-drawer" aria-label="Cerrar">${icon('i-x')}</button></div>`;
    if (cx && !st.verCodigo) {
      const m = st.model;
      const estado = ve
        ? `<div class="err-box" role="alert"><b>La última lectura falló.</b> ${esc(ve.msg)}${ve.detalle ? `<details class="small" style="margin-top:6px"><summary>Lo que dice Google</summary><span class="mono">${esc(ve.detalle)}</span></details>` : ''}</div>${arregloVivo(ve)}`
        : `<div class="ok-box">${icon('i-check')}<span>Este navegador lee ANALISIS DE PRODUCTOS en vivo${m && m.origen === 'vivo' ? ` (última lectura ${esc(U.relTime(m.leidaEn || m.fetchedAt))})` : ''}.</span></div>`;
      return h + `<div class="drawer-b" data-panel="conexion">
        ${estado}
        <div><div class="card-h" style="margin-bottom:6px"><h3 style="font-size:14px">Link para el equipo</h3></div>
          <p class="small muted">Mandalo por WhatsApp a quien tenga que usar la página. Al abrirlo, su navegador queda conectado (no necesita cuenta de Google ni subir nada). Es privado: el que tenga el link puede leer la planilla.${ve ? ' Cuando arregles la conexión, el mismo link sigue sirviendo.' : ''}</p>
          <input class="field mono" id="link-equipo" readonly value="${esc(RV.app.linkInvitacion())}" aria-label="Link para el equipo">
          <div class="share-actions"><button class="btn${ve ? '' : ' btn-primary'}" type="button" data-action="copiar" data-que="link">${icon('i-copy')}Copiar link</button>
          <a class="btn" href="https://wa.me/?text=${encodeURIComponent('Link del reporte de ventas (conectado a ANALISIS): ' + RV.app.linkInvitacion())}" target="_blank" rel="noopener noreferrer">Mandar por WhatsApp</a></div></div>
        <div class="rows">
          <div><span>Volver a leer la planilla ahora</span><span class="r-v"><button class="btn btn-sm" type="button" data-action="recargar-planilla">${icon('i-refresh')}Leer</button></span></div>
          <div><span>Ver el código y los pasos otra vez</span><span class="r-v"><button class="btn btn-sm" type="button" data-action="vivo-codigo">Ver</button></span></div>
          <div><span>Desconectar este navegador</span><span class="r-v"><button class="btn btn-sm btn-ghost" type="button" data-action="vivo-desconectar">Desconectar</button></span></div>
        </div>
        <p class="small muted">Para cortar el acceso de todos: en script.google.com cambiá la clave del código, creá una versión nueva y mandá el link nuevo.</p>
      </div>`;
    }
    const clave = cx ? cx.clave : st.claveEnCurso;
    const paso = (n, html) => `<li><span class="paso-n">${n}</span><div>${html}</div></li>`;
    const codigo = `<div class="share-actions"><button class="btn btn-sm btn-primary" type="button" data-action="copiar" data-que="codigo">${icon('i-copy')}Copiar código</button></div>
          <details class="code-det"><summary>Ver el código</summary><pre class="code">${esc(RV.app.codigoConexion(clave))}</pre></details>`;
    const manifiesto = `<div class="share-actions"><button class="btn btn-sm" type="button" data-action="copiar" data-que="manifest">${icon('i-copy')}Copiar appsscript.json</button></div>
          <details class="code-det"><summary>Ver appsscript.json</summary><pre class="code">${esc(RV.CODIGO_CONEXION ? RV.CODIGO_CONEXION.manifest : '')}</pre></details>`;
    const verManifiesto = 'Si no aparece en la lista de archivos: engranaje <b>Configuración del proyecto</b> (Project Settings) → marcá «Mostrar el archivo de manifiesto "appsscript.json" en el editor» y volvé al editor <b>(&lt;&gt;)</b>.';
    const probar = 'Arriba, al lado de «Depurar» (Debug), elegí la función <b>probar</b> y tocá <b>Ejecutar</b> (Run). Abajo, en el <b>registro de ejecución</b>, tiene que decir «OK: la conexión puede leer…». Si dice «NO PUDO LEER», ahí mismo dice qué hacer.';
    const permiso = 'Si Google pide permiso: elegí la cuenta; si aparece «Google no verificó esta app» (Google hasn’t verified this app), tocá <b>Configuración avanzada</b> (Advanced) → <b>Ir a Reporte de Ventas – lectura (no seguro)</b> → <b>Permitir</b> (Allow). Tiene que pedir <b>solo</b> «Ver todas tus hojas de cálculo» (See all your Google Sheets spreadsheets); si pide editar, el appsscript.json no es el de acá.';
    const form = (boton) => `<form class="vivo-form" data-form="vivo" autocomplete="off">
            <label class="sr" for="vivo-url">URL de la aplicación web</label>
            <input class="field mono" id="vivo-url" placeholder="https://script.google.com/macros/s/…/exec" value="${cx ? esc(cx.url) : ''}" required>
            <button class="btn btn-primary" type="submit">${boton}</button>
            <span class="vivo-msg small" role="status"></span>
          </form>`;
    if (cx) {
      // Ya existe: actualizar el mismo proyecto (misma URL, misma clave, mismo link del equipo)
      return h + `<div class="drawer-b" data-panel="conexion">
      <p><b>Actualizar la conexión</b> (2 minutos). Se hace en el mismo proyecto de Google: la URL, la clave y el link del equipo quedan iguales.</p>
      <ol class="pasos">
        ${paso(1, 'Entrá a <a href="https://script.google.com/home" target="_blank" rel="noopener noreferrer">script.google.com</a> con la cuenta con la que creaste la conexión y abrí el proyecto <b>«Reporte de Ventas – lectura»</b>.')}
        ${paso(2, `En <span class="mono">Código.gs</span>: borrá todo y pegá el código nuevo (ya trae la misma clave):${codigo}`)}
        ${paso(3, `En <span class="mono">appsscript.json</span>: borrá todo y pegá este (sigue siendo <b>solo lectura</b> y activa «Google Sheets API»). ${verManifiesto}${manifiesto}`)}
        ${paso(4, `Guardá (ícono del disquete). ${probar} ${permiso}`)}
        ${paso(5, '<b>Implementar</b> (Deploy) → <b>Gestionar implementaciones</b> (Manage deployments) → tocá el lápiz <b>Editar</b> (Edit) → en «Versión» elegí <b>Nueva versión</b> (New version) → <b>Implementar</b> (Deploy). Guardar el código solo no alcanza: lo que usa la página es la versión implementada.')}
        ${paso(6, `Volvé acá y probá:${form('Probar de nuevo')}`)}
      </ol>
      <details class="code-det"><summary>Crearla de cero (por ejemplo, desde otra cuenta)</summary>
        <p class="small">Hacé lo mismo en un <b>proyecto nuevo</b> (<a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener noreferrer">crear proyecto</a>) con una cuenta que pueda abrir ANALISIS, y en el paso 5 usá <b>Implementar → Nueva implementación</b>: tipo <b>Aplicación web</b>, Ejecutar como: <b>Yo</b>, Quién tiene acceso: <b>Cualquier usuario</b>. Después pegá la URL nueva en el paso 6 y mandá el link del equipo otra vez.</p>
      </details>
      <p class="small muted">Si algo falla, también podés seguir soltando ANALISIS en .xlsx: la página guarda la última copia.</p>
    </div>`;
    }
    return h + `<div class="drawer-b" data-panel="conexion">
      <p>Se hace <b>una sola vez</b> (5 minutos) desde una cuenta de Google que pueda abrir ANALISIS DE PRODUCTOS. Después la página la lee sola cada vez que se abre, y el resto del equipo solo abre un link.</p>
      <p class="small muted">Es un pequeño programa de Google (Apps Script) que queda en <b>tu</b> Google Drive. Tiene permiso solo para <b>ver</b> hojas de cálculo: no puede modificar, borrar ni compartir nada.</p>
      <ol class="pasos">
        ${paso(1, 'Entrá a <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener noreferrer">script.google.com</a> con una cuenta que pueda abrir ANALISIS DE PRODUCTOS (la cuenta activa se ve arriba a la derecha) y creá un <b>proyecto nuevo</b>. Ponele de nombre «Reporte de Ventas – lectura».')}
        ${paso(2, `Borrá lo que viene escrito en <span class="mono">Código.gs</span> y pegá este código (ya tiene la clave de tu conexión):${codigo}`)}
        ${paso(3, `Abrí <span class="mono">appsscript.json</span> y reemplazá todo por esto (le da permiso <b>solo de lectura</b> y activa «Google Sheets API»). ${verManifiesto}${manifiesto}`)}
        ${paso(4, `Guardá (ícono del disquete). ${probar} ${permiso}`)}
        ${paso(5, 'Arriba a la derecha: <b>Implementar → Nueva implementación</b> (Deploy → New deployment). En el engranaje de «Seleccionar tipo» elegí <b>Aplicación web</b>. Ejecutar como: <b>Yo</b>. Quién tiene acceso: <b>Cualquier usuario</b> (no el que dice «con cuenta de Google»: así el resto del equipo no necesita iniciar sesión). Tocá <b>Implementar</b>.')}
        ${paso(6, `Copiá la <b>URL de la aplicación web</b> (termina en <span class="mono">/exec</span>) y pegala acá:${form('Probar y guardar')}`)}
      </ol>
      <p class="small muted">Si algo falla, también podés seguir soltando ANALISIS en .xlsx: la página guarda la última copia.</p>
    </div>`;
  };

  R_.origenTxt = (m) => {
    if (!m) return '';
    const base = m.origen === 'demo' ? 'Datos de ejemplo' : m.tipo === 'analisis' ? 'ANALISIS DE PRODUCTOS' : 'Planilla auxiliar';
    if (m.restaurado) return base + ' · copia guardada';
    const via = m.origen === 'vivo' ? 'en vivo' : m.origen === 'drive' ? 'Google Drive' : m.origen === 'upload' ? 'archivo subido' : '';
    return base + (via ? ' · ' + via : '');
  };

  // ============================================================
  //  REPORTE
  // ============================================================
  R_.sectionList = (R) => [
    ['resumen', 'Resumen'], ['plata', 'La plata'], ['evolucion', 'Día a día'], ['productos', 'Productos'],
    ['stock', 'Stock'], ['envios', 'Envíos'], ['cobros', 'Cobros'], ['terceros', 'Terceros y gastos'],
    ['alertas', 'Alertas', R.alertas.filter(a => a.nivel !== 'info').length], ['metodo', 'Cómo se calcula'],
  ];
  R_.secnav = (R) => R_.sectionList(R).map(([id, t, n]) => `<a href="#${id}" data-sec="${id}">${esc(t)}${n ? `<span class="count">${n}</span>` : ''}</a>`).join('');

  R_.report = (R, st) => {
    return [R_.resumen(R, st), R_.plata(R), R_.evolucion(R, st), R_.productos(R, st), R_.stock(R, st), R_.envios(R), R_.cobros(R), R_.tercerosGastos(R, st), R_.alertas(R), R_.metodo(R)].join('');
  };

  const periodoTxt = (R) => {
    const { desde, hasta, dias } = R.periodo;
    if (!desde) return '';
    const mismoMes = desde.getMonth() === hasta.getMonth() && desde.getFullYear() === hasta.getFullYear();
    const t = mismoMes ? `${desde.getDate()} al ${hasta.getDate()} de ${U.MESES_NOMBRE[hasta.getMonth()]} ${hasta.getFullYear()}` : `${U.fmtDateLong(desde)} al ${U.fmtDateLong(hasta)} ${hasta.getFullYear()}`;
    return `${t} · ${U.plural(dias, 'día', 'días')}`;
  };
  R_.periodoTxt = periodoTxt;

  // ---------- Resumen ----------
  R_.resumen = (R, st) => {
    const K = R.kpis, op = R.opciones;
    const tone = K.margen == null ? 'ok' : K.margen < op.rojo ? 'crit' : K.margen < op.verde ? 'warn' : 'ok';
    const g = R.gastos;
    const parcialGastos = g && R.periodo.parcial;
    const modoTxt = [R.modo.mp ? 'Meli + Mercado Pago' : 'Solo Meli', R.modo.flexZona ? 'flex por zona' : 'sin tarifario de flex', R.modo.stock ? 'con stock' : null].filter(Boolean);
    const ins = R.insights.slice(0, 4);
    const insHTML = (i) => `<div class="ins t-${i.tono}" ${i.ir ? `data-go="${esc(i.ir)}" role="link" tabindex="0"` : ''}><span class="ins-ic">${i.tono === 'bueno' ? icon('i-up-tr') : i.tono === 'malo' ? icon('i-dn-tr') : i.tono === 'atencion' ? icon('i-alert') : icon('i-info')}</span><div><div class="ins-t">${esc(i.titulo)}</div><div class="ins-x">${esc(i.texto)}</div></div></div>`;
    const ultimo = R.modo.mp ? { l: 'Por liberar en MP', v: $(R.cobros.pendiente.total), s: (() => { const p = R.cobros.calendarioLista.find(e => !e.vencida); return p ? `próxima: ${U.fmtDate(p.fecha)} · ${$c(p.monto)}` : 'sin fechas futuras'; })() }
      : { l: 'Cancelaciones y devoluciones', v: U.fmtInt(K.cancelaciones + K.devoluciones), s: `${pct(K.tasaProblemas)} de las ventas` };
    const tiles = [
      { l: 'Facturación de tus cuentas', v: $(K.facturacion), s: K.facturacionTerceros ? `tuyo ${$c(K.facturacionMia)} · terceros ${$c(K.facturacionTerceros)}` : 'todo de tus productos', sp: R.diario.map(d => d.facturacion) },
      { l: 'Unidades vendidas', v: U.fmtInt(K.unidades), s: `${U.plural(K.pedidos, 'pedido', 'pedidos')} · ${U.fmtDec(K.ritmoDiario ? K.ritmoDiario.unidades : 0, 1)} por día`, sp: R.diario.map(d => d.unidades) },
      { l: 'Ticket promedio', v: $(K.ticket), s: `precio por unidad ${$c(K.precioUnidad)}` },
      { l: 'Te deposita Meli', v: $(K.depositaMeliTodas), s: `Meli se queda el ${pct(K.facturacion ? 1 - K.depositaMeliTodas / K.facturacion : 0)}` },
      { l: 'Costo de mercadería', v: $(K.cogs), s: `${pct(K.factMiaConCosto ? K.cogs / K.factMiaConCosto : 0)} de lo que facturaste` },
      ultimo,
    ];
    return `<section class="section wrap" id="resumen" aria-labelledby="h-resumen">
      <h2 class="sr" id="h-resumen">Resumen</h2>
      <div class="hero-grid">
        <div class="card hero reveal">
          <div class="hero-eyebrow"><span>${esc(periodoTxt(R))}</span>${R.cuentas.map(c => `<span class="tag">${esc(c.cuenta)}</span>`).join('')}${modoTxt.map(t => `<span class="tag acc">${esc(t)}</span>`).join('')}</div>
          <div class="hero-label">Ganancia neta de ${esc(R.perfil.nombre)}${R.perfil.cuentas.length > 1 && R.perfil.cuentas.some(c => !R.cuentas.some(k => k.cuenta === c)) ? ` <span class="muted">· solo ${esc(R.cuentas.map(c => c.cuenta).join(' + '))}</span>` : ''}</div>
          <div class="hero-num ${K.gananciaNeta < 0 ? 'is-neg' : ''}">${$(K.gananciaNeta)}</div>
