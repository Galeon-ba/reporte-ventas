    if (res.sinDato.length) msgs.push(`No figuran en la hoja de stock: ${esc(res.sinDato.map(l => l.nombre).join(', '))}.`);
    if (res.cuentasFuera.length) msgs.push(`La venta del reporte sale solo de ${esc(R.cuentas.map(c => c.cuenta).join(' + '))}; no incluye ${esc(RV.app.listaY(res.cuentasFuera))}.`);
    const resumen = `<div class="ped-sum">
        <div><span class="small muted">Unidades</span><b>${U.fmtInt(res.unidades)}</b></div>
        <div><span class="small muted">Inversión</span><b>${res.usd ? U.fmtUSD(res.usd) : '—'}</b>${res.ars ? `<span class="small muted">≈ ${$(res.ars)}</span>` : ''}</div>
        <div><span class="small muted">Productos</span><b>${U.fmtInt(res.conPedido.length)}</b></div>
        <div class="ped-acc"><button class="btn btn-sm" type="button" data-action="pedido" ${res.conPedido.length ? '' : 'disabled'}>${icon('i-share')}Copiar para WhatsApp</button></div>
      </div>`;
    const resto = res.sinPedido.filter(l => l.mes > 0 || l.stock > 0);
    const lineas = res.conPedido.concat(res.afuera);
    return `${resumen}
      ${msgs.length ? `<ul class="ped-msgs">${msgs.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
      ${lineas.length ? tabla(lineas) : `<div class="ok-box">${icon('i-check')}Con estas opciones no hace falta pedir nada: todo llega a los días pedidos.</div>`}
      ${resto.length ? `<details class="ped-mas"><summary>${U.plural(resto.length, 'producto que no hace falta pedir', 'productos que no hace falta pedir')}</summary>${tabla(resto)}</details>` : ''}
      <p class="small muted ped-pie">Costo = precio en Paraguay + ${U.fmtPct(C.RECARGO_SERGIO_PY, 0)} de Sergio PY${res.dolar ? `, en pesos al dólar de la planilla (${$(res.dolar)})` : ''}. Venta por mes usada = ${esc(RV.pedido.pesoTxt(o.peso))}; con eso se calculan los días que cubre cada producto, por eso pueden diferir un poco de la tabla de arriba (que usa solo el reporte). Lo que viene en camino ya cuenta como stock.${res.hayPlanilla ? ' «En la planilla» es la «Cantidad a Comprar» de Consulta stock, para comparar.' : ''}</p>`;
  };

  // ---------- Envíos ----------
  R_.envios = (R) => {
    const E = R.envios;
    const tot = E.flex.ventas + E.correo.ventas || 1;
    const nEnv = E.flex.envios || E.flex.ventas; // los que viajaron juntos pagan un solo flex
    const flexNeto = nEnv ? (E.flex.costo - E.flex.bonif) / nEnv : null;
    const stats = [
      { l: 'Envíos por flex', v: U.fmtInt(nEnv), s: `${pct(E.flex.ventas / tot, 0)} de las ventas${E.flex.compartidos ? ` · ${U.plural(E.flex.compartidos, 'venta viajó', 'ventas viajaron')} con otra` : ''}` },
      { l: 'Costo flex por envío', v: flexNeto != null ? $(flexNeto) : '—', s: nEnv ? `${$(E.flex.prom)} menos ${$(E.flex.bonif / nEnv)} de bonificación` : '' },
      { l: 'Envíos por correo (Meli)', v: U.fmtInt(E.correo.ventas), s: E.correo.prom != null ? `${$(E.correo.prom)} promedio que cobra Meli` : '' },
      { l: 'Tiempo de entrega (mediana)', v: E.flex.horasMediana != null ? `${U.fmtDec(E.flex.horasMediana, 0)} h flex` : '—', s: E.correo.horasMediana != null ? `${U.fmtDec(E.correo.horasMediana, 0)} h por correo` : '' },
    ];
    const prov = E.porProvincia.slice(0, 10);
    return `<section class="section wrap" id="envios" aria-labelledby="h-env">
      <div class="section-h"><div><h2 id="h-env">Envíos</h2><p>Flex lo pagás aparte (por zona); el correo te lo descuenta Meli en la venta.</p></div></div>
      <div class="stats" style="margin-bottom:1rem">${stats.map(t => `<div class="stat"><div class="stat-l">${esc(t.l)}</div><div class="stat-v">${esc(t.v)}</div><div class="stat-s">${esc(t.s)}</div></div>`).join('')}</div>
      <div class="grid g-12">
        <div class="card span-6"><div class="card-h"><div><h3>A dónde vendiste</h3><div class="sub">Ventas por provincia</div></div></div>
          ${CH.hbars(prov.map(p => ({ label: p.provincia, value: p.ventas, valueLabel: U.plural(p.ventas, 'venta', 'ventas'), sub: $c(p.facturacion) })))}</div>
        <div class="card span-6"><div class="card-h"><div><h3>Flex por zona</h3><div class="sub">Tarifario por código postal de la página${R.model.tarifaAgregados && R.model.tarifaAgregados.length ? ` + ${U.plural(R.model.tarifaAgregados.length, 'CP', 'CP')} de «CPs a AGREGAR»` : ''}</div></div></div>
          ${E.porZona.length ? CH.hbars(E.porZona.map(z => ({ label: z.zona, value: z.envios, valueLabel: `${U.plural(z.envios, 'envío', 'envíos')} · ${$c(z.costo)}`, title: `${z.zona}: ${U.plural(z.envios, 'envío', 'envíos')} (${U.plural(z.ventas, 'venta', 'ventas')}) · ${$(z.costo)}` }))) : '<p class="muted">No hubo envíos por flex.</p>'}
          <div style="margin-top:1.25rem">${CH.segbar([{ label: 'Flex', value: E.flex.ventas, color: 'var(--accent)', ink: 'var(--on-accent)' }, { label: 'Correo', value: E.correo.ventas, color: 'var(--tot)', ink: 'var(--on-tot)' }], { aria: 'Flex contra correo' })}
          <div class="chart-legend"><span><i class="k-end"></i>Flex ${pct(E.flex.ventas / tot, 0)}</span><span><i class="k-bar"></i>Correo ${pct(E.correo.ventas / tot, 0)}</span></div></div>
          ${E.sinTarifaCPs.length ? `<p class="small" style="margin-top:.75rem;color:var(--warn-ink)">${icon('i-alert')} CP de flex sin tarifa (se usó el promedio): ${E.sinTarifaCPs.map(esc).join(', ')}</p>` : `<p class="small muted" style="margin-top:.75rem">${icon('i-check')} Todos los envíos flex tienen su tarifa por código postal.</p>`}
        </div>
      </div>
    </section>`;
  };

  // ---------- Cobros ----------
  R_.cobros = (R) => {
    const Cb = R.cobros;
    const head = `<div class="section-h"><div><h2 id="h-cob">Cobros en Mercado Pago</h2><p>${Cb ? `Foto del reporte de Mercado Pago${Cb.generado ? ' al ' + esc(U.fmtDateTime(Cb.generado)) : ''}: qué ya se liberó, qué falta y de quién es.` : 'Qué plata ya está liberada y cuál falta.'}</p></div></div>`;
    if (!Cb) return `<section class="section wrap" id="cobros" aria-labelledby="h-cob">${head}<div class="empty"><h3>Sumá el reporte de Mercado Pago</h3><p>Soltá el <span class="mono">settlement_v2-…xlsx</span> del mismo período junto con las ventas y vas a ver lo liberado, lo que falta (con fechas), los cupones que pagaste, las retenciones de IIBB por provincia y cómo te pagan los compradores.</p></div></section>`;
    const venc = U.sum(Cb.vencidas, x => x.monto);
    const stats = [
      { l: 'Ya liberado', v: $(Cb.liberado.total), s: `de ventas de este período` },
      { l: 'Por liberar', v: $(Cb.pendiente.total), s: `${U.plural(Cb.calendarioLista.length, 'fecha', 'fechas')} de liberación` },
      { l: 'Vencido sin liberar', v: $(venc), s: Cb.vencidas.length ? U.plural(Cb.vencidas.length, 'venta', 'ventas') : 'nada trabado', cls: venc ? 'is-warn' : '' },
      { l: 'Bonificación flex', v: $(Cb.cashbackFlex.liberado + Cb.cashbackFlex.pendiente), s: Cb.cashbackFlex.pendiente ? `${$(Cb.cashbackFlex.pendiente)} todavía por liberar` : 'todo liberado' },
    ];
    const maxCal = Math.max(1, ...Cb.calendarioLista.map(e => e.monto));
    const cal = Cb.calendarioLista.map(e => `<div class="cal-day ${e.vencida ? 'is-late' : ''}" tabindex="0" data-tip="${esc(U.fmtDateLong(e.fecha))}: ${esc($(e.monto))} de ${e.ventas} ${e.ventas === 1 ? 'venta' : 'ventas'}${e.vencida ? ' (fecha vencida)' : ''}">
      <div class="cal-v">${esc($c(e.monto))}</div><div class="cal-bar" style="height:${(Math.max(4, e.monto / maxCal * 90) / 16).toFixed(3)}rem"></div><div class="cal-d">${e.vencida ? '<span aria-hidden="true">◆ </span>' : ''}${esc(U.fmtWeekday(e.fecha))}<br>${esc(U.fmtDate(e.fecha))}</div></div>`).join('');
    const quien = (b) => [[R.perfil.nombre + ' (vos)', b.mio], ...Object.entries(b.terceros).map(([d, v]) => [RV.engine.perfilDe(d).nombre, v])];
    return `<section class="section wrap" id="cobros" aria-labelledby="h-cob">${head}
      <div class="stats" style="margin-bottom:1rem">${stats.map(t => `<div class="stat ${t.cls || ''}"><div class="stat-l">${esc(t.l)}</div><div class="stat-v">${esc(t.v)}</div><div class="stat-s">${esc(t.s)}</div></div>`).join('')}</div>
      <div class="grid g-12">
        <div class="card span-8"><div class="card-h"><div><h3>Calendario de liberaciones</h3><div class="sub">Plata de ventas de este período que todavía no está disponible${Cb.vencidas.length ? '. En amarillo: la fecha ya pasó y sigue sin liquidar.' : ''}</div></div></div>
          ${cal ? `<div class="cal">${cal}</div>${(() => {
            const fut = Cb.calendarioLista.filter(e => !e.vencida), prox = fut[0], ult = fut[fut.length - 1];
            const dia = e => `${esc(U.fmtWeekday(e.fecha))} ${esc(U.fmtDate(e.fecha))}`;
            return `<div class="cal-foot"><span>Por liberar <b>${$(Cb.pendiente.total)}</b></span>${venc ? `<span>de eso, vencido <b>${$(venc)}</b></span>` : ''}${prox ? `<span>próxima: <b>${dia(prox)}</b> · ${$c(prox.monto)}</span>` : ''}${ult && ult !== prox ? `<span>última: <b>${dia(ult)}</b></span>` : ''}</div>`;
          })()}` : `<div class="ok-box">${icon('i-check')}No queda nada por liberar.</div>`}</div>
        <div class="card span-4"><div class="card-h"><div><h3>De quién es la plata</h3><div class="sub">Neto de Meli, antes del flex</div></div></div>
          <div class="rows">
            <div><span class="ink2 small" style="font-weight:700">Liberado</span><span></span></div>
            ${quien(Cb.liberado).map(([n, v]) => `<div><span>${esc(n)}</span><span class="r-v">${$(v)}</span></div>`).join('')}
            <div><span class="ink2 small" style="font-weight:700">Por liberar</span><span></span></div>
            ${quien(Cb.pendiente).map(([n, v]) => `<div><span>${esc(n)}</span><span class="r-v">${$(v)}</span></div>`).join('')}
            <div><span>Flex de este período (se paga aparte)</span><span class="r-v" style="color:var(--crit-ink)">${U.fmtMoneySigned(-R.kpis.flexTodas)}</span></div>
          </div></div>
        <div class="card span-4"><div class="card-h"><div><h3>Cómo te pagan</h3><div class="sub">Medio de pago de los compradores</div></div></div>
          ${CH.hbars(Cb.mediosLista.slice(0, 6).map(m => ({ label: String(m.medio).replace(/^tarjeta de (d[ée]bito|cr[ée]dito)\s*/i, (x, t) => U.capitalize(t.toLowerCase()) + ' ').trim(), title: m.medio, value: m.n, valueLabel: String(m.n) })))}</div>
        <div class="card span-4"><div class="card-h"><div><h3>En cuántas cuotas</h3><div class="sub">Las cuotas las financia Meli; vos cobrás igual</div></div></div>
          ${CH.hbars(Cb.cuotasLista.map(c => ({ label: c.cuotas === 1 ? 'En un pago' : `${c.cuotas} cuotas`, value: c.n, valueLabel: String(c.n) })))}</div>
        <div class="card span-4"><div class="card-h"><div><h3>Retenciones de IIBB</h3><div class="sub">Por provincia, de todas las ventas cobradas (también las de terceros) · total ${$(Math.abs(U.sum(Cb.iibbLista, x => x.monto)))}</div></div></div>
          ${Cb.iibbLista.length ? CH.hbars(Cb.iibbLista.slice(0, 8).map(x => ({ label: x.provincia, value: Math.abs(x.monto), valueLabel: $(Math.abs(x.monto)), tone: 'muted' }))) : '<p class="muted">Sin retenciones.</p>'}</div>
        ${Cb.otrosLista.length ? `<div class="card span-12"><div class="card-h"><div><h3>Otros movimientos de la cuenta</h3><div class="sub">Lo que no son ventas de Meli: retiros, transferencias y pagos. Solo totales.</div></div></div>
          <div class="tbl-wrap" tabindex="0" role="region" aria-label="Otros movimientos de la cuenta"><table class="tbl"><thead><tr><th>Tipo</th><th>Movimientos</th><th class="hide-sm">Entró</th><th class="hide-sm">Salió</th><th>Neto</th></tr></thead><tbody>
          ${Cb.otrosLista.map(o => `<tr><td>${esc(o.nombre)}</td><td>${U.fmtInt(o.n)}</td><td class="hide-sm">${o.entra ? $(o.entra) : '—'}</td><td class="hide-sm">${o.sale ? $(o.sale) : '—'}</td><td>${$(o.neto)}</td></tr>`).join('')}
          ${Cb.cashbackOtros ? `<tr><td>Bonificaciones de Meli (no flex)</td><td>—</td><td class="hide-sm">${$(Cb.cashbackOtros)}</td><td class="hide-sm">—</td><td>${$(Cb.cashbackOtros)}</td></tr>` : ''}
          </tbody></table></div></div>` : ''}
      </div>
    </section>`;
  };

  // ---------- Terceros, gastos y devoluciones ----------
  R_.tercerosGastos = (R, st) => {
    const g = R.gastos;
    const terc = R.terceros.length ? R.terceros.map(t => `<div style="margin-bottom:1rem">
        <div class="person">${R_.avatar(t.dueño, t.nombre)}<div><div style="font-weight:700">${esc(t.nombre)}</div><div class="small muted">${U.plural(t.unidades, 'unidad', 'unidades')} · facturado ${$(t.facturacion)}</div></div><span style="flex:1"></span><div style="text-align:right"><div class="small muted">a transferir</div><div class="person-big">${$(t.transferir)}</div></div></div>
        <div class="rows" style="margin-top:.5rem">${t.productos.map(p => `<div><span>${esc(p.nombre)} <span class="small muted nowrap">· ${U.plural(p.unidades, 'u', 'u')}</span></span><span class="r-v">${$(p.transferir)}</span></div>`).join('')}</div>
      </div>`).join('') : `<div class="ok-box">${icon('i-check')}No vendiste productos de otros en tus cuentas.</div>`;
    const gas = g ? `<div class="rows">
        ${g.items.map(i => `<div><span>${esc(i.categoria)}</span><span class="r-v">${$(i.monto)}</span></div>`).join('')}
        <div><span class="r-total">Total</span><span class="r-v r-total">${$(g.total)}</span></div></div>
        <p class="small muted" style="margin-top:.625rem">${g.meses.map(m => `${U.capitalize(m.nombre)}: ${m.estimado ? 'sin datos cargados, se usó el promedio de los meses con datos' : (m.proporcion < 0.999 ? `${m.diasCubiertos} de ${m.diasEnMes} días (${pct(m.proporcion, 0)})` : 'mes completo')}`).map(esc).join(' · ')}</p>
        ${R.periodo.parcial ? `<div class="segc" role="group" aria-label="Gastos grupales" style="margin-top:.625rem"><button type="button" data-action="gastos" data-modo="proporcional" aria-pressed="${R.opciones.gastosModo !== 'completo'}">Proporcional</button><button type="button" data-action="gastos" data-modo="completo" aria-pressed="${R.opciones.gastosModo === 'completo'}">Mes completo</button></div>` : ''}`
      : `<p class="muted">No hay gastos grupales cargados para ${esc(R.perfil.nombre)}${R.perfil.cuentas.length > 1 ? ' en las columnas de las cuentas de este reporte' : ' en la planilla'}.</p>`;
    // Qué columnas (C1, C2…) entraron y cuáles no, según las cuentas marcadas
    const cols = R.perfil.cuentas.map((c, i) => ({ c, col: 'C' + (i + 1), dentro: R.cuentas.some(k => k.cuenta === c) }));
    const colsGastos = R.perfil.cuentas.length > 1 ? `<p class="small muted" style="margin-top:.625rem">Entran: ${cols.filter(x => x.dentro).map(x => `${esc(x.c)} (${x.col})`).join(' · ') || '—'}${cols.some(x => !x.dentro) ? `. Quedan afuera: ${cols.filter(x => !x.dentro).map(x => `${esc(x.c)} (${x.col})`).join(' · ')}` : ''}.</p>` : '';
    const dev = R.devoluciones;
    const pillDev = v => v.tipoEstado === 'cancelada' ? '<span class="pill neu"><i aria-hidden="true">–</i>Cancelada</span>' : v.tipoEstado === 'devolucion_curso' ? '<span class="pill warn"><i aria-hidden="true">◆</i>Devolución en curso</span>' : '<span class="pill crit"><i aria-hidden="true">↩</i>Devolución</span>';
    const devRows = dev.lista.map(v => {
      const ajena = !v.esMia && v.dueño; // producto de otro: no toca tu ganancia
      return `<tr><td>${esc(U.fmtDate(v.fecha))}</td><td class="t-name l"><div class="t-name-main">${esc(v.productoNombre || v.titulo)}${ajena ? ` <span class="tag">de ${esc(RV.engine.perfilDe(v.dueño).nombre)}</span>` : ''}${R.cuentas.length > 1 ? ` <span class="tag">${esc(v.cuenta)}</span>` : ''}</div><div class="small muted">${esc(v.estadoDesc || '')}</div><div class="only-sm">${pillDev(v)}</div></td><td class="l hide-sm">${pillDev(v)}</td><td class="hide-sm">${$(v.total)}</td><td class="hide-tab">${v.flex ? U.fmtMoneySigned(-v.flex) : '—'}</td><td>${ajena ? '<span class="muted">no es tuyo</span>' : v.tipoEstado === 'devolucion_curso' ? `<span class="muted">en suspenso</span>` : U.fmtMoneySigned(v.total - v.flex)}</td></tr>`;
    }).join('');
    return `<section class="section wrap" id="terceros" aria-labelledby="h-ter">
      <div class="section-h"><div><h2 id="h-ter">Terceros, gastos y devoluciones</h2><p>Lo que no es tuyo, lo que se paga entre todos y lo que volvió.</p></div></div>
      <div class="grid g-12">
        <div class="card span-6"><div class="card-h"><div><h3>Plata de otros vendedores</h3><div class="sub">Productos de otros que se vendieron en tus cuentas, ya descontado Meli y flex</div></div></div>${terc}</div>
        <div class="card span-6"><div class="card-h"><div><h3>Gastos grupales${g && g.esPromedio ? ' (estimado)' : ''}</h3><div class="sub">De la pestaña GASTOS GRUPALES, solo las columnas de las cuentas de este reporte</div></div></div>${gas}${colsGastos}</div>
        <div class="card span-12"><div class="card-h"><div><h3>Devoluciones y cancelaciones</h3><div class="sub">Impacto en tu ganancia: ${U.fmtMoneySigned(dev.impacto)}${dev.enSuspenso ? ` · ${$(dev.enSuspenso)} en suspenso por devoluciones en curso (no se suman)` : ''}</div></div></div>
          ${dev.lista.length ? `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Devoluciones y cancelaciones"><table class="tbl"><thead><tr><th>Fecha</th><th class="l">Producto</th><th class="l hide-sm">Estado</th><th class="hide-sm">Meli te dejó</th><th class="hide-tab">Flex</th><th>Impacto</th></tr></thead><tbody>${devRows}</tbody></table></div>` : `<div class="ok-box">${icon('i-check')}Sin devoluciones ni cancelaciones.</div>`}
          ${dev.devueltasCobradas.length ? `<p class="small muted" style="margin-top:.625rem">${U.plural(dev.devueltasCobradas.length, 'venta figura', 'ventas figuran')} como devuelta pero cobrada (Meli te pagó igual): se cuentan como venta normal.</p>` : ''}
        </div>
      </div>
    </section>`;
  };

  // ---------- Alertas ----------
  R_.alertas = (R) => {
    const A = R.alertas;
    // la misma etiqueta que «Lo más importante»: forma + palabra + color (▼ Alerta, ◆ Atención, ● Dato)
    const tonoAlerta = { critico: 'malo', atencion: 'atencion', info: 'neutro' };
    const item = it => `<li><span>${esc(it.titulo)}</span>${it.extra ? `<span class="muted">${esc(it.extra)}</span>` : ''}${it.sugerido ? `<span class="sug">¿es «${esc(it.sugerido)}»?</span>` : ''}${it.ventas ? `<span class="muted">${U.plural(it.ventas, 'venta', 'ventas')} · ${$(it.facturacion)}</span>` : ''}</li>`;
    return `<section class="section wrap" id="alertas" aria-labelledby="h-al">
      <div class="section-h"><div><h2 id="h-al">Alertas y datos a revisar</h2><p>Lo que conviene corregir en la planilla o mirar en Meli / Mercado Pago.</p></div></div>
      ${A.length ? `<div class="alerts">${A.map(a => `<div class="alert ${a.nivel}">${R_.sev(tonoAlerta[a.nivel] || 'neutro')}<div><div class="alert-t">${esc(a.titulo)}</div>${a.detalle ? `<div class="alert-d">${esc(a.detalle)}</div>` : ''}
        ${a.items && a.items.length ? (a.items.length > 6 ? `<details><summary>Ver ${a.items.length}</summary><ul class="alert-items">${a.items.map(item).join('')}</ul></details>` : `<ul class="alert-items">${a.items.map(item).join('')}</ul>`) : ''}</div></div>`).join('')}</div>`
        : `<div class="ok-box">${icon('i-check')}Todo en orden: no hay nada para revisar.</div>`}
    </section>`;
  };

  // ---------- Cómo se calcula ----------
  R_.metodo = (R) => `<section class="section wrap" id="metodo" aria-labelledby="h-met">
    <div class="section-h"><div><h2 id="h-met">Cómo se calcula</h2><p>Para que cualquiera pueda chequear los números contra los Excel.</p></div></div>
    <div class="card method">
      <p><b>De dónde salen los datos</b>: las ventas, de los Excel de Meli y Mercado Pago que soltás (se procesan en tu navegador, no se suben a ningún lado). Costos, dueños, gastos y stock, de ANALISIS DE PRODUCTOS, que la página <b>solo lee</b>: en Claude por Google Drive, en la web por la conexión en vivo o subiendo el .xlsx; la última lectura queda guardada en este navegador. El tarifario de flex es propio de la página.</p>
      <p><b>Período</b>: de la primera a la última venta de los archivos. Si bajaste el mes entero pero los últimos días no hubo ventas, el período termina en la última venta (para los gastos grupales podés elegir «Mes completo»).</p>

    escala: 1, animar: false, // tamaño de la página (control «Tamaño») y si el próximo reporte entra con la carga gradual
    mcp: null, driveState: null,
    excluidas: new Set(),   // cuentas del perfil con archivo que el usuario sacó del reporte
    sumadas: new Set(),     // cuentas de OTRO perfil que el usuario sumó a mano
    agregando: false,       // formulario «+ Agregar cuenta» abierto
    cuentaDestino: null,    // cuenta elegida al tocar una tarjeta vacía (para el próximo archivo)
    pedido: RV.pedido.normalizar(U.store.get('rv2.pedido', null)), // cómo armar el pedido (se recuerda en este navegador)
  };
  let uid = 0;
  const registro = () => Object.assign({}, C.CUENTAS_CONOCIDAS, U.store.get(K.cuentas, {}));

  const app = RV.app = {
    st, IN_CLAUDE,
    puedeDrive: () => !!st.mcp,
  };

  // ============================================================
  //  Planilla
  // ============================================================
  const setModel = (m, status, msg) => {
    st.model = m; st.modelStatus = status; st.modelMsg = msg || '';
    renderChip();
    if (!st.report || st.demo) renderLoader();
  };

  // ---------- Conexión en vivo (web): { url, clave } del Apps Script de solo lectura ----------
  const KX = 'rv2.conexion';
  const URL_VALIDA = /^https:\/\/script\.google\.com\/(?:a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/;
  st.conexion = (() => { const c = U.store.get(KX, null); return c && URL_VALIDA.test(c.url) && c.clave ? c : null; })();
  app.puedeVivo = () => !IN_CLAUDE; // dentro de Claude se lee por Drive
  const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const desdeB64url = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
  app.linkInvitacion = () => st.conexion ? location.href.split('#')[0] + '#conexion=' + b64url(JSON.stringify({ url: st.conexion.url, clave: st.conexion.clave })) : '';
  // Link de invitación (#conexion=…): se guarda en este navegador y se borra de la barra de direcciones
  const leerInvitacion = () => {
    const m = (location.hash || '').match(/conexion=([\w-]+)/);
    if (!m) return false;
    let ok = false;
    try {
      const cx = JSON.parse(desdeB64url(m[1]));
      if (cx && URL_VALIDA.test(cx.url) && cx.clave) { st.conexion = { url: cx.url, clave: String(cx.clave) }; U.store.set(KX, st.conexion); ok = true; }
    } catch (e) { /* link roto */ }
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { /* nada */ }
    return ok;
  };
  const claveNueva = () => {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    const r = new Uint32Array(24); (globalThis.crypto || {}).getRandomValues ? crypto.getRandomValues(r) : r.forEach((_, i) => { r[i] = Math.random() * 4294967296; });
    return [...r].map(x => abc[x % abc.length]).join('');
  };
  app.codigoConexion = (clave) => (RV.CODIGO_CONEXION ? RV.CODIGO_CONEXION.gs : '').replace('__CLAVE__', clave);
  // Si la conexión responde con la clave correcta se guarda, aunque todavía no pueda leer (código viejo,
  // cuenta sin acceso…): así, cuando se arregla del lado de Google, alcanza con «Volver a leer».
  const GUARDABLES = ['viejo', 'servicio', 'alcance', 'permiso', 'cuota', 'lectura'];
  app.guardarConexion = async (url, clave) => {
    url = String(url || '').trim();
    if (!URL_VALIDA.test(url)) throw Object.assign(new Error('Ese link no parece el de una aplicación web de Apps Script (termina en /exec).'), { code: 'url' });
    let aviso = null;
    try {
      const d = await S.probarVivo({ url, clave });
      if (!(Number(d.version) >= 2)) aviso = Object.assign(new Error('código anterior'), { code: 'viejo' });
    } catch (e) {
      if (!GUARDABLES.includes(e.code)) throw e;
      aviso = e;
    }
    st.conexion = { url, clave }; U.store.set(KX, st.conexion);
    st.vivoError = null;
    if (aviso) {
      st.vivoError = { code: aviso.code, msg: mensajeVivo(aviso), detalle: aviso.detalle || '' };
      renderChip(); if (!st.report || st.demo) renderLoader();
      throw Object.assign(aviso, { guardada: true });
    }
    await app.cargarPlanilla(false, true);
  };
  app.desconectar = () => { st.conexion = null; st.vivoError = null; U.store.del(KX); app.cargarPlanilla(); };
  // Cuando la lectura falla sin decir por qué (la versión 1 del código hacía eso), el modo prueba lo aclara
  const diagnosticar = async (cx, e) => {
    if (!['network', 'http', 'respuesta'].includes(e && e.code)) return e;
    try {
      const d = await S.probarVivo(cx);
      return Number(d.version) >= 2 ? e : Object.assign(new Error('código anterior'), { code: 'viejo' });
    } catch (e2) { return GUARDABLES.includes(e2.code) || e2.code === 'clave' ? e2 : e; }
  };

  app.cargarPlanilla = async (forzarDrive, fresco) => {
    st.modelStatus = 'loading'; st.modelMsg = 'Conectando con la planilla…'; renderChip(); renderLoader();
    const previo = S.restore();
    const subida = st.files.find(f => (f.kind === 'analisis' || f.kind === 'auxiliar') && !f.error);
    if (subida) { usarPlanillaSubida(); return; }
    const progreso = msg => { st.modelMsg = msg; renderChip(); };
    const conCopia = (msg) => {
      if (previo) { previo.warnings.push(msg); setModel(previo, 'ok', msg); regenerar(); }
      else setModel(null, 'error', msg);
    };
    // 1) Dentro de Claude: Google Drive (con el permiso del que mira)
    if (st.mcp && (forzarDrive || st.driveState === 'granted')) {
      try {
        const m = await S.loadDrive(st.mcp, progreso, fresco);
        st.driveState = 'granted'; // si la llamada anduvo, el permiso está dado
        S.save(m); setModel(m, 'ok'); regenerar(); return;
      } catch (e) { const msg = mensajeDrive(e); toast(msg); conCopia(msg); return; }
    }
    // 2) En la web: la conexión en vivo del equipo
    if (!IN_CLAUDE && st.conexion) {
      if (previo && !st.model) setModel(previo, 'loading', 'Actualizando ANALISIS en vivo…');
      try { const m = await S.loadVivo(st.conexion, progreso, fresco); st.vivoError = null; S.save(m); setModel(m, 'ok'); regenerar(); return; }
      catch (e0) {
        const e = await diagnosticar(st.conexion, e0);
        st.vivoError = { code: e.code || 'error', msg: mensajeVivo(e), detalle: e.detalle || '' };
        conCopia(st.vivoError.msg); return;
      }
    }
    // 3) Sin fuente: la última copia guardada, o explicar cómo conectarla
    if (previo) { setModel(previo, 'ok', ''); regenerar(); return; }
    setModel(null, 'idle', IN_CLAUDE
      ? (st.mcp ? 'Tocá «Leer ANALISIS DE PRODUCTOS desde Drive» para traer costos y stock, o soltá la planilla en .xlsx.' : 'Soltá ANALISIS DE PRODUCTOS (.xlsx) junto con tus reportes.')
      : 'Conectá ANALISIS DE PRODUCTOS en vivo (se hace una sola vez) o soltá la planilla en .xlsx.');
  };
  const mensajeVivo = (e) => {
    const c = e && e.code;
    if (c === 'clave') return 'La conexión en vivo rechazó la clave: pedí el link nuevo de la conexión.';
    if (c === 'timeout') return 'La conexión en vivo tardó demasiado. Tocá «Volver a leer» en un rato.';
    if (c === 'viejo') return 'La conexión en vivo todavía tiene el código anterior, que Google no deja leer con permiso de solo lectura. Hay que actualizarla en script.google.com (2 minutos).';
    if (c === 'permiso') return 'La cuenta de Google que creó la conexión no puede abrir ANALISIS DE PRODUCTOS. Hay que compartirle ANALISIS (como «Lector») o crear la conexión desde una cuenta que la abra.';
    if (c === 'servicio') return 'A la conexión en vivo le falta el servicio «Google Sheets API»: hay que pegar el appsscript.json nuevo y crear una versión nueva.';
    if (c === 'alcance') return 'A la conexión en vivo le falta el permiso de lectura: hay que pegar el appsscript.json nuevo y crear una versión nueva.';
    if (c === 'cuota') return 'Google frenó las lecturas por un rato (demasiadas seguidas). Tocá «Volver a leer» en unos minutos.';
    if (c === 'network') return 'No se pudo llegar a la conexión en vivo (¿hay internet?). Si sigue, revisá que esté implementada como «Aplicación web» con acceso «Cualquier usuario».';
    if (c === 'respuesta') return 'La conexión en vivo respondió algo que no se puede leer. Revisá que la dirección sea la «URL de la aplicación web» (termina en /exec) y que el código pegado en Google sea el de la página: tocá «Arreglar la conexión».';
    return 'No se pudo leer ANALISIS en vivo (' + ((e && e.message) || 'error') + ').';
  };
  app.mensajeVivo = mensajeVivo;
  const mensajeDrive = (e) => {
    const c = e && e.code;
    if (c === 'server_not_connected') return 'Agregá Google Drive en Configuración → Conectores de claude.ai para leer la planilla.';
    if (c === 'needs_reauth') return 'Volvé a conectar Google Drive en Configuración → Conectores de claude.ai.';
    if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'No se dio permiso para leer Google Drive desde esta página.';
    if (c === 'selection_required') return 'Elegí qué conexión de Google Drive usar cuando claude.ai te lo pregunte.';
    if (c === 'tool_error') return 'Google Drive no devolvió la planilla. ¿Tenés acceso a ANALISIS DE PRODUCTOS con esta cuenta?';
    return 'No se pudo leer la planilla desde Drive (' + ((e && e.message) || 'error') + ').';
  };
  const usarPlanillaSubida = () => {
    const f = st.files.find(x => (x.kind === 'analisis' || x.kind === 'auxiliar') && !x.error);
    const logi = st.files.find(x => x.kind === 'logistica' && !x.error);
    if (!f) return;
    try {
      const m = S.fromTables(f.kind === 'analisis' ? { analisis: f.tables, logistica: logi ? logi.tables : null } : { auxiliar: f.tables, logistica: logi ? logi.tables : null }, 'upload');
      S.save(m); // la próxima vez se abre con esta copia, sin volver a subirla
      setModel(m, 'ok', 'Planilla subida a mano');
    } catch (e) { setModel(st.model, st.model ? 'ok' : 'error', 'La planilla subida no se pudo leer: ' + e.message); }
  };

  // ============================================================
  //  Archivos
  // ============================================================
  const leerArchivo = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('no se pudo abrir')); r.readAsArrayBuffer(file); });

  app.agregarArchivos = async (lista) => {
    const nuevos = [...lista].filter(f => /\.(xlsx|xls)$/i.test(f.name));
    if (!nuevos.length) { st.error = 'Solo se aceptan archivos de Excel (.xlsx).'; renderLoader(); return; }
    st.error = null;
    if (!globalThis.XLSX) { st.error = 'No se pudo cargar el lector de Excel (¿sin internet?). Recargá la página.'; renderLoader(); return; }
    for (const file of nuevos) {
      const f = { id: ++uid, name: file.name, loading: true };
      st.files.push(f); renderLoader();
      try {
        const buf = await leerArchivo(file);
        // SheetJS avisa por consola "Bad uncompressed size" con los Excel de Meli: es inofensivo
        const ce = console.error; console.error = (...a) => { if (!/uncompressed size/i.test(String(a[0]))) ce.apply(console, a); };
        let wb; try { wb = globalThis.XLSX.read(buf, { type: 'array', cellDates: true }); } finally { console.error = ce; }
        const tables = P.workbookToTables(wb);
        const det = P.detect(tables, file.name);
        f.kind = det.kind;
        if (det.kind === 'ml') f.parsed = P.mlVentas(tables[Object.keys(tables)[0]], file.name);
        else if (det.kind === 'mp') f.parsed = P.mpMovimientos(tables[Object.keys(tables)[0]], file.name);
        else if (['analisis', 'auxiliar', 'logistica'].includes(det.kind)) f.tables = tables;
        else throw new Error('no parece un reporte de Meli, de Mercado Pago ni la planilla');
        if (det.kind === 'ml' || det.kind === 'mp') {
          f.sellerId = det.sellerId || (f.parsed && f.parsed.sellerId) || null;
          const reg = registro();
          f.cuenta = (f.sellerId && reg[f.sellerId]) || null;
          if (!f.cuenta) { // misma cuenta que otro archivo ya cargado
            const par = st.files.find(o => o !== f && o.sellerId && o.sellerId === f.sellerId && o.cuenta);
            if (par) f.cuenta = par.cuenta;
          }
          if (!f.cuenta && st.cuentaDestino) { // se eligió el archivo tocando la tarjeta de esa cuenta
            f.cuenta = st.cuentaDestino;
            if (f.sellerId) { const r = U.store.get(K.cuentas, {}); r[f.sellerId] = f.cuenta; U.store.set(K.cuentas, r); }
          }
          if (!f.cuenta && st.perfil) {
            const usadas = st.files.filter(o => o !== f && o.kind === 'ml').map(o => o.cuenta);
            const perfil = RV.engine.perfilDe(st.perfil);
            if (perfil.cuentas.length === 1 && det.kind === 'ml' && !usadas.includes(perfil.cuentas[0])) f.cuenta = perfil.cuentas[0];
          }
        }
        if (f.kind === 'ml' && f.cuenta) st.excluidas.delete(f.cuenta); // si la cargaste, va al reporte
        // si ya había un archivo de la misma clase y cuenta con el mismo nombre, reemplazar
        const dup = st.files.find(o => o !== f && o.name === f.name);
        if (dup) st.files.splice(st.files.indexOf(dup), 1);
      } catch (e) { f.error = e.message || String(e); }
      f.loading = false;
      renderLoader();
    }
    st.cuentaDestino = null;
    if (st.files.some(f => (f.kind === 'analisis' || f.kind === 'auxiliar' || f.kind === 'logistica') && !f.error)) usarPlanillaSubida();
    if (pendientes().length) { renderLoader(); return; } // primero hay que decir de qué cuenta es cada archivo
    if (st.report && !st.demo) regenerar(); else app.generar(true);
  };

  app.quitar = (id) => {
    const f = st.files.find(x => x.id === id); if (!f) return;
    st.files.splice(st.files.indexOf(f), 1);
    if (['analisis', 'auxiliar', 'logistica'].includes(f.kind)) app.cargarPlanilla();
    if (st.report && !st.demo && (f.kind === 'ml' || f.kind === 'mp') && armarCuentas().cuentas.length) regenerar();
    else renderLoader();
  };

  app.setCuenta = (id, cuenta) => {
    const f = st.files.find(x => x.id === id); if (!f) return;
    f.cuenta = cuenta || null;
    if (f.kind === 'ml' && cuenta) { st.excluidas.delete(cuenta); st.sumadas.add(cuenta); } // elegida a mano: entra
    if (f.sellerId && cuenta) {
      const reg = U.store.get(K.cuentas, {}); reg[f.sellerId] = cuenta; U.store.set(K.cuentas, reg);
      for (const o of st.files) if (o !== f && o.sellerId === f.sellerId) o.cuenta = cuenta; // el de MP de la misma cuenta, también
    }
    if (pendientes().length || !cuenta) { renderLoader(); return; }
    if (st.report && !st.demo) regenerar(); else app.generar(true);
  };

  // ============================================================
  //  Cuentas: cuáles tiene el perfil, qué archivos tiene cada una y cuáles entran
  // ============================================================
  const listaY = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1] : (arr[0] || '');
  app.listaY = listaY;
  // Metas mensuales de ganancia neta, por perfil (en este navegador)
  const KM = 'rv2.metas';
  app.metaDe = (perfil) => { const m = U.store.get(KM, {}) || {}; return m[perfil] > 0 ? m[perfil] : null; };
  const guardarMeta = (perfil, valor) => { const m = U.store.get(KM, {}) || {}; if (valor > 0) m[perfil] = valor; else delete m[perfil]; U.store.set(KM, m); };
  const cuentasEstado = () => {
    const perfil = st.perfil ? RV.engine.perfilDe(st.perfil) : null;
    const nombres = perfil ? [...perfil.cuentas] : [];
    for (const f of st.files) if ((f.kind === 'ml' || f.kind === 'mp') && f.cuenta && !f.error && !nombres.includes(f.cuenta)) nombres.push(f.cuenta);
    return nombres.map(cuenta => {
      const ml = st.files.filter(f => f.kind === 'ml' && f.cuenta === cuenta && !f.error && f.parsed);
      const mp = st.files.filter(f => f.kind === 'mp' && f.cuenta === cuenta && !f.error && f.parsed);
      const enPerfil = !!perfil && perfil.cuentas.includes(cuenta);
      const desdes = ml.map(f => f.parsed.desde).filter(Boolean), hastas = ml.map(f => f.parsed.hasta).filter(Boolean);
      return {
        cuenta, enPerfil, col: enPerfil ? 'C' + (perfil.cuentas.indexOf(cuenta) + 1) : null,
        extra: enPerfil && !!(perfil.extra && perfil.extra.includes(cuenta)),
        compartida: enPerfil ? RV.engine.compartidaCon(cuenta, perfil.id) : [],
        ml, mp, ventas: U.sum(ml, f => f.parsed.ventas.length),
        desde: desdes.length ? new Date(Math.min(...desdes)) : null, hasta: hastas.length ? new Date(Math.max(...hastas)) : null,
        tieneVentas: ml.length > 0,
        incluida: ml.length > 0 && (enPerfil ? !st.excluidas.has(cuenta) : st.sumadas.has(cuenta)),
      };
    });
  };
  app.cuentasEstado = cuentasEstado;
  // Archivos de Meli / MP que todavía no tienen cuenta asignada
  const pendientes = () => st.files.filter(f => (f.kind === 'ml' || f.kind === 'mp') && !f.cuenta && !f.error && f.parsed);
  app.pendientes = pendientes;

  app.toggleCuenta = (cuenta) => {
    const est = cuentasEstado();
    const c = est.find(x => x.cuenta === cuenta);
    if (!c || !c.tieneVentas) { // tarjeta vacía: elegir su archivo
      st.cuentaDestino = cuenta;
      const inp = $id('file-input');
      if (inp && (!st.report || st.demo || st.loaderOpen)) inp.click();
      else { st.loaderOpen = true; renderLoader(); $id('cargar').scrollIntoView({ behavior: 'smooth' }); }
      return;
    }
    if (c.incluida) {
      if (!est.some(x => x.incluida && x.cuenta !== cuenta)) { toast('Tiene que quedar al menos una cuenta en el reporte.'); return; }
      if (c.enPerfil) st.excluidas.add(cuenta); else st.sumadas.delete(cuenta);
    } else if (c.enPerfil) st.excluidas.delete(cuenta); else st.sumadas.add(cuenta);
    if (st.report && !st.demo) regenerar(); else renderLoader();
  };

  app.agregarCuenta = (nombre) => {
    const perfil = st.perfil ? RV.engine.perfilDe(st.perfil) : null;
    if (!perfil) return 'Elegí tu perfil primero.';
    const n = String(nombre || '').replace(/\s+/g, ' ').trim().toUpperCase();
    if (!n) return 'Escribí el nombre de la cuenta.';
    if (n.length > 24) return 'Usá un nombre más corto (hasta 24 letras).';
    if (perfil.cuentas.includes(n)) return `${n} ya es una cuenta de ${perfil.nombre}.`;
    if (perfil.cuentas.length >= C.MAX_CUENTAS) return `Hasta ${C.MAX_CUENTAS} cuentas por perfil.`;
    const ex = C.CUENTAS_EXTRA[perfil.id] || [];
    C.CUENTAS_EXTRA[perfil.id] = ex.concat([n]);
    U.store.set(K.extra, C.CUENTAS_EXTRA);
    st.agregando = false;
    toast(`Cuenta ${n} agregada a ${perfil.nombre}`);
    if (st.report && !st.demo) regenerar(); else renderLoader();
    return null;
  };
  app.borrarCuenta = (cuenta) => {
    const perfil = st.perfil ? RV.engine.perfilDe(st.perfil) : null;
    if (!perfil) return;
    C.CUENTAS_EXTRA[perfil.id] = (C.CUENTAS_EXTRA[perfil.id] || []).filter(c => c !== cuenta);
    if (!C.CUENTAS_EXTRA[perfil.id].length) delete C.CUENTAS_EXTRA[perfil.id];
    U.store.set(K.extra, C.CUENTAS_EXTRA);
    st.excluidas.delete(cuenta);
    if (st.report && !st.demo) regenerar(); else renderLoader();
  };

  // ============================================================
  //  Generar el reporte
  // ============================================================
  const armarCuentas = () => {
    const incluidas = new Set(cuentasEstado().filter(c => c.incluida).map(c => c.cuenta));
    const ml = st.files.filter(f => f.kind === 'ml' && f.cuenta && !f.error && incluidas.has(f.cuenta));
    const mp = st.files.filter(f => f.kind === 'mp' && f.cuenta && !f.error && (incluidas.has(f.cuenta) || !st.files.some(o => o.kind === 'ml' && o.cuenta === f.cuenta && !o.error)));
    const porCuenta = new Map();
    for (const f of ml) {
      const c = porCuenta.get(f.cuenta) || { cuenta: f.cuenta, sellerId: f.sellerId, ventas: [], ids: new Set(), tieneFormaEntrega: true, generado: null, mp: null, avisos: [] };
      for (const v of f.parsed.ventas) if (!c.ids.has(v.id)) { c.ids.add(v.id); c.ventas.push(v); }
      for (const a of f.parsed.avisos || []) if (!c.avisos.some(x => x.id === a.id)) c.avisos.push(a);
      c.tieneFormaEntrega = c.tieneFormaEntrega && f.parsed.tieneFormaEntrega;
      if (!c.generado || (f.parsed.generado && f.parsed.generado > c.generado)) c.generado = f.parsed.generado;
      porCuenta.set(f.cuenta, c);
    }
    const sinVentas = [];
    for (const f of mp) {
      const c = porCuenta.get(f.cuenta);
      if (!c) { sinVentas.push(f.cuenta); continue; }
      if (!c.mp) c.mp = { movs: [], formato: f.parsed.formato, generado: f.parsed.generado, sellerId: f.parsed.sellerId };
      c.mp.movs.push(...f.parsed.movs);
      if (f.parsed.generado && (!c.mp.generado || f.parsed.generado > c.mp.generado)) c.mp.generado = f.parsed.generado;
    }
    return { cuentas: [...porCuenta.values()], sinVentas };
  };

  app.generar = (silencioso) => {
    st.error = null;
    if (!st.perfil) { if (!silencioso) { st.error = 'Elegí tu perfil.'; renderLoader(); } return; }
    const { cuentas, sinVentas } = armarCuentas();
    if (!cuentas.length) {
      if (!silencioso) {
        const sinCuenta = pendientes().some(f => f.kind === 'ml');
        const conVentas = cuentasEstado().some(c => c.tieneVentas);
        st.error = sinCuenta ? 'Elegí de qué cuenta es cada Excel de ventas.' : conVentas ? 'Marcá al menos una cuenta para el reporte.' : 'Falta el Excel de ventas de Meli.';

      }
      return;
    }
    if (!st.model) { if (!silencioso) { st.error = st.modelStatus === 'loading' ? 'Esperá a que termine de leer la planilla de costos…' : 'Sin la planilla de costos no se puede calcular la ganancia. ' + (st.modelMsg || ''); renderLoader(); } return; }
    try {
      st.report = construir(cuentas, sinVentas);
      st.demo = false; st.loaderOpen = false; st.animar = true;
      U.store.set(K.visto, true);
      renderAll();
      if (!silencioso) document.getElementById('resumen')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

          ${CH.tipRow('ganancia neta por día', U.fmtMoney(x.e.neta / (x.e.dias || 1)), 'var(--tot)')}${CH.tipRow('ganancia neta', U.fmtMoney(x.e.neta))}

  // Nombre corto para etiquetas de gráfico: "Dolce & Gabbana The One For Men EDT 100ML" → "D&G The One"
  const corto = (n) => {
    const orig = String(n || '');
    let s = orig
      .replace(/^perfume\s+/i, '')
      .replace(/\bdolce\s*(&|y|and)\s*gabbana\b/ig, 'D&G')
      .replace(/\bcalvin\s+klein\b/ig, 'CK')
      .replace(/\b(eau\s+de\s+(toilette|parfum|cologne)|edt|edp|edc)\b/ig, ' ')
      .replace(/\b\d+([.,]\d+)?\s*(ml|mls|cc|oz)\b/ig, ' ')
      .replace(/\b(fem|femenino|feminino|femme|mujer|masc|masculino|hombre|unisex|unissex|for\s+(men|women|him|her)|pour\s+(homme|femme))\b/ig, ' ')
      .replace(/\s+/g, ' ').trim();
    s = s.split(' ').filter((w, i, a) => i === 0 || w.toLowerCase() !== a[i - 1].toLowerCase()).join(' ');
    if (!s) s = orig;
    let out = '';

    return out;
  };

      <button class="icon-btn" type="button" data-action="cerrar-drawer" aria-label="Cerrar"><svg aria-hidden="true"><use href="#i-x"/></svg></button></div>
      <div class="drawer-b" tabindex="0">
        <p class="small muted">${esPedido ? 'Lo que conviene comprar para no quedarte sin stock, con el costo aproximado. Cambiá las cantidades si querés y copialo.' : 'Listo para pegar en WhatsApp: los *asteriscos* salen en negrita. Podés editarlo antes de copiar.'}</p>
        <textarea class="share-txt" id="share-txt" spellcheck="false" aria-label="${esPedido ? 'Texto del pedido' : 'Texto del resumen'}">${U.esc(texto)}</textarea>
        <div class="share-actions">
          <button class="btn btn-primary" type="button" data-action="copiar-resumen"><svg aria-hidden="true" width="16" height="16"><use href="#i-copy"/></svg>Copiar</button>
          <a class="btn" id="share-wa" href="https://wa.me/?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a>
        </div>
      </div>`;
    d.hidden = false; $id('scrim').hidden = false;
    document.body.style.overflow = 'hidden';
    const ta = $id('share-txt');
    ta.addEventListener('input', () => { const w = $id('share-wa'); if (w) w.href = 'https://wa.me/?text=' + encodeURIComponent(ta.value); });
    d.querySelector('[data-action="cerrar-drawer"]').focus();
  };
  app.copiarResumen = async () => {
    const ta = $id('share-txt'); if (!ta) return;
    const listo = /pedido/i.test(ta.getAttribute('aria-label') || '') ? 'Pedido copiado' : 'Resumen copiado';
    try { await navigator.clipboard.writeText(ta.value); toast(listo); return; } catch (e) { /* sigue abajo */ }
    ta.focus(); ta.select();
    try { if (document.execCommand('copy')) { toast(listo); return; } } catch (e) { /* nada */ }
    toast('Seleccioné el texto: copialo con Ctrl+C (o mantené apretado en el celular).');
  };
  app.cerrarDrawer = () => {
    $id('drawer').hidden = true; $id('scrim').hidden = true; document.body.style.overflow = '';
    CH.tip.hide();
    if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
  };

  // ============================================================
  //  Exportar
  // ============================================================
  app.exportar = async () => {
    const R = st.report; if (!R) return;
    const btn = $id('btn-excel'); btn.disabled = true;
    try {
      const { blob, nombre } = await RV.exporter.excel(R, st.demo, { pedido: st.pedido });
      const tieneClaude = !!(globalThis.claude && typeof globalThis.claude.use === 'function');
      const dl = tieneClaude ? await globalThis.claude.use('downloads').catch(() => null) : null;
      if (dl) {
        try { await dl.save({ filename: nombre, data: blob }); toast('Excel listo'); }
        catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar (' + (e.code || e.message) + ').'); }
      } else if (tieneClaude && enIframe) {
        toast('Esta vista no permite descargar archivos.');
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast('Descargado: ' + nombre);
      }
    } catch (e) {
      // Sin internet para la biblioteca del Excel no es un error de la página: se avisa y listo
      (e && e.code === 'sin_biblioteca' ? console.warn : console.error)(e);
      toast('No se pudo armar el Excel: ' + (e.message || e));
    }
    finally { btn.disabled = false; }
  };

  let toastT = null;
  const toast = (msg) => { const t = $id('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3600); };
  app.toast = toast;

  // ============================================================
  //  Eventos
  // ============================================================
  const onClick = (ev) => {
    const a = ev.target.closest('[data-action]');
    const go = ev.target.closest('[data-go]');
    if (!a && go) { const el = document.getElementById(go.dataset.go); if (el) el.scrollIntoView({ behavior: el.closest('#drawer') ? 'auto' : 'smooth', block: 'start' }); return; } // en un panel, el salto es directo
    if (!a) {
      const th = ev.target.closest('th[data-sort]');
      if (th) { const k = th.dataset.sort; if (st.orden === k) st.ordenDir *= -1; else { st.orden = k; st.ordenDir = k === 'nombre' ? 1 : -1; } renderSeccion('productos', RV.render.productos(st.report, st)); montarGraficos(st.report); }
      return;
    }
    const act = a.dataset.action;
    if (act === 'perfil') {
      st.perfil = a.dataset.id; U.store.set(K.perfil, st.perfil); st.error = null;
      st.excluidas.clear(); st.sumadas.clear(); st.agregando = false;
      const perfil = RV.engine.perfilDe(st.perfil);
      for (const f of st.files) if (f.kind === 'ml' && !f.cuenta && perfil.cuentas.length === 1) f.cuenta = perfil.cuentas[0];
      if (st.report && !st.demo) { regenerar(); st.loaderOpen = true; renderLoader(); }
      else { renderLoader(); if (st.files.some(f => f.kind === 'ml') && !pendientes().length) app.generar(true); }
    }
    else if (act === 'quitar') app.quitar(+a.dataset.id);
    else if (act === 'toggle-cuenta') app.toggleCuenta(a.dataset.cuenta);
    else if (act === 'agregar-cuenta') { st.agregando = true; renderLoader(); const i = $id('nueva-cuenta'); if (i) i.focus(); }
    else if (act === 'cancelar-cuenta') { st.agregando = false; renderLoader(); }
    else if (act === 'borrar-cuenta') app.borrarCuenta(a.dataset.cuenta);
    else if (act === 'compartir') app.abrirCompartir();
    else if (act === 'pedido') app.abrirCompartir('pedido');
    else if (act === 'ped-modo') {
      st.pedido = Object.assign({}, st.pedido, { modo: a.dataset.k }); app.refrescarPedido();
      if (a.dataset.k === 'tope') { const i = $id('ped-tope'); if (i && !i.value) i.focus(); }
    }
    else if (act === 'meta-editar') { st.editandoMeta = true; renderSeccion('resumen', RV.render.resumen(st.report, st)); montarGraficos(st.report); const i = $id('meta-in'); if (i) i.focus(); }
    else if (act === 'meta-cancelar') { st.editandoMeta = false; renderSeccion('resumen', RV.render.resumen(st.report, st)); montarGraficos(st.report); }
    else if (act === 'meta-borrar') { guardarMeta(st.perfil, 0); st.editandoMeta = false; renderSeccion('resumen', RV.render.resumen(st.report, st)); montarGraficos(st.report); }
    else if (act === 'novedades') app.abrirNovedades();
    else if (act === 'guia') app.abrirGuia();
    else if (act === 'conectar-vivo') { st.verCodigo = false; app.abrirConexion(); }
    else if (act === 'vivo-codigo') { st.verCodigo = true; app.abrirConexion(); }
    else if (act === 'vivo-desconectar') { app.cerrarDrawer(); app.desconectar(); toast('Este navegador ya no lee la planilla en vivo.'); }
    else if (act === 'copiar') {
      const que = a.dataset.que;
      const texto = que === 'codigo' ? app.codigoConexion(st.conexion && st.verCodigo ? st.conexion.clave : (st.conexion ? st.conexion.clave : st.claveEnCurso))
        : que === 'manifest' ? (RV.CODIGO_CONEXION ? RV.CODIGO_CONEXION.manifest : '') : que === 'link' ? app.linkInvitacion() : '';
      app.copiar(texto, que === 'link' ? 'Link copiado' : 'Copiado');
    }
    else if (act === 'copiar-resumen') app.copiarResumen();
    else if (act === 'borrar-historial') {
      if (!a.dataset.seguro) { a.dataset.seguro = '1'; a.textContent = 'Tocá de nuevo para borrar'; setTimeout(() => { if (a.isConnected) { delete a.dataset.seguro; a.textContent = 'Borrar historial'; } }, 4000); return; }
      RV.historial.borrar(st.perfil); toast('Historial borrado'); renderAll();
    }
    else if (act === 'generar') app.generar(false);
    else if (act === 'abrir-carga') { st.loaderOpen = true; renderLoader(); $id('cargar').scrollIntoView({ behavior: 'smooth' }); }
    else if (act === 'cerrar-carga') { st.loaderOpen = false; renderLoader(); }
    else if (act === 'recargar-planilla') {
      // Desde el panel de la conexión: al terminar, el panel muestra cómo quedó
      const enPanel = !!a.closest('[data-panel="conexion"]');
      if (enPanel) { a.disabled = true; a.textContent = 'Leyendo…'; }
      app.cargarPlanilla(false, true).then(() => {
        const d = $id('drawer');
        if (!enPanel || d.hidden || !d.querySelector('[data-panel="conexion"]')) return;
        d.innerHTML = RV.render.conexion(st);
        const x = d.querySelector('[data-action="cerrar-drawer"]'); if (x) x.focus();
        toast(vivoFallo() ? 'Todavía no puede leer: mirá el aviso.' : 'Leída en vivo.');
      });
    }
    else if (act === 'conectar-drive') app.cargarPlanilla(true);
    else if (act === 'gastos') { st.opciones.gastosModo = a.dataset.modo; U.store.set(K.opciones, st.opciones); reconstruir(); }
    else if (act === 'metrica') { st.metrica = a.dataset.k; renderSeccion('evolucion', RV.render.evolucion(st.report, st)); montarGraficos(st.report); }
    else if (act === 'scope') { st.scope = a.dataset.k; renderSeccion('productos', RV.render.productos(st.report, st)); montarGraficos(st.report); }
    else if (act === 'producto') app.abrirProducto(a.dataset.key, a.dataset.dueno);
    else if (act === 'cerrar-drawer') app.cerrarDrawer();
    else if (act === 'todos-insights') { const m = $id('ins-more'); m.hidden = !m.hidden; a.textContent = m.hidden ? `Ver los ${st.report.insights.length}` : 'Ver menos'; }
  };

  // ---------- Tamaño de la página: A− / 100 % / A+ (todo está en rem: cambia --escala en <html>) ----------
  const ESCALAS = [0.85, 0.92, 1, 1.08, 1.16, 1.25];
  const KT = 'rv2.escala';
  const pintarEscala = (v) => {
    const val = ESCALAS.includes(v) ? v : 1;
    if (val === 1) document.documentElement.style.removeProperty('--escala'); else document.documentElement.style.setProperty('--escala', String(val));
    const pct = Math.round(val * 100) + ' %';
    const t = $id('tam');
    if (t) {
      $id('tam-v').textContent = pct;
      t.querySelector('[data-tam="-1"]').setAttribute('aria-disabled', String(val <= ESCALAS[0]));
      t.querySelector('[data-tam="1"]').setAttribute('aria-disabled', String(val >= ESCALAS[ESCALAS.length - 1]));
      t.querySelector('[data-tam="0"]').setAttribute('aria-label', `${pct}: volver al tamaño normal`);
    }
    return val;
  };
  app.escala = (v) => {
    const nueva = pintarEscala(v);
    if (nueva === st.escala) return nueva;
    st.escala = nueva; U.store.set(KT, nueva);
    if (st.report) montarGraficos(st.report);
    RV.mov.indicador();
    return nueva;
  };
  const montarTamano = () => {
    st.escala = pintarEscala(Number(U.store.get(KT, 1)));
    const t = $id('tam'); if (!t) return;
    t.addEventListener('click', ev => {
      const b = ev.target.closest('button[data-tam]'); if (!b || b.getAttribute('aria-disabled') === 'true') return;
      const paso = Number(b.dataset.tam);
      const i = Math.max(0, ESCALAS.indexOf(st.escala));
      const antes = st.escala;
      const v = app.escala(paso === 0 ? 1 : ESCALAS[U.clamp(i + paso, 0, ESCALAS.length - 1)]);
      // en el celular no se ve el porcentaje: lo dice un aviso
      if (v !== antes && !t.querySelector('.tam-v').offsetParent) toast(`Tamaño de la página: ${Math.round(v * 100)} %`);
    });
  };

  const init = () => {
    revisarVersion(); // primero, antes de que la página guarde nada en este navegador
    montarTamano();
    // Tema (solo fuera de Claude: adentro manda el tema de claude.ai)
    if (!IN_CLAUDE) {
      const t = U.store.get(K.tema, null);
      if (t) document.documentElement.setAttribute('data-theme', t);
      const bt = $id('btn-theme'); bt.hidden = false;
      const pintar = () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); bt.innerHTML = `<svg aria-hidden="true"><use href="#${dark ? 'i-sun' : 'i-moon'}"/></svg>`; const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', dark ? '#0D1221' : '#EDF0F7'); };
      pintar();
      bt.addEventListener('click', () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
        const nuevo = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nuevo); U.store.set(K.tema, nuevo); pintar();
        if (st.report) montarGraficos(st.report);
      });
      $id('btn-print').addEventListener('click', () => window.print());
    }
    document.addEventListener('click', onClick);
    document.addEventListener('change', ev => {
      const s = ev.target.closest('select[data-action="cuenta"]'); if (s) { app.setCuenta(+s.dataset.id, s.value); return; }
      if (ev.target.id === 'ped-moneda') { st.pedido = Object.assign({}, st.pedido, { moneda: ev.target.value }); app.refrescarPedido(); return; }
      if (ev.target.id === 'ped-dias' || ev.target.id === 'ped-tope') { clearTimeout(pedTipeo); app.refrescarPedido(); if (ev.target.id === 'ped-dias') ev.target.value = st.pedido.dias; }
    });
    document.addEventListener('submit', async ev => {
      const fv = ev.target.closest('form[data-form="vivo"]');
      if (fv) {
        ev.preventDefault();
        const msg = fv.querySelector('.vivo-msg'), btn = fv.querySelector('button[type="submit"]');
        msg.textContent = 'Probando la conexión…'; msg.className = 'vivo-msg small muted'; btn.disabled = true;
        try {
          await app.guardarConexion(fv.querySelector('input').value, st.conexion ? st.conexion.clave : st.claveEnCurso);
          if (vivoFallo()) throw Object.assign(new Error(st.vivoError.msg), { code: st.vivoError.code, guardada: true }); // respondió pero no pudo leer todo
          st.verCodigo = false; st.claveEnCurso = null;
          toast('¡Conectado! La página ya lee ANALISIS en vivo.'); app.abrirConexion();
        } catch (e) {
          if (e.guardada) st.claveEnCurso = null;
          msg.className = 'vivo-msg small err-txt';
          msg.textContent = e.code === 'url' ? e.message
            : e.code === 'clave' ? 'Respondió, pero la clave no coincide: ¿pegaste el código copiado de esta página? Si lo cambiaste, creá una versión nueva (Implementar → Gestionar implementaciones → Editar → Nueva versión).'
            : e.code === 'viejo' ? 'Respondió, pero todavía con el código anterior. ¿Creaste la versión nueva? (Implementar → Gestionar implementaciones → lápiz «Editar» → Versión: «Nueva versión» → Implementar). Guardar el código solo no alcanza.'
            : e.guardada ? 'Quedó guardada, pero todavía no puede leer: ' + mensajeVivo(e)
            : e.code === 'timeout' ? 'Tardó demasiado en responder. Esperá un minuto y probá de nuevo.'
            : 'No respondió. Revisá que esté implementada como «Aplicación web» con acceso «Cualquier usuario» y probá de nuevo.';
        } finally { btn.disabled = false; }
        return;
      }
      const fmeta = ev.target.closest('form[data-form="meta"]');
      if (fmeta) {
        ev.preventDefault();
        const v = U.num(fmeta.querySelector('input').value);
        guardarMeta(st.perfil, v); st.editandoMeta = false;
        renderSeccion('resumen', RV.render.resumen(st.report, st)); montarGraficos(st.report);
        if (v > 0) toast('Meta guardada');
        return;
      }
      const fm = ev.target.closest('form[data-form="cuenta"]'); if (!fm) return;
      ev.preventDefault();
      const err = app.agregarCuenta(fm.querySelector('input').value);
      if (err) { const m = fm.querySelector('.acct-err'); if (m) m.textContent = err; fm.querySelector('input').focus(); }
    });
    document.addEventListener('input', ev => {
      const id = ev.target.id;
      if (id === 'ped-peso') { st.pedido = Object.assign({}, st.pedido, { peso: Number(ev.target.value) / 100 }); app.refrescarPedido(); return; }
      if (id === 'ped-dias' || id === 'ped-tope') {
        const v = ev.target.value.trim();
        const cambio = id === 'ped-dias' ? { dias: v === '' ? null : Number(v) } : { tope: v === '' ? null : Number(v) };
        st.pedido = Object.assign({}, st.pedido, cambio);
        U.store.set('rv2.pedido', RV.pedido.normalizar(st.pedido));
        clearTimeout(pedTipeo); pedTipeo = setTimeout(app.refrescarPedido, 300); // mientras escribe, espera un poquito
        return;
      }
      if (ev.target.id === 'prod-search') {
        st.busqueda = ev.target.value;
        const pos = ev.target.selectionStart;
        renderSeccion('productos', RV.render.productos(st.report, st)); montarGraficos(st.report);
        const n = $id('prod-search'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* nada */ }
      }
    });
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape' && !$id('drawer').hidden) app.cerrarDrawer();
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-action="producto"], [data-go], .hb-row.is-link')) { ev.preventDefault(); ev.target.click(); }
    });
    $id('scrim').addEventListener('click', app.cerrarDrawer);
    $id('btn-excel').addEventListener('click', app.exportar);
    $id('sheet-chip').addEventListener('click', () => {
      if (vivoFallo()) { st.verCodigo = false; app.abrirConexion(); return; }
      st.loaderOpen = true; renderLoader(); $id('cargar').scrollIntoView({ behavior: 'smooth' });
    });
    // Arrastrar y soltar (en toda la página)
    let dragDepth = 0;
    window.addEventListener('dragenter', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) { dragDepth++; const dz = $id('dropzone'); if (dz) dz.classList.add('is-over'); } });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { const dz = $id('dropzone'); if (dz) dz.classList.remove('is-over'); } });
    window.addEventListener('dragover', ev => { ev.preventDefault(); });
    window.addEventListener('drop', ev => {
      ev.preventDefault(); dragDepth = 0; const dz = $id('dropzone'); if (dz) dz.classList.remove('is-over');
      if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
        if (st.report && !st.demo && !st.loaderOpen) { st.loaderOpen = true; }
        app.agregarArchivos(ev.dataTransfer.files);
      }
    });
    CH.bindDataTips(document.body);
    let rsT = null; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(RV.mov.indicador, 120); });
    // Al imprimir, los gráficos se vuelven a dibujar al ancho útil de una hoja A4 (703 px menos márgenes y tarjeta:
    // unos 645 px), así las letras y las barras salen de su tamaño en vez de achicarse; después vuelven a la pantalla.
    window.addEventListener('beforeprint', () => { if (!st.report) return; CH.anchoFijo = 645; montarGraficos(st.report); });
    window.addEventListener('afterprint', () => { if (!CH.anchoFijo) return; CH.anchoFijo = null; if (st.report) montarGraficos(st.report); });

    const invitado = !IN_CLAUDE && leerInvitacion();
    renderChip(); renderLoader();
    if (!U.store.get(K.visto, false) || IN_CLAUDE) mostrarDemo(); else renderDemoBanner();
    if (invitado) setTimeout(() => toast('Listo: esta página quedó conectada a ANALISIS en vivo.'), 600);

    (async () => {
      if (IN_CLAUDE) {
        try { st.mcp = await globalThis.claude.use('mcp'); } catch (e) { st.mcp = null; }
        if (st.mcp) {
          try { const perms = await globalThis.claude.use('permissions'); st.driveState = perms ? await perms.state('mcp:Google Drive').catch(() => 'unavailable') : null; } catch (e) { st.driveState = null; }
        }
      }
      app.cargarPlanilla(false);
    })();
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(globalThis.RV = globalThis.RV || {});

</script>
</body>
</html>
