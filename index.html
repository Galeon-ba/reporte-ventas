/* en celulares angostos: sin el número de versión (está al pie) ni el botón de imprimir */
@media (max-width: 480px) {
  .brand-txt { display: none; }
}
@media (max-width: 420px) {
  .ver-chip { display: none; }
  #btn-print { display: none !important; }
  /* el botón del Excel queda en su ícono (el nombre sigue para los lectores de pantalla) */
  #btn-excel { width: 2.25rem; padding: 0; border-radius: 50%; border-color: var(--line); }
  #btn-excel:hover { border-color: var(--line-2); background: var(--surface-2); }
  #btn-excel span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}
@media (max-width: 420px) and (pointer: coarse) { #btn-excel { width: 2.75rem; } }
/* en el celular la barra de arriba no crece con el control «Tamaño»: ya tiene el tamaño de un dedo y así entra siempre */
@media (max-width: 480px) {
  .topbar-in { gap: min(.375rem, 6px); }
  .topbar-actions { gap: min(.375rem, 6px); }
  .topbar .icon-btn, #btn-excel { width: min(2.25rem, 36px); height: min(2.25rem, 36px); min-height: 0; }
  .topbar .icon-btn svg, #btn-excel svg { width: min(1.125rem, 18px); height: min(1.125rem, 18px); }
  .tam { height: min(2.25rem, 36px); padding: 0 min(.1875rem, 3px); }
  .tam button { min-width: min(1.875rem, 30px); height: min(1.875rem, 30px); padding: 0 min(.375rem, 6px); font-size: min(.8125rem, 13px); }
  .brand::before { width: min(1.375rem, 22px); height: min(1.375rem, 22px); border-radius: min(.4375rem, 7px); box-shadow: inset 0 0 0 min(.3125rem, 5px) var(--surface); }
}
@media (max-width: 480px) and (pointer: coarse) {
  .topbar .icon-btn, #btn-excel { width: min(2.75rem, 44px); height: min(2.75rem, 44px); }
  .tam { height: min(2.75rem, 44px); }
  .tam button { min-width: min(2.25rem, 36px); height: min(2.375rem, 38px); }
}
@media (max-width: 380px) {
  :root { --gut: .75rem; }
  .tiles, .stats { gap: .375rem; }
  .tile-v, .stat-v { font-size: 1.0625rem; }
  .hero-num { font-size: 2.5rem; }
  .cuatro { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Impresión (A4: unos 703 px útiles) ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  :root { --page: #fff; --surface: #fff; --surface-2: #F5F7FC; --ink: #171D37; --ink-2: #2D344D; --muted: #4A5068; --line: #D4D9E4; }
  html { font-size: 100%; }
  .topbar, .secnav, .loader, .demo-banner, .card-tools, .no-print, .drawer, .scrim, .toast, .tam,
  .btn, .segc, .search, .link-btn, .meta-form, .ped-fields, .ayuda-archivos, .ins-go { display: none !important; }
  body { background: #fff; color: #171D37; font-size: .78rem; }
  .card, .insights, .alert, .paso, .loaded-bar { box-shadow: none; }
  .card { padding: .625rem .75rem; }
  /* la isla del Resumen se imprime en claro: tinta sobre papel */
  .hero {
    background: #fff; border: 1px solid #D4D9E4; box-shadow: none; padding: .75rem .875rem;
    --ink: #171D37; --ink-2: #2D344D; --muted: #4A5068; --line: #D4D9E4; --line-2: #B7BECC; --track: #E6E9F3; --surface-2: #F5F7FC; --surface-3: #E6E9F3;
    --accent: #F4692B; --accent-ink: #B23B19; --good: #048149; --good-ink: #00713E; --good-soft: #DFF8E6; --warn: #C68206; --warn-ink: #804D0C; --warn-soft: #FFEECB;
    --crit: #D02B31; --crit-ink: #B71824; --crit-soft: #FFE9E8; --brand: #2E56D9;
  }
  .hero::after { display: none; }
  .section { padding-top: 1.25rem; }
  #resumen.section { padding-top: 0; }
  /* que no se corten al medio las piezas chicas; las grandes (tablas, «Cómo se calcula») siguen en la hoja
     siguiente en vez de saltar enteras y dejar hojas en blanco */
  .stat, .tile, .ins, .alert, .cuatro > div, .tres > div, .medidor, .chart, .cien, .wf-row, .hb-row, .lg-row,
  .tbl tr, .person, .opener, .card-h, .ped-sum, .cal, .hm { break-inside: avoid; }
  h2, h3, .card-h, .opener, .section-h { break-after: avoid; }
  /* las barras, los cuadraditos y las tiras de color son datos: se imprimen aunque el navegador no imprima fondos */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .mv-wait { opacity: 1 !important; }
  .grid { gap: .625rem; }
  .hero-grid { grid-template-columns: minmax(0, 1fr); gap: .625rem; }
  .hero-num { font-size: 2.75rem; }
  .op-n { font-size: 1.875rem; }
  .op-f, .hero-sub { font-size: .875rem; }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
  .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: 1 / -1; }
  .card.ped { border-width: 1px; box-shadow: none; padding: .75rem; margin-top: .75rem; }
  /* tablas enteras en el papel: sin scroll, letra más chica y sin las columnas de detalle */
  .tbl-wrap { overflow: visible !important; background: none; }
  .tbl { font-size: 10.5px; }
  .tbl th, .tbl td { padding: 4px 5px; }
  .tbl th { position: static !important; background: #F5F7FC; } /* el encabezado fijo se imprime corrido */
  .tbl th, .tbl td { white-space: normal; } /* en A4 los textos largos van en dos renglones para que la tabla entre */
  .tbl td .nw { white-space: nowrap; font-size: 8.5px; } /* el rango de precios, en un renglón y más chico */
  .tbl thead { display: table-header-group; }
  .tbl .hide-sm { display: none !important; }
  .mb { display: none; }
  .pcards.can-swap { display: none !important; }
  .tbl.can-swap { display: table !important; }
  .foot { margin-top: 1.25rem; }
}

<script>
/* ============================================================
   util.js — helpers puros (texto, números, fechas, formato)
   ============================================================ */
(function (RV) {
  'use strict';
  const U = RV.util = {};

  U.isEmpty = v => v === undefined || v === null || (typeof v === 'string' && v.trim() === '');

  // Normaliza texto para comparar: minúsculas, espacios simples, sin \r
  U.norm = v => {
    if (v === undefined || v === null) return '';
    return String(v).replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
  };
  // Igual que norm pero además sin acentos
  U.normPlain = v => U.norm(v).normalize('NFD').replace(/[̀-ͯ]/g, '');

  // Número desde celda (acepta number, "1.234,5", "$1.234", "12,5%", "-20001.13")
  U.num = v => {
    if (v === undefined || v === null) return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (typeof v === 'boolean') return v ? 1 : 0;
    let s = String(v).trim();
    if (!s) return 0;
    s = s.replace(/[$\s%]/g, '').replace(/^USD/i, '');
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); // 1.234.567,89
    else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');                               // 1234,5
    else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');               // 1,234,567.89
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };
  // Número o null si la celda está vacía / no es número
  U.numOrNull = v => {
    if (U.isEmpty(v)) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).trim();
    if (!/\d/.test(s)) return null;
    return U.num(s);
  };

  U.sum = (arr, f) => { let s = 0; for (const x of arr) s += (f ? f(x) : x) || 0; return s; };
  U.round = (n, d = 0) => { const p = Math.pow(10, d); return Math.round(n * p) / p; };
  U.clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  U.median = arr => {
    const a = arr.filter(x => isFinite(x)).slice().sort((x, y) => x - y);
    if (!a.length) return null;
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };
  U.groupBy = (arr, keyFn) => {
    const m = new Map();
    for (const x of arr) { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
    return m;
  };
  U.uniq = arr => [...new Set(arr)];

  // ---------- Fechas ----------
  const MESES = { enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6, agosto: 7,
    septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11 };
  U.MESES_NOMBRE = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  U.MESES_CORTO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  U.DIAS_CORTO = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  U.DIAS_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  // "29 de octubre de 2026 08:43 hs." -> Date (hora local)
  U.parseFechaVentaML = t => {
    if (U.isEmpty(t)) return null;
    if (t instanceof Date) return isNaN(t) ? null : t;
    const m = String(t).match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)\s+de\s+(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/i);
    if (!m) return null;
    const mes = MESES[U.normPlain(m[2])];
    if (mes === undefined) return null;
    const d = new Date(+m[3], mes, +m[1], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, 0);
    return isNaN(d) ? null : d;
  };
  // "29 de octubre | 19:51" (sin año) -> Date, infiriendo el año desde una fecha base
  U.parseFechaSinAnio = (t, base) => {
    if (U.isEmpty(t) || !base) return null;
    const m = String(t).match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)(?:\s*\|\s*(\d{1,2}):(\d{2}))?/i);
    if (!m) return null;
    const mes = MESES[U.normPlain(m[2])];
    if (mes === undefined) return null;
    let anio = base.getFullYear();
    if (mes < base.getMonth() - 6) anio += 1; // cruzó fin de año
    const d = new Date(anio, mes, +m[1], m[3] ? +m[3] : 0, m[4] ? +m[4] : 0);
    return isNaN(d) ? null : d;
  };
  // ISO "2026-10-31T22:12:35.000-03:00" o "31/10/2026 22:12" o "2026-10-31"
  U.parseFechaFlexible = v => {
    if (U.isEmpty(v)) return null;
    if (v instanceof Date) return isNaN(v) ? null : v;
    if (typeof v === 'number') return U.excelSerialToDate(v);
    const s = String(v).trim();
    let m = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/); // gviz
    if (m) return new Date(+m[1], +m[2], +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0);
    // Fecha y hora ISO (Mercado Pago: "2026-10-31T22:12:35.000-03:00"). Se guarda la hora de Argentina, sea cual sea

(function (RV) { RV.GUIA = {"html": "<h2 id=\"guia-que-es-y-para-que-sirve\">Qué es y para qué sirve<\/h2>\n<p>La página del Reporte de Ventas te dice, con tus propios archivos de Mercado Libre y Mercado Pago, <strong>cuánta plata te quedó de verdad en el mes<\/strong> y qué hacer con eso: qué productos te convienen, cuáles reponer, cuánta plata está trabada y cuánto le tenés que pasar a cada socio.<\/p>\n<p>Hace sola las cuentas que antes había que hacer a mano:<\/p>\n<ul>\n<li>A cada venta le resta lo que se queda Meli (comisión, envío, impuestos y cupones) y el flex.<\/li>\n<li>Le resta el costo de cada perfume, según la planilla ANALISIS DE PRODUCTOS.<\/li>\n<li>Separa lo que es tuyo de lo que es de otro socio.<\/li>\n<li>Le resta los gastos grupales que te tocan.<\/li>\n<\/ul>\n<p><strong>Ejemplo:<\/strong> si en octubre vendiste $11 millones, la página te muestra cuánto de eso se fue en Meli, envíos, mercadería y gastos, y te dice algo como «Ganancia neta: $2,5 millones».<\/p>\n<p><strong>Lo que no hace:<\/strong> no cambia nada en Mercado Libre, en Mercado Pago ni en la planilla. Solo lee. Tus archivos no se suben a ningún lado: se procesan en tu propio navegador.<\/p>\n<h2 id=\"guia-antes-de-empezar-que-necesitas\">Antes de empezar: qué necesitás<\/h2>\n<ol>\n<li><strong>El link de la página que te mandó Agus.<\/strong> Se puede usar desde la compu o el celular; en la compu se ve más cómodo. La primera vez abrí el link <strong>largo y completo<\/strong>: así tu navegador queda conectado a la planilla. Después podés guardar la página en favoritos. Si cambiás de compu, de celular o de navegador, abrí el link largo una vez más ahí.<\/li>\n<li><strong>El Excel de ventas de Mercado Libre de cada cuenta tuya<\/strong>, del período que querés ver (por ejemplo, el mes pasado). Es el mismo Excel que ya bajaban para la página anterior y se llama parecido a <code>…Ventas_AR_Mercado_Libre…xlsx<\/code>.<\/li>\n<li><strong>El reporte de Liquidaciones de Mercado Pago<\/strong> del mismo período, de cada cuenta. Es opcional pero conviene: sin él no ves qué plata ya se liberó y cuál falta. Se pide así: en Mercado Pago, menú de la izquierda → «Informes y facturación» → «Reportes de ventas y extractos de cuenta» → «Liquidaciones» → «Crear reporte». Elegís las fechas y tocás «Generar». Te llega un mail cuando está listo. Se llama parecido a <code>settlement_v2-…xlsx<\/code>.<\/li>\n<\/ol>\n<p><strong>Lo que no necesitás:<\/strong><\/p>\n<ul>\n<li>Bajar o subir ANALISIS DE PRODUCTOS: la página la lee sola.<\/li>\n<li>Abrir los Excel antes: soltalos tal cual vienen. Si los abrís y guardás con otro programa pueden cambiar y la página puede no reconocerlos.<\/li>\n<li>Una cuenta o contraseña para la página.<\/li>\n<\/ul>\n<h2 id=\"guia-paso-a-paso-armar-tu-reporte\">Paso a paso: armar tu reporte<\/h2>\n<p>La carga va en cuatro pasos numerados, de arriba hacia abajo (en la compu, el 1 y el 2 a la izquierda y el 3 y el 4 a la derecha):<\/p>\n<ol>\n<li><strong>«¿Quién sos?»: tocá tu nombre<\/strong> (Surak, Ana, Sergio, A Viajar o Agus). Abajo aparecen tus cuentas de Mercado Libre.<\/li>\n<li><strong>«Planilla de costos y stock»: fijate que esté leída.<\/strong> Tiene que decir «ANALISIS DE PRODUCTOS · en vivo», con un punto verde. Arriba a la derecha de la página dice lo mismo. Si dice «Planilla sin conectar», mirá «Problemas comunes» más abajo.<\/li>\n<li><strong>«Tus Excel del mes»: soltá los Excel<\/strong> en el recuadro «Soltá acá los Excel de Mercado Libre y Mercado Pago», o tocá «Elegir archivos». Podés soltar todos juntos: los de ventas y los de Mercado Pago de todas tus cuentas. La primera vez, si la página no conoce el número de vendedor que viene en el nombre de un archivo, te pone un selector al lado: elegí la cuenta. Se acuerda para la próxima.<\/li>\n<li><strong>«Cuentas del reporte»: elegí qué cuentas entran.<\/strong> Cada cuenta se puede marcar o desmarcar: el reporte se puede armar con una, con varias o con todas.<\/li>\n<\/ol>\n<p>Al final, <strong>tocá «Ver mi reporte»<\/strong>. Abajo aparece todo el reporte.<\/p>\n<p><strong>Para cambiar algo después<\/strong> (sumar una cuenta, cambiar un archivo), arriba del reporte está el botón «Sumar cuentas o cambiar archivos».<\/p>\n<p><strong>Ojo con el ejemplo:<\/strong> antes de que cargues tus archivos, la página muestra un reporte de EJEMPLO con datos inventados, marcado con la etiqueta naranja «EJEMPLO». No son tus números.<\/p>\n<h2 id=\"guia-como-leer-el-resumen-de-arriba\">Cómo leer el resumen de arriba<\/h2>\n<ul>\n<li><strong>Ganancia neta<\/strong> (el número grande de la tarjeta azul): lo que te quedó en el bolsillo en el período, después de Meli, envíos, mercadería, gastos grupales y devoluciones. Es <em>tu<\/em> ganancia: lo que vendiste de otros socios no entra acá. Abajo, una frase te dice qué parte de lo que facturaste te quedó.<\/li>\n<li><strong>El medidor del margen<\/strong> (el semicírculo): de cada $100 que facturaste con tus productos, cuántos te quedaron de ganancia, antes de gastos y devoluciones. Afuera tiene las tres franjas del semáforo de toda la página: roja por debajo de 24%, amarilla entre 24% y 28% y verde desde 28%. La rayita que cruza el arco marca el objetivo (25%). Debajo te dice con palabras cuántos puntos estás arriba o abajo del objetivo, con su forma: ▼ rojo, ◆ amarillo, ▲ verde.<\/li>\n<li><strong>Los cuatro números de al lado:<\/strong> ganancia de tus productos, gastos grupales, devoluciones y lo que tenés que transferirle a otros socios.<\/li>\n<li><strong>Ritmo:<\/strong> cuánto facturás y ganás por día. Si el mes no terminó, te dice cómo cerraría a ese ritmo.<\/li>\n<li><strong>Contra el mes anterior:<\/strong> si en esa compu armaste el reporte del mes anterior (mismo perfil y mismas cuentas), cuánto subieron o bajaron la ganancia neta por día, la facturación por día y el margen.<\/li>\n<li><strong>Meta:<\/strong> con «Ponerte una meta de ganancia…» podés fijarte una ganancia para el mes y ver cuánto te falta.<\/li>\n<li><strong>Gastos grupales: Proporcional o Mes completo.<\/strong> Si tu reporte es de medio mes, «Proporcional» cuenta solo la parte de los gastos que corresponde a esos días; «Mes completo» los cuenta todos.<\/li>\n<li><strong>Lo más importante<\/strong> (a la derecha; en el celular, abajo): las cuatro cosas que más conviene mirar, explicadas en criollo. Cada una tiene una etiqueta con su forma: ▼ Alerta, ◆ Atención, ▲ Bien y ● Dato. «Ver los…» muestra el resto.<\/li>\n<li><strong>Las cifras de abajo:<\/strong> facturación, unidades, ticket promedio, lo que te deposita Meli, el costo de la mercadería y lo que falta liberar en Mercado Pago, cada una con su ícono. En las dos primeras, las barritas son los días del período (la más marcada es el último).<\/li>\n<\/ul>\n<p><strong>Ojo:<\/strong> «facturación» es lo que pagaron los compradores, no lo que te queda. Lo que te queda es la ganancia neta.<\/p>\n<h2 id=\"guia-seccion-por-seccion\">Sección por sección<\/h2>\n<p>Cada parte del reporte aparece de a poco cuando llegás a ella: primero las tarjetas y enseguida su contenido (las barras crecen, las líneas se dibujan, el mapa de calor se prende y las cifras suben). Es solo para que se lea más fácil; si en tu compu o celular está activado «reducir movimiento», aparece todo de una. Al imprimir sale todo, aunque no hayas bajado hasta el final.<\/p>\n<p>Debajo del resumen hay una barra con todas las secciones (Resumen, La plata, Día a día, Productos, Stock, Envíos, Cobros, Terceros y gastos, Alertas y Cómo se calcula). Tocá cualquiera para ir directo.<\/p>\n<p>Algunas secciones arrancan con su número más importante en grande y una frase que lo explica: en La plata, cuántos pesos te quedan de cada $100; en Productos, cuánto te dejó el producto que más ganancia dio; en Stock, cuántos productos hay que reponer ya.<\/p>\n<h3>La plata: adónde se va<\/h3>\n<p>Es una «cascada»: arranca en lo que facturaste con tus productos y va restando renglón por renglón (comisión de Meli, envíos, cupones, impuestos, flex, mercadería, devoluciones y gastos) hasta llegar a la ganancia neta. Las barras grises restan, las verdes suman, la naranja es la ganancia neta y las azules son subtotales (la leyenda de abajo lo recuerda). Al lado, «De cada $100 que vendiste» muestra cien cuadraditos: cada uno es $1, los naranjas son tu ganancia y los celestes, lo que se va; abajo dice en qué se va cada parte.<\/p>\n<h3>Día a día<\/h3>\n<p>Cuánto vendiste cada día, el acumulado del mes con su proyección, qué días y horarios te compran más (cuanto más intenso el azul, más ventas) y el resumen por semana. «Mes a mes» compara con los reportes de meses anteriores que armaste <strong>en esa misma compu<\/strong>.<\/p>\n<h3>Productos<\/h3>\n<p>Una fila por producto: unidades, precio promedio, cuánto ganás por unidad y el <strong>margen<\/strong> con semáforo y su forma (▼ rojo, menos de 24%; ◆ amarillo, 24% a 28%; ▲ verde, 28% o más). En la compu, al lado del margen hay una barrita: la raya que la cruza es el objetivo (25%). En el celular cada producto se ve como una ficha. También:<\/p>\n<ul>\n<li><strong>Demanda contra margen:<\/strong> cada círculo es un producto. Arriba a la derecha están los que venden mucho y dejan buen margen.<\/li>\n<li><strong>Dónde ajustar el precio:<\/strong> el precio aproximado para llegar al objetivo de margen.<\/li>\n<\/ul>\n<h3>El detalle de un producto<\/h3>\n<p>Tocá un producto para abrir su ficha. Tiene la ganancia y el margen, la calculadora <strong>«¿Y si lo vendés a…?»<\/strong> (escribís un precio y te dice cuánto ganarías), el precio de cada venta a lo largo del mes (los puntos rojos son ventas con margen bajo), cómo le fue contra el mes anterior, su stock, cuánto entra en el pedido y la lista de ventas.<\/p>\n<h3>Envíos<\/h3>\n<p>Cuántos envíos fueron por flex y cuántos por correo, cuánto costó cada uno, a qué provincias vendiste y el flex por zona. Si dos ventas viajaron juntas, el flex se cuenta una sola vez.<\/p>\n<h3>Cobros en Mercado Pago<\/h3>\n<p>Necesita el reporte de Liquidaciones. Muestra qué plata ya se liberó, cuál falta y en qué fecha se libera (calendario). En amarillo, la plata con la fecha de liberación <strong>vencida<\/strong>: conviene revisarla en Mercado Pago, porque puede ser un reclamo. También cómo te pagan los compradores, en cuántas cuotas y las retenciones de Ingresos Brutos por provincia, que le sirven al contador.<\/p>\n<h3>Terceros, gastos y devoluciones<\/h3>\n<ul>\n<li><strong>Plata de otros vendedores:<\/strong> productos de otro socio que se vendieron en tus cuentas, y cuánto le tenés que transferir (ya descontado Meli y el flex).<\/li>\n<li><strong>Gastos grupales:<\/strong> lo que te toca de la pestaña GASTOS GRUPALES.<\/li>\n<li><strong>Devoluciones y cancelaciones:<\/strong> cada una y cuánto te afectó. Las devoluciones «en curso» todavía no se descuentan: quedan en suspenso.<\/li>\n<\/ul>\n<h3>Alertas<\/h3>\n<p>Lo que conviene corregir en la planilla o mirar en Meli y Mercado Pago, de lo más grave a lo menos grave: publicaciones sin mapear, productos sin costo, plata trabada, productos para reponer y más. Cada alerta lleva la misma etiqueta que «Lo más importante» (▼ Alerta, ◆ Atención o ● Dato) y dice qué hacer.<\/p>\n<h3>Cómo se calcula<\/h3>\n<p>Explica de dónde sale cada número, para que cualquiera pueda chequearlo contra los Excel.<\/p>\n<h2 id=\"guia-stock-y-pedido-optimo\">Stock y pedido óptimo<\/h2>\n<p><strong>La tabla de stock<\/strong> muestra, para cada producto tuyo, cuánto stock hay según «Consulta stock» de la planilla (incluido lo que viene en camino), cuánto se vendió y la <strong>cobertura<\/strong>: cuántos días te dura al ritmo de venta del reporte. El estado te dice qué hacer:<\/p>\n<ul>\n<li><strong>✕ Sin stock<\/strong> o <strong>▼ Pedir ya:<\/strong> le quedan menos de 10,5 días.<\/li>\n<li><strong>◆ Revisar:<\/strong> menos de 21 días.<\/li>\n<li><strong>✓ OK:<\/strong> alcanza.<\/li>\n<\/ul>\n<p>En la compu, la barra de la cobertura muestra los días que te alcanza: la raya roja marca 10,5 días y la otra, 21.<\/p>\n<h3>Armá el pedido<\/h3>\n<p>La página arma el pedido sola. Vos elegís cuatro cosas:<\/p>\n<ol>\n<li><strong>El tipo de pedido.<\/strong> Cada botón ya muestra cuánto costaría.<ul>\n<li><strong>Óptimo<\/strong> (el recomendado): cubre los días que elijas de los productos que dejan buen margen y solo 21 días de los que están en rojo, para no inmovilizar plata en lo que menos deja.<\/li>\n<li><strong>Mínimo:<\/strong> lo justo para que ningún producto quede con menos de 21 días.<\/li>\n<li><strong>Completo:<\/strong> todos los productos hasta los días que elijas.<\/li>\n<li><strong>Con tope:<\/strong> ponés cuánto podés gastar como máximo, en dólares o en pesos, y la página arma el mejor pedido con esa plata. Primero cubre lo urgente, después el mínimo de todos y después el resto; en cada paso, primero lo que más ganancia deja por cada dólar.<\/li>\n<\/ul>\n<\/li>\n<li><strong>La venta mensual a usar.<\/strong> La página mezcla la venta mensual que figura en la planilla con la que dio este reporte. Con el deslizador elegís cuánto pesa cada una; al medio es mitad y mitad. Si la planilla dice 0 o está vacía, usa solo el reporte.<\/li>\n<li><strong>Los días a cubrir:<\/strong> para cuántos días querés comprar (30, si no cambiás nada).<\/li>\n<li><strong>El máximo a gastar<\/strong>, solo en «Con tope».<\/li>\n<\/ol>\n<p>Debajo aparece cuántas unidades pedir de cada producto, cuánto cuesta (precio en Paraguay + 10% de Sergio PY), para cuántos días te alcanza después y, al lado, lo que dice la planilla en «Cantidad a Comprar», para comparar. Con <strong>«Copiar para WhatsApp»<\/strong> te queda el pedido listo para mandar.<\/p>\n<p><strong>Ejemplo:<\/strong> si el pedido completo cuesta US$2.200 y ponés un tope de US$1.000, la página compra primero lo que se está por quedar sin stock, después lleva todo a 21 días y, si sobra plata, sigue con lo que más ganancia deja. Abajo te dice qué no entró y cuánto faltaría para el óptimo y para el completo.<\/p>\n<p><strong>Ojo:<\/strong><\/p>\n<ul>\n<li>El pedido usa las ventas de las cuentas que pusiste en el reporte. Si vendés esos productos en otras cuentas que no cargaste, la página lo avisa y el pedido puede quedar corto.<\/li>\n<li>Los días que cubre cada producto en el pedido pueden diferir un poco de la tabla de stock: el pedido usa la venta mezclada y la tabla usa solo la del reporte.<\/li>\n<li>La página recuerda cómo dejaste el pedido, en esa compu.<\/li>\n<\/ul>\n<h2 id=\"guia-botones-utiles\">Botones útiles<\/h2>\n<ul>\n<li><strong>Guía<\/strong> (arriba a la derecha, el signo de pregunta, y al pie): esta guía. Siempre está al día con la versión de la página.<\/li>\n<li><strong>Excel<\/strong> (arriba a la derecha): baja todo el reporte en un Excel con varias hojas: resumen, productos, ventas, terceros, cobros, stock, pedido y alertas.<\/li>\n<li><strong>Resumen para WhatsApp<\/strong> (arriba del reporte): arma un texto con lo más importante del mes (ganancia, facturación, mejores productos, lo que hay que transferir, Mercado Pago, qué reponer y el pedido). Lo copiás y lo pegás.<\/li>\n<li><strong>Imprimir<\/strong> (ícono de impresora, en la versión web): para imprimir el reporte o guardarlo como PDF.<\/li>\n<li><strong>Tamaño: A− y A+<\/strong> (arriba a la derecha): achican o agrandan toda la página (letras, espacios y gráficos) de a un paso, del 85 % al 125 %. En la compu, el botón del medio muestra el tamaño y vuelve al 100 % al tocarlo; en el celular, un aviso te dice en cuánto quedó. La página se acuerda del tamaño en ese navegador. El zoom del navegador (Ctrl + y Ctrl − en la compu, pellizcar en el celular) también anda.<\/li>\n<li><strong>Modo oscuro<\/strong> (ícono de luna, en la versión web): fondo azul noche y letras claras. Tocándolo otra vez volvés al claro.<\/li>\n<li><strong>Ponerte una meta de ganancia…<\/strong> (en el resumen): fijás una ganancia para el mes.<\/li>\n<li><strong>Sumar cuentas o cambiar archivos<\/strong> (arriba del reporte): volvés a la carga sin perder lo que hiciste.<\/li>\n<li><strong>Volver a leer<\/strong> (en «Planilla de costos y stock»): si recién cambiaste algo en ANALISIS, lo trae al momento. Si no lo tocás, la página igual lee la planilla cada vez que se abre.<\/li>\n<\/ul>\n<h2 id=\"guia-version-y-novedades\">Versión y novedades<\/h2>\n<p>Arriba, al lado del nombre de la página, está el número de versión, por ejemplo <strong>v2.6.0<\/strong>. Tocándolo se abren las <strong>Novedades<\/strong>: qué cambió en cada versión, la más nueva primero. El número también está al pie de la página, y en el celular aparece solo ahí.<\/p>\n<ul>\n<li><strong>Un punto en el número<\/strong> quiere decir que la página se actualizó desde tu última visita. Se va cuando abrís las Novedades.<\/li>\n<li><strong>Cómo leer el número:<\/strong> el primero cambia cuando cambia la forma de usar la página, el segundo cuando se suma algo nuevo y el tercero cuando se arregla algo. De 2.5.1 a 2.6.0 hay cosas nuevas (el diseño nuevo); de 2.5.0 a 2.5.1, solo arreglos.<\/li>\n<li><strong>Esta guía se actualiza con cada versión<\/strong>: si algo se ve distinto a lo que dice, recargá la página.<\/li>\n<li><strong>Para comparar números con alguien<\/strong>, fijense que los dos tengan la misma versión. Si no, recarguen la página (Ctrl + Shift + R en la compu; en el celular, cerrar la pestaña y volver a abrirla).<\/li>\n<li><strong>El Excel<\/strong> dice con qué versión se hizo, en la segunda línea de la hoja Resumen.<\/li>\n<\/ul>\n<h2 id=\"guia-problemas-comunes-y-como-resolverlos\">Problemas comunes y cómo resolverlos<\/h2>\n<div class=\"guia-tbl-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Tabla de la guía: Problemas comunes y cómo resolverlos\"><table class=\"guia-tbl\">\n<thead>\n<tr>\n<th>Lo que ves<\/th>\n<th>Qué pasa y qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Arriba dice «Planilla sin conectar»<\/td>\n<td>Ese navegador todavía no está conectado a ANALISIS. Abrí una vez el link largo que te mandó Agus, en esa misma compu o celular.<\/td>\n<\/tr>\n<tr>\n<td>«Planilla: no se pudo leer», «la conexión en vivo falló» o «copia guardada»<\/td>\n<td>La conexión con la planilla no pudo leer (internet, Google tardó, o hay que arreglarla). La página usa la última copia que guardó y te dice de cuándo es. Tocá ese aviso de arriba: dice el motivo. Si dice que hay que actualizar la conexión o compartir ANALISIS, avisale a quien la conectó: se arregla desde su cuenta de Google. Si no, probá «Volver a leer» en un rato.<\/td>\n<\/tr>\n<tr>\n<td>«no parece un reporte de Meli, de Mercado Pago ni la planilla»<\/td>\n<td>Ese archivo no es el Excel de ventas ni el de Liquidaciones, o se modificó al abrirlo. Bajalo de nuevo y soltalo sin abrirlo.<\/td>\n<\/tr>\n<tr>\n<td>«Elegí de qué cuenta es cada archivo»<\/td>\n<td>La página no conoce el número de vendedor de ese archivo. Elegí la cuenta en el selector que aparece al lado.<\/td>\n<\/tr>\n<tr>\n<td>«Falta el Excel de ventas de Meli»<\/td>\n<td>Soltaste solo el de Mercado Pago. El de ventas es obligatorio.<\/td>\n<\/tr>\n<tr>\n<td>«Cobros sin ventas»<\/td>\n<td>Cargaste el reporte de Mercado Pago de una cuenta pero no sus ventas: ese reporte no se usó.<\/td>\n<\/tr>\n<tr>\n<td>«X ventas aparecen en dos cuentas»<\/td>\n<td>El mismo Excel quedó asignado a dos cuentas. Revisá de qué cuenta es cada archivo. Igual se cuentan una sola vez.<\/td>\n<\/tr>\n<tr>\n<td>«X publicaciones sin mapear»<\/td>\n<td>Esas ventas no están en la pestaña MAPPING de la planilla. Hasta que se agreguen, no entran en la ganancia.<\/td>\n<\/tr>\n<tr>\n<td>«X productos sin costo»<\/td>\n<td>Falta el costo en TITULARES o un pedido en PEDIDOS. Sin costo no se puede calcular la ganancia de ese producto.<\/td>\n<\/tr>\n<tr>\n<td>«X productos sin vendedor en TITULARES»<\/td>\n<td>Se tomaron como tuyos. Si son de otro socio, hay que cargar el vendedor en la planilla.<\/td>\n<\/tr>\n<tr>\n<td>«Códigos postales de flex sin tarifa»<\/td>\n<td>Un código postal que no está en el tarifario: se usó un precio promedio. Hay que cargarlo en «CPs a AGREGAR» de la planilla.<\/td>\n<\/tr>\n<tr>\n<td>«Ventas que no aparecen en el reporte de Mercado Pago»<\/td>\n<td>El reporte de Mercado Pago es de otras fechas o se pidió antes que el de Meli. Pedilo de nuevo con las mismas fechas.<\/td>\n<\/tr>\n<tr>\n<td>«Con la fecha de liberación vencida»<\/td>\n<td>Mercado Pago no liberó esa plata aunque ya pasó la fecha: puede ser un reclamo o una retención. Revisalo en Mercado Pago.<\/td>\n<\/tr>\n<tr>\n<td>«Ventas con precio $0 en el Excel de Meli»<\/td>\n<td>Es una falla del Excel de Meli. La página las completó con el promedio de ese producto.<\/td>\n<\/tr>\n<tr>\n<td>Los números no te coinciden con otro lado<\/td>\n<td>Revisá que los archivos sean del mismo período y que estén marcadas todas las cuentas. Al final de la página, «Cómo se calcula» explica cada número.<\/td>\n<\/tr>\n<tr>\n<td>El período termina antes de fin de mes<\/td>\n<td>La página cuenta desde la primera hasta la última venta del archivo. Si los últimos días no hubo ventas, termina antes. Para los gastos podés elegir «Mes completo».<\/td>\n<\/tr>\n<tr>\n<td>En el celular una tabla no entra<\/td>\n<td>Deslizala con el dedo hacia el costado: la sombra en el borde te avisa que hay más.<\/td>\n<\/tr>\n<tr>\n<td>Ves números que no son tuyos<\/td>\n<td>Fijate si dice EJEMPLO: son datos inventados hasta que cargues tus archivos.<\/td>\n<\/tr>\n<tr>\n<td>Un socio no ve lo mismo que vos<\/td>\n<td>La meta, el historial «mes a mes» y cómo dejaste el pedido se guardan en cada compu. La planilla y los cálculos son los mismos para todos.<\/td>\n<\/tr>\n<tr>\n<td>Un punto en el número de arriba, o el aviso «La página se actualizó»<\/td>\n<td>Es normal: hay una versión nueva. Tocá el número para ver qué cambió; el punto se va solo.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"guia-glosario\">Glosario<\/h2>\n<div class=\"guia-tbl-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Tabla de la guía: Glosario\"><table class=\"guia-tbl\">\n<thead>\n<tr>\n<th>Palabra<\/th>\n<th>Qué quiere decir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Facturación<\/td>\n<td>Lo que pagaron los compradores por tus productos. No es lo que te queda.<\/td>\n<\/tr>\n<tr>\n<td>Te deposita Meli<\/td>\n<td>Lo que te queda después de lo que cobra Meli (comisión, envío por correo, impuestos y cupones), antes del flex y la mercadería.<\/td>\n<\/tr>\n<tr>\n<td>Ganancia de tus productos<\/td>\n<td>Lo que te deposita Meli, menos el flex y el costo de la mercadería.<\/td>\n<\/tr>\n<tr>\n<td>Ganancia neta<\/td>\n<td>La ganancia de tus productos, menos devoluciones y gastos grupales: lo que te quedó en el bolsillo.<\/td>\n<\/tr>\n<tr>\n<td>Margen<\/td>\n<td>De cada $100 que facturaste, cuántos te quedaron de ganancia. 25% = $25 de cada $100.<\/td>\n<\/tr>\n<tr>\n<td>Semáforo<\/td>\n<td>Rojo: margen menor a 24%. Amarillo: entre 24% y 28%. Verde: 28% o más.<\/td>\n<\/tr>\n<tr>\n<td>Flex<\/td>\n<td>Envíos de Mercado Envíos Flex: no los hace el correo de Meli, se pagan aparte según la zona del código postal.<\/td>\n<\/tr>\n<tr>\n<td>Bonificación flex<\/td>\n<td>Lo que Meli te devuelve por cada envío flex.<\/td>\n<\/tr>\n<tr>\n<td>Cupones<\/td>\n<td>Descuentos que Meli le hace al comprador y te descuenta a vos.<\/td>\n<\/tr>\n<tr>\n<td>IIBB<\/td>\n<td>Ingresos Brutos: impuesto que te retienen en cada venta, según la provincia.<\/td>\n<\/tr>\n<tr>\n<td>Liberado / por liberar<\/td>\n<td>Plata que Mercado Pago ya te dejó disponible, o que todavía retiene hasta una fecha.<\/td>\n<\/tr>\n<tr>\n<td>Vencido<\/td>\n<td>Plata que debía estar liberada y no lo está. Hay que revisarla en Mercado Pago.<\/td>\n<\/tr>\n<tr>\n<td>Terceros<\/td>\n<td>Productos de otro socio que se vendieron en tus cuentas. Esa plata es de él.<\/td>\n<\/tr>\n<tr>\n<td>Gastos grupales<\/td>\n<td>Gastos que se pagan entre todos (insumos, contador, monotributo…), según la pestaña GASTOS GRUPALES.<\/td>\n<\/tr>\n<tr>\n<td>Cobertura<\/td>\n<td>Cuántos días te dura el stock al ritmo de venta actual.<\/td>\n<\/tr>\n<tr>\n<td>Mapear<\/td>\n<td>Decirle a la planilla (pestaña MAPPING) a qué producto corresponde cada publicación de Meli.<\/td>\n<\/tr>\n<tr>\n<td>Período<\/td>\n<td>Desde la primera hasta la última venta de los archivos que cargaste.<\/td>\n<\/tr>\n<tr>\n<td>Perfil y cuentas<\/td>\n<td>El perfil es la persona (Surak, Ana, Sergio, A Viajar o Agus); las cuentas son sus cuentas de Mercado Libre.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "secciones": [["guia-que-es-y-para-que-sirve", "Qué es y para qué sirve"], ["guia-antes-de-empezar-que-necesitas", "Antes de empezar: qué necesitás"], ["guia-paso-a-paso-armar-tu-reporte", "Paso a paso: armar tu reporte"], ["guia-como-leer-el-resumen-de-arriba", "Cómo leer el resumen de arriba"], ["guia-seccion-por-seccion", "Sección por sección"], ["guia-stock-y-pedido-optimo", "Stock y pedido óptimo"], ["guia-botones-utiles", "Botones útiles"], ["guia-version-y-novedades", "Versión y novedades"], ["guia-problemas-comunes-y-como-resolverlos", "Problemas comunes y cómo resolverlos"], ["guia-glosario", "Glosario"]]}; })(globalThis.RV = globalThis.RV || {});

/* ============================================================
   parsers.js — leer los archivos de Meli / Mercado Pago y las
   pestañas de la planilla. Todo por NOMBRE de columna (no por
   posición), así toleran columnas nuevas o reordenadas.
   ============================================================ */
(function (RV) {
  'use strict';
  const U = RV.util;
  const P = RV.parse = {};

  // ---------- Workbook (SheetJS) -> { hoja: aoa } ----------
  // SheetJS arma las fechas de Excel desde el 30/12/1899 con la hora local de esa época, que en casi todas las
  // zonas tiene segundos sueltos (Buenos Aires era −4:16:48). Por eso cada fecha le llega corrida unos segundos:
  // en Buenos Aires, +48 s; en zonas al este, unos segundos antes, o sea el día anterior a las 23:59. Se corrige
  // con el mismo cálculo que usa SheetJS, así una fecha da lo mismo en cualquier compu.
  const CORRIMIENTO_1899 = (() => { const b = new Date(1899, 11, 30, 0, 0, 0); return b.getTime() - (Date.UTC(1899, 11, 30) + b.getTimezoneOffset() * 60000); })();
  P.workbookToTables = wb => {
    const out = {};
    for (const name of wb.SheetNames) {
      const ws = wb.Sheets[name];
      const filas = globalThis.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: true });
      out[name] = CORRIMIENTO_1899 ? filas.map(f => f.map(v => v instanceof Date ? new Date(v.getTime() - CORRIMIENTO_1899) : v)) : filas;
    }
    return out;
  };

  // Busca una hoja por nombre aproximado (sin acentos/mayúsculas/espacios)
  P.findSheet = (tables, names) => {
    const keys = Object.keys(tables);
    for (const n of names) {
      const k = keys.find(x => U.normPlain(x) === U.normPlain(n));
      if (k) return k;
    }
    return null;
  };

  // Índice de la fila de encabezado: la primera que contiene la columna clave
  const findHeaderRow = (aoa, clave, limite = 40) => {
    const c = U.normPlain(clave);
    for (let i = 0; i < Math.min(limite, aoa.length); i++) {
      const fila = aoa[i] || [];
      if (fila.some(x => U.normPlain(x) === c)) return i;
    }
    return -1;
  };
  // Encuentra columna por alias exactos (normalizados sin acento)
  const colByAlias = (headers, aliases, desde = 0) => {
    const al = aliases.map(U.normPlain);
    for (let i = desde; i < headers.length; i++) if (al.includes(U.normPlain(headers[i]))) return i;
    return -1;
  };
  const colByPrefix = (headers, prefix) => {
    const p = U.normPlain(prefix);
    return headers.findIndex(h => U.normPlain(h).startsWith(p));
  };
  P.colByAlias = colByAlias;

  // ---------- Detección de qué archivo es ----------
  P.sellerIdFromName = (name) => {
    const s = String(name || '');
    let m = s.match(/settlement[^-]*-(\d{6,13})-/i);
    if (m) return m[1];
    m = s.match(/_(\d{6,13})(?:\s*\(\d+\))?\.xlsx?$/i);
    if (m) return m[1];
    // último recurso: un número largo que NO sea una fecha (20261101) ni fecha+hora (202611012051)
    const esFecha = n => /^20\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(\d{4}|\d{6})?$/.test(n);
    for (const x of s.match(/\d{8,13}/g) || []) if (!esFecha(x)) return x;
    return null;
  };
  P.fechaDesdeNombre = (name) => {
    const s = String(name || '');
    let m = s.match(/(\d{4})-(\d{2})-(\d{2})[_-](\d{2})-?(\d{2})(?:hs|-?(\d{2}))?/i);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    m = s.match(/(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
    return null;
  };

  P.detect = (tables, filename) => {
    const names = Object.keys(tables);
    const has = n => !!P.findSheet(tables, [n]);
    if (has('TITULARES') && (has('Consulta stock') || has('Pedidos') && names.length > 6)) return { kind: 'analisis' };
    if (has('TITULARES') && (has('MAPPING') || has('MAPING'))) return { kind: 'auxiliar' };
    if (has('Caba') && has('Zona Norte')) return { kind: 'logistica' };
    const first = tables[names[0]] || [];
    if (findHeaderRow(first, '# de venta', 40) !== -1) return { kind: 'ml', sellerId: P.sellerIdFromName(filename) };
    const head = (first[0] || []).map(U.normPlain);
    const mpKeys = ['tipo de operacion', 'monto neto de la operacion', 'estado de la operacion (status)', 'monto recibido (net_received_amount)', 'fecha de liberacion del pago (date_released_short)'];
    if (head.some(h => mpKeys.includes(h))) {
      let sellerId = P.sellerIdFromName(filename);
      const iCta = head.indexOf('codigo de la cuenta del vendedor');
      if (iCta !== -1) { const r = first.slice(1).find(r => !U.isEmpty(r[iCta])); if (r) sellerId = String(r[iCta]).trim(); }
      return { kind: 'mp', sellerId };
    }
    return { kind: 'unknown' };
  };

  // ============================================================
  //  Reporte de VENTAS de Mercado Libre
  // ============================================================
  const COLS_CRITICAS = ['# de venta', 'Fecha de venta', 'Estado', 'Unidades', 'Ingresos por productos (ARS)', 'Total (ARS)', 'Título de la publicación'];

  P.mlVentas = (aoa, filename) => {
    const hRow = findHeaderRow(aoa, '# de venta', 40);
    if (hRow === -1) throw new Error('No encontramos la columna "# de venta". ¿Es el Excel de Ventas original de Mercado Libre?');
    const H = (aoa[hRow] || []).map(c => String(c == null ? '' : c).trim());
    // Fila de "grupos" arriba del encabezado (Ventas / Compradores / Envíos / Devoluciones / Reclamos)
    const G = [];
    if (hRow > 0) {
      let cur = '';
      const gr = aoa[hRow - 1] || [];
      for (let i = 0; i < H.length; i++) { if (!U.isEmpty(gr[i])) cur = U.normPlain(gr[i]); G[i] = cur; }
    }
    const hayGrupos = G.some(Boolean);
    const col = (name, grupo) => {
      const n = U.normPlain(name);
      if (hayGrupos && grupo) {
        const g = U.normPlain(grupo);
        const i = H.findIndex((h, k) => U.normPlain(h) === n && (G[k] || '').startsWith(g));
        if (i !== -1) return i;
      }
      return H.findIndex(h => U.normPlain(h) === n);
    };
    // «Estado» y «Unidades» también están en otros bloques (Compradores, Devoluciones, Reclamos). Si el archivo trae los
    // bloques, tienen que estar en el de Ventas: si no, se tomaría otra columna (la provincia del comprador o las
    // unidades devueltas) y el reporte saldría mal sin avisar.
    const enVentas = (name) => {
      if (!hayGrupos) return col(name);
      const n = U.normPlain(name);
      return H.findIndex((h, k) => U.normPlain(h) === n && (G[k] || '').startsWith('venta'));
    };
    const AMBIGUAS = ['Estado', 'Unidades'];
    const faltan = COLS_CRITICAS.filter(c => (AMBIGUAS.includes(c) ? enVentas(c) : col(c)) === -1);
    if (faltan.length) throw new Error('Al archivo de ventas le faltan columnas: ' + faltan.join(', ') + '.');

    const iDom = col('Domicilio');
    const idx = {
      id: col('# de venta'), fecha: col('Fecha de venta'), estado: enVentas('Estado'), desc: col('Descripción del estado'),
      paquete: col('Paquete de varios productos'), kit: col('Pertenece a un kit'), unidades: enVentas('Unidades'),
      ingresos: col('Ingresos por productos (ARS)'), cargo: col('Cargo por venta'), fijo: col('Costo fijo'),
      cuotasCosto: col('Costo por ofrecer cuotas'), ingEnvio: col('Ingresos por envío (ARS)'), envio: col('Costos de envío (ARS)'),
      envioMedidas: col('Costo de envío basado en medidas y peso declarados'), difMedidas: col('Cargo por diferencias en medidas y peso del paquete'),
      cargoVentaImp: col('Cargo por venta e impuestos (ARS)'),
      impuestos: col('Impuestos'), bonif: col('Descuentos y bonificaciones'), anul: col('Anulaciones y reembolsos (ARS)'),
      total: col('Total (ARS)'), mesFact: col('Mes de facturación de tus cargos'), ads: col('Venta por publicidad'),
      sku: col('SKU'), pub: col('# de publicación'), titulo: col('Título de la publicación'), variante: col('Variante'),
      precioPub: col('Precio unitario de venta de la publicación (ARS)'), cuotasAgregadas: col('Tiene cuotas agregadas'),
      condIva: col('Condición fiscal (IVA)'), negocio: col('Negocio'),
      ciudad: col('Ciudad', 'compradores'), cp: col('Código postal', 'compradores'),
      entrega: col('Forma de entrega', 'envios'), enCamino: col('Fecha en camino', 'envios'), entregado: col('Fecha entregado', 'envios'),
      transportista: col('Transportista', 'envios'), seguimiento: col('Número de seguimiento', 'envios'),
      devForma: hayGrupos ? col('Forma de entrega', 'devoluciones') : -1,
      devResultado: col('Resultado', 'devoluciones'), devDinero: col('Dinero a favor', 'devoluciones'),
      devMotivo: col('Motivo del resultado', 'devoluciones'),
      reclamoAbierto: col('Reclamo abierto'), reclamoCerrado: col('Reclamo cerrado'), mediacion: col('Con mediación'),
    };
    // Provincia: "Estado" del bloque Compradores (o el primero después de Domicilio)
    idx.provincia = hayGrupos ? H.findIndex((h, k) => U.normPlain(h) === 'estado' && (G[k] || '').startsWith('compradores')) : -1;
    if (idx.provincia === -1 && iDom !== -1) idx.provincia = H.findIndex((h, k) => k > iDom && U.normPlain(h) === 'estado');
    if (idx.devForma === idx.entrega) idx.devForma = -1;

    const g = (fila, k) => (idx[k] === -1 || idx[k] === undefined) ? '' : fila[idx[k]];
    const txt = (fila, k) => { const v = g(fila, k); return U.isEmpty(v) ? '' : String(v).trim(); };

    // Fecha de generación del reporte ("Estado de tus ventas al 1 de noviembre de 2026 a las 20:51 hs.")
    let generado = null;
    for (let i = 0; i < hRow; i++) {
      const t = (aoa[i] || []).map(x => String(x || '')).join(' ');
      const m = t.match(/al\s+(\d{1,2}\s+de\s+[a-záéíóúñ]+\s+de\s+\d{4})\s+a\s+las\s+(\d{1,2}):(\d{2})/i);
      if (m) { const d = U.parseFechaVentaML(m[1] + ' ' + m[2] + ':' + m[3]); if (d) generado = d; }
    }
    if (!generado) generado = P.fechaDesdeNombre(filename);

    const ventas = [];
    let paqueteActual = null;
    const mismoMomento = (a, b) => a && b && Math.abs(a - b) < 90000; // los productos de un paquete comparten fecha y hora
    for (let i = hRow + 1; i < aoa.length; i++) {
      const fila = aoa[i] || [];
      if (!fila.some(x => !U.isEmpty(x))) continue;
      let id = txt(fila, 'id');
      const titulo = txt(fila, 'titulo');
      const unidades = U.num(g(fila, 'unidades'));
      // Fila contenedora de "Paquete de N productos" (sin unidades propias)
      const esCabeceraPaquete = (!titulo || /^paquete de \d+/i.test(titulo)) && !unidades;
      if (!id && !titulo) continue;
      const fechaPropia = U.parseFechaVentaML(g(fila, 'fecha'));
      // ¿Es un producto del paquete de arriba? Sin número propio, o con la misma fecha y hora
      // mientras falten productos para completar el "Paquete de N".
      let hijoDe = null;
      if (!esCabeceraPaquete && paqueteActual) {
        if (!id) hijoDe = paqueteActual;
        else if (paqueteActual.n && paqueteActual.hijos.length < paqueteActual.n && mismoMomento(fechaPropia, paqueteActual.fecha)) hijoDe = paqueteActual;
      }
      if (!id && hijoDe) id = hijoDe.id + '·' + (hijoDe.hijos.length + 1);
      if (!id) continue;
      const fecha = fechaPropia || (hijoDe ? hijoDe.fecha : null);
      const bonifRaw = g(fila, 'bonif');
      const v = {
        id, fecha, estado: txt(fila, 'estado'), estadoDesc: txt(fila, 'desc'),
        enPaquete: U.normPlain(txt(fila, 'paquete')) === 'si',
        unidades,
        ingresos: U.num(g(fila, 'ingresos')),
        cargo: U.num(g(fila, 'cargo')) || (idx.cargo === -1 ? U.num(g(fila, 'cargoVentaImp')) : 0),
        costoFijo: U.num(g(fila, 'fijo')), costoCuotas: U.num(g(fila, 'cuotasCosto')),
        ingresosEnvio: U.num(g(fila, 'ingEnvio')), costoEnvio: U.num(g(fila, 'envio')),
        envioMedidas: U.num(g(fila, 'envioMedidas')), difMedidas: U.num(g(fila, 'difMedidas')),
        impuestos: U.num(g(fila, 'impuestos')), bonif: U.num(bonifRaw), tieneBonif: !U.isEmpty(bonifRaw),
        anulaciones: U.num(g(fila, 'anul')), total: U.num(g(fila, 'total')),
        mesFacturacion: txt(fila, 'mesFact'), ads: U.normPlain(txt(fila, 'ads')) === 'si',
        sku: txt(fila, 'sku').replace(/\.0$/, ''), publicacion: txt(fila, 'pub'), titulo, variante: txt(fila, 'variante'),
        precioPublicacion: U.num(g(fila, 'precioPub')), cuotasAgregadas: U.normPlain(txt(fila, 'cuotasAgregadas')) === 'si',
        negocio: U.normPlain(txt(fila, 'negocio')) === 'si', condIva: txt(fila, 'condIva'),
        ciudad: txt(fila, 'ciudad'), provincia: txt(fila, 'provincia'),
        cp: (() => { const c = txt(fila, 'cp'); const n = parseInt(c, 10); return isNaN(n) ? '' : String(n); })(),
        entrega: txt(fila, 'entrega'), enCaminoTxt: txt(fila, 'enCamino'), entregadoTxt: txt(fila, 'entregado'),
        transportista: txt(fila, 'transportista'), envioId: txt(fila, 'seguimiento'),
        devForma: txt(fila, 'devForma'), devResultado: txt(fila, 'devResultado'), devMotivo: txt(fila, 'devMotivo'),
        reclamo: U.normPlain(txt(fila, 'reclamoAbierto')) === 'si', mediacion: U.normPlain(txt(fila, 'mediacion')) === 'si',
        esCabeceraPaquete,
      };
      // Componente que Meli no detalla en columnas (cupones de descuento, costos de reclamos, etc.)
      const comp = v.ingresos + v.cargo + v.costoFijo + v.costoCuotas + v.ingresosEnvio + v.costoEnvio + v.envioMedidas +
        v.difMedidas + v.impuestos + v.bonif + v.anulaciones;
      v.noDetallado = U.round(v.total - comp, 2);
      if (Math.abs(v.noDetallado) < 0.5) v.noDetallado = 0;
      v.fechaEnCamino = U.parseFechaSinAnio(v.enCaminoTxt, v.fecha);
      v.fechaEntregado = U.parseFechaSinAnio(v.entregadoTxt, v.fecha);
      if (esCabeceraPaquete) {
        const n = (titulo.match(/^paquete de (\d+)/i) || [])[1];
        paqueteActual = { id, fecha, n: n ? +n : null, fila: v, hijos: [] };
        v.hijos = paqueteActual.hijos;
      } else if (hijoDe) { hijoDe.hijos.push(v); v.paqueteDe = hijoDe.id; }
      else paqueteActual = null;
      ventas.push(v);
    }

    // Paquetes: si la cabecera trae la plata y los productos no, se reparte por precio x unidades;
    // si los productos ya traen su plata, la cabecera no se suma (evita contar dos veces);
    // si no hay detalle, la cabecera queda como una venta más (cuenta en la plata, sin producto).
    const avisos = [];
    for (const v of ventas.filter(x => x.esCabeceraPaquete)) {
      const hijos = v.hijos || [];
      delete v.hijos;
      const hijosSinPlata = hijos.filter(h => !h.ingresos && !h.total);
      if (hijos.length && hijosSinPlata.length === hijos.length) {
        const base = U.sum(hijos, h => (h.precioPublicacion || 1) * (h.unidades || 1));
        for (const h of hijos) {
          const w = ((h.precioPublicacion || 1) * (h.unidades || 1)) / base;
          for (const k of ['ingresos', 'cargo', 'costoFijo', 'costoCuotas', 'ingresosEnvio', 'costoEnvio', 'envioMedidas', 'difMedidas', 'impuestos', 'bonif', 'anulaciones', 'total', 'noDetallado']) h[k] = U.round(v[k] * w, 2);
          if (!h.estado) h.estado = v.estado;
          if (!h.entrega) h.entrega = v.entrega;
          if (!h.envioId) h.envioId = v.envioId;
        }
      } else if (!hijos.length) {
        avisos.push({ id: v.id, texto: `La venta ${v.id} es un «${v.titulo || 'paquete'}» sin el detalle de productos: entra en la plata, pero no se sabe qué productos tenía.` });
        v.esCabeceraPaquete = false; v.paqueteSinDetalle = true;
        continue;
      }
      for (const h of hijos) { if (!h.entrega) h.entrega = v.entrega; if (!h.envioId) h.envioId = v.envioId; }
      v.descartar = true;
    }
    const finales = ventas.filter(v => !v.descartar);
    if (!finales.length) throw new Error('No hay ventas debajo del encabezado en este archivo.');
    const fechas = finales.map(v => v.fecha).filter(Boolean);
    return {
      ventas: finales, generado, avisos,
      desde: fechas.length ? new Date(Math.min(...fechas)) : null,
      hasta: fechas.length ? new Date(Math.max(...fechas)) : null,
      tieneFormaEntrega: idx.entrega !== -1,
    };
  };

  // ============================================================
  //  Reporte de Mercado Pago (liberaciones "settlement" o "cobros")
  // ============================================================
  P.mpMovimientos = (aoa, filename) => {
    let hRow = 0;
    for (let i = 0; i < Math.min(10, aoa.length); i++) {
      const r = (aoa[i] || []).map(U.normPlain);
      if (r.includes('tipo de operacion') || r.includes('estado de la operacion (status)')) { hRow = i; break; }
    }
    const H = (aoa[hRow] || []).map(c => String(c == null ? '' : c).trim());
    const c = (...al) => colByAlias(H, al);
    const idx = {
      tipo: c('TIPO DE OPERACIÓN'), estadoCobros: c('Estado de la operación (status)'), tipoCobros: c('Tipo de operación (operation_type)'),
      canal: c('CANAL DE VENTA'), valor: c('VALOR DE LA COMPRA', 'Valor del producto (transaction_amount)'),
      comisiones: c('COMISIONES + IVA'), comisionML: c('COMISIÓN DE MERCADO LIBRE + IVA', 'Comisión de Mercado Libre (marketplace_fee)'),
      neto: c('MONTO NETO DE LA OPERACIÓN', 'Monto recibido (net_received_amount)'),
      iibb: c('IMPUESTOS COBRADOS POR RETENCIONES DE IIBB'), detalleImp: c('DETALLE DE IMPUESTOS'), impDesagregados: c('IMPUESTOS DESAGREGADOS'),
      cupon: c('CUPÓN DE DESCUENTO', 'Descuento (coupon_amount)'), envio: c('COSTO DE ENVÍO', 'Costo de envío (shipping_cost)'),
      cuotas: c('CUOTAS', 'Cuotas (installments)'), medio: c('MEDIO DE PAGO', 'Medio de pago (payment_type)'),
      sku: c('CÓDIGO DE PRODUCTO SKU', 'SKU Producto (seller_custom_field)'),
      numId: c('NÚMERO DE IDENTIFICACIÓN'), orden: c('ID DE LA ORDEN', 'Número de venta en Mercado Libre (order_id)'),
      paquete: c('ID DEL PAQUETE', 'Pack ID (pack_id)'),
      liberacion: c('FECHA CORTA DE LIBERACIÓN DE DINERO', 'Fecha de liberación del pago (date_released_short)', 'FECHA DE LIQUIDACIÓN DEL DINERO'),
      origen: c('FECHA DE ORIGEN', 'Fecha de compra (date_created)'),
      liquidado: c('LIQUIDADO'), pagador: c('PAGADOR'), segmento: c('DETALLE DEL SEGMENTO'),
      cuenta: c('CÓDIGO DE LA CUENTA DEL VENDEDOR'),
    };
    if (idx.neto === -1) throw new Error('Al archivo de Mercado Pago le falta la columna del monto neto.');
    const formato = idx.tipo !== -1 ? 'liberaciones' : 'cobros';
    const g = (f, k) => idx[k] === -1 ? '' : f[idx[k]];
    const t = (f, k) => { const v = g(f, k); return U.isEmpty(v) ? '' : String(v).trim().replace(/^"+|"+$/g, ''); };
    const idTxt = v => { if (U.isEmpty(v)) return ''; const s = String(v).trim(); return /^\d+(\.0+)?$/.test(s) ? s.replace(/\.0+$/, '') : s; };

    let generado = P.fechaDesdeNombre(filename);
    let sellerId = P.sellerIdFromName(filename);
    const movs = [];
    for (let i = hRow + 1; i < aoa.length; i++) {
      const f = aoa[i] || [];
      if (!f.some(x => !U.isEmpty(x))) continue;
      let tipo = t(f, 'tipo');
      const canal = t(f, 'canal');
      if (formato === 'cobros') {
        const st = U.normPlain(t(f, 'estadoCobros'));
        if (st === 'rejected' || st === 'cancelled') continue;
        const op = U.normPlain(t(f, 'tipoCobros'));
        tipo = op === 'regular_payment' ? 'Pago aprobado' : (op || 'Otro');
      }
      const tn = U.normPlain(tipo);
      const pagador = U.normPlain(t(f, 'pagador'));
      const seg = U.normPlain(t(f, 'segmento'));
      let clase = 'otro';
      const esML = U.normPlain(canal) === 'mercado libre' || (formato === 'cobros' && !U.isEmpty(g(f, 'orden')));
      if (tn.startsWith('cashback cancel')) clase = 'cashback_cancelado';
      else if (tn.startsWith('cashback')) clase = 'cashback';
      else if (tn === 'reclamo') clase = esML ? 'reclamo' : 'otro';
      else if (tn === 'pago aprobado' && esML) clase = 'venta';
      else if (tn === 'payouts') clase = 'retiro';
      else if (tn === 'propina') clase = 'pago';
      else if (seg.includes('intra mp') || seg.includes('transfer')) clase = 'transferencia';
      else if (['qr', 'nfc', 'bill payments', 'point'].some(x => seg.includes(x)) || seg.startsWith('transport') || seg.startsWith('wallet')) clase = 'pago';
      const neto = U.num(g(f, 'neto'));
      if (clase === 'otro' && tn === 'pago aprobado') clase = neto < 0 ? 'pago' : 'ingreso';
      const liqTxt = U.normPlain(t(f, 'liquidado'));
      const cuenta = t(f, 'cuenta');
      if (cuenta) sellerId = cuenta;
      const origen = U.parseFechaFlexible(g(f, 'origen'));
      movs.push({
        clase, tipo, canal,
        valor: U.num(g(f, 'valor')), comisiones: U.num(g(f, 'comisiones')), comisionML: U.num(g(f, 'comisionML')),
        neto, iibb: U.num(g(f, 'iibb')), detalleImp: t(f, 'detalleImp'),
        iibbPorEntidad: (() => {
          const raw = g(f, 'impDesagregados');
          if (U.isEmpty(raw)) return null;
          try {
            const arr = JSON.parse(String(raw));
            if (!Array.isArray(arr) || !arr.length) return null;
            return arr.map(x => ({ entidad: String(x.financial_entity || ''), monto: U.num(x.amount) })).filter(x => x.monto);
          } catch (e) { return null; }
        })(),
        cupon: U.num(g(f, 'cupon')), envio: U.num(g(f, 'envio')),
        cuotas: parseInt(t(f, 'cuotas'), 10) || null, medio: t(f, 'medio'),
        sku: t(f, 'sku'), numId: idTxt(g(f, 'numId')), orden: idTxt(g(f, 'orden')), paquete: idTxt(g(f, 'paquete')),
        liberacion: U.parseFechaFlexible(g(f, 'liberacion')),
        liquidado: liqTxt === 'true' ? true : liqTxt === 'false' ? false : null,
        origen, esFlexBonif: clase.startsWith('cashback') && pagador.includes('flex'),
      });
    }
    if (!generado) {
      const fs = movs.map(m => m.origen).filter(Boolean);
      generado = fs.length ? new Date(Math.max(...fs)) : null;
    }
    return { movs, formato, generado, sellerId };
  };

  // ============================================================
  //  Pestañas de la planilla (ANALISIS DE PRODUCTOS / AUXILIAR)
  // ============================================================
  const filasConEncabezado = (aoa, claves) => {
    // Encabezado: primera fila (de las primeras 10) que tenga alguna de las claves
    let h = 0;

    for (let i = 0; i < diario.length; i += 7) {
      const tramo = diario.slice(i, i + 7);
      semanas.push({ desde: tramo[0].fecha, hasta: tramo[tramo.length - 1].fecha, dias: tramo.length,
        pedidos: U.sum(tramo, d => d.pedidos), unidades: U.sum(tramo, d => d.unidades), facturacion: U.sum(tramo, d => d.facturacion), ganancia: U.sum(tramo, d => d.ganancia) });
    }

    // Una fila por cada cuenta incluida (aunque no haya tenido ventas válidas)
    const porCuenta = cuentas.map(cta => {
      const arr = validas.filter(v => v.cuenta === cta.cuenta);
      const mias = arr.filter(v => v.esMia), conC = mias.filter(v => v.ganancia != null);
      const fC = S(conC, 'ingresos'), g = S(conC, 'ganancia');
      const mp = cobros && cobros.porCuenta ? cobros.porCuenta.get(cta.cuenta) || { liberado: 0, pendiente: 0 } : null;
      return {
        cuenta: cta.cuenta, tieneMP: !!(cta.mp && cta.mp.movs && cta.mp.movs.length),
        pedidos: arr.length, unidades: S(arr, 'unidades'), facturacion: S(arr, 'ingresos'),
        facturacionMia: S(mias, 'ingresos'), facturacionTerceros: S(arr.filter(v => !v.esMia), 'ingresos'),
        deposita: S(arr, 'total'), flex: S(arr, 'flex'), ganancia: g, margen: fC ? g / fC : null,
        liberado: mp && cta.mp ? mp.liberado : null, pendiente: mp && cta.mp ? mp.pendiente : null,
      };
    }).sort((a, b) => b.facturacion - a.facturacion);
    const porMes = meses.length > 1 ? meses.map(m => {
      const arr = validas.filter(v => v.fecha && v.fecha.getMonth() === m.mes && v.fecha.getFullYear() === m.anio);
      const conC = arr.filter(v => v.esMia && v.ganancia != null);
      const f = U.sum(conC, v => v.ingresos);
      return { nombre: m.nombre, anio: m.anio, dias: m.diasCubiertos, pedidos: arr.length, unidades: S(arr, 'unidades'), facturacion: S(arr, 'ingresos'), ganancia: U.sum(conC, v => v.ganancia), margen: f ? U.sum(conC, v => v.ganancia) / f : null };
    }) : null;

    // ---------- 8. Envíos ----------
    const envios = E.envios(validas, excluidas, model);

    // ---------- 9. Stock ----------
    const stock = E.stock(model, validas, perfil, op, dias, cuentas.map(c => c.cuenta));

    // ---------- 10. KPIs ----------
    const ritmoDiario = dias ? { facturacion: facturacion / dias, ganancia: gananciaBruta / dias, unidades: unidades / dias } : null;
    let proyeccion = null;
    if (parcial && meses.length === 1 && dias) {
      const m = meses[0];
      proyeccion = { mes: m.nombre, diasEnMes: m.diasEnMes, facturacion: facturacion / dias * m.diasEnMes, gananciaBruta: gananciaBruta / dias * m.diasEnMes,
        unidades: unidades / dias * m.diasEnMes };
    }
    const kpis = {
      facturacion, facturacionMia, facturacionTerceros, facturacionSinProducto, facturacionFinal, unidades, pedidos,
      ticket: pedidos ? facturacion / pedidos : null, precioUnidad: unidades ? facturacion / unidades : null,
      depositaMeliTodas: S(validas, 'total'), flexTodas: S(validas, 'flex'), netoTodas: S(validas, 'neto'),
      costoOperativo: facturacion ? (facturacion - S(validas, 'neto')) / facturacion : null,
      gananciaBruta, cogs, margen: fact ? gananciaBruta / fact : null, gananciaNeta, margenNeto: fact ? gananciaNeta / fact : null,
      gastos: gastosTotal, impactoDevoluciones, enSuspenso, transferirTerceros: U.sum(terceros, t => t.transferir),
      cancelaciones: excluidas.filter(v => v.tipoEstado === 'cancelada').length,
      devoluciones: excluidas.filter(v => v.tipoEstado !== 'cancelada').length,
      tasaProblemas: ventas.length ? excluidas.length / ventas.filter(v => !v.esCabeceraPaquete).length : 0,
      ads: validas.filter(v => v.ads).length, ritmoDiario, proyeccion,
      factMiaConCosto: fact,
      unidadPromedio: base.length ? (() => { const u = U.sum(base, v => v.unidades) || 1; return { precio: fact / u, comision: -comision / u, envios: (-(enviosME + bonif) + flexMio) / u, cuponesImp: -(noDetallado + impuestos + anul) / u, mercaderia: cogs / u, ganancia: gananciaBruta / u }; })() : null,
      margenFormula: (() => { const fc = base.filter(v => v.costoU != null && v.unidades); const f = U.sum(fc, v => v.ingresos); if (!f) return null;
        return U.sum(fc, v => v.ingresos * (1 - C.PLANILLA_COMISION) - C.PLANILLA_ENVIO_FIJO * v.unidades - v.costoU * v.unidades) / f; })(),
    };

    const R = {
      perfil, cuentas: cuentas.map(c => ({ cuenta: c.cuenta, sellerId: c.sellerId, tieneMP: !!c.mp, ventas: c.ventas.length, generado: c.generado })),
      periodo: { desde, hasta, dias, meses, parcial }, opciones: op, model,
      modo: { mp: !!cobros, flexZona: !!model.tarifa, stock: !!stock, planilla: model.tipo, origen: model.origen },
      ventas, validas, excluidas, mias, terceras, sinProducto, preciosCorregidos,
      kpis, waterfall, de100, productos, terceros, gastos, diario, semanas, heat, envios, stock, cobros, porCuenta, porMes,
      devoluciones: { lista: excluidas.slice().sort((a, b) => (b.fecha || 0) - (a.fecha || 0)), devueltasCobradas: validas.filter(v => v.devueltaCobrada),
        impactoFinalizadas, flexEnCurso, enSuspenso, impacto: impactoDevoluciones },
      repetidas, avisos,
    };
    R.alertas = E.alertas(R);
    R.insights = RV.insights ? RV.insights.build(R) : [];
    return R;
  };

  // ============================================================
  E.gastosGrupales = (gastos, perfil, cuentasIncluidas, meses, modo) => {
    if (!gastos) return null;
    const fila = gastos[perfil.id];
    if (!fila) return null;
    // Columna C1, C2… de cada cuenta del perfil (por su orden) y si entra en este reporte
    const slots = perfil.cuentas.map(c => cuentasIncluidas.includes(c));
    if (!slots.some(Boolean)) slots[0] = true;
    const cuentasGastos = perfil.cuentas.map((c, i) => ({ cuenta: c, col: 'C' + (i + 1), incluida: slots[i] }));
    const sumMes = (items) => {
      const porCat = {};
      for (const it of items || []) if (slots[it.slot]) porCat[it.categoria] = (porCat[it.categoria] || 0) + it.monto;
      return porCat;
    };
    const conDatos = Object.entries(fila).map(([mes, items]) => ({ mes, porCat: sumMes(items) }))
      .filter(x => U.sum(Object.values(x.porCat)) > 0);
    const promedio = {};
    if (conDatos.length) {
      for (const x of conDatos) for (const [k, v] of Object.entries(x.porCat)) promedio[k] = (promedio[k] || 0) + v / conDatos.length;
    }
    const porCat = {}; let esPromedio = false; const detalleMeses = [];
    for (const m of meses) {
      const prop = modo === 'completo' ? 1 : m.proporcion;
      const datos = sumMes(fila[U.normPlain(m.nombre)]);
      const tiene = U.sum(Object.values(datos)) > 0;
      const fuente = tiene ? datos : promedio;
      if (!tiene) esPromedio = true;
      for (const [k, v] of Object.entries(fuente)) porCat[k] = (porCat[k] || 0) + v * prop;
      detalleMeses.push({ nombre: m.nombre, proporcion: prop, diasCubiertos: m.diasCubiertos, diasEnMes: m.diasEnMes, estimado: !tiene, total: U.sum(Object.values(fuente)) * prop });
    }
    const nombreCat = k => ({ 'insumos': 'Insumos', 'gastos externos': 'Gastos externos de Meli', 'roturas en pedidos': 'Roturas en pedidos',
      'contador': 'Contador', 'mono': 'Monotributo', 'ingresos brutos': 'Ingresos brutos' }[k] || U.capitalize(k));
    const items = Object.entries(porCat).map(([k, v]) => ({ categoria: nombreCat(k), monto: v })).filter(x => x.monto > 0).sort((a, b) => b.monto - a.monto);
    const total = U.sum(items, x => x.monto);
    if (!total && !conDatos.length) return null;
    return { total, items, esPromedio, meses: detalleMeses, modo, cuentas: cuentasGastos };
  };

  // ============================================================
  E.productos = (validas, model, perfil, op, desde, hasta, dias) => {
    const out = [];
    const grupos = U.groupBy(validas.filter(v => v.producto), v => v.producto + '|' + v.dueño);
    const totalFact = U.sum(validas, v => v.ingresos) || 1;
    for (const [, arr] of grupos) {
      const v0 = arr[0];
      const u = U.sum(arr, v => v.unidades) || 0;
      const fact = U.sum(arr, v => v.ingresos);
      const neto = U.sum(arr, v => v.neto);
      const conCosto = arr.filter(v => v.costoU != null);
      const uC = U.sum(conCosto, v => v.unidades);
      const costoU = uC ? U.sum(conCosto, v => v.costoU * v.unidades) / uC : null;
      const ganancia = conCosto.length ? U.sum(conCosto, v => v.ganancia) : null;
      const factC = U.sum(conCosto, v => v.ingresos);
      const margen = (ganancia != null && factC) ? ganancia / factC : null;
      // Estructura de costos por unidad para el precio sugerido
      const ing = fact || 1;
      const tasaCom = -U.sum(arr, v => v.cargo + v.costoFijo + v.costoCuotas) / ing;
      const tasaImp = -U.sum(arr, v => v.impuestos) / ing;
      const tasaCup = -U.sum(arr, v => v.noDetallado + v.anulaciones) / ing;
      const envioU = u ? (-U.sum(arr, v => v.costoEnvio + v.envioMedidas + v.difMedidas + v.ingresosEnvio + v.bonif) + U.sum(arr, v => v.flex)) / u : 0;
      const precioPara = (m) => {
        if (costoU == null) return null;
        const den = 1 - tasaCom - tasaImp - tasaCup - m;
        return den > 0.05 ? (costoU + envioU) / den : null;
      };
      const precios = arr.map(v => v.unidades ? v.ingresos / v.unidades : null).filter(x => x);
      const ordenadas = arr.slice().sort((a, b) => a.fecha - b.fecha);
      const ult = ordenadas[ordenadas.length - 1];
      const serie = [];
      if (desde) { for (let i = 0; i < dias; i++) serie.push(0); for (const v of arr) if (v.fecha) { const k = U.daysBetween(desde, v.fecha); if (k >= 0 && k < dias) serie[k] += v.unidades; } }
      const p = model.productos.get(v0.producto) || {};
      out.push({
        key: v0.producto, nombre: v0.productoNombre, dueño: v0.dueño, esMio: v0.esMia,
        ventas: arr.length, unidades: u, facturacion: fact, share: fact / totalFact,
        precioProm: u ? fact / u : null, precioMin: precios.length ? Math.min(...precios) : null, precioMax: precios.length ? Math.max(...precios) : null,
        precioUlt: ult && ult.unidades ? ult.ingresos / ult.unidades : null,
        netoU: u ? neto / u : null, costoU, gananciaU: (u && costoU != null) ? neto / u - costoU : null, ganancia, margen,
        costoFuente: conCosto.some(v => v.costoFuente === 'pedido') ? 'pedido' : (conCosto.length ? 'titulares' : null),
        precioObjetivo: precioPara(op.objetivo), precioVerde: precioPara(op.verde),
        margenFormula: (costoU != null && u && fact) ? ((fact / u) * (1 - C.PLANILLA_COMISION) - C.PLANILLA_ENVIO_FIJO - costoU) / (fact / u) : null,
        porPublicacion: [...U.groupBy(arr, v => v.titulo).entries()].map(([t, a]) => ({ titulo: t, ids: U.uniq(a.map(v => v.publicacion).filter(Boolean)), unidades: U.sum(a, v => v.unidades), facturacion: U.sum(a, v => v.ingresos) })).sort((a, b) => b.unidades - a.unidades),
        tasaCom, tasaImp, tasaCup, envioU,
        flex: arr.filter(v => v.esFlex).length, ads: arr.filter(v => v.ads).length, sinCosto: arr.length - conCosto.length,
        serie, precioPublicadoPlanilla: p.precioPublicado || null, margenPlanilla: p.margenPlanilla != null ? p.margenPlanilla : null,
        precioPY: p.precioPY || null, volumen: p.volumen || null, linkPY: p.linkPY || null,
        cuentas: U.uniq(arr.map(v => v.cuenta)), publicaciones: U.uniq(arr.map(v => v.titulo)),
        ventasLista: ordenadas,
      });
    }
    out.sort((a, b) => (b.ganancia || 0) - (a.ganancia || 0) || b.unidades - a.unidades);
    return out;
  };

  // ============================================================
  E.envios = (validas, excluidas, model) => {
    const flex = validas.filter(v => v.esFlex), correo = validas.filter(v => !v.esFlex);
    const horas = arr => arr.map(v => (v.fechaEntregado && v.fecha) ? (v.fechaEntregado - v.fecha) / 3600000 : null).filter(x => x != null && x >= 0 && x < 24 * 40);
    const porProvincia = [];
    for (const [prov, arr] of U.groupBy(validas, v => v.provincia || 'Sin dato')) porProvincia.push({ provincia: prov, ventas: arr.length, unidades: U.sum(arr, v => v.unidades), facturacion: U.sum(arr, v => v.ingresos) });
    porProvincia.sort((a, b) => b.ventas - a.ventas);
    const porZona = [];
    // Por zona se cuentan ENVÍOS (dos ventas que viajaron juntas pagan un solo flex), igual que en el total
    for (const [z, arr] of U.groupBy(flex.filter(v => v.flexZona), v => v.flexZona)) porZona.push({ zona: z, ventas: arr.length, envios: arr.filter(v => v.flex > 0).length, costo: U.sum(arr, v => v.flex) });
    porZona.sort((a, b) => b.envios - a.envios || b.ventas - a.ventas);
    const sinTarifa = [];
    for (const v of validas.concat(excluidas)) if (v.esFlex && v.flexFuente === 'promedio') sinTarifa.push(v);
    const transportistas = [];
    for (const [t, arr] of U.groupBy(correo.filter(v => v.transportista), v => v.transportista)) transportistas.push({ nombre: t, ventas: arr.length });
    transportistas.sort((a, b) => b.ventas - a.ventas);
    const hF = horas(flex), hC = horas(correo);
    return {
      flex: { ventas: flex.length, envios: flex.filter(v => v.flex > 0).length, compartidos: flex.filter(v => v.flexCompartido).length,
        costo: U.sum(flex, v => v.flex), bonif: U.sum(flex, v => v.bonif), prom: flex.some(v => v.flex > 0) ? U.sum(flex, v => v.flex) / flex.filter(v => v.flex > 0).length : null,
        horasMediana: U.median(hF), mismoDia: hF.length ? hF.filter(h => h <= 14).length / hF.length : null, entregadas: hF.length },
      correo: { ventas: correo.length, costo: -U.sum(correo, v => v.costoEnvio + v.envioMedidas + v.difMedidas), prom: correo.length ? -U.sum(correo, v => v.costoEnvio + v.envioMedidas + v.difMedidas) / correo.length : null,
        horasMediana: U.median(hC), entregadas: hC.length },
      porProvincia, porZona, sinTarifa, sinTarifaCPs: U.uniq(sinTarifa.map(v => v.cp).filter(Boolean)), transportistas,
      tarifaFuente: model.tarifaFuente,
    };
  };

  // ============================================================
  E.stock = (model, validas, perfil, op, dias, incluidas) => {
    if (!model.stock) return null;
    const cuentasFuera = incluidas ? perfil.cuentas.filter(c => !incluidas.includes(c)) : [];
    const vendidas = new Map();
    for (const v of validas) if (v.producto) vendidas.set(v.producto, (vendidas.get(v.producto) || 0) + v.unidades);
    const filas = [];
    const claves = new Set();
    for (const [k, it] of model.stock) {
      const p = model.productos.get(k) || {};
      const dueño = it.vendedor || p.vendedor;
      if (dueño !== perfil.id) continue;
      claves.add(k);
    }
    // también productos tuyos vendidos que no están en la hoja de stock
    for (const v of validas) if (v.esMia && v.producto && !model.stock.has(v.producto)) claves.add(v.producto);
    for (const k of claves) {
      const it = model.stock.get(k) || null;
      const p = model.productos.get(k) || {};
      const total = it ? (it.total != null ? it.total : (it.fisico || 0) + (it.camino || 0)) : null;
      const u = vendidas.get(k) || 0;
      const vDia = dias ? u / dias : 0;
      const cobertura = (total != null && vDia > 0) ? total / vDia : null;
      let estado;
      if (total == null) estado = 'SIN DATO';
      else if (total <= 0 && vDia > 0) estado = 'SIN STOCK';
      else if (total <= 0) estado = 'AGOTADO';
      else if (vDia === 0) estado = 'QUIETO';
      else if (cobertura < C.STOCK_PEDIR_YA_DIAS) estado = 'PEDIR YA';
      else if (cobertura < C.STOCK_REVISAR_DIAS) estado = 'REVISAR';
      else estado = 'OK';
      // Costo de compra por unidad en dólares: precio en Paraguay + el recargo de Sergio PY
      // (si no hay precio PY, el costo en pesos de la planilla pasado a dólares)
      const precioPY = p.precioPY || (it && it.precioCompraUSD ? it.precioCompraUSD / (1 + C.RECARGO_SERGIO_PY) : null);
      const costoUSDu = precioPY ? precioPY * (1 + C.RECARGO_SERGIO_PY) : (p.costo && model.dolar ? p.costo / model.dolar : null);
      filas.push({
        key: k, nombre: (it && it.nombre) || p.nombre || k, fisico: it ? it.fisico : null, camino: it ? it.camino : null, total,
        rotos: it ? it.rotos : null, vendidas: u, ventaDia: vDia, ventaMesReal: vDia * 30, ventaMesPlanilla: it ? it.ventaMensualPlanilla : null,
        cobertura, estado, estadoPlanilla: it ? it.estadoPlanilla : (p.estadoStock || null), costoUSDu,
        aComprarPlanilla: it && it.aComprarPlanilla > 0 ? it.aComprarPlanilla : null, // «Cantidad a Comprar» de Consulta stock (referencia)
        valorARS: (total != null && p.costo != null) ? Math.max(0, total) * p.costo : null,
        valorUSD: (total != null && costoUSDu != null) ? Math.max(0, total) * costoUSDu : null,
      });
    }
    const orden = { 'SIN STOCK': 0, 'PEDIR YA': 1, 'REVISAR': 2, 'OK': 3, 'QUIETO': 4, 'AGOTADO': 5, 'SIN DATO': 6 };
    filas.sort((a, b) => (orden[a.estado] - orden[b.estado]) || ((a.cobertura ?? 1e9) - (b.cobertura ?? 1e9)) || b.vendidas - a.vendidas);
    const cuenta = e => filas.filter(f => f.estado === e).length;
    return {
      filas, fuente: model.stockFuente, ultimaAct: model.stockUltimaAct,
      unidades: U.sum(filas, f => Math.max(0, f.total || 0)), valorARS: U.sum(filas, f => f.valorARS || 0), valorUSD: U.sum(filas, f => f.valorUSD || 0),
      sinStock: cuenta('SIN STOCK'), pedirYa: cuenta('PEDIR YA'), revisar: cuenta('REVISAR'), quietos: filas.filter(f => f.estado === 'QUIETO'),
      cuentasFuera,
    };
  };

  // ============================================================
  E.cobros = (cuentas, ventas, perfil) => {
    const conMP = cuentas.filter(c => c.mp && c.mp.movs && c.mp.movs.length);
    if (!conMP.length) return null;
    const porId = new Map();
    for (const v of ventas) if (!v.esCabeceraPaquete) porId.set(v.id, v);
    const out = {
      generado: null, porVenta: new Map(), liberado: { mio: 0, terceros: {}, total: 0 }, pendiente: { mio: 0, terceros: {}, total: 0 },
      calendario: new Map(), vencidas: [], cashbackFlex: { liberado: 0, pendiente: 0, n: 0 }, cashbackOtros: 0,
      otrosPeriodos: { n: 0, monto: 0 }, iibb: new Map(), cuotas: new Map(), medios: new Map(), otrosMovs: new Map(),
      cuponesMios: 0, cuponesTotal: 0, diferencias: [], formato: conMP[0].mp.formato, tieneLiquidado: false,
      porCuenta: new Map(), // cuenta -> { liberado, pendiente } (ventas y reclamos)
    };
    const vencPorVenta = new Map();
    const provNombre = s => {
      const m = U.normPlain(s).match(/iibb_(.*)/);
      if (!m) return s || 'Otra';
      return m[1].split('_').map(w => w === 'de' || w === 'del' ? w : U.capitalize(w)).join(' ')
        .replace('Cordoba', 'Córdoba').replace('Entre Rios', 'Entre Ríos').replace('Tucuman', 'Tucumán').replace('Neuquen', 'Neuquén').replace('Rio Negro', 'Río Negro')
        .replace('Buenos Aires', 'Buenos Aires').replace('Caba', 'CABA').replace('Capital Federal', 'CABA');
    };
    for (const c of conMP) {
      const gen = c.mp.generado;
      if (gen && (!out.generado || gen > out.generado)) out.generado = gen;
      const corte = gen || new Date();
      for (const m of c.mp.movs) {
        if (m.liquidado !== null) out.tieneLiquidado = true;
        const liberada = m.liquidado !== null ? m.liquidado : (m.liberacion ? m.liberacion <= corte : true);
        if (m.clase === 'cashback' || m.clase === 'cashback_cancelado') {
          if (m.esFlexBonif) { out.cashbackFlex.n += m.clase === 'cashback' ? 1 : -1; if (liberada) out.cashbackFlex.liberado += m.neto; else out.cashbackFlex.pendiente += m.neto; }
          else out.cashbackOtros += m.neto;
          continue;
        }
        if (m.clase === 'venta' || m.clase === 'reclamo') {
          const v = porId.get(m.numId) || porId.get(m.orden) || porId.get(m.paquete);
          if (!v) { out.otrosPeriodos.n++; out.otrosPeriodos.monto += m.neto; continue; }
          let pv = out.porVenta.get(v.id);
          if (!pv) { pv = { neto: 0, cupon: 0, iibb: 0, liberado: 0, pendiente: 0, fechas: [], cuotas: null, medio: null }; out.porVenta.set(v.id, pv); }
          pv.neto += m.neto; pv.cupon += m.cupon; pv.iibb += m.iibb;
          if (m.clase === 'venta') { pv.cuotas = pv.cuotas || m.cuotas; pv.medio = pv.medio || m.medio; }
          const dueño = v.dueño || perfil.id;
