<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1513">
<title>Reporte de Ventas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Reporte de ventas de Mercado Libre y Mercado Pago cruzado con la planilla de costos: ganancia, productos, stock, envíos y cobros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: columna única de 1240px. Arriba la carga de archivos; después el estado de resultados en
   tarjetas (bento) que van de lo general a lo particular; navegación de secciones fija arriba.
   Identidad: vidrio esmerilado (neutros fríos verdosos) + ámbar de perfume como único acento. */
:root {
  --page: #EBF0ED;
  --surface: #FCFDFC;
  --surface-2: #F3F6F4;
  --surface-3: #E7ECE9;
  --ink: #0F1513;
  --ink-2: #44514A;
  --muted: #6F7B75;
  --line: #DAE2DD;
  --line-2: #C6D0CA;
  --accent: #A15C00;
  --accent-strong: #864C00;
  --accent-soft: #FCEBD2;
  --accent-ink: #6B3D00;
  --on-accent: #FFFFFF;
  --glow: rgba(240, 164, 60, .22);

  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --neg: #e34948;
  --pos: #2a78d6;
  --tot: #56635C;
  --on-tot: #FFFFFF;
  --end: #0F1513;
  --grid: #E2E8E4;
  --axis: #C3CCC7;
  --ax-text: #78847E;
  --wknd: rgba(42, 120, 214, .05);

  --good: #0ca30c;
  --good-ink: #006300;
  --good-soft: #E1F3E1;
  --warn: #fab219;
  --warn-ink: #6F4A00;
  --warn-soft: #FFF2D2;
  --crit: #d03b3b;
  --crit-ink: #A32222;
  --crit-soft: #FBE3E1;
  --info-soft: #E3EEFB;
  --info-ink: #1C5CAB;

  --f-sans: "Archivo", "Archivo Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 0 rgba(15, 21, 19, .04), 0 12px 32px -20px rgba(15, 21, 19, .28);
  --shadow-pop: 0 18px 50px -12px rgba(15, 21, 19, .35);
  --topbar-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #090D0C; --surface: #111715; --surface-2: #161E1B; --surface-3: #1D2723;
    --ink: #E8EEEB; --ink-2: #B2BDB7; --muted: #85928B; --line: #212C27; --line-2: #2E3B35;
    --accent: #F0A43C; --accent-strong: #FFB95E; --accent-soft: #382710; --accent-ink: #FFCF8A; --on-accent: #1A1206; --glow: rgba(240, 164, 60, .14);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181;
    --neg: #e66767; --pos: #3987e5; --tot: #8D9B94; --on-tot: #0B0B0B; --end: #E8EEEB;
    --grid: #1C2622; --axis: #34423B; --ax-text: #85928B; --wknd: rgba(57, 135, 229, .06);
    --good-ink: #4CD14C; --good-soft: #12301A; --warn-ink: #FFC94D; --warn-soft: #33270B; --crit-ink: #FF8B85; --crit-soft: #3B1614;
    --info-soft: #14243A; --info-ink: #8DB8F0;
    --shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 16px 36px -22px rgba(0, 0, 0, .9);
    --shadow-pop: 0 20px 60px -10px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #090D0C; --surface: #111715; --surface-2: #161E1B; --surface-3: #1D2723;
  --ink: #E8EEEB; --ink-2: #B2BDB7; --muted: #85928B; --line: #212C27; --line-2: #2E3B35;
  --accent: #F0A43C; --accent-strong: #FFB95E; --accent-soft: #382710; --accent-ink: #FFCF8A; --on-accent: #1A1206; --glow: rgba(240, 164, 60, .14);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181;
  --neg: #e66767; --pos: #3987e5; --tot: #8D9B94; --on-tot: #0B0B0B; --end: #E8EEEB;
  --grid: #1C2622; --axis: #34423B; --ax-text: #85928B; --wknd: rgba(57, 135, 229, .06);
  --good-ink: #4CD14C; --good-soft: #12301A; --warn-ink: #FFC94D; --warn-soft: #33270B; --crit-ink: #FF8B85; --crit-soft: #3B1614;
  --info-soft: #14243A; --info-ink: #8DB8F0;
  --shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 16px 36px -22px rgba(0, 0, 0, .9);
  --shadow-pop: 0 20px 60px -10px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 64px); }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: var(--f-sans); font-size: 14.5px; line-height: 1.5; font-stretch: 100%;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
img, svg { max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in oklab, var(--surface) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: center; gap: 14px; min-height: var(--topbar-h); padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 30px; height: 30px; flex: none; color: var(--accent); }
.brand-txt { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.brand-name { font-stretch: 116%; font-weight: 760; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.topbar-sp { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.status-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2);
  max-width: 340px; min-width: 0; cursor: pointer;
}
.status-chip > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status-chip.is-ok .status-dot { background: var(--good); }
.status-chip.is-warn .status-dot { background: var(--warn); }
.status-chip.is-err .status-dot { background: var(--crit); }
.status-chip.is-loading .status-dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { border-color: var(--line-2); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer;
  transition: background-color .15s, border-color .15s, transform .08s;
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* Control segmentado */
.segc { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.segc button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.segc button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* ---------- Tarjetas ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; min-width: 0;
}
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h3 { font-size: 15.5px; font-weight: 700; font-stretch: 106%; letter-spacing: -.005em; }
.card-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: 1 / -1; }

/* ---------- Secciones ---------- */
.section { padding-block: 26px 6px; }
.section-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.section-h h2 { font-size: clamp(20px, 2.4vw, 25px); font-stretch: 115%; font-weight: 780; letter-spacing: -.015em; }
.section-h p { color: var(--muted); font-size: 13.5px; margin-top: 4px; max-width: 70ch; }

/* Navegación de secciones */
.secnav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); z-index: 40;
  background: color-mix(in oklab, var(--page) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.secnav-in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
.secnav-in::-webkit-scrollbar { display: none; }
.secnav a {
  flex: none; text-decoration: none; color: var(--ink-2); font-size: 13px; font-weight: 600;
  padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
}
.secnav a:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
.secnav a.is-active { background: var(--ink); color: var(--page); }
.secnav a .count { margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--crit); color: #fff; font-variant-numeric: tabular-nums; }

/* ---------- Carga de archivos ---------- */
.loader { padding-block: 22px 8px; }
.loader-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; }
.loader-intro h1 { font-size: clamp(26px, 3.6vw, 38px); font-stretch: 118%; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.loader-intro .lede { color: var(--ink-2); margin-top: 10px; max-width: 54ch; font-size: 15px; }
.step-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }
.step-label b { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: inline-grid; place-items: center; font-size: 11px; letter-spacing: 0; }

.profiles { display: flex; gap: 8px; flex-wrap: wrap; }
.profile {
  display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 650; font-size: 13.5px; color: var(--ink);
  transition: border-color .15s, background-color .15s;
}
.profile:hover { border-color: var(--line-2); }
.profile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  font-size: 11.5px; font-weight: 800; letter-spacing: .02em; color: #fff; background: var(--tot);
}
.profile-accounts { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.step-note { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; color: var(--muted); }

/* Cuentas del reporte: tarjetas que se marcan / desmarcan */
.accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
.acct { position: relative; min-width: 0; }
.acct-btn {
  width: 100%; height: 100%; display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; min-height: 56px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit;
  transition: border-color .15s, background-color .15s;
}
.acct-btn:hover { border-color: var(--line-2); }
.acct-box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none;
  background: var(--surface); color: transparent; transition: background-color .15s, border-color .15s;
}
.acct-box svg { width: 13px; height: 13px; }
.acct.is-on .acct-btn { border-color: var(--accent); background: color-mix(in oklab, var(--accent-soft) 60%, var(--surface)); }
.acct.is-on .acct-box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.acct.is-empty .acct-btn { border-style: dashed; background: transparent; }
.acct.is-empty .acct-box { border: 0; background: var(--surface-3); color: var(--muted); width: 24px; height: 24px; border-radius: 7px; }
.acct.is-empty .acct-btn:hover { border-color: var(--accent); }
.acct-txt { min-width: 0; display: grid; gap: 2px; }
.acct-n { font-weight: 700; font-size: 13.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.acct-s { font-size: 12px; color: var(--muted); }
.acct.is-on .acct-s { color: var(--ink-2); }
.acct-del {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 7px; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1;
}
.acct-del:hover { background: var(--crit-soft); color: var(--crit-ink); }
.acct-add {
  min-height: 56px; border-radius: 12px; border: 1.5px dashed var(--line-2); background: transparent; color: var(--ink-2);
  font: inherit; font-weight: 650; font-size: 13px; cursor: pointer; padding: 10px 12px;
}
.acct-add:hover { border-color: var(--accent); color: var(--accent-ink); }
.acct-form { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.acct-form input {
  flex: 1 1 220px; min-width: 0; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink);
  padding: 0 10px; font: inherit; font-size: 13.5px; text-transform: uppercase;
}
.acct-form input::placeholder { text-transform: none; color: var(--muted); }
.acct-err { color: var(--crit-ink); flex-basis: 100%; }
.acct-err:empty { display: none; }
.acct-note { flex-basis: 100%; }
.acct-help { margin-top: 8px; }

/* Interruptores de cuentas en la barra plegada */
.chip-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip-tg, .chip-off { cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; }
.chip-tg[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.chip-tg[aria-pressed="false"] { background: transparent; border-style: dashed; color: var(--muted); text-decoration: line-through; }
.chip-tg[aria-pressed="false"] svg { opacity: 0; width: 0; margin-right: -6px; }
.chip-off { background: transparent; border-style: dashed; color: var(--muted); }
.chip-tg:hover, .chip-off:hover { border-color: var(--accent); }
.chip-mp { font-size: 11px; font-weight: 700; opacity: .75; margin-left: 2px; }
.note-warn { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
  background: var(--warn-soft); color: var(--warn-ink); font-size: 12.5px; line-height: 1.45; }
.note-warn svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
/* Comparación con el período anterior */
.hero-cmp { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; font-size: 12.5px; }
.delta { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-weight: 650; font-size: 12px; }
.delta svg { width: 13px; height: 13px; }
.delta.up { background: var(--good-soft); color: var(--good-ink); }
.delta.down { background: var(--crit-soft); color: var(--crit-ink); }
.tbl tr.is-now td { background: color-mix(in oklab, var(--accent-soft) 45%, transparent); }
.hist-empty { padding-bottom: 4px; }
.loaded-actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* Resumen para compartir */
.share-txt { width: 100%; min-height: 320px; resize: vertical; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2);
  color: var(--ink); padding: 12px 14px; font: 13px/1.5 var(--f-mono); white-space: pre-wrap; }
.share-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
/* Conexión en vivo */
.field { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); padding: 0 12px; font: inherit; font-size: 13px; }
.field.mono { font-family: var(--f-mono); font-size: 12px; }
.pasos { list-style: none; margin: 14px 0; padding: 0; display: grid; gap: 14px; }
.pasos > li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 13.5px; line-height: 1.5; }
.paso-n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.code-det { margin-top: 8px; }
.code-det summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
.code-det pre.code { max-height: 260px; overflow: auto; white-space: pre; margin-top: 8px; }
.vivo-form { display: grid; gap: 8px; margin-top: 8px; }
.vivo-form .btn { justify-self: start; }
.err-txt { color: var(--crit-ink); }
.drawer-b > p { font-size: 13.5px; }
.drawer-b > .err-box { margin-top: 0; line-height: 1.5; }
.drawer-b > .err-box .mono { word-break: break-word; }
.pasos-cortos { margin: -8px 0 0; padding-left: 20px; display: grid; gap: 8px; font-size: 13.5px; line-height: 1.5; }
.drawer-b .code-det > p { margin-top: 8px; }
/* Meta del mes */
.meta-line { margin-top: 10px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent-ink); font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.meta-box { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; }
.meta-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.meta-track { height: 8px; border-radius: 99px; background: var(--surface-3); margin: 8px 0 6px; overflow: hidden; }
.meta-track span { display: block; height: 100%; border-radius: 99px; background: var(--good); }
.meta-box.warn .meta-track span { background: var(--warn); }
.meta-s { color: var(--ink-2); }
.meta-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: 12.5px; }
.meta-form label { flex-basis: 100%; color: var(--ink-2); }
.meta-form .field { flex: 1 1 160px; max-width: 220px; height: 32px; }

.dropzone {
  position: relative; border: 1.5px dashed var(--line-2); border-radius: var(--radius); background: var(--surface);
  padding: 26px 22px; display: flex; gap: 16px; align-items: center; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.dropzone:hover, .dropzone.is-over { border-color: var(--accent); background: color-mix(in oklab, var(--accent-soft) 45%, var(--surface)); }
.dropzone .dz-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.dropzone .dz-icon svg { width: 24px; height: 24px; }
.dz-title { font-weight: 700; font-size: 15px; }
.dz-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

.files { display: grid; gap: 8px; margin-top: 12px; }
.file {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
.file-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 11px; letter-spacing: .02em; }
.file-ic.k-ml { background: var(--info-soft); color: var(--info-ink); }
.file-ic.k-mp { background: var(--good-soft); color: var(--good-ink); }
.file-ic.k-sheet { background: var(--accent-soft); color: var(--accent-ink); }
.file-ic.k-err { background: var(--crit-soft); color: var(--crit-ink); }
.file-main { min-width: 0; }
.file-t { font-weight: 650; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.file-n { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file select { height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 8px; font-size: 12.5px; font-weight: 600; }
.file .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 30px; height: 30px; border-radius: 8px; font-size: 18px; line-height: 1; }
.file .x:hover { background: var(--crit-soft); color: var(--crit-ink); }

.loader-side { display: grid; gap: 12px; align-content: start; }
.side-card { padding: 16px 18px; }
.side-card h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.side-card ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.side-card li + li { margin-top: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.loader-actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.err-box { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--crit-soft); color: var(--crit-ink); font-size: 13px; }

/* Resumen de carga (plegado) */
.loaded-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }
.loaded-bar .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
}
.chip svg { width: 13px; height: 13px; }

/* Banner de ejemplo */
.demo-banner {
  display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 14px; margin-top: 14px;
  background: repeating-linear-gradient(135deg, var(--accent-soft) 0 12px, color-mix(in oklab, var(--accent-soft) 70%, var(--surface)) 12px 24px);
  border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent); color: var(--accent-ink); font-size: 13.5px;
}
.demo-banner b { font-weight: 800; letter-spacing: .08em; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--accent); color: var(--on-accent); }

/* ---------- Héroe ---------- */
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.hero {
  position: relative; overflow: hidden; padding: 24px 24px 20px;
  background:
    radial-gradient(120% 90% at 100% 0%, var(--glow), transparent 55%),
    var(--surface);
}
.hero-eyebrow { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hero-label { margin-top: 12px; font-size: 14px; font-weight: 650; color: var(--ink-2); }
.hero-num { font-size: clamp(42px, 6.2vw, 64px); font-weight: 700; letter-spacing: -.035em; line-height: 1; margin-top: 6px; font-stretch: 96%; }
.hero-num.is-neg { color: var(--crit-ink); }
.hero-sub { margin-top: 10px; color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.hero-meter { margin-top: 18px; }
.hero-meter-h { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; gap: 10px; }
.hero-meter-h b { color: var(--ink); font-size: 13px; }
.hero-strip { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.hero-strip > div { padding: 12px 12px 2px 0; }
.hero-strip > div + div { padding-left: 14px; border-left: 1px solid var(--line); }
.hs-l { font-size: 12px; color: var(--muted); }
.hs-v { font-size: 17px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
.hs-v.is-neg { color: var(--crit-ink); }
.hero-pace { margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.hero-pace b { color: var(--ink); font-weight: 700; }
.hero-controls { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

.meter { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: visible; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--good); }
.meter.tone-warn .meter-fill { background: var(--warn); }
.meter.tone-crit .meter-fill { background: var(--crit); }
.meter-target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; }

/* Insights */
.insights { display: grid; gap: 10px; align-content: start; }
.ins-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ins-h h3 { font-size: 15.5px; font-weight: 700; font-stretch: 106%; }
.ins {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line); cursor: default;
}
.ins[data-go] { cursor: pointer; }
.ins[data-go]:hover { border-color: var(--line-2); }
.ins-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.ins-ic svg { width: 15px; height: 15px; }
.t-bueno .ins-ic { background: var(--good-soft); color: var(--good-ink); }
.t-malo .ins-ic { background: var(--crit-soft); color: var(--crit-ink); }
.t-atencion .ins-ic { background: var(--warn-soft); color: var(--warn-ink); }
.t-neutro .ins-ic { background: var(--info-soft); color: var(--info-ink); }
.ins-t { font-weight: 650; font-size: 13.5px; line-height: 1.35; }
.ins-x { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }

/* KPI tiles */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.tile { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-l { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.tile-v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-s { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.tile .spark { margin-top: 6px; width: 100%; height: 26px; }
.spark-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark-area { fill: var(--series-1); opacity: .1; }
.spark-dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.minibars rect { fill: var(--series-1); opacity: .85; }

/* ---------- Pills de estado ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 6px; border-radius: 999px;
  font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.6;
}
.pill i { font-style: normal; width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; }
.pill.ok { background: var(--good-soft); color: var(--good-ink); } .pill.ok i { background: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); } .pill.warn i { background: var(--warn); color: #241800; }
.pill.crit { background: var(--crit-soft); color: var(--crit-ink); } .pill.crit i { background: var(--crit); }
.pill.neu { background: var(--surface-3); color: var(--ink-2); } .pill.neu i { background: var(--tot); }
.pill.info { background: var(--info-soft); color: var(--info-ink); } .pill.info i { background: var(--series-1); }
.tag { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--ink-2); letter-spacing: .02em; white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent-ink); }

/* ---------- Cascada ---------- */
.wf { display: grid; gap: 2px; }
.wf-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(0, 2fr) minmax(96px, auto); gap: 12px; align-items: center; padding: 5px 0; }
.wf-label { font-size: 13px; color: var(--ink-2); }
.wf-subtotal .wf-label, .wf-start .wf-label, .wf-end .wf-label { color: var(--ink); font-weight: 700; }
.wf-subtotal, .wf-end { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.wf-track { position: relative; height: 18px; }
.wf-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.wf-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
.wf-bar.tone-tot { background: var(--tot); }
.wf-bar.tone-end { background: var(--end); }
.wf-bar.tone-neg { background: var(--neg); }
.wf-bar.tone-pos { background: var(--good); }
.wf-val { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 13.5px; white-space: nowrap; }
.wf-val.is-neg { color: var(--crit-ink); font-weight: 600; }
.wf-val.is-pos { color: var(--good-ink); font-weight: 600; }
.wf-end .wf-val { font-size: 16px; font-weight: 800; }
.info-i { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line-2); font-size: 9.5px; font-weight: 800; color: var(--muted); vertical-align: 1px; font-style: normal; }

/* Barra segmentada */
.seg { display: flex; gap: 2px; height: 28px; border-radius: 6px; overflow: hidden; }
.seg--thin { height: 8px; border-radius: 999px; }
.seg-part { display: flex; align-items: center; padding-left: 8px; min-width: 2px; border-radius: 4px; }
.seg--thin .seg-part { border-radius: 0; padding: 0; }
.seg-part b { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 8px; margin-top: 14px; }
.lg-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 13px; }
.lg-sw { width: 12px; height: 12px; border-radius: 3px; }
.lg-v { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
.lg-p { color: var(--muted); font-variant-numeric: tabular-nums; width: 44px; text-align: right; }
.unit-box { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.unit-h { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.unit-box .rows > div { padding: 6px 0; font-size: 13px; }
.big100 { font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
.big100 b { font-size: 26px; color: var(--ink); letter-spacing: -.02em; }

/* ---------- Gráficos ---------- */
.chart { width: 100%; min-height: 60px; position: relative; outline: none; }
.chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.ch { display: block; overflow: visible; font-family: var(--f-sans); }
.ch-grid { stroke: var(--grid); stroke-width: 1; }
.ch-base { stroke: var(--axis); stroke-width: 1; }
.ch-ax { fill: var(--ax-text); font-size: 11px; font-variant-numeric: tabular-nums; }
.ch-lab { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; }
.ch-lab--muted { fill: var(--muted); font-weight: 500; }
.ch-bar { fill: var(--series-1); transition: opacity .12s; }
.ch-bar.is-dim { opacity: .35; }
.ch-bar.is-hot { fill: color-mix(in oklab, var(--series-1) 78%, var(--ink)); }
.ch-wknd { fill: var(--wknd); }
.ch-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-line--avg { stroke: var(--ink-2); stroke-width: 2; opacity: .8; }
.ch-line--proj { stroke: var(--series-1); stroke-dasharray: 4 5; opacity: .9; }
.ch-area { fill: var(--series-1); opacity: .1; }
.ch-dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.ch-dot--hollow { fill: var(--surface); stroke: var(--series-1); stroke-width: 2; }
.ch-cross { stroke: var(--ink-2); stroke-width: 1; opacity: .5; pointer-events: none; }
.ch-ref { stroke: var(--ink-2); stroke-width: 1; opacity: .45; }
.ch-quad--good { fill: var(--good); opacity: .06; }
.ch-bub { fill: var(--series-1); fill-opacity: .82; stroke: var(--surface); stroke-width: 2; }
.ch-bub.is-low { fill: var(--neg); }
.ch-bub.tone-crit { fill: var(--neg); }
.ch-bub.tone-warn { fill: var(--warn); }
.ch-bub.tone-ok { fill: var(--good); }
.ch-dotp { fill: var(--series-1); stroke: var(--surface); stroke-width: 1.5; }
.ch-dotp.tone-crit { fill: var(--neg); }
.ch-dotp.tone-warn { fill: var(--warn); }
.ch-dotp.tone-ok { fill: var(--good); }
.cmp-prod { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; }
.ch-bub.is-hl { fill-opacity: 1; stroke: var(--ink); }
.ch-hit { cursor: crosshair; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend .k-bar { width: 10px; height: 10px; border-radius: 3px; background: var(--series-1); }
.chart-legend .k-line { width: 16px; height: 2px; background: var(--ink-2); border-radius: 2px; }
.chart-legend .k-dash { width: 16px; height: 0; border-top: 2px dashed var(--series-1); }
.chart-legend .k-neg { width: 10px; height: 10px; border-radius: 50%; background: var(--neg); }
.chart-legend .k-pos { width: 10px; height: 10px; border-radius: 50%; background: var(--series-1); }
.chart-legend .k-good { width: 10px; height: 10px; border-radius: 50%; background: var(--good); }
.chart-legend .k-warn { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }

.tt {
  position: fixed; z-index: 100; pointer-events: none; background: var(--ink); color: var(--page);
  padding: 8px 10px; border-radius: 10px; font-size: 12.5px; box-shadow: var(--shadow-pop); max-width: 260px;
}
.tt-h { font-size: 11.5px; opacity: .75; margin-bottom: 4px; }
.tt-row { display: flex; align-items: center; gap: 7px; line-height: 1.5; }
.tt-key { width: 12px; height: 2px; border-radius: 2px; flex: none; }
.tt-v { font-weight: 750; font-variant-numeric: tabular-nums; }
.tt-l { opacity: .8; }

/* Barras horizontales */
.hb { display: grid; gap: 6px; }
.hb-row { display: grid; grid-template-columns: minmax(122px, 1.35fr) minmax(0, 2fr) minmax(64px, auto); gap: 10px; align-items: center; padding: 3px 0; border-radius: 8px; }
.hb-row.is-link { cursor: pointer; }
.hb-row.is-link:hover .hb-name { text-decoration: underline; }
.hb-label { min-width: 0; display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
.hb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.hb-track { height: 14px; position: relative; }
.hb-bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--series-1); }
.hb-bar.tone-neg { background: var(--neg); }
.hb-bar.tone-muted { background: var(--tot); }
.hb-bar.tone-warn { background: var(--warn); }
.hb-val { text-align: right; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }

/* Mapa de calor */
.hm { display: grid; gap: 3px; }
.hm-row { display: grid; grid-template-columns: 34px repeat(var(--cols), minmax(0, 1fr)); gap: 3px; align-items: center; }
.hm-col { font-size: 10.5px; color: var(--ax-text); text-align: center; white-space: nowrap; }
.hm-rl { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.hm-cell {
  height: 28px; border-radius: 6px; display: grid; place-items: center;
  background: color-mix(in oklab, var(--series-1) var(--t), var(--surface-2));
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.hm-cell i { font-style: normal; }

/* ---------- Tablas ---------- */
.tbl-wrap { overflow-x: auto; margin-inline: -20px; padding-inline: 20px;
  background: linear-gradient(to right, var(--surface) 30%, transparent) left / 32px 100% no-repeat local,
    linear-gradient(to left, var(--surface) 30%, transparent) right / 32px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, .14), transparent) left / 12px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, .14), transparent) right / 12px 100% no-repeat scroll; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th {
  text-align: right; font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 8px 10px; white-space: nowrap;
  border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; cursor: default; user-select: none;
}
.tbl th[data-sort] { cursor: pointer; }
.tbl th[data-sort]:hover { color: var(--ink); }
.tbl th.is-sorted { color: var(--ink); }
.tbl th.is-sorted::after { content: " ↓"; }
.tbl th.is-sorted.asc::after { content: " ↑"; }
.tbl th:first-child, .tbl td:first-child, .tbl th.l, .tbl td.l { text-align: left; }
.tbl td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; vertical-align: middle; white-space: nowrap; }
.tbl tbody tr { transition: background-color .1s; }
.tbl tbody tr.is-link { cursor: pointer; }
.tbl tbody tr.is-link:hover { background: var(--surface-2); }
.tbl tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--line-2); }
.tbl .t-name { white-space: normal; min-width: 210px; max-width: 340px; }
.t-name-main { font-weight: 650; line-height: 1.3; }
.t-name-sub { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.cell-bar { position: relative; display: inline-flex; justify-content: flex-end; min-width: 92px; }
.cell-bar::before { content: ""; position: absolute; left: 0; bottom: -6px; height: 3px; width: var(--w); background: var(--series-1); border-radius: 3px; opacity: .55; }
.cell-bar.neg::before { background: var(--neg); }
.cov { display: inline-grid; grid-template-columns: 70px auto; align-items: center; gap: 8px; }
.cov-track { position: relative; height: 8px; border-radius: 999px; background: var(--surface-3); }
.cov-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--good); }
.cov-fill.warn { background: var(--warn); } .cov-fill.crit { background: var(--crit); }
.cov-mark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); opacity: .5; }

.tbl-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 12px; min-width: 200px; font-size: 13px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }

/* Tarjetas de producto en celular */
.pcards { display: none; gap: 10px; }
.pcard { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
.pcard-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pcard-n { font-weight: 650; line-height: 1.3; }
.pcard-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.pcard-g div span { display: block; font-size: 11px; color: var(--muted); }
.pcard-g div b { font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* Mini stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.stat-l { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat-v { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-s { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.stat.is-crit { background: var(--crit-soft); border-color: transparent; }
.stat.is-crit .stat-v, .stat.is-crit .stat-l { color: var(--crit-ink); }
.stat.is-warn { background: var(--warn-soft); border-color: transparent; }
.stat.is-warn .stat-v, .stat.is-warn .stat-l { color: var(--warn-ink); }

/* Vacío */
.empty { padding: 28px 22px; border: 1.5px dashed var(--line-2); border-radius: var(--radius); text-align: left; display: grid; gap: 10px; background: var(--surface); }
.empty h3 { font-size: 15px; }
.empty p { color: var(--ink-2); font-size: 13.5px; max-width: 70ch; }
.code {
  font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--ink);
}

/* Alertas */
.alerts { display: grid; gap: 10px; }
.alert { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.alert-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; }
.alert.critico .alert-ic { background: var(--crit-soft); color: var(--crit-ink); }
.alert.atencion .alert-ic { background: var(--warn-soft); color: var(--warn-ink); }
.alert.info .alert-ic { background: var(--info-soft); color: var(--info-ink); }
.alert-t { font-weight: 700; }
.alert-d { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.alert-items { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; }
.alert-items li { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.alert-items li::before { content: "·"; color: var(--muted); }
.alert-items .sug { color: var(--good-ink); font-weight: 600; }
.alert details summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--accent); margin-top: 6px; }
.ok-box { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 14px; background: var(--good-soft); color: var(--good-ink); font-weight: 600; }

/* Listas simples */
.rows { display: grid; }
.rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: baseline; }
.rows > div:last-child { border-bottom: 0; }
.rows .r-v { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .r-total { font-weight: 800; }
.person { display: flex; align-items: center; gap: 10px; }
.person-big { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }

/* Calendario de liberaciones */
.cal { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.cal-day { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); display: grid; gap: 6px; align-content: end; min-height: 150px; position: relative; }
.cal-bar { width: 100%; max-width: 24px; justify-self: center; border-radius: 4px 4px 0 0; background: var(--series-1); }
.cal-day.is-late { background: var(--warn-soft); border-color: transparent; }
.cal-day.is-late .cal-bar { background: var(--warn); }
.cal-v { font-size: 12px; font-weight: 750; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-d { font-size: 11.5px; color: var(--muted); text-align: center; white-space: nowrap; }
.cal-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.cal-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cal-day.is-late .cal-d { color: var(--warn-ink); font-weight: 700; }

/* ---------- Drawer de producto ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 8, 7, .45); z-index: 80; }
.drawer {
  position: fixed; z-index: 90; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-h { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-h h3 { font-size: 18px; font-stretch: 108%; font-weight: 760; line-height: 1.25; }
.drawer-b { overflow-y: auto; padding: 16px 20px 28px; display: grid; gap: 18px; align-content: start; }
.drawer .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.calc { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); }
.calc label { font-size: 12.5px; font-weight: 700; }
.calc-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.calc input { height: 38px; width: 150px; border-radius: 9px; border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); background: var(--surface); padding: 0 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.calc-out { font-size: 13.5px; color: var(--ink); }
.calc-out b { font-size: 18px; }
.sales-list { display: grid; gap: 0; font-size: 12.5px; }
.sales-list > div { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: center; }

/* ---------- Pie ---------- */
.foot { padding-block: 34px 48px; color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.method { columns: 2 320px; column-gap: 28px; font-size: 13px; color: var(--ink-2); }
.method p { break-inside: avoid; margin-bottom: 10px; }
.method b { color: var(--ink); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 120; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-pop); }

/* Animación de entrada sutil (sin dejar nada invisible) */
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Ayuda de archivos (carga) ---------- */
.ayuda-archivos { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.ayuda-archivos summary { cursor: pointer; font-weight: 600; padding: 4px 0; width: fit-content; }
.ayuda-archivos ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.45; }

/* ---------- Pedido ---------- */
.ped { margin-top: 16px; }
.ped-modos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; margin-top: 4px; }
.ped-modos button { display: grid; gap: 2px; padding: 8px 10px; text-align: center; white-space: normal; }
.ped-m-sub { font-size: 11.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.ped-modos button[aria-pressed="true"] .ped-m-sub { color: var(--ink-2); }
.ped-desc { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.ped-fields { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-start; margin: 14px 0 4px; }
.ped-f { display: grid; gap: 6px; font-size: 12.5px; align-content: start; }
.ped-f > span:first-child { font-weight: 650; color: var(--ink-2); }
.ped-f[hidden] { display: none; }
.ped-range { display: flex; align-items: center; gap: 8px; height: 38px; }
.ped-range input { width: 190px; accent-color: var(--accent); }
.ped-dias .field { width: 96px; }
.ped-tope-in { display: flex; gap: 6px; }
.ped-tope-in input { width: 150px; }
.ped-tope-in select { width: auto; padding-right: 8px; }
.ped-sum { display: flex; flex-wrap: wrap; gap: 10px 30px; align-items: flex-start; padding: 14px 0 10px; border-top: 1px solid var(--line); margin-top: 12px; }
.ped-acc { align-self: center; }
.ped-sum > div { display: grid; gap: 2px; }
.ped-sum b { font-size: 20px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.ped-acc { margin-left: auto; }
.ped-msgs { margin: 2px 0 12px; padding-left: 18px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; line-height: 1.45; }
.ped-tbl .ped-q { font-weight: 750; }
.tbl tr.is-dim td { color: var(--muted); }
.ped-mas { margin-top: 12px; }
.ped-mas summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 4px 0; }
.ped-pie { margin-top: 10px; }
.ped-vacio { background: var(--surface-2); color: var(--ink-2); font-weight: 500; margin-top: 12px; }
.stat.is-link { cursor: pointer; }
.stat.is-link:hover, .stat.is-link:focus-visible { border-color: var(--ink-2); }

/* ---------- Responsive ---------- */
.only-sm { display: none !important; }
@media (max-width: 1000px) {
  .hide-md { display: none !important; }
}
@media (max-width: 1100px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: 1 / -1; }
}
@media (max-width: 820px) {
  .pcards.can-swap { display: grid; }
  .tbl.can-swap { display: none; }
  .hide-tab { display: none !important; }
  .tbl th, .tbl td { padding-inline: 8px; }
}
@media (max-width: 900px) {
  .loader-grid, .hero-grid, .g-2, .g-3 { grid-template-columns: minmax(0, 1fr); }
  .status-chip { max-width: 200px; }
}
@media (max-width: 640px) {
  :root { --topbar-h: 54px; }
  body { font-size: 14px; }
  .brand-eyebrow { display: none; }
  .brand-name { font-size: 15.5px; }
  .status-chip { display: none; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 16px; }
  .tbl-wrap { margin-inline: -16px; padding-inline: 16px; }
  .hero { padding: 20px 18px 16px; }
  .wf-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; }
  .wf-track { grid-column: 1 / -1; grid-row: 2; height: 12px; }
  .hb-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; }
  .hb-track { grid-column: 1 / -1; grid-row: 2; height: 10px; }
  .hide-sm { display: none !important; }
  .only-lg { display: none !important; }
  .cov { grid-template-columns: auto; gap: 0; }
  .cov-track { display: none; }
  .tbl th, .tbl td { padding-inline: 6px; }
  .tbl td:first-child { white-space: normal; }
  .only-sm { display: block !important; margin-top: 4px; }
  .tbl .pill { padding-inline: 6px; }
  .pcards.can-swap { display: grid; }
  .tbl.can-swap { display: none; }
  .dropzone { padding: 18px 16px; }
  .loaded-bar .btn { width: 100%; }
  .loaded-actions { width: 100%; flex-direction: column; }
  .hero-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; }
  .hero-strip > div + div { padding-left: 0; border-left: 0; }
  .hm-cell { height: 24px; font-size: 10px; }
  .drawer { top: auto; height: 92vh; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding-left: env(safe-area-inset-left, 0px); }
  .ped-modos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ped-acc { margin-left: 0; width: 100%; }
  .ped-acc .btn { width: 100%; }
  .ped-range input { width: 150px; }
}

/* ---------- Impresión ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  .topbar, .secnav, .loader, .demo-banner, .card-tools, .no-print, .drawer, .scrim, .toast,
  .btn, .segc, .search, .link-btn, .meta-form, .ped-fields, .ayuda-archivos { display: none !important; }
  body { background: #fff; color: #000; }
  .card, .stat { box-shadow: none; break-inside: avoid; }
  .section { break-inside: avoid-page; }
  /* tablas enteras en el papel: sin scroll, letra más chica y sin las columnas de detalle */
  .tbl-wrap { overflow: visible !important; }
  .tbl { font-size: 10.5px; }
  .tbl th, .tbl td { padding: 5px 6px; }
  .tbl th { position: static !important; } /* el encabezado fijo se imprime corrido */
  .tbl thead { display: table-header-group; }
  .tbl .hide-sm { display: none !important; }
  .pcards.can-swap { display: none !important; }
  .tbl.can-swap { display: table !important; }
}

/* ============================================================

(function (RV) {
  'use strict';
  const U = RV.util = {};

  U.isEmpty = v => v === undefined || v === null || (typeof v === 'string' && v.trim() === '');

  // Normaliza texto para comparar: minúsculas, espacios simples, sin \r
  U.norm = v => {
    if (v === undefined || v === null) return '';

    if (typeof v === 'boolean') return v ? 1 : 0;
    let s = String(v).trim();
    if (!s) return 0;
    s = s.replace(/[$\s%]/g, '').replace(/^USD/i, '');
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); // 1.234.567,89
    else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');                               // 1234,5

  U.numOrNull = v => {
    if (U.isEmpty(v)) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).trim();
    if (!/\d/.test(s)) return null;
    return U.num(s);
  };

  U.sum = (arr, f) => { let s = 0; for (const x of arr) s += (f ? f(x) : x) || 0; return s; };
  U.round = (n, d = 0) => { const p = Math.pow(10, d); return Math.round(n * p) / p; };
  U.clamp = (n, a, b) => Math.max(a, Math.min(b, n));

    const a = arr.filter(x => isFinite(x)).slice().sort((x, y) => x - y);
    if (!a.length) return null;
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };
  U.groupBy = (arr, keyFn) => {
    const m = new Map();
    for (const x of arr) { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
    return m;
  };
  U.uniq = arr => [...new Set(arr)];

  // ---------- Fechas ----------
  const MESES = { enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6, agosto: 7,
    septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11 };
  U.MESES_NOMBRE = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  U.MESES_CORTO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  U.DIAS_CORTO = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  U.DIAS_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  // "29 de octubre de 2026 08:43 hs." -> Date (hora local)
  U.parseFechaVentaML = t => {
    if (U.isEmpty(t)) return null;
    if (t instanceof Date) return isNaN(t) ? null : t;
    const m = String(t).match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)\s+de\s+(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/i);
    if (!m) return null;
    const mes = MESES[U.normPlain(m[2])];
    if (mes === undefined) return null;
    const d = new Date(+m[3], mes, +m[1], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, 0);
    return isNaN(d) ? null : d;
  };
  // "29 de octubre | 19:51" (sin año) -> Date, infiriendo el año desde una fecha base
  U.parseFechaSinAnio = (t, base) => {
    if (U.isEmpty(t) || !base) return null;
    const m = String(t).match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)(?:\s*\|\s*(\d{1,2}):(\d{2}))?/i);
    if (!m) return null;
    const mes = MESES[U.normPlain(m[2])];
    if (mes === undefined) return null;
    let anio = base.getFullYear();
    if (mes < base.getMonth() - 6) anio += 1; // cruzó fin de año
    const d = new Date(anio, mes, +m[1], m[3] ? +m[3] : 0, m[4] ? +m[4] : 0);
    return isNaN(d) ? null : d;
  };
  // ISO "2026-10-31T22:12:35.000-03:00" o "31/10/2026 22:12" o "2026-10-31"
  U.parseFechaFlexible = v => {
    if (U.isEmpty(v)) return null;
    if (v instanceof Date) return isNaN(v) ? null : v;
    if (typeof v === 'number') return U.excelSerialToDate(v);
    const s = String(v).trim();
    let m = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/); // gviz
    if (m) return new Date(+m[1], +m[2], +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0);
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { const d = new Date(s); return isNaN(d) ? null : d; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (m) {
      let y = +m[3]; if (y < 100) y += 2000;
      return new Date(y, +m[2] - 1, +m[1], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0);
    }
    const ml = U.parseFechaVentaML(s);
    if (ml) return ml;
    return null;
  };
  // Para fechas cortas tipo "30/10" sin año: usa el año de referencia

    if (U.isEmpty(v)) return null;
    const d = U.parseFechaFlexible(v);
    if (d) return d;
    const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})$/);
    if (!m) return null;
    const hoy = new Date();
    let f = new Date(anioRef || hoy.getFullYear(), +m[2] - 1, +m[1]);
    // "28/12" leído en enero es del año pasado: una fecha sin año no puede quedar en el futuro
    if (!anioRef && f - hoy > 45 * 86400000) f = new Date(f.getFullYear() - 1, f.getMonth(), f.getDate());
    return f;
  };
  U.excelSerialToDate = n => {
    if (!isFinite(n) || n < 20000 || n > 80000) return null;
    const ms = Math.round((n - 25569) * 86400 * 1000);
    const d = new Date(ms);
    // serial es "hora local" del archivo: corregimos el offset para no correr de día
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes());
  };
  U.dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  U.startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  U.addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  U.daysBetween = (a, b) => Math.round((U.startOfDay(b) - U.startOfDay(a)) / 86400000);
  U.daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();

  // ---------- Formato (es-AR) ----------
  const nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const MINUS = '−';
  U.fmtInt = n => (n == null || !isFinite(n)) ? '—' : (n < 0 ? MINUS : '') + nf0.format(Math.abs(Math.round(n)));
  U.fmtMoney = n => (n == null || !isFinite(n)) ? '—' : (n < 0 ? MINUS : '') + '$' + nf0.format(Math.abs(Math.round(n)));
  U.fmtMoneySigned = n => (n == null || !isFinite(n)) ? '—' : (Math.round(n) === 0 ? '' : n < 0 ? MINUS : '+') + '$' + nf0.format(Math.abs(Math.round(n)));
  U.fmtUSD = n => (n == null || !isFinite(n)) ? '—' : (n < 0 ? MINUS : '') + 'US$' + nf0.format(Math.abs(Math.round(n)));
  U.fmtMoneyCompact = n => {
    if (n == null || !isFinite(n)) return '—';
    const a = Math.abs(n), s = n < 0 ? MINUS : '';
    if (a >= 1e9) return s + '$' + nf1.format(a / 1e9).replace(',0', '') + ' mil M';
    if (a >= 1e6) return s + '$' + nf1.format(a / 1e6).replace(/,0$/, '') + 'M';
    if (a >= 1e4) return s + '$' + nf0.format(a / 1e3) + 'k';
    if (a >= 1e3) return s + '$' + nf1.format(a / 1e3).replace(/,0$/, '') + 'k';
    return s + '$' + nf0.format(a);
  };
  U.fmtNumCompact = n => {
    if (n == null || !isFinite(n)) return '—';
    const a = Math.abs(n), s = n < 0 ? MINUS : '';
    if (a >= 1e6) return s + nf1.format(a / 1e6).replace(/,0$/, '') + 'M';
    if (a >= 1e4) return s + nf0.format(a / 1e3) + 'k';
    return s + nf0.format(a);
  };
  U.fmtPct = (n, dec = 1) => (n == null || !isFinite(n)) ? '—' : (n < 0 ? MINUS : '') + (dec === 0 ? nf0 : dec === 2 ? nf2 : nf1).format(Math.abs(n * 100)) + '%';
  U.fmtPctPts = n => (n == null || !isFinite(n)) ? '—' : (n < 0 ? MINUS : '+') + nf1.format(Math.abs(n * 100)) + ' pts';
  U.fmtDec = (n, d = 1) => (n == null || !isFinite(n)) ? '—' : (d === 0 ? nf0 : d === 2 ? nf2 : nf1).format(n);
  U.fmtDate = d => d ? `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}` : '—';
  U.fmtDateLong = d => d ? `${d.getDate()} de ${U.MESES_NOMBRE[d.getMonth()]}` : '—';
  U.fmtDateShortMonth = d => d ? `${d.getDate()} ${U.MESES_CORTO[d.getMonth()]}` : '—';
  U.fmtDateFull = d => d ? `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}` : '—';
  U.fmtDateTime = d => d ? `${U.fmtDate(d)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '—';
  U.fmtWeekday = d => d ? U.DIAS_CORTO[d.getDay()] : '';
  U.plural = (n, uno, varios) => `${U.fmtInt(n)} ${Math.round(n) === 1 ? uno : varios}`;
  U.capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  U.relTime = (ms) => {
    if (!ms) return '';
    const diff = Date.now() - ms;
    const m = Math.round(diff / 60000);
    if (m < 1) return 'recién';
    if (m < 60) return `hace ${m} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `hace ${h} h`;
    const d = Math.round(h / 24);
    return `hace ${d} día${d === 1 ? '' : 's'}`;
  };

  // ---------- Escape para HTML ----------
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- Similitud de títulos (para sugerir mapeos) ----------
  const STOP = new Set(['perfume', 'perfumes', 'de', 'para', 'el', 'la', 'los', 'las', 'y', 'con', 'original', 'importado',
    'hombre', 'mujer', 'masculino', 'femenino', 'unisex', 'masc', 'fem', 'men', 'women', 'woman', 'man', 'eau', 'toilette', 'parfum',
    'spray', 'x', 'pour', 'caballero', 'dama', 'by', 'new']);
  const SINONIMOS = { 'edt': 'edt', 'edp': 'edp', 'toilette': 'edt', 'parfum': 'edp' };
  U.tokens = s => {
    let t = U.normPlain(s).replace(/&/g, ' ').replace(/[^a-z0-9.\s]/g, ' ');
    t = t.replace(/(\d+)\s*ml\b/g, ' $1ml ').replace(/\beau de toilette\b/g, ' edt ').replace(/\beau de parfum\b/g, ' edp ');
    return t.split(/\s+/).filter(Boolean).map(w => SINONIMOS[w] || w).filter(w => !STOP.has(w));
  };
  U.mlSize = s => { const m = U.normPlain(s).match(/(\d{2,3})\s*ml\b/); return m ? +m[1] : null; };
  U.similarity = (a, b) => {
    const A = new Set(U.tokens(a)), B = new Set(U.tokens(b));
    if (!A.size || !B.size) return 0;
    let inter = 0; for (const w of A) if (B.has(w)) inter++;
    const dice = (2 * inter) / (A.size + B.size);
    const ma = U.mlSize(a), mb = U.mlSize(b);
    let bonus = 0;
    if (ma && mb) bonus = ma === mb ? 0.12 : -0.35; // tamaño distinto = producto distinto
    return U.clamp(dice + bonus, 0, 1);
  };

  U.hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

  // Storage seguro (puede fallar en iframes / modo privado)

    get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } },
  };
})(globalThis.RV = globalThis.RV || {});
