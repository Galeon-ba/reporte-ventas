<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F7">
<title>Reporte de Ventas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Reporte de ventas de Mercado Libre y Mercado Pago cruzado con la planilla de costos: ganancia, productos, stock, envíos y cobros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Instrument+Serif&display=swap">
<style>
/* Reporte de Ventas 2.6.0 — diseño «E. Cobalto» (ver DESIGN.md y el Design System «Reporte de Ventas»).
   Tarjetas blancas sobre un fondo niebla, cobalto para la estructura y los datos, mandarina para la ganancia
   y lo que destaca. Letras: Figtree (todo) e Instrument Serif (solo los números que abren: la ganancia neta y
   la cifra de cada sección). Todo en rem: el control «Tamaño» de arriba y el zoom del navegador agrandan y
   achican la página entera. La carga es gradual (ver «Movimiento» al final), siempre con transform y opacity.
   Los nombres de las variables son los de la 2.5.1 y la 2.6.0 «D»: el JavaScript usa var(--tot), var(--accent),
   var(--on-accent), var(--crit-ink), var(--warn-ink) y var(--on-tot). */
:root {
  --page: #EDF0F7;
  --surface: #FFFFFF;
  --surface-2: #F5F7FC;
  --surface-3: #E6E9F3;
  --ink: #171D37;
  --ink-2: #2D344D;
  --muted: #585F78;
  --line: #DFE3ED;
  --line-2: #B7BECC;
  --track: #E6E9F3;
  --ghost: #F1F5FF;
  --ghost-w: #E0E8FD;
  --brand: #2E56D9;
  --brand-hi: #2441B0;
  --brand-soft: #E9F0FF;
  --on-brand: #FFFFFF;
  --accent: #F4692B;
  --accent-ink: #B23B19;
  --accent-soft: #FFF4EC;
  --on-accent: #171D37;
  --inv: #171D37;
  --on-inv: #FFFFFF;
  --heat-hi: #85A6FB;
  --cien: #AFC2F7;

  --series-1: #2E56D9;
  --series-2: #F4692B;
  --series-3: #009A9B;
  --series-4: #9F3EBB;
  --series-5: #EC79A9;
  --bar: #4570EE;
  --bar-hi: #2441B0;
  --neg: #848C9F;
  --tot: #2E56D9;
  --on-tot: #FFFFFF;
  --end: #F4692B;
  --grid: #EEF1F7;
  --axis: #B7BECC;
  --ax-text: #585F78;

  --good: #048149;
  --good-ink: #00713E;
  --good-soft: #DFF8E6;
  --warn: #C68206;
  --warn-ink: #804D0C;
  --warn-soft: #FFEECB;
  --crit: #D02B31;
  --crit-ink: #B71824;
  --crit-soft: #FFE9E8;

  /* íconos de las seis cifras del Resumen: un tinte suave por cifra (no son series ni estados) */
  --ic-1: #2E56D9; --ic-1s: #E9F0FF;
  --ic-2: #007F80; --ic-2s: #DDF5F3;
  --ic-3: #8A35A3; --ic-3s: #F5E8FA;
  --ic-4: #B23B19; --ic-4s: #FFEDE2;
  --ic-5: #B4366C; --ic-5s: #FDE8F0;
  --ic-6: #2A6BA8; --ic-6s: #E3F0FB;

  --f-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-sans: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r-card: 1rem;
  --r-in: .625rem;
  --r-sm: .375rem;
  --r-xs: .1875rem;
  --sh-card: 0 1px 0 rgba(23, 29, 55, .03), 0 .0625rem .1875rem rgba(23, 29, 55, .05);
  --shadow-pop: 0 1.25rem 3rem -.75rem rgba(23, 29, 55, .32);
  --scroll-sh: rgba(23, 29, 55, .14); /* sombrita en el borde de una tabla que sigue de costado */
  --glass: rgba(237, 240, 247, .78);
  --aurora-1: rgba(69, 112, 238, .16);
  --aurora-2: rgba(244, 105, 43, .12);
  --ease: cubic-bezier(.22, .8, .24, 1);
  --topbar-h: 3.5rem;
  --gut: 1.5rem;
  color-scheme: light;
}
/* el tema oscuro es solo de pantalla: al imprimir siempre sale en claro */
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0D1221; --surface: #151B2D; --surface-2: #1C2235; --surface-3: #262D42;
    --ink: #F1F3FA; --ink-2: #DADEE9; --muted: #A9B1C5; --line: #292F44; --line-2: #4C546C; --track: #262D42; --ghost: #192135; --ghost-w: #232D4B;
    --brand: #729AFB; --brand-hi: #96B6FE; --brand-soft: #1F2B51; --on-brand: #0D1221;
    --accent: #FA8746; --accent-ink: #FFA56C; --accent-soft: #462312; --on-accent: #0D1221;
    --inv: #F1F3FA; --on-inv: #0D1221; --heat-hi: #3A57A8; --cien: #34477F;
    --series-1: #648CF3; --series-2: #E56B25; --series-3: #009A9B; --series-4: #8A42BE; --series-5: #DA6893;
    --bar: #648CF3; --bar-hi: #96B6FE;
    --neg: #697187; --tot: #729AFB; --on-tot: #0D1221; --end: #FA8746;
    --grid: #1E2437; --axis: #4C546C; --ax-text: #A9B1C5;
    --good: #4BC680; --good-ink: #6AD895; --good-soft: #143320; --warn: #F1BF4E; --warn-ink: #F4CC64; --warn-soft: #392C0C;
    --crit: #F66C6D; --crit-ink: #FF9492; --crit-soft: #451E1D;
    --ic-1: #96B6FE; --ic-1s: #1F2B51; --ic-2: #5CD3CC; --ic-2s: #0E3133; --ic-3: #D49BEA; --ic-3s: #33203F;
    --ic-4: #FFA56C; --ic-4s: #3D2213; --ic-5: #F59CC0; --ic-5s: #3C1C2B; --ic-6: #8CC4F5; --ic-6s: #142C44;
    --sh-card: 0 0 0 1px rgba(255, 255, 255, .015) inset;
    --shadow-pop: 0 1.25rem 3rem -.75rem rgba(0, 0, 0, .7);
    --scroll-sh: rgba(255, 255, 255, .16);
    --glass: rgba(13, 18, 33, .76);
    --aurora-1: rgba(114, 154, 251, .14);
    --aurora-2: rgba(250, 135, 70, .10);
    color-scheme: dark;
  }
}
@media screen {
  :root[data-theme="dark"] {
    --page: #0D1221; --surface: #151B2D; --surface-2: #1C2235; --surface-3: #262D42;
    --ink: #F1F3FA; --ink-2: #DADEE9; --muted: #A9B1C5; --line: #292F44; --line-2: #4C546C; --track: #262D42; --ghost: #192135; --ghost-w: #232D4B;
    --brand: #729AFB; --brand-hi: #96B6FE; --brand-soft: #1F2B51; --on-brand: #0D1221;
    --accent: #FA8746; --accent-ink: #FFA56C; --accent-soft: #462312; --on-accent: #0D1221;
    --inv: #F1F3FA; --on-inv: #0D1221; --heat-hi: #3A57A8; --cien: #34477F;
    --series-1: #648CF3; --series-2: #E56B25; --series-3: #009A9B; --series-4: #8A42BE; --series-5: #DA6893;
    --bar: #648CF3; --bar-hi: #96B6FE;
    --neg: #697187; --tot: #729AFB; --on-tot: #0D1221; --end: #FA8746;
    --grid: #1E2437; --axis: #4C546C; --ax-text: #A9B1C5;
    --good: #4BC680; --good-ink: #6AD895; --good-soft: #143320; --warn: #F1BF4E; --warn-ink: #F4CC64; --warn-soft: #392C0C;
    --crit: #F66C6D; --crit-ink: #FF9492; --crit-soft: #451E1D;
    --ic-1: #96B6FE; --ic-1s: #1F2B51; --ic-2: #5CD3CC; --ic-2s: #0E3133; --ic-3: #D49BEA; --ic-3s: #33203F;
    --ic-4: #FFA56C; --ic-4s: #3D2213; --ic-5: #F59CC0; --ic-5s: #3C1C2B; --ic-6: #8CC4F5; --ic-6s: #142C44;
    --sh-card: 0 0 0 1px rgba(255, 255, 255, .015) inset;
    --shadow-pop: 0 1.25rem 3rem -.75rem rgba(0, 0, 0, .7);
    --scroll-sh: rgba(255, 255, 255, .16);
    --glass: rgba(13, 18, 33, .76);
    --aurora-1: rgba(114, 154, 251, .14);
    --aurora-2: rgba(250, 135, 70, .10);
    color-scheme: dark;
  }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* el tamaño de toda la página sale de acá: el control «Tamaño» cambia --escala (0,85 a 1,25) */
html { font-size: calc(var(--escala, 1) * 100%); -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 4.5rem); background: var(--page); }
body {
  margin: 0; min-height: 100vh; color: var(--ink-2);
  background:
    radial-gradient(60rem 22rem at 8% -6rem, var(--aurora-1), transparent 70%),
    radial-gradient(48rem 20rem at 92% -8rem, var(--aurora-2), transparent 70%),
    var(--page);
  background-repeat: no-repeat;
  font-family: var(--f-sans); font-size: .875rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "cv11";
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--page); }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
a { color: var(--brand); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: var(--r-xs); }
.mono { font-family: var(--f-sans); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: .8125rem; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; color: var(--ink); }
p { margin: 0; }
b, strong { color: var(--ink); font-weight: 650; }
/* sobre fondo de color (botón apretado, globo, aviso) la negrita hereda el color */
:where(.btn-primary, .segc button[aria-pressed="true"], .secnav a.is-active, .profile[aria-pressed="true"], .acct.is-on .acct-box, .chip-tg[aria-pressed="true"], .tt, .toast) :is(b, strong) { color: inherit; }

.wrap {
  max-width: 90rem; margin: 0 auto;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
}

/* ---------- Barra superior (vidrio) ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: center; gap: .5rem; min-height: var(--topbar-h); padding-block: .5rem; }
.brand { display: flex; align-items: center; gap: .5rem; min-width: 0; text-decoration: none; color: var(--ink); }
.brand::before {
  content: ""; flex: none; width: 1.375rem; height: 1.375rem; border-radius: .4375rem;
  background: conic-gradient(from 210deg, var(--brand) 0 62%, var(--accent) 62% 100%);
  box-shadow: inset 0 0 0 .3125rem var(--surface);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.brand-mark { display: none; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-family: var(--f-sans); font-weight: 700; font-size: 1rem; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-sp { flex: 1; }
.ver-chip {
  position: relative; flex: none; min-height: 1.75rem; padding: 0 .5625rem; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--muted); font-size: .75rem; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
}
.ver-chip:hover { color: var(--ink); border-color: var(--line-2); }
.ver-chip.is-new::after { content: ''; position: absolute; top: -2px; right: -2px; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--page); }
.topbar-actions { display: flex; align-items: center; gap: .375rem; }
.status-chip {
  display: inline-flex; align-items: center; gap: .5rem; min-height: 2.25rem; padding: 0 .75rem; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); font-size: .8125rem; color: var(--muted); max-width: 20rem; min-width: 0; cursor: pointer; text-align: left;
}
.status-chip:hover > span:last-child { color: var(--ink); }
.status-chip > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--muted); flex: none; }
.status-chip.is-ok .status-dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.status-chip.is-warn .status-dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.status-chip.is-err .status-dot { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
.status-chip.is-loading .status-dot { background: var(--brand); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.icon-btn {
  width: 2.25rem; height: 2.25rem; display: inline-grid; place-items: center; border-radius: 50%; flex: none;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  transition: background-color .15s, border-color .15s;
}
.icon-btn:hover { border-color: var(--line-2); background: var(--surface-2); }
.icon-btn svg { width: 1.125rem; height: 1.125rem; }

/* Tamaño de la página: achicar, volver al 100 % y agrandar */
.tam { display: inline-flex; align-items: center; height: 2.25rem; padding: 0 .1875rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); flex: none; }
.tam button { min-width: 1.875rem; height: 1.875rem; padding: 0 .375rem; border: 0; border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; font-weight: 700; font-size: .8125rem; line-height: 1; }
.tam button:hover:not([aria-disabled="true"]) { background: var(--surface-2); }
.tam button[aria-disabled="true"] { color: var(--line-2); cursor: not-allowed; }
.tam .tam-v { min-width: 3rem; font-weight: 600; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tam .tam-a { font-size: .6875rem; }
.tam .tam-a2 { font-size: .9375rem; }

/* Novedades */
.novedades { list-style: none; margin: 0; padding: 0; display: grid; gap: .625rem; }
.nov { border: 1px solid var(--line); border-radius: var(--r-in); padding: .875rem 1rem; background: var(--surface); }
.nov.is-actual { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.nov-h { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .5rem; }
.nov-v { font-weight: 700; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.nov-tipo { font-size: .6875rem; font-weight: 700; padding: .0625rem .5rem; border-radius: 999px; background: var(--good-soft); color: var(--good-ink); }
.nov-tipo.t-mayor { background: var(--warn-soft); color: var(--warn-ink); }
.nov-tipo.t-parche { background: var(--surface-3); color: var(--ink-2); }
.nov-t { font-weight: 650; margin: .5rem 0 .25rem; color: var(--ink); }
.nov ul { margin: 0; padding-left: 1.125rem; display: grid; gap: .25rem; font-size: .8125rem; line-height: 1.5; }

/* Guía */
.drawer.is-wide { width: min(50rem, 100%); }
.drawer-b.guia { grid-template-columns: minmax(0, 1fr); }
.guia-tbl-wrap { overflow-x: auto; margin: .625rem 0; -webkit-overflow-scrolling: touch; }
.guia-toc { display: flex; flex-wrap: wrap; gap: .375rem; }
.guia-toc-a { min-height: 2rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: .8125rem; font-weight: 600; padding: 0 .75rem; border-radius: 999px; cursor: pointer; }
.guia-toc-a:hover { border-color: var(--brand); color: var(--brand); }
.guia-txt { font-size: .875rem; line-height: 1.6; overflow-wrap: anywhere; }
.guia-txt h2 { font-size: 1.125rem; font-weight: 700; letter-spacing: -.01em; margin: 1.75rem 0 .5rem; padding-top: .875rem; border-top: 1px solid var(--line); scroll-margin-top: .75rem; }
.guia-txt h2:first-child { margin-top: .25rem; }
.guia-txt h3 { font-size: .9375rem; font-weight: 700; margin: 1.125rem 0 .375rem; }
.guia-txt p { margin: .5rem 0; }
.guia-txt ul, .guia-txt ol { margin: .5rem 0; padding-left: 1.25rem; display: grid; gap: .3125rem; }
.guia-txt li > ul { margin-top: .375rem; }
.guia-txt code { font-family: var(--f-mono); font-size: .8125rem; background: var(--surface-2); padding: .0625rem .3125rem; border-radius: var(--r-xs); overflow-wrap: anywhere; }
.guia-tbl { width: 100%; border-collapse: collapse; font-size: .8125rem; min-width: 28.75rem; }
.guia-tbl th, .guia-tbl td { text-align: left; vertical-align: top; padding: .5rem .625rem .5rem 0; border-bottom: 1px solid var(--line); }
.guia-tbl th { font-size: .75rem; font-weight: 600; color: var(--muted); border-bottom-color: var(--line-2); }
.guia-tbl td:first-child { font-weight: 600; width: 38%; color: var(--ink); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4375rem;
  min-height: 2.25rem; padding: 0 .9375rem; border-radius: 999px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: .8125rem; line-height: 1.2; cursor: pointer; text-decoration: none;
  transition: background-color .15s, color .15s, border-color .15s;
}
.btn:hover { border-color: var(--ink); }
.btn svg { width: 1rem; height: 1rem; flex: none; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-hi); border-color: var(--brand-hi); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.btn-ghost:hover { background: var(--brand-soft); border-color: transparent; }
.btn-sm { min-height: 2rem; padding: 0 .75rem; font-size: .8125rem; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary[disabled] { opacity: 1; background: transparent; color: var(--muted); border-color: var(--line-2); border-style: dashed; }
.link-btn { min-height: 1.5rem; border: 0; background: none; padding: 0; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--brand-hi); }
@media (pointer: coarse) { .btn, .btn-sm { min-height: 2.75rem; } .icon-btn, .tam { width: 2.75rem; height: 2.75rem; } .tam { width: auto; } .tam button { min-width: 2.25rem; height: 2.375rem; } }

/* Control segmentado: una pista con la opción elegida resaltada */
.segc { display: inline-flex; flex-wrap: wrap; gap: .125rem; padding: .1875rem; border-radius: 1.1875rem; background: var(--surface-3); }
.segc button {
  min-height: 2rem; padding: 0 .8125rem; border: 0; border-radius: 999px; background: transparent;
  font-size: .8125rem; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.segc button:hover { color: var(--ink); background: color-mix(in oklab, var(--surface) 55%, transparent); }
.segc button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23, 29, 55, .12), 0 0 0 1px var(--line) inset; }
@media (pointer: coarse) { .segc button { min-height: 2.5rem; } }

/* ---------- Módulos: tarjetas ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--sh-card);
  padding: 1rem 1.125rem 1.125rem; min-width: 0;
}
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem .75rem; margin-bottom: .875rem; flex-wrap: wrap; }
.card-h h3 { font-size: .9375rem; line-height: 1.3; font-weight: 700; letter-spacing: -.005em; }
.card-h .sub { font-size: .75rem; color: var(--muted); margin-top: .125rem; max-width: 72ch; line-height: 1.45; }
.card-tools { display: flex; gap: .375rem; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: .75rem; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: 1 / -1; }

/* ---------- Secciones ---------- */
.section { padding-block: 2.5rem 0; }
#resumen.section { padding-top: 1.25rem; }
#ch-meses + .tbl-wrap { margin-top: 1.25rem; }
.section-h { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem; margin-bottom: .875rem; flex-wrap: wrap; }
.section-h h2 { font-size: 1.25rem; line-height: 1.2; font-weight: 700; letter-spacing: -.015em; }
.section-h p { color: var(--muted); font-size: .8125rem; margin-top: .25rem; max-width: 80ch; }
/* Apertura de sección: título, cifra en serif y la frase al lado (Plata, Productos y Stock) */
.opener { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: .125rem 1rem; margin-bottom: .875rem; }
.opener > :not(.op-n):not(.op-f) { grid-column: 1 / -1; }
.op-l { font-size: 1.25rem; line-height: 1.2; font-weight: 700; color: var(--ink); letter-spacing: -.015em; }
.op-n { margin-top: .25rem; font-family: var(--f-display); font-size: 2.5rem; line-height: 1; font-weight: 400; letter-spacing: -.01em; color: var(--ink); font-variant-numeric: lining-nums; overflow-wrap: anywhere; }
.op-f { max-width: 62rem; font-size: .9375rem; line-height: 1.45; font-weight: 500; color: var(--ink); }
.op-f:first-of-type:not(.op-n + .op-f) { grid-column: 1 / -1; margin-top: .25rem; }
.op-f .muted { font-weight: 400; }

/* Navegación de secciones: pastillas en una pista, con un indicador que se desliza a la elegida */
.secnav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); z-index: 40;
  background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--line);
}
.secnav-in { position: relative; display: flex; gap: .125rem; overflow-x: auto; scrollbar-width: none; padding-block: .5rem; }
.secnav-in::-webkit-scrollbar { display: none; }
.secnav a {
  position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; min-height: 2.125rem; padding: 0 .8125rem; text-decoration: none;
  color: var(--ink-2); font-size: .8125rem; font-weight: 600; border-radius: 999px; white-space: nowrap; transition: color .2s;
}
.secnav a:hover { color: var(--ink); background: color-mix(in oklab, var(--surface-3) 70%, transparent); }
.secnav a.is-active { background: var(--brand); color: var(--on-brand); }
.secnav-in.has-ind a.is-active { background: transparent; }
.secnav-in.has-ind a:hover { background: transparent; }
.secnav-ind {
  position: absolute; z-index: 0; left: 0; top: .5rem; height: 2.125rem; width: 100px; border-radius: 999px; background: var(--brand);
  transform-origin: 0 50%; pointer-events: none; transition: transform .38s var(--ease);
}
.secnav a .count { margin-left: .375rem; min-width: 1.125rem; height: 1.125rem; display: inline-grid; place-items: center; padding: 0 .3125rem; border-radius: 999px; font-size: .6875rem; font-weight: 700; background: var(--crit-soft); color: var(--crit-ink); font-variant-numeric: tabular-nums; }
.secnav a.is-active .count { background: var(--on-brand); color: var(--brand); }
@media (pointer: coarse) { .secnav a { min-height: 2.75rem; } .secnav-ind { height: 2.75rem; } }

/* ---------- Carga de archivos ---------- */
.loader { padding-block: 2rem 1rem; }
.loader:has(> .loaded-bar) { padding-block: .875rem 0; }
.loader > .loaded-bar { margin-top: 0; }
.loader-intro h1 { font-size: 1.75rem; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.loader-intro .lede { color: var(--muted); margin-top: .5rem; max-width: 60ch; font-size: .9375rem; }
.loader-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: .75rem; margin-top: 1.25rem; align-items: start; }
.loader-main { min-width: 0; display: grid; gap: .75rem; align-content: start; }
.loader-side { min-width: 0; display: grid; gap: .75rem; align-content: start; }
.paso {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .75rem; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--sh-card); padding: 1rem 1.125rem 1.125rem;
}
.paso-num {
  width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; align-self: start; margin-top: .0625rem;
  font-size: .8125rem; font-weight: 700; color: var(--brand); background: var(--brand-soft); font-variant-numeric: tabular-nums;
}
.paso-c { display: grid; gap: .75rem; min-width: 0; align-content: start; }
.paso-c > h2 { font-size: 1rem; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
.paso-c > h2 .step-note { margin-left: .5rem; font-size: .8125rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.step-note { font-size: .8125rem; color: var(--muted); }

.profiles { display: flex; gap: .375rem; flex-wrap: wrap; }
.profile {
  display: inline-flex; align-items: center; min-height: 2.25rem; padding: 0 .9375rem; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .875rem; color: var(--ink);
}
.profile:hover { border-color: var(--brand); color: var(--brand); }
.profile[aria-pressed="true"] { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
@media (pointer: coarse) { .profile { min-height: 2.75rem; } }
.avatar {
  width: 2rem; height: 2rem; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  font-size: .75rem; font-weight: 700; color: var(--brand); background: var(--brand-soft);
}

/* Planilla (paso 2) */
.side-card { display: grid; gap: .625rem; }
.side-card .listo { display: flex; align-items: center; gap: .5rem; font-size: .875rem; color: var(--ink-2); }
.luz { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); flex: none; }
.luz.w { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.luz.b { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
.luz.a { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0; font-size: .8125rem; margin: 0; }
.kv dt { color: var(--muted); padding: .375rem 0; border-top: 1px solid var(--line); }
.kv dd { margin: 0; padding: .375rem 0 .375rem 1rem; border-top: 1px solid var(--line); font-weight: 600; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.side-actions { display: flex; gap: .375rem; align-items: center; flex-wrap: wrap; }

/* Cuentas del reporte: se marcan / desmarcan */
.accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .5rem; }
.acct { position: relative; min-width: 0; }
.acct-btn {
  width: 100%; height: 100%; display: flex; gap: .625rem; align-items: center; text-align: left; padding: .5rem .75rem; min-height: 3.25rem;
  border-radius: var(--r-in); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.acct-btn:hover { border-color: var(--brand); }
.acct-box {
  width: 1.25rem; height: 1.25rem; border-radius: .375rem; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none;
  background: transparent; color: transparent;
}
.acct-box svg { width: .8125rem; height: .8125rem; }
.acct.is-on .acct-btn { border-color: var(--brand); background: var(--brand-soft); }
.acct.is-on .acct-box { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.acct.is-empty .acct-btn { border-style: dashed; border-color: var(--line-2); background: transparent; }
.acct.is-empty .acct-box { border: 0; color: var(--ink); width: 1.375rem; height: 1.375rem; }
.acct.is-empty .acct-btn:hover { border-color: var(--brand); }
.acct-txt { min-width: 0; display: grid; gap: .0625rem; }
.acct-n { font-weight: 700; font-size: .875rem; display: flex; gap: .375rem; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.acct-s { font-size: .75rem; color: var(--muted); }
.acct-del {
  position: absolute; top: .3125rem; right: .3125rem; width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1;
}
.acct-del:hover { background: var(--crit-soft); color: var(--crit-ink); }
.acct-add {
  min-height: 3.25rem; border-radius: var(--r-in); border: 1px dashed var(--line-2); background: transparent; color: var(--brand);
  font-weight: 600; font-size: .8125rem; cursor: pointer; padding: .5rem .75rem;
}
.acct-add:hover { border-color: var(--brand); background: var(--brand-soft); }
.acct-form { grid-column: 1 / -1; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; padding: .625rem .75rem; border-radius: var(--r-in); border: 1px solid var(--brand); background: var(--surface); }
.acct-form input {
  flex: 1 1 13.75rem; min-width: 0; min-height: 2.25rem; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  padding: 0 .875rem; font-size: .875rem; text-transform: uppercase;
}
.acct-form input::placeholder { text-transform: none; color: var(--muted); }
.acct-err { color: var(--crit-ink); flex-basis: 100%; }
.acct-err:empty { display: none; }
.acct-note { flex-basis: 100%; }
.acct-help { margin-top: .125rem; }

/* Interruptores de cuentas en la barra plegada */
.chip-group { display: inline-flex; gap: .375rem; flex-wrap: wrap; }
.chip-tg, .chip-off { cursor: pointer; font-size: .8125rem; font-weight: 600; }
.chip-tg[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-hi); }
.chip-tg[aria-pressed="false"] { background: transparent; border-style: dashed; border-color: var(--line-2); color: var(--muted); text-decoration: line-through; }
.chip-tg[aria-pressed="false"] svg { opacity: 0; width: 0; margin-right: -.375rem; }
.chip-off { background: transparent; border-style: dashed; border-color: var(--line-2); color: var(--muted); }
.chip-tg:hover, .chip-off:hover { border-color: var(--brand); }
.chip-mp { font-size: .6875rem; font-weight: 700; margin-left: .125rem; color: var(--muted); }
.chip-tg[aria-pressed="true"] .chip-mp { color: inherit; opacity: .8; }
.note-warn { display: flex; gap: .625rem; align-items: flex-start; margin: 0 0 .75rem; padding: .625rem .875rem; border-radius: var(--r-in);
  background: var(--warn-soft); color: var(--warn-ink); font-size: .8125rem; line-height: 1.45; }
.note-warn svg { width: 1rem; height: 1rem; flex: none; margin-top: .125rem; }
/* Comparación con el período anterior */
.hero-cmp { display: grid; gap: .25rem; justify-items: start; }
.cmp-i { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .125rem .5rem; }
.delta { display: inline-flex; align-items: center; gap: .25rem; padding: .0625rem .4375rem .0625rem .3125rem; border-radius: 999px; font-weight: 700; font-size: .75rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta svg { width: .875rem; height: .875rem; }
.delta.up { color: var(--good-ink); background: var(--good-soft); }
.delta.down { color: var(--crit-ink); background: var(--crit-soft); }
.tbl tr.is-now td { background: var(--brand-soft); }
.tbl tr.is-now td:first-child { box-shadow: inset 3px 0 0 var(--brand); padding-left: .75rem; }
.hist-empty { padding-bottom: .25rem; }
.loaded-actions { display: flex; gap: .375rem; flex-wrap: wrap; }
/* Resumen para compartir */
.share-txt { width: 100%; min-height: 20rem; resize: vertical; border-radius: var(--r-in); border: 1px solid var(--line-2); background: var(--surface-2);
  color: var(--ink); padding: .75rem .875rem; font: .8125rem/1.55 var(--f-mono); white-space: pre-wrap; }
.share-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }
/* Campos */
.field { width: 100%; min-height: 2.25rem; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 0 .875rem; font-size: .875rem; }
.field:focus-visible, .search:focus-visible, .acct-form input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
.field.mono { font-family: var(--f-mono); font-size: .8125rem; }
select.field, .file select { background: var(--surface); color: var(--ink); }
@media (pointer: coarse) { .field, .search { min-height: 2.75rem; } }
.pasos { list-style: none; margin: .75rem 0; padding: 0; display: grid; gap: .875rem; }
.pasos > li { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); gap: .625rem; font-size: .875rem; line-height: 1.55; }
.paso-n { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: .75rem; font-weight: 700; }
.code-det { margin-top: .5rem; }
.code-det summary { cursor: pointer; font-size: .8125rem; color: var(--brand); font-weight: 600; min-height: 2rem; display: flex; align-items: center; }
.code-det pre.code { max-height: 16.25rem; overflow: auto; white-space: pre; margin-top: .5rem; }
.vivo-form { display: grid; gap: .5rem; margin-top: .625rem; }
.vivo-form .btn { justify-self: start; }
.err-txt { color: var(--crit-ink); }
.drawer-b > p { font-size: .875rem; }
.drawer-b > .err-box { margin-top: 0; line-height: 1.5; }
.drawer-b > .err-box .mono { word-break: break-word; }
.pasos-cortos { margin: -.5rem 0 0; padding-left: 1.25rem; display: grid; gap: .5rem; font-size: .875rem; line-height: 1.55; }
.drawer-b .code-det > p { margin-top: .5rem; }
/* Meta del mes */
.meta-line { margin-top: 0; }
.link-btn.small { font-size: .8125rem; }
.meta-box { font-size: .875rem; }
.meta-h { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.meta-track { height: .375rem; border-radius: 999px; background: var(--track); margin: .5rem 0 .375rem; overflow: hidden; }
.meta-track span { display: block; height: 100%; border-radius: 999px; background: var(--accent); transform-origin: 0 50%; }
.meta-s { color: var(--muted); font-size: .8125rem; }
.meta-form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .8125rem; }
.meta-form label { flex-basis: 100%; color: var(--muted); }
.meta-form .field { flex: 1 1 10rem; max-width: 13.75rem; min-height: 2.25rem; }

.dropzone {
  position: relative; border: 1.5px dashed color-mix(in oklab, var(--brand) 45%, var(--line-2)); border-radius: var(--r-card);
  background: linear-gradient(180deg, var(--brand-soft), color-mix(in oklab, var(--brand-soft) 35%, var(--surface)));
  padding: 1.75rem 1.25rem; display: grid; justify-items: center; gap: .375rem; text-align: center; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.dropzone:hover, .dropzone.is-over { border-color: var(--brand); border-style: solid; }
.dropzone:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
.dz-icon {
  width: 2.5rem; height: 2.5rem; border-radius: .75rem; display: grid; place-items: center; margin-bottom: .25rem;
  font-size: 1.5rem; line-height: 1; font-weight: 400; color: var(--on-brand); background: var(--brand); box-shadow: 0 .375rem 1rem -.375rem var(--brand);
}
.dz-title { display: block; font-size: 1rem; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; color: var(--ink); max-width: 34ch; }
.dz-sub { display: block; font-size: .8125rem; color: var(--muted); margin-top: .25rem; max-width: 48ch; }
.dz-btn { margin-top: .5rem; pointer-events: none; }
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

.files { display: grid; gap: 0; }
.file {
  display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; gap: .625rem; align-items: center;
  padding: .625rem 0; border-top: 1px solid var(--line);
}
.files .file:last-child { border-bottom: 1px solid var(--line); }
.file-ic { width: 2.25rem; height: 2.25rem; border-radius: .625rem; display: grid; place-items: center; font-weight: 700; font-size: .6875rem; background: var(--brand-soft); color: var(--brand); }
.file-ic.k-sheet { background: var(--good-soft); color: var(--good-ink); }
.file-ic.k-err { background: var(--crit-soft); color: var(--crit-ink); }
.file-main { min-width: 0; }
.file-t { font-weight: 650; font-size: .875rem; color: var(--ink); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.file-n { font-size: .75rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file select { min-height: 2rem; border-radius: 999px; border: 1px solid var(--line-2); padding: 0 .625rem; font-size: .8125rem; font-weight: 600; max-width: 100%; }
.file .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 2.25rem; height: 2.25rem; border-radius: 50%; font-size: 1.125rem; line-height: 1; }
.file .x:hover { background: var(--crit-soft); color: var(--crit-ink); }

.loader-actions {
  display: flex; gap: .75rem 1rem; align-items: center; flex-wrap: wrap; margin-top: .75rem; padding: 1rem 1.125rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--sh-card);
}
.loader-actions .btn-primary { min-height: 2.75rem; padding: 0 1.5rem; font-size: .9375rem; }
.loader-actions .small { font-size: .8125rem; color: var(--muted); }
.err-box { margin-top: .25rem; padding: .625rem .875rem; border-radius: var(--r-in); background: var(--crit-soft); color: var(--crit-ink); font-size: .8125rem; }

/* Resumen de carga (plegado) */
.loaded-bar {
  display: flex; align-items: center; gap: .625rem .875rem; flex-wrap: wrap; margin-top: 1rem; padding: .625rem .75rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--sh-card);
}
.loaded-bar .chips { display: flex; gap: .375rem; flex-wrap: wrap; flex: 1; min-width: 0; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: .375rem; min-height: 2rem; padding: 0 .6875rem; border-radius: 999px; font-size: .8125rem; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); white-space: nowrap;
}
.chip svg { width: .875rem; height: .875rem; }
@media (pointer: coarse) { .chip-tg, .chip-off { min-height: 2.75rem; } }

/* Aviso de ejemplo */
.demo-banner { display: flex; flex-wrap: wrap; gap: .375rem .625rem; align-items: center; padding: 1rem 0 0; font-size: .875rem; color: var(--ink-2); }
.demo-banner b { font-weight: 700; font-size: .75rem; padding: .1875rem .5625rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }

/* ---------- Resumen ---------- */
.hero-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: .75rem; align-items: stretch; }
/* La isla: la tarjeta de la ganancia neta es la única oscura de la página (en claro y en oscuro).
   Adentro se redefinen los colores, así todo lo de adentro (medidor, cifras, botones) se lee sobre el azul. */
.hero {
  position: relative; min-width: 0; padding: 1.25rem 1.375rem 1.25rem; border-radius: 1.25rem; overflow: hidden; isolation: isolate;
  --ink: #FFFFFF; --ink-2: #E2E8F6; --muted: #B9C3E2; --line: rgba(255, 255, 255, .14); --line-2: rgba(255, 255, 255, .38);
  --track: rgba(255, 255, 255, .13); --surface: transparent; --surface-2: rgba(255, 255, 255, .08); --surface-3: rgba(255, 255, 255, .12); --page: #1B2A72;
  --brand: #96B6FE; --brand-hi: #BCD1FF; --brand-soft: rgba(150, 182, 254, .16); --on-brand: #121A4A;
  --accent: #FA8746; --accent-ink: #FFA56C; --accent-soft: rgba(250, 135, 70, .16);
  --good: #4BC680; --good-ink: #6AD895; --good-soft: rgba(75, 198, 128, .16); --warn: #F1BF4E; --warn-ink: #F4CC64; --warn-soft: rgba(241, 191, 78, .16);
  --crit: #F66C6D; --crit-ink: #FF9492; --crit-soft: rgba(246, 108, 109, .18);
  color: var(--ink-2);
  background:
    radial-gradient(28rem 16rem at 100% 0%, rgba(244, 105, 43, .34), transparent 70%),
    radial-gradient(24rem 18rem at 0% 110%, rgba(116, 153, 251, .30), transparent 70%),
    linear-gradient(150deg, #1F3385 0%, #162166 55%, #181A4B 100%);
  box-shadow: 0 1.5rem 3rem -1.75rem rgba(22, 33, 102, .7);
}
.hero::after { /* grilla de puntos muy suave, como en las referencias */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background-image: radial-gradient(rgba(255, 255, 255, .09) 1px, transparent 1.2px); background-size: 1rem 1rem;
  -webkit-mask-image: linear-gradient(180deg, #000, transparent 65%); mask-image: linear-gradient(180deg, #000, transparent 65%);
}
.hero-meta { margin-top: .5rem; font-size: .8125rem; color: var(--muted); max-width: 70ch; }
.hero-label { margin-top: 0; font-size: .875rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.hero-label .muted { font-weight: 500; }
.hero-num {
  margin-top: .25rem; font-family: var(--f-display); font-size: 3.75rem; font-weight: 400; letter-spacing: -.015em; line-height: 1;
  color: var(--ink); font-variant-numeric: lining-nums; overflow-wrap: anywhere;
}
.hero-num.is-neg { color: var(--crit-ink); }
.hero-sub { margin-top: .5rem; max-width: 44rem; font-size: .9375rem; line-height: 1.45; font-weight: 500; color: var(--ink); }
.hero-g { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 1.25rem; margin-top: 1rem; padding-top: .875rem; border-top: 1px solid var(--line); }
.medidor { min-width: 0; }
.lab { font-size: .75rem; font-weight: 600; color: var(--muted); }
.gauge { display: block; width: 100%; max-width: 12.5rem; height: auto; margin-top: .25rem; overflow: visible; }
.gauge path, .gauge line { fill: none; }
.gauge .trk { stroke: var(--track); }
.gauge .zb, .gauge .val.tone-crit { stroke: var(--crit); }
.gauge .zw, .gauge .val.tone-warn { stroke: var(--warn); }
.gauge .zg, .gauge .val.tone-ok { stroke: var(--good); }
.gauge .obj { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.gauge .gv { fill: var(--ink); font-family: var(--f-display); font-size: 44px; font-weight: 400; letter-spacing: -.01em; }
.gauge .gl { fill: var(--muted); font-family: var(--f-sans); font-size: 13px; font-weight: 600; }
.medidor .sev { margin-top: .375rem; }
.medidor .nota { margin-top: .375rem; font-size: .75rem; color: var(--muted); }
.cuatro { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; align-content: start; margin: 0; }
.cuatro > div { padding: .625rem .75rem .6875rem; border-radius: var(--r-in); background: var(--surface-2); min-width: 0; }
.cuatro dt { font-size: .75rem; color: var(--muted); }
.cuatro dd { margin: .125rem 0 0; font-size: 1.25rem; line-height: 1.15; font-weight: 650; letter-spacing: -.015em; color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tres { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem 1.25rem; margin-top: .875rem; }
.tres > div { padding-top: .625rem; border-top: 1px solid var(--line); font-size: .8125rem; min-width: 0; }
.tres > div:has(.meta-form) { grid-column: 1 / -1; }
.tres h3 { margin-bottom: .25rem; font-size: .75rem; font-weight: 600; color: var(--muted); }
.hero-controls { margin-top: .75rem; display: flex; gap: .5rem .75rem; align-items: center; flex-wrap: wrap; font-size: .8125rem; color: var(--ink-2); }

/* Etiquetas de gravedad: forma + palabra + color, en minúscula normal */
.sev {
  display: inline-flex; align-items: center; gap: .3125rem; min-height: 1.375rem; padding: 0 .5625rem 0 .4375rem; border-radius: 999px; width: fit-content;
  font-size: .6875rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
}
.sev > span[aria-hidden] { font-size: .5625rem; }
.sev-crit { background: var(--crit-soft); color: var(--crit-ink); }
.sev-warn { background: var(--warn-soft); color: var(--warn-ink); }
.sev-ok { background: var(--good-soft); color: var(--good-ink); }
.sev-info { background: var(--surface-3); color: var(--ink-2); }

/* Lo más importante */
.insights { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 1.25rem; box-shadow: var(--sh-card); padding: 1.125rem 1.125rem .5rem; }
.ins-h { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; flex-wrap: wrap; padding-bottom: .375rem; }
.ins-h h3 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; }
.ins { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 1.125rem; gap: .25rem .75rem; padding: .75rem .25rem .8125rem; border-top: 1px solid var(--line); color: var(--ink-2); }
.ins > .sev { grid-column: 1; justify-self: start; }
.ins-t { grid-column: 1; font-size: .875rem; line-height: 1.35; font-weight: 700; color: var(--ink); }
.ins-x { grid-column: 1; font-size: .8125rem; color: var(--muted); line-height: 1.45; }
.ins-go { grid-column: 2; grid-row: 1 / 4; align-self: center; width: 1.125rem; height: 1.125rem; color: var(--muted); transition: transform .2s var(--ease); }
.ins[data-go] { cursor: pointer; border-radius: var(--r-in); }
.ins[data-go]:hover { background: var(--surface-2); }
.ins[data-go]:hover .ins-go { color: var(--brand); transform: translateX(2px); }

/* Seis números del mes: tarjetas con ícono */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .75rem; margin-top: .75rem; }
.tile { padding: .875rem .9375rem .9375rem; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.tile-top { display: flex; align-items: center; gap: .5rem; min-width: 0; min-height: 1.95rem; } /* dos renglones del rótulo: las cifras quedan a la misma altura aunque un rótulo ocupe dos */
.tile-ic { width: 1.75rem; height: 1.75rem; border-radius: .5rem; display: grid; place-items: center; flex: none; color: var(--ic-1); background: var(--ic-1s); }
.tile-ic svg { width: 1rem; height: 1rem; }
.tile:nth-child(2) .tile-ic { color: var(--ic-2); background: var(--ic-2s); }
.tile:nth-child(3) .tile-ic { color: var(--ic-3); background: var(--ic-3s); }
.tile:nth-child(4) .tile-ic { color: var(--ic-4); background: var(--ic-4s); }
.tile:nth-child(5) .tile-ic { color: var(--ic-5); background: var(--ic-5s); }
.tile:nth-child(6) .tile-ic { color: var(--ic-6); background: var(--ic-6s); }
.tile-l { font-size: .75rem; font-weight: 600; color: var(--muted); line-height: 1.3; min-width: 0; }
.tile-v { margin-top: .625rem; font-size: 1.375rem; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tile-s { margin-top: .25rem; font-size: .75rem; color: var(--muted); min-height: 1.125rem; line-height: 1.4; }
.tile .spark { margin-top: .625rem; width: 100%; height: 1.625rem; }
.spark-bar { fill: var(--ic-1); opacity: .45; }
.tile:nth-child(2) .spark-bar { fill: var(--ic-2); }
.spark-bar.is-last { opacity: 1; }
.spark-line { fill: none; stroke: var(--line-2); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark-area { display: none; }
.spark-dot { fill: var(--accent); stroke: none; }
.minibars rect { fill: var(--bar); opacity: .55; }

/* ---------- Margen y estados: forma + color + número (nunca solo color) ---------- */
.pill { display: inline-flex; align-items: center; gap: .3125rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.4; }
.pill i { font-style: normal; font-size: .5625rem; line-height: 1; }
.pill.ok { color: var(--good-ink); }
.pill.warn { color: var(--warn-ink); }
.pill.crit { color: var(--crit-ink); }
.pill.neu, .pill.info { color: var(--muted); font-weight: 600; }
.mb { position: relative; display: inline-block; width: 3rem; height: .3125rem; border-radius: 999px; background: var(--track); margin-right: .25rem; }
.mb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; font-size: 0; transform-origin: 0 50%; }
.mb b { position: absolute; top: -.1875rem; bottom: -.1875rem; width: 1.5px; background: var(--ink); }
.pill.ok .mb i { background: var(--good); }
.pill.warn .mb i { background: var(--warn); }
.pill.crit .mb i { background: var(--crit); }
.tag { display: inline-flex; align-items: center; min-height: 1.25rem; padding: 0 .4375rem; border-radius: 999px; font-size: .6875rem; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag.acc { background: var(--accent-soft); color: var(--accent-ink); }
.nota { font-size: .8125rem; color: var(--muted); }

/* ---------- Cascada ---------- */
.wf { display: grid; }
.wf-row { display: grid; grid-template-columns: minmax(8.5rem, 1.2fr) minmax(0, 2fr) minmax(5.75rem, auto); gap: .75rem; align-items: center; min-height: 2.125rem; border-top: 1px solid var(--line); }
.wf-row:first-child { border-top: 0; }
.wf-label { font-size: .8125rem; color: var(--ink-2); }
.wf-subtotal .wf-label, .wf-start .wf-label, .wf-end .wf-label { color: var(--ink); font-weight: 700; }
.wf-end { border-top-color: var(--line-2); }
.wf-track { position: relative; height: .75rem; border-radius: var(--r-xs); background: var(--ghost); }
.wf-zero { position: absolute; top: -.25rem; bottom: -.25rem; width: 1px; background: var(--axis); }
.wf-bar { position: absolute; top: 0; bottom: 0; border-radius: var(--r-xs); min-width: 3px; transform-origin: 0 50%; }
.wf-bar.tone-tot { background: var(--tot); }
.wf-bar.tone-end { background: var(--end); }
.wf-bar.tone-neg { background: var(--neg); }
.wf-bar.tone-pos { background: var(--good); }
.wf-val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: .8125rem; white-space: nowrap; color: var(--ink-2); }
.wf-val.is-neg { color: var(--ink-2); }
.wf-val.is-pos { color: var(--good-ink); }
.wf-subtotal .wf-val, .wf-start .wf-val { color: var(--ink); font-weight: 700; }
.wf-end .wf-val { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; color: var(--accent-ink); }
.info-i { display: inline-grid; place-items: center; width: .875rem; height: .875rem; border-radius: 50%; border: 1px solid var(--line-2); font-size: .5625rem; font-weight: 700; color: var(--muted); vertical-align: 1px; font-style: normal; }

/* Barra segmentada (flex contra correo) */
.seg { display: flex; gap: 2px; height: 1.75rem; border-radius: var(--r-sm); overflow: hidden; }
.seg--thin { height: .5rem; border-radius: 999px; }
.seg-part { display: flex; align-items: center; padding-left: .5rem; min-width: 2px; border-radius: var(--r-xs); transform-origin: 0 50%; }
.seg--thin .seg-part { border-radius: 0; padding: 0; }
.seg-part b { font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
/* De cada $100: cien cuadraditos, la ganancia en mandarina y lo demás en cobalto */
.cien { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: .1875rem; max-width: 15rem; }
.cien i { display: block; aspect-ratio: 1; border-radius: .1875rem; background: var(--cien); }
.cien i.g { background: var(--accent); }
.legend { display: grid; margin-top: .875rem; }
.lg-row { display: grid; grid-template-columns: .75rem minmax(0, 1fr) auto 3.5rem; gap: .625rem; align-items: center; padding: .4375rem 0; border-top: 1px solid var(--line); font-size: .8125rem; }
.lg-sw { width: .75rem; height: .75rem; border-radius: .1875rem; background: var(--cien); }
.lg-sw.is-gan { background: var(--accent); }
.lg-v { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.lg-p { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.unit-box { margin-top: 1rem; padding: .75rem .875rem; border-radius: var(--r-in); background: var(--surface-2); }
.unit-h { font-size: .875rem; font-weight: 700; color: var(--ink); margin-bottom: .25rem; }
.unit-box .rows > div { padding: .375rem 0; font-size: .8125rem; }

/* ---------- Gráficos ---------- */
.chart { width: 100%; min-height: 3.75rem; position: relative; outline: none; }
.chart:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: var(--r-xs); }
.ch { display: block; overflow: visible; font-family: var(--f-sans); }
.ch-grid { stroke: var(--grid); stroke-width: 1; }
.ch-base { stroke: var(--axis); stroke-width: 1; }
.ch-ax { fill: var(--ax-text); font-size: .6875rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.ch-lab { fill: var(--ink); font-size: .75rem; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; } /* un borde del color de la tarjeta: la etiqueta se lee aunque cruce una raya */
.ch-lab--muted { fill: var(--muted); font-weight: 500; }
.ch-ghost { fill: var(--ghost); }
.ch-ghost.is-wknd { fill: var(--ghost-w); }
.ch-bar { fill: var(--bar); transition: opacity .12s, fill .12s; }
.ch-bar.is-dim { opacity: .35; }
.ch-bar.is-hot { fill: var(--bar-hi); }
.ch-line { fill: none; stroke: var(--tot); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-line--avg { stroke: var(--accent); stroke-width: 2.5; }
.ch-line--proj { stroke: var(--accent); stroke-dasharray: 4 5; }
.ch-area { fill: var(--tot); opacity: .08; }
.ch-dot { fill: var(--tot); stroke: var(--surface); stroke-width: 2; }
.ch-dot--hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.ch-cross { stroke: var(--ink-2); stroke-width: 1; opacity: .45; stroke-dasharray: 3 3; pointer-events: none; }
.ch-ref { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .7; }
.ch-quad--good { fill: var(--good); opacity: .07; }
.ch-bub { fill: var(--tot); fill-opacity: .8; stroke: var(--surface); stroke-width: 2; }
.ch-bub.is-low, .ch-bub.tone-crit { fill: var(--crit); }
.ch-bub.tone-warn { fill: var(--warn); }
.ch-bub.tone-ok { fill: var(--good); }
.ch-dotp { fill: var(--tot); stroke: var(--surface); stroke-width: 1.5; }
.ch-dotp.tone-crit { fill: var(--crit); }
.ch-dotp.tone-warn { fill: var(--warn); }
.ch-dotp.tone-ok { fill: var(--good); }
.cmp-prod { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem 1rem; padding: .625rem .875rem; border-radius: var(--r-in); background: var(--surface-2); font-size: .8125rem; }
.ch-bub.is-hl { fill-opacity: 1; stroke: var(--ink); }
.ch-hit { cursor: crosshair; }
.chart-legend { display: flex; gap: .375rem 1rem; flex-wrap: wrap; font-size: .75rem; color: var(--muted); margin-top: .625rem; }
.chart-legend span { display: inline-flex; align-items: center; gap: .375rem; }
.chart-legend .k-bar { width: .625rem; height: .625rem; border-radius: 2px; background: var(--tot); }
.chart-legend .k-desc { width: .625rem; height: .625rem; border-radius: 2px; background: var(--neg); }
.chart-legend .k-end { width: .625rem; height: .625rem; border-radius: 2px; background: var(--end); }
.chart-legend .k-line { width: 1rem; height: 2.5px; background: var(--accent); border-radius: 2px; }
.chart-legend .k-dash { width: 1rem; height: 0; border-top: 2px dashed var(--accent); }
.chart-legend .k-neg { width: .625rem; height: .625rem; border-radius: 50%; background: var(--crit); }
.chart-legend .k-pos { width: .625rem; height: .625rem; border-radius: 50%; background: var(--tot); }
.chart-legend .k-good { width: .625rem; height: .625rem; border-radius: 50%; background: var(--good); }
.chart-legend .k-warn { width: .625rem; height: .625rem; border-radius: 50%; background: var(--warn); }
.chart-legend .k-wknd { width: .625rem; height: .625rem; border-radius: 2px; background: var(--ghost-w); box-shadow: inset 0 0 0 1px var(--line-2); }
/* las barras del día a día van en el color de barras, no en el de los subtotales */
#dia .chart-legend .k-bar, #ch-dias + .chart-legend .k-bar { background: var(--bar); }

.tt {
  position: fixed; z-index: 100; pointer-events: none; background: #171D37; color: #FFFFFF;
  padding: .5rem .6875rem; border-radius: .625rem; font-size: .8125rem; box-shadow: var(--shadow-pop); max-width: 17.5rem;
}
:root[data-theme="dark"] .tt { background: #F1F3FA; color: #171D37; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tt { background: #F1F3FA; color: #171D37; } }
.tt-h { font-size: .75rem; opacity: .8; margin-bottom: .25rem; }
.tt-row { display: flex; align-items: center; gap: .4375rem; line-height: 1.5; }
.tt-key { width: .75rem; height: .1875rem; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, .6); }
.tt-v { font-weight: 700; font-variant-numeric: tabular-nums; }
.tt-l { opacity: .85; }

/* Barras horizontales */
.hb { display: grid; }
.hb-row { display: grid; grid-template-columns: minmax(7.5rem, 1.35fr) minmax(0, 2fr) minmax(4rem, auto); gap: .75rem; align-items: center; min-height: 2.125rem; border-top: 1px solid var(--line); }
.hb-row:first-child { border-top: 0; }
.hb-row.is-link { cursor: pointer; border-radius: var(--r-sm); }
.hb-row.is-link:hover { background: var(--surface-2); }
.hb-row.is-link:hover .hb-name { text-decoration: underline; }
.hb-label { min-width: 0; display: flex; align-items: baseline; gap: .375rem; font-size: .8125rem; }
.hb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-sub { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.hb-track { height: .5rem; position: relative; border-radius: 999px; background: var(--ghost); }
.hb-bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--bar); transform-origin: 0 50%; }
.hb-bar.tone-neg { background: var(--crit); }
.hb-bar.tone-muted { background: var(--neg); }
.hb-bar.tone-warn { background: var(--warn); }
.hb-val { text-align: right; font-size: .8125rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.dot { width: .5rem; height: .5rem; border-radius: 50%; flex: none; align-self: center; }

/* Mapa de calor (una sola tinta: de niebla a cobalto; el número va siempre en tinta) */
.hm { display: grid; gap: .1875rem; }
.hm-row { display: grid; grid-template-columns: 2.25rem repeat(var(--cols), minmax(0, 1fr)); gap: .1875rem; align-items: center; }
.hm-col { font-size: .6875rem; color: var(--ax-text); text-align: center; white-space: nowrap; }
.hm-rl { font-size: .75rem; color: var(--ink-2); font-weight: 600; }
.hm-cell {
  position: relative; isolation: isolate; height: 1.75rem; border-radius: .3125rem; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2);
  font-size: .6875rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.hm-cell::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: color-mix(in oklab, var(--heat-hi) var(--t), var(--surface-2)); }
.hm-cell i { font-style: normal; }

/* ---------- Tablas ---------- */
/* tabla más ancha que la pantalla: una sombrita en el borde avisa que sigue */
.tbl-wrap { overflow-x: auto;
  background: linear-gradient(to right, var(--surface) 30%, transparent) left / 2rem 100% no-repeat local,
    linear-gradient(to left, var(--surface) 30%, transparent) right / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, var(--scroll-sh), transparent) left / .75rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, var(--scroll-sh), transparent) right / .75rem 100% no-repeat scroll; }
.tbl-wrap:focus-visible { outline-offset: 2px; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .8125rem; }
.tbl th {
  text-align: right; font-size: .75rem; font-weight: 600; letter-spacing: 0; color: var(--muted);
  padding: .5rem .625rem; white-space: nowrap; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; cursor: default; user-select: none;
}
.tbl th:first-child { border-top-left-radius: var(--r-sm); border-bottom-left-radius: var(--r-sm); }
.tbl th:last-child { border-top-right-radius: var(--r-sm); border-bottom-right-radius: var(--r-sm); }
.tbl th[data-sort] { cursor: pointer; }
.tbl th[data-sort]:hover, .tbl th.is-sorted { color: var(--ink); }
.tbl th.is-sorted::after { content: " ↓"; color: var(--brand); }
.tbl th.is-sorted.asc::after { content: " ↑"; }
.tbl th:first-child, .tbl td:first-child, .tbl th.l, .tbl td.l { text-align: left; }
.tbl td { padding: .625rem .625rem; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; vertical-align: middle; white-space: nowrap; }
.tbl tbody tr { transition: background-color .1s; }
.tbl tbody tr.is-link { cursor: pointer; }
.tbl tbody tr.is-link:hover td { background: var(--surface-2); }
.tbl tfoot td { font-weight: 700; color: var(--ink); border-bottom: 0; border-top: 1px solid var(--line-2); }
.tbl .t-name { white-space: normal; min-width: 13rem; max-width: 22.5rem; }
.t-name-main { font-weight: 650; line-height: 1.3; color: var(--ink); }
.t-name-sub { display: flex; gap: .375rem; align-items: center; margin-top: .3125rem; flex-wrap: wrap; }
.cell-bar { position: relative; display: inline-flex; justify-content: flex-end; min-width: 5.75rem; }
.cell-bar::before { content: ""; position: absolute; left: 0; bottom: -.4375rem; height: 3px; width: var(--w); background: var(--bar); opacity: .55; border-radius: 2px; }
.cell-bar.neg::before { background: var(--crit); opacity: 1; }
.cov { display: inline-grid; grid-template-columns: 6.5rem 3.25rem; align-items: center; gap: .625rem; }
.cov > span:last-child { text-align: right; }
.cov-track { position: relative; height: .5rem; border-radius: 999px; background: var(--track); }
.cov-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--bar); transform-origin: 0 50%; }
.cov-fill.warn { background: var(--warn); } .cov-fill.crit { background: var(--crit); }
.cov-mark { position: absolute; top: -.25rem; bottom: -.25rem; width: 2px; border-radius: 1px; background: var(--ink); }
.cov-fill + .cov-mark { background: var(--crit); }

.tbl-tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.search { min-height: 2.25rem; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 0 .875rem; min-width: 13.75rem; font-size: .8125rem; }

/* Tarjetas de producto en celular */
.pcards { display: none; gap: 0; }
.pcard { padding: .75rem .125rem; border-top: 1px solid var(--line); cursor: pointer; }
.pcard:last-child { border-bottom: 1px solid var(--line); }
.pcard-h { display: flex; justify-content: space-between; gap: .625rem; align-items: flex-start; }
.pcard-n { font-weight: 650; line-height: 1.3; color: var(--ink); font-size: .875rem; }
.pcard-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .625rem; margin-top: .5rem; }
.pcard-g div span { display: block; font-size: .6875rem; font-weight: 600; color: var(--muted); }
.pcard-g div b { font-size: .875rem; font-variant-numeric: tabular-nums; }

/* Números chicos (stats): cifra con rótulo, en una cajita suave */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .5rem; }
.stat { padding: .625rem .75rem .6875rem; border-radius: var(--r-in); background: var(--surface-2); border: 1px solid transparent; min-width: 0; }
.stat-l { font-size: .75rem; color: var(--muted); }
.stat-v { margin-top: .1875rem; font-size: 1.25rem; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.stat-s { font-size: .75rem; color: var(--muted); margin-top: .1875rem; }
.stat.is-crit { background: var(--crit-soft); }
.stat.is-crit .stat-v { color: var(--crit-ink); }
.stat.is-warn { background: var(--warn-soft); }
.stat.is-warn .stat-v { color: var(--warn-ink); }

/* Vacío */
.empty { padding: 1.25rem 1.25rem; border: 1px dashed var(--line-2); border-radius: var(--r-card); display: grid; gap: .5rem; background: var(--surface-2); }
.empty h3 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; }
.empty p { color: var(--ink-2); font-size: .875rem; max-width: 72ch; }
.code {
  font-family: var(--f-mono); font-size: .75rem; background: var(--surface-2); border-radius: var(--r-in);
  padding: .75rem .875rem; overflow-x: auto; white-space: pre; color: var(--ink);
}

/* Alertas */
.alerts { display: grid; gap: .5rem; }
.alert { display: grid; grid-template-columns: minmax(0, 1fr); gap: .4375rem; padding: .875rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--sh-card); }
.alert > .sev { justify-self: start; }
.alert-t { font-size: .9375rem; line-height: 1.35; font-weight: 700; color: var(--ink); }
.alert-d { color: var(--muted); font-size: .8125rem; margin-top: .1875rem; }
.alert-items { margin: .5rem 0 0; padding: 0; list-style: none; display: grid; gap: .25rem; font-size: .8125rem; }
/* cada renglón fluye como un párrafo con sangría: en el celular, la raya no queda sola arriba del nombre */
.alert-items li { position: relative; padding-left: 1rem; line-height: 1.45; }
.alert-items li::before { content: "–"; position: absolute; left: 0; color: var(--muted); }
.alert-items li > span + span { margin-left: .5rem; }
.alert-items .sug { color: var(--good-ink); font-weight: 600; }
.alert details summary { cursor: pointer; font-size: .8125rem; font-weight: 600; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; margin-top: .375rem; min-height: 1.75rem; }
.ok-box { display: flex; gap: .625rem; align-items: center; padding: .75rem .875rem; border-radius: var(--r-in); background: var(--good-soft); color: var(--ink); font-weight: 600; font-size: .875rem; }
.ok-box svg { width: 1.125rem; height: 1.125rem; flex: none; color: var(--good-ink); }

/* Listas simples */
.rows { display: grid; }
.rows > div { display: flex; justify-content: space-between; gap: .75rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: .8125rem; align-items: baseline; }
.rows > div:last-child { border-bottom: 0; }
.rows > div > :first-child { min-width: 0; overflow-wrap: anywhere; }
.rows .r-v { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.rows .r-v .small { white-space: normal; }
.rows .r-total { font-weight: 800; color: var(--ink); }
.rows .is-link:hover b { text-decoration: underline; text-underline-offset: 3px; }
/* «Dónde ajustar el precio» en el celular: el precio sugerido va debajo del nombre, entero, sin cortarse a mitad de frase */
@media (max-width: 480px) {
  .rows-precio > div { flex-wrap: wrap; row-gap: .25rem; }
  .rows-precio > div > :first-child { flex: 1 1 100%; }
  .rows-precio .r-v { margin-left: auto; }
  .rows-precio .r-v .small { white-space: nowrap; }
}
.person { display: flex; align-items: center; gap: .625rem; }
.person-big { font-size: 1.375rem; font-weight: 700; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Calendario de liberaciones */
.cal { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(3.75rem, 1fr); gap: .375rem; overflow-x: auto; padding-bottom: .375rem; }
.cal-day { border-radius: var(--r-in); background: var(--surface-2); padding: .5rem .25rem .375rem; display: grid; gap: .375rem; align-content: end; min-height: 9rem; position: relative; }
.cal-bar { width: 100%; max-width: 1.375rem; justify-self: center; border-radius: .25rem .25rem .125rem .125rem; background: var(--bar); transform-origin: 50% 100%; }
.cal-day.is-late { background: var(--warn-soft); }
.cal-day.is-late .cal-bar { background: var(--warn); }
.cal-v { font-size: .75rem; font-weight: 700; text-align: center; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-d { font-size: .6875rem; line-height: 1.35; color: var(--muted); text-align: center; white-space: nowrap; }
.cal-foot { display: flex; flex-wrap: wrap; gap: .375rem 1.25rem; margin-top: .75rem; padding-top: .625rem; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--ink-2); }
.cal-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cal-day.is-late .cal-d { color: var(--warn-ink); font-weight: 600; }

/* ---------- Panel lateral (detalle, guía, novedades, conexión) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(13, 18, 33, .42); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); z-index: 80; }
.drawer {
  position: fixed; z-index: 90; top: .5rem; right: .5rem; bottom: .5rem; width: min(36rem, calc(100% - 1rem));
  background: var(--page); border: 1px solid var(--line); border-radius: 1.25rem; box-shadow: var(--shadow-pop); overflow: hidden;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-h { display: flex; gap: .75rem; align-items: flex-start; justify-content: space-between; padding: 1rem 1.25rem .875rem; border-bottom: 1px solid var(--line); background: var(--surface); }
.drawer-h h3 { font-size: 1.125rem; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
.drawer-b { overflow-y: auto; padding: 1rem 1.25rem 1.75rem; display: grid; gap: 1.125rem; align-content: start; }
.drawer-b:focus-visible { outline-offset: -3px; }
.drawer-b .card-h { margin-bottom: .5rem; }
.drawer-b .card-h h3 { font-size: .9375rem; }
.drawer .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
.drawer .stat { background: var(--surface); border-color: var(--line); }
.calc { display: grid; gap: .625rem; padding: 1rem; border-radius: var(--r-card); background: var(--inv); color: var(--on-inv); }
.calc b, .calc .pill { color: inherit; }
.calc label { font-size: .875rem; font-weight: 600; }
.calc-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.calc input { min-height: 2.5rem; width: 10.5rem; border-radius: 999px; border: 1px solid var(--on-inv); background: transparent; padding: 0 .875rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--on-inv); }
.calc input:focus-visible { outline-color: var(--accent); }
.calc-out { font-size: .875rem; }
.calc-out b { font-size: 1.125rem; font-weight: 700; }
.calc .small { color: var(--on-inv); opacity: .85; }
.calc-out .pill.ok, .calc-out .pill.warn, .calc-out .pill.crit { padding: .125rem .5rem; border-radius: 999px; }
.calc-out .pill.ok { background: var(--good-soft); color: var(--good-ink); }
.calc-out .pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.calc-out .pill.crit { background: var(--crit-soft); color: var(--crit-ink); }
.sales-list { display: grid; gap: 0; font-size: .8125rem; }
.sales-list > div { display: grid; grid-template-columns: 4.75rem minmax(0, 1fr) auto auto; gap: .625rem; padding: .4375rem 0; border-bottom: 1px solid var(--line); align-items: center; }

/* ---------- Pie ---------- */
.foot { position: relative; display: flex; gap: .5rem 1.75rem; justify-content: space-between; flex-wrap: wrap; margin-top: 3rem; padding-block: 1.125rem 2.5rem; color: var(--muted); font-size: .8125rem; }
.foot::before { content: ""; position: absolute; top: 0; left: max(var(--gut), env(safe-area-inset-left, 0px)); right: max(var(--gut), env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }
.foot .link-btn { color: var(--brand); }
.method { columns: 2 21rem; column-gap: 2.5rem; font-size: .8125rem; color: var(--ink-2); line-height: 1.55; }
.method p { break-inside: avoid; margin-bottom: .625rem; }

/* Aviso flotante */
.toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 120; background: #171D37; color: #FFFFFF; padding: .625rem 1rem; border-radius: .875rem; font-size: .8125rem; font-weight: 600; box-shadow: var(--shadow-pop); width: max-content; max-width: min(35rem, calc(100vw - 2rem)); }

/* ---------- Ayuda de archivos (carga) ---------- */
.ayuda-archivos { font-size: .8125rem; color: var(--ink-2); }
.ayuda-archivos summary { cursor: pointer; font-weight: 600; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; min-height: 2rem; display: flex; align-items: center; width: fit-content; }
.ayuda-archivos ul { margin: .375rem 0 0; padding-left: 1.125rem; display: grid; gap: .5rem; line-height: 1.5; }

/* ---------- Pedido: recibo con borde punteado ---------- */
.card.ped { margin-top: .75rem; padding: 1.25rem 1.375rem; border: 1px solid var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), var(--sh-card); border-radius: 1.25rem; }
.ped .card-h h3 { font-size: 1.0625rem; }
.ped-modos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; margin-top: .25rem; border-radius: var(--r-card); }
.ped-modos button { display: grid; gap: .0625rem; align-content: center; min-height: 3.25rem; padding: .375rem .625rem; text-align: center; white-space: normal; border-radius: .75rem; }
.ped-m-sub { font-size: .75rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.ped-modos button[aria-pressed="true"] .ped-m-sub { color: var(--ink-2); }
.ped-desc { margin: .625rem 0 0; font-size: .875rem; color: var(--ink-2); line-height: 1.5; }
.ped-fields { display: flex; flex-wrap: wrap; gap: .875rem 1.75rem; align-items: flex-start; margin: 1rem 0 .25rem; }
.ped-f { display: grid; gap: .375rem; font-size: .8125rem; align-content: start; min-width: 0; max-width: 100%; }
.ped-f > span:first-child { font-weight: 600; color: var(--muted); }
.ped-f[hidden] { display: none; }
.ped-range { display: flex; align-items: center; gap: .625rem; min-height: 2.75rem; }
.ped-range input { width: 11.875rem; accent-color: var(--brand); }
.ped-dias .field { width: 6.875rem; }
.ped-tope-in { display: flex; gap: .375rem; }
.ped-tope-in input { width: 10rem; }
.ped-tope-in select { width: auto; padding-right: .625rem; }
.ped-sum { display: flex; flex-wrap: wrap; gap: .75rem 2rem; align-items: flex-end; padding: 1rem 0 .875rem; border-top: 1.5px dashed var(--line-2); margin-top: .875rem; }
.ped-sum > div { display: grid; gap: .25rem; }
.ped-sum b { font-size: 1.875rem; line-height: 1; font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.ped-acc { margin-left: auto; align-self: center; }
.ped-msgs { margin: .125rem 0 .875rem; padding-left: 1.125rem; font-size: .8125rem; color: var(--ink-2); display: grid; gap: .25rem; line-height: 1.5; }
.ped-tbl td { border-bottom-style: dashed; border-bottom-color: var(--line-2); }
.ped-tbl .ped-q { font-size: 1rem; font-weight: 700; color: var(--ink); }
.tbl tr.is-dim td { color: var(--muted); }
.ped-mas { margin-top: .875rem; }
.ped-mas summary { cursor: pointer; font-size: .875rem; font-weight: 600; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; min-height: 2rem; display: flex; align-items: center; width: fit-content; }
.ped-pie { margin-top: .75rem; }
.ped-vacio { background: var(--surface-2); color: var(--ink-2); font-weight: 500; margin-top: .875rem; }
.ped-vacio svg { color: var(--ink); }
.stat.is-link { cursor: pointer; }
.stat.is-link .stat-s { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.stat.is-link:hover { border-color: var(--brand); }

/* ---------- Movimiento: la carga gradual ----------
   Primero aparecen las tarjetas vacías, después su contenido; las barras crecen desde la base de a una,
   las líneas se trazan de izquierda a derecha, los cuadraditos se prenden en ola y las cifras suben dígito
   por dígito. Solo transform y opacity. Nada de esto corre si el sistema pide «reducir movimiento», al imprimir
   ni en las pruebas automáticas (ver RV.mov en app.js). */
@keyframes mv-card { from { opacity: 0; transform: translateY(.625rem) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes mv-in { from { opacity: 0; transform: translateY(.375rem); } to { opacity: 1; transform: none; } }
@keyframes mv-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mv-sy { from { transform: scaleY(0); } to { transform: none; } }
@keyframes mv-sx { from { transform: scaleX(0); } to { transform: none; } }
@keyframes mv-pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes mv-dig { from { opacity: 0; transform: translateY(.45em); } to { opacity: 1; transform: none; } }
@keyframes mv-rot { from { transform: rotate(var(--a, -180deg)); } to { transform: none; } }
.mv-wait { opacity: 0; }
.mv-card { animation: mv-card .5s var(--ease) var(--d, 0ms) both; }
.mv-in { animation: mv-in .45s var(--ease) var(--d, 0ms) both; }
.mv-fade { animation: mv-fade .5s ease-out var(--d, 0ms) both; }
.mv-sy { transform-box: fill-box; transform-origin: 50% 100%; animation: mv-sy .6s var(--ease) var(--d, 0ms) both; }
.mv-sy.mv-down { transform-origin: 50% 0%; }
.mv-sx { transform-origin: 0 50%; animation: mv-sx .7s var(--ease) var(--d, 0ms) both; }
svg .mv-sx { transform-box: fill-box; }
.mv-pop { transform-box: fill-box; transform-origin: 50% 50%; animation: mv-pop .38s var(--ease) var(--d, 0ms) both; }
.gauge .val.mv-rot { transform-box: view-box; transform-origin: 150px 150px; animation: mv-rot .9s var(--ease) var(--d, 0ms) both; }
.hm-cell.mv-bloom::before { animation: mv-pop .45s var(--ease) var(--d, 0ms) both; }
.hm-cell.mv-bloom i { animation: mv-fade .35s ease-out both; animation-delay: calc(var(--d, 0ms) + 140ms); }
.mv-num { display: inline-block; white-space: nowrap; }
.mv-num > span { display: inline-block; white-space: pre; animation: mv-dig .5s var(--ease) var(--d, 0ms) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .mv-wait { opacity: 1 !important; }
}

/* ---------- Responsive ---------- */
.only-sm { display: none !important; }
@media (max-width: 1000px) {
  .hide-md { display: none !important; }
}
@media (max-width: 1200px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

  .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: 1 / -1; }

}

  .stat-v { font-size: 1.125rem; }

  .loader { padding-top: 1.25rem; }

  .paso { grid-template-columns: minmax(0, 1fr); gap: .5rem; padding: .875rem; }

  .dropzone { padding: 1.25rem .875rem; }
  .wf-row { grid-template-columns: minmax(0, 1fr) auto; gap: .25rem .75rem; padding: .4375rem 0; }

  .lg-row { grid-template-columns: .75rem minmax(0, 1fr) auto; gap: .25rem .625rem; }
  .lg-p { grid-column: 2 / -1; text-align: left; }
  .cien { max-width: 13.5rem; }
  .hide-sm { display: none !important; }

  .tbl td:first-child { white-space: normal; }
  .tbl td .small { white-space: normal; } /* las notas chicas («4 en camino») cortan renglón en vez de ensanchar la tabla */
  .only-sm { display: block !important; margin-top: .25rem; }

  .drawer { top: auto; left: 0; right: 0; bottom: 0; height: 92vh; width: 100%; border-radius: 1.25rem 1.25rem 0 0; border-bottom: 0; padding-left: env(safe-area-inset-left, 0px); }
  .drawer-h { padding: .875rem 1rem .75rem; }

  .op-n { font-size: 1.875rem; }
  .opener { grid-template-columns: minmax(0, 1fr); }
  .search { min-width: 0; width: 100%; }
