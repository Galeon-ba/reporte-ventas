          <p class="hero-sub">Lo que te quedó de ${$(K.factMiaConCosto)} facturados de tus productos, después de Meli, envíos, mercadería${g ? ', gastos grupales' : ''} y devoluciones: <b>${pct(K.margenNeto)}</b>.</p>
          <div class="hero-meter">
            <div class="hero-meter-h"><span>Margen de tus productos <b>${pct(K.margen)}</b></span><span>objetivo ${pct(op.objetivo, 0)}</span></div>
            ${CH.meter(K.margen || 0, { target: op.objetivo, max: Math.max(0.4, (K.margen || 0) + 0.05), tone, aria: `Margen ${pct(K.margen)} contra objetivo ${pct(op.objetivo, 0)}` })}
          </div>
          <div class="hero-strip">
            <div><div class="hs-l">Ganancia de productos</div><div class="hs-v">${$(K.gananciaBruta)}</div></div>
            ${g ? `<div><div class="hs-l">Gastos grupales${g.esPromedio ? ' (estimado)' : ''}</div><div class="hs-v is-neg">${U.fmtMoneySigned(-K.gastos)}</div></div>` : ''}
            <div><div class="hs-l">Devoluciones</div><div class="hs-v ${K.impactoDevoluciones < 0 ? 'is-neg' : ''}">${U.fmtMoneySigned(K.impactoDevoluciones)}</div></div>
            ${R.terceros.length ? `<div><div class="hs-l">A transferir a terceros</div><div class="hs-v">${$(K.transferirTerceros)}</div></div>` : ''}
          </div>
          ${K.ritmoDiario ? `<p class="hero-pace">Ritmo: <b>${$c(K.ritmoDiario.facturacion)}</b> de facturación y <b>${$c(K.ritmoDiario.ganancia)}</b> de ganancia de productos por día${K.proyeccion ? ` · a este ritmo ${esc(K.proyeccion.mes)} cierra en ~<b>${$c(K.proyeccion.facturacion)}</b>` : ''}.</p>` : ''}
          ${(() => { const cmp = RV.historial.comparar(R, RV.historial.anterior(R)); if (!cmp) return '';
            const chip = (l, c, pts) => c == null ? '' : `<span class="delta ${c >= 0 ? 'up' : 'down'}">${icon(c >= 0 ? 'i-up-tr' : 'i-dn-tr')}${esc(l)} ${pts ? esc(U.fmtPctPts(c)) : esc(RV.historial.fmtCambio(c))}</span>`;
            return `<p class="hero-cmp"><span class="muted">Contra ${esc(cmp.etiqueta)}:</span> ${chip('ganancia neta por día', cmp.netaDia.cambio)} ${chip('facturación por día', cmp.factDia.cambio)} ${chip('margen', cmp.margen.pts, true)}</p>`; })()}
          ${R_.meta(R, st)}
          ${parcialGastos ? `<div class="hero-controls"><span>Gastos grupales:</span><div class="segc" role="group" aria-label="Gastos grupales">
            <button type="button" data-action="gastos" data-modo="proporcional" aria-pressed="${R.opciones.gastosModo !== 'completo'}">Proporcional (${R.periodo.meses.map(m => m.diasCubiertos + '/' + m.diasEnMes).join(' + ')} días)</button>
            <button type="button" data-action="gastos" data-modo="completo" aria-pressed="${R.opciones.gastosModo === 'completo'}">Mes completo</button></div></div>` : ''}
        </div>
        <div class="card insights reveal">
          <div class="ins-h"><h3>Lo más importante</h3><span class="small muted">${R.insights.length > 4 ? `<button class="link-btn" type="button" data-action="todos-insights">Ver los ${R.insights.length}</button>` : ''}</span></div>
          ${ins.map(insHTML).join('')}
          <div id="ins-more" hidden>${R.insights.slice(4).map(insHTML).join('')}</div>
        </div>
      </div>
      <div class="tiles">${tiles.map(t => `<div class="card tile"><div class="tile-l">${esc(t.l)}</div><div class="tile-v" title="${esc(t.v)}">${esc(t.v)}</div><div class="tile-s">${esc(t.s)}</div>${t.sp ? CH.spark(t.sp, { w: 160, h: 26 }) : ''}</div>`).join('')}</div>
    </section>`;
  };

  // ---------- La plata ----------
  R_.plata = (R) => {
    const parts = [
      { id: 'gan', color: 'var(--series-3)', ink: '#fff' }, { id: 'merc', color: 'var(--tot)', ink: 'var(--on-tot)' },
      { id: 'com', color: 'var(--series-1)', ink: '#fff' }, { id: 'env', color: 'var(--series-2)', ink: '#fff' }, { id: 'imp', color: 'var(--series-5)', ink: '#0b0b0b' },
    ];
    const d = R.de100.map(x => Object.assign({}, x, parts.find(p => p.id === x.id)));
    const gan = d.find(x => x.id === 'gan');
    return `<section class="section wrap" id="plata" aria-labelledby="h-plata">
      <div class="section-h"><div><h2 id="h-plata">Adónde se va la plata</h2><p>De lo que facturaste con tus productos hasta lo que te queda en el bolsillo, paso por paso.</p></div></div>
      <div class="grid g-12">
        <div class="card span-7">
          <div class="card-h"><div><h3>De la facturación a la ganancia</h3><div class="sub">Solo tus productos con costo cargado · ${U.plural(R.mias.filter(v => v.ganancia != null).length, 'venta', 'ventas')}</div></div></div>
          ${CH.waterfall(R.waterfall, $)}
          <div class="chart-legend"><span><i class="k-bar" style="background:var(--tot)"></i>subtotales</span><span><i class="k-neg"></i>lo que se descuenta</span><span><i class="k-good"></i>lo que suma</span></div>
        </div>
        <div class="card span-5">
          <div class="card-h"><div><h3>De cada $100 que vendiste</h3><div class="sub">Antes de gastos grupales y devoluciones</div></div></div>
          ${gan ? `<p class="big100">Te quedan <b>$${U.fmtDec(gan.share * 100, 1)}</b> de ganancia</p>` : ''}
          ${CH.segbar(d.map(x => ({ label: x.label, value: Math.max(0, x.value), color: x.color, ink: x.ink })), { aria: 'Reparto de cada 100 pesos facturados' })}
          <div class="legend">${d.map(x => `<div class="lg-row"><span class="lg-sw" style="background:${x.color}"></span><span>${esc(x.label)}</span><span class="lg-v">${$(x.value)}</span><span class="lg-p">${pct(x.share, 1)}</span></div>`).join('')}</div>
          ${R.kpis.unidadPromedio ? (() => { const u = R.kpis.unidadPromedio; return `<div class="unit-box"><div class="unit-h">Una unidad promedio</div><div class="rows">
            <div><span>Precio de venta</span><span class="r-v">${$(u.precio)}</span></div>
            <div><span>Comisión de Meli</span><span class="r-v">${U.fmtMoneySigned(-u.comision)}</span></div>
            <div><span>Envío (correo o flex, neto de bonificación)</span><span class="r-v">${U.fmtMoneySigned(-u.envios)}</span></div>
            <div><span>Cupones e impuestos</span><span class="r-v">${U.fmtMoneySigned(-u.cuponesImp)}</span></div>
            <div><span>Mercadería</span><span class="r-v">${U.fmtMoneySigned(-u.mercaderia)}</span></div>
            <div><span class="r-total">Te queda</span><span class="r-v r-total">${$(u.ganancia)}</span></div></div></div>`; })() : ''}
          ${R.kpis.margenFormula != null ? `<p class="small muted" style="margin-top:12px">Con la fórmula de TITULARES (15% + ${$(C.PLANILLA_ENVIO_FIJO)} de envío) estos mismos precios darían <b class="ink2">${pct(R.kpis.margenFormula)}</b> de margen; el real fue <b class="ink2">${pct(R.kpis.margen)}</b>.</p>` : ''}
        </div>
        ${R.porCuenta.length > 1 ? R_.porCuenta(R) : ''}
      </div>
    </section>`;
  };

  // ---------- Meta del mes (ganancia neta), guardada en este navegador ----------
  R_.meta = (R, st) => {
    const P = R.periodo;
    if (!P.desde || P.meses.length !== 1) return '';
    const m = P.meses[0];
    const meta = st && !st.demo ? RV.app.metaDe(R.perfil.id) : (R.historialDemo ? 2800000 : null);
    if (st && st.editandoMeta) return `<form class="meta-form" data-form="meta" autocomplete="off">
        <label for="meta-in">Meta de ganancia neta para ${esc(m.nombre)}</label>
        <input id="meta-in" class="field" inputmode="numeric" placeholder="Ej.: 3.000.000" value="${meta ? esc(U.fmtInt(meta)) : ''}">
        <button class="btn btn-sm btn-primary" type="submit">Guardar</button>
        ${meta ? '<button class="btn btn-sm btn-ghost" type="button" data-action="meta-borrar">Quitar meta</button>' : ''}
        <button class="btn btn-sm btn-ghost" type="button" data-action="meta-cancelar">Cancelar</button>
      </form>`;
    if (!meta) return st && !st.demo ? `<p class="meta-line"><button type="button" class="link-btn" data-action="meta-editar">+ Ponerte una meta de ganancia para ${esc(m.nombre)}</button></p>` : '';
    const K = R.kpis;
    // Cierre estimado: ganancia de productos al ritmo actual por los días del mes, menos los gastos del mes completo
    const gMes = RV.engine.gastosGrupales(R.model.gastos, R.perfil, R.cuentas.map(c => c.cuenta), P.meses, 'completo');
    const proy = K.gananciaBruta / P.dias * m.diasEnMes + K.impactoDevoluciones - (gMes ? gMes.total : 0);
    const hecho = K.gananciaBruta + K.impactoDevoluciones - (gMes ? gMes.total : 0);
    const quedan = m.diasEnMes - m.diasCubiertos;
    const falta = meta - hecho;
    const avance = U.clamp(hecho / meta, 0, 1);
    const llega = proy >= meta;
    const txt = quedan > 0
      ? (llega ? `a este ritmo cerrás en ~<b>${$c(proy)}</b>: llegás` : `a este ritmo cerrás en ~<b>${$c(proy)}</b>; para llegar necesitás <b>${$c(falta / quedan)}</b> de ganancia por día los ${quedan} días que quedan`)
      : (hecho >= meta ? 'cumplida' : `te faltaron ${$c(falta)}`);
    return `<div class="meta-box ${llega || hecho >= meta ? 'ok' : 'warn'}">
      <div class="meta-h"><span>Meta de ${esc(m.nombre)}: <b>${$(meta)}</b></span>${st && !st.demo ? '<button type="button" class="link-btn" data-action="meta-editar">cambiar</button>' : ''}</div>
      <div class="meta-track" role="img" aria-label="Avance de la meta ${pct(avance, 0)}"><span style="width:${(avance * 100).toFixed(1)}%"></span></div>
      <div class="meta-s">Vas ${pct(avance, 0)} (${$c(hecho)} contando los gastos del mes completo) · ${txt}.</div>
    </div>`;
  };

  // ---------- Mes a mes (historial guardado en este navegador) ----------
  R_.mesAMes = (R) => {
    const H = RV.historial;
    const lista = H.paraReporte(R).slice(-12);
    if (lista.length < 2) return `<div class="card span-12 hist-empty"><div class="card-h"><div><h3>Mes a mes</h3><div class="sub">Cada reporte que armás queda guardado en este navegador. El mes que viene vas a ver acá cómo te fue contra este.</div></div></div></div>`;
    const maxN = Math.max(1, ...lista.map(e => Math.abs(e.neta / (e.dias || 1))));
    const filas = lista.slice().reverse().map(e => `<tr class="${e.actual ? 'is-now' : ''}"><td class="l"><b>${esc(H.etiqueta(e))}</b>${e.actual ? ' <span class="tag acc">este</span>' : ''}</td>
      <td class="hide-sm">${U.fmtInt(e.dias)}</td><td>${$(e.facturacion)}</td><td>${$(e.neta)}</td>
      <td><span class="cell-bar ${e.neta < 0 ? 'neg' : ''}" style="--w:${(Math.abs(e.neta / (e.dias || 1)) / maxN * 100).toFixed(0)}%">${$c(e.neta / (e.dias || 1))}</span></td>
      <td>${R_.pillMargen(e.margen, R.opciones)}</td><td class="hide-sm">${U.fmtInt(e.unidades)}</td></tr>`).join('');
    return `<div class="card span-12">
      <div class="card-h"><div><h3>Mes a mes</h3><div class="sub">${R.historialDemo ? 'Ejemplo: meses anteriores inventados.' : 'Guardado en este navegador cada vez que armás un reporte (mismo perfil y mismas cuentas).'} Ganancia neta con gastos grupales proporcionales; «por día» compara bien meses de distinto largo.</div></div>
        ${R.historialDemo ? '' : '<div class="card-tools"><button type="button" class="btn btn-sm btn-ghost" data-action="borrar-historial">Borrar historial</button></div>'}</div>
      <div class="chart" id="ch-meses"></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Período</th><th class="hide-sm">Días</th><th>Facturación</th><th>Ganancia neta</th><th>Neta por día</th><th>Margen</th><th class="hide-sm">Unidades</th></tr></thead><tbody>${filas}</tbody></table></div>
    </div>`;
  };

  // ---------- Por cuenta ----------
  R_.porCuenta = (R) => {
    const L = R.porCuenta;
    const maxF = Math.max(1, ...L.map(c => c.facturacion));
    const totF = U.sum(L, c => c.facturacion) || 1;
    const conMP = L.some(c => c.tieneMP);
    const terc = L.some(c => c.facturacionTerceros > 0);
    return `<div class="card span-12"><div class="card-h"><div><h3>Por cuenta</h3><div class="sub">Cuánto vendió cada cuenta y qué te dejaron tus productos en ella</div></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Cuenta</th><th>Pedidos</th><th class="hide-sm">Unidades</th><th>Facturación</th><th class="hide-sm">Parte</th>${terc ? '<th class="hide-sm">De terceros</th>' : ''}<th>Ganancia (tus productos)</th><th>Margen</th>${conMP ? '<th class="hide-sm">Por liberar en MP</th>' : ''}</tr></thead><tbody>
      ${L.map(c => `<tr><td class="l"><b>${esc(c.cuenta)}</b></td><td>${U.fmtInt(c.pedidos)}</td><td class="hide-sm">${U.fmtInt(c.unidades)}</td>
        <td>${$(c.facturacion)}</td>
        <td class="hide-sm"><span class="cell-bar" style="--w:${(c.facturacion / maxF * 100).toFixed(0)}%">${pct(c.facturacion / totF, 0)}</span></td>
        ${terc ? `<td class="hide-sm">${c.facturacionTerceros ? $(c.facturacionTerceros) : '—'}</td>` : ''}
        <td>${$(c.ganancia)}</td><td>${R_.pillMargen(c.margen, R.opciones)}</td>
        ${conMP ? `<td class="hide-sm">${c.pendiente != null ? $(c.pendiente) : '<span class="muted">sin reporte de MP</span>'}</td>` : ''}</tr>`).join('')}
      </tbody></table></div></div>`;
  };

  // ---------- Día a día ----------
  R_.evolucion = (R, st) => {
    const met = st.metrica || 'facturacion';
    const sem = R.semanas;
    return `<section class="section wrap" id="evolucion" aria-labelledby="h-evo">
      <div class="section-h"><div><h2 id="h-evo">Día a día</h2><p>Cómo vino el período: cada día, el acumulado y en qué momentos te compran.</p></div></div>
      <div class="grid g-12">
        <div class="card span-12">
          <div class="card-h"><div><h3>Ventas por día</h3><div class="sub">Todas las ventas válidas de tus cuentas</div></div>
            <div class="card-tools"><div class="segc" role="group" aria-label="Qué medir">
              ${[['facturacion', 'Facturación'], ['unidades', 'Unidades'], ['ganancia', 'Ganancia']].map(([k, t]) => `<button type="button" data-action="metrica" data-k="${k}" aria-pressed="${met === k}">${t}</button>`).join('')}
            </div></div></div>
          <div class="chart" id="ch-diario" aria-label="Ventas por día"></div>
          <div class="chart-legend"><span><i class="k-bar"></i>por día</span><span><i class="k-line"></i>promedio de 7 días</span><span><i class="k-bar" style="background:var(--wknd);outline:1px solid var(--line)"></i>fin de semana</span></div>
        </div>
        <div class="card span-7">
          <div class="card-h"><div><h3>Facturación acumulada</h3><div class="sub">${R.kpis.proyeccion ? `La línea punteada proyecta el mes completo al ritmo actual (${$c(R.kpis.ritmoDiario.facturacion)} por día)` : 'Suma día a día del período'}</div></div></div>
          <div class="chart" id="ch-acum"></div>
        </div>
        <div class="card span-5">
          <div class="card-h"><div><h3>¿Cuándo te compran?</h3><div class="sub">Ventas por día de la semana y franja horaria</div></div></div>
          <div id="heat"></div>
        </div>
        ${R_.mesAMes(R)}
        ${R.porMes ? `<div class="card span-12"><div class="card-h"><div><h3>Por mes</h3><div class="sub">El período cruza meses</div></div></div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mes</th><th>Días</th><th>Pedidos</th><th>Unidades</th><th>Facturación</th><th>Ganancia (tus productos)</th><th>Margen</th></tr></thead><tbody>
          ${R.porMes.map(m => `<tr><td>${esc(U.capitalize(m.nombre))} ${m.anio}</td><td>${m.dias}</td><td>${U.fmtInt(m.pedidos)}</td><td>${U.fmtInt(m.unidades)}</td><td>${$(m.facturacion)}</td><td>${$(m.ganancia)}</td><td>${RV.render.pillMargen(m.margen, R.opciones)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
        <div class="card span-12">
          <div class="card-h"><div><h3>Por semana</h3></div></div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Semana</th><th class="hide-sm">Pedidos</th><th class="hide-sm">Unidades</th><th>Facturación</th><th>Ganancia<span class="hide-sm"> (tus productos)</span></th><th class="hide-tab">Promedio por día</th></tr></thead>
          <tbody>${sem.map((s, i) => `<tr><td>${esc(U.fmtDate(s.desde))} al ${esc(U.fmtDate(s.hasta))}${s.dias < 7 ? ` <span class="tag">${s.dias} ${s.dias === 1 ? 'día' : 'días'}</span>` : ''}</td><td class="hide-sm">${U.fmtInt(s.pedidos)}</td><td class="hide-sm">${U.fmtInt(s.unidades)}</td><td>${$(s.facturacion)}</td><td>${$(s.ganancia)}</td><td class="hide-tab">${$(s.facturacion / s.dias)}</td></tr>`).join('')}</tbody></table></div>
        </div>
      </div>
    </section>`;
  };

  // ---------- Productos ----------
  R_.productos = (R, st) => {
    const scope = st.scope || 'mios';
    const op = R.opciones;
    const stock = R.stock ? new Map(R.stock.filas.map(f => [f.key, f])) : null;
    let lista = R.productos.filter(p => scope === 'todos' ? true : scope === 'terceros' ? !p.esMio : p.esMio);
    const q = U.normPlain(st.busqueda || '');
    if (q) lista = lista.filter(p => U.normPlain(p.nombre).includes(q));
    const sk = st.orden || 'ganancia', dir = st.ordenDir || -1;
    const val = (p, k) => k === 'nombre' ? p.nombre : (p[k] == null ? -Infinity : p[k]);
    lista = lista.slice().sort((a, b) => { const x = val(a, sk), y = val(b, sk); return (typeof x === 'string' ? x.localeCompare(y) : (x - y)) * dir; });
    const maxG = Math.max(1, ...lista.map(p => Math.abs(p.ganancia || 0)));
    const th = (k, t, cls = '') => `<th data-sort="${k}" class="${cls} ${sk === k ? 'is-sorted' + (dir > 0 ? ' asc' : '') : ''}" scope="col">${t}</th>`;
    const tot = { u: U.sum(lista, p => p.unidades), f: U.sum(lista, p => p.facturacion), g: U.sum(lista, p => p.ganancia || 0) };
    const factC = U.sum(lista.filter(p => p.ganancia != null), p => p.facturacion);
    const nMios = R.productos.filter(p => p.esMio).length, nTer = R.productos.length - nMios;
    const rows = lista.map(p => {
      const s = stock && stock.get(p.key);
      return `<tr class="is-link" data-action="producto" data-key="${esc(p.key)}" data-dueno="${esc(p.dueño)}" tabindex="0">
        <td class="t-name"><div class="t-name-main">${esc(p.nombre)}</div><div class="t-name-sub">${CH.miniBars(p.serie, { w: 84, h: 18 })}${!p.esMio ? `<span class="tag">de ${esc(RV.engine.perfilDe(p.dueño).nombre)}</span>` : ''}${p.flex ? `<span class="tag">${U.fmtInt(p.flex)} flex</span>` : ''}${p.ads ? `<span class="tag">${U.fmtInt(p.ads)} por publi</span>` : ''}</div></td>
        <td>${U.fmtInt(p.unidades)}</td>
        <td>${$(p.precioProm)}${p.precioMin && p.precioMax && p.precioMax - p.precioMin > 1 ? `<div class="small muted">${$c(p.precioMin)}–${$c(p.precioMax)}</div>` : ''}</td>
        <td class="hide-md">${$(p.netoU)}</td>
        <td class="hide-md">${$(p.costoU)}${p.costoFuente === 'pedido' ? '<div class="small muted">último pedido</div>' : ''}</td>
        <td>${$(p.gananciaU)}</td>
        <td>${RV.render.pillMargen(p.margen, op)}</td>
        <td><span class="cell-bar ${p.ganancia < 0 ? 'neg' : ''}" style="--w:${(Math.abs(p.ganancia || 0) / maxG * 100).toFixed(0)}%">${$(p.ganancia)}</span></td>
        ${stock ? `<td>${s ? `${pillStock(s.estado)}<div class="small muted">${s.total != null ? U.fmtInt(s.total) + ' u' : ''}${s.cobertura != null ? ' · ' + U.fmtDec(s.cobertura, 0) + ' días' : ''}</div>` : '<span class="muted">—</span>'}</td>` : ''}
      </tr>`;
    }).join('');
    const cards = lista.map(p => {
      const s = stock && stock.get(p.key);
      return `<div class="pcard" data-action="producto" data-key="${esc(p.key)}" data-dueno="${esc(p.dueño)}" tabindex="0">
        <div class="pcard-h"><div class="pcard-n">${esc(p.nombre)}${!p.esMio ? ` <span class="tag">de ${esc(RV.engine.perfilDe(p.dueño).nombre)}</span>` : ''}</div>${RV.render.pillMargen(p.margen, op)}</div>
        <div class="pcard-g"><div><span>Unidades</span><b>${U.fmtInt(p.unidades)}</b></div><div><span>Precio prom.</span><b>${$c(p.precioProm)}</b></div><div><span>Ganancia</span><b>${$c(p.ganancia)}</b></div>
        ${s ? `<div><span>Stock</span><b>${s.total != null ? U.fmtInt(s.total) : '—'}</b></div><div><span>Cobertura</span><b>${s.cobertura != null ? U.fmtDec(s.cobertura, 0) + ' d' : '—'}</b></div><div><span>Estado</span><b>${esc(labelStock(s.estado))}</b></div>` : ''}</div>
      </div>`;
    }).join('');
    const ajustar = R.productos.filter(p => p.esMio && p.margen != null && p.margen < op.verde && p.precioObjetivo).sort((a, b) => b.unidades - a.unidades).slice(0, 6);
    return `<section class="section wrap" id="productos" aria-labelledby="h-prod">
      <div class="section-h"><div><h2 id="h-prod">Productos</h2><p>Rentabilidad por producto con el costo vigente a la fecha de cada venta. Tocá una fila para ver el detalle.</p></div></div>
      <div class="grid g-12">
        <div class="card span-12">
          <div class="card-h">
            <div class="tbl-tools">
              <div class="segc" role="group" aria-label="Qué productos ver">
                <button type="button" data-action="scope" data-k="mios" aria-pressed="${scope === 'mios'}">Tuyos (${nMios})</button>
                ${nTer ? `<button type="button" data-action="scope" data-k="terceros" aria-pressed="${scope === 'terceros'}">De terceros (${nTer})</button><button type="button" data-action="scope" data-k="todos" aria-pressed="${scope === 'todos'}">Todos</button>` : ''}
              </div>
              <input class="search" id="prod-search" type="search" placeholder="Buscar producto" value="${esc(st.busqueda || '')}" aria-label="Buscar producto">
            </div>
            <div class="small muted">Semáforo: <span class="pill crit"><i>✕</i>&lt; ${pct(op.rojo, 0)}</span> <span class="pill warn"><i>!</i>${pct(op.rojo, 0)}–${pct(op.verde, 0)}</span> <span class="pill ok"><i>✓</i>≥ ${pct(op.verde, 0)}</span></div>
          </div>
          ${lista.length ? `<div class="tbl-wrap"><table class="tbl can-swap" id="tbl-prod">
            <thead><tr>${th('nombre', 'Producto')}${th('unidades', 'Unid.')}${th('precioProm', 'Precio prom.')}${th('netoU', 'Neto por u.', 'hide-md')}${th('costoU', 'Costo por u.', 'hide-md')}${th('gananciaU', 'Ganancia por u.')}${th('margen', 'Margen')}${th('ganancia', 'Ganancia total')}${stock ? '<th scope="col">Stock</th>' : ''}</tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr><td>${U.plural(lista.length, 'producto', 'productos')}</td><td>${U.fmtInt(tot.u)}</td><td>${$(tot.u ? tot.f / tot.u : null)}</td><td class="hide-md"></td><td class="hide-md"></td><td></td><td>${factC ? RV.render.pillMargen(tot.g / factC, op) : ''}</td><td>${$(tot.g)}</td>${stock ? '<td></td>' : ''}</tr></tfoot>
          </table></div><div class="pcards can-swap">${cards}</div>` : `<p class="muted">No hay productos para mostrar${q ? ' con esa búsqueda' : ''}.</p>`}
        </div>
        <div class="card span-7">
          <div class="card-h"><div><h3>Demanda contra margen</h3><div class="sub">Cada círculo es un producto tuyo; el tamaño es la ganancia. Arriba a la derecha, los que conviene empujar.</div></div></div>
          <div class="chart" id="ch-matriz"></div>
          <div class="chart-legend"><span><i class="k-neg"></i>margen menor a ${pct(op.rojo, 0)}</span><span><i class="k-warn"></i>${pct(op.rojo, 0)} a ${pct(op.verde, 0)}</span><span><i class="k-good"></i>${pct(op.verde, 0)} o más</span><span>línea: objetivo ${pct(op.objetivo, 0)}</span></div>
        </div>
        <div class="card span-5">
          <div class="card-h"><div><h3>Dónde ajustar el precio</h3><div class="sub">Precio aproximado para llegar al objetivo, con la misma estructura de costos del período</div></div></div>
          ${ajustar.length ? `<div class="rows">${ajustar.map(p => `<div class="is-link" data-action="producto" data-key="${esc(p.key)}" data-dueno="${esc(p.dueño)}" style="cursor:pointer" tabindex="0"><span><b>${esc(p.nombre)}</b><br><span class="small muted">hoy ${$(p.precioProm)} · ${pct(p.margen)}</span></span><span class="r-v">${$(p.precioObjetivo)}<br><span class="small muted">para ${pct(op.objetivo, 0)}${p.precioVerde ? ' · ' + $c(p.precioVerde) + ' para ' + pct(op.verde, 0) : ''}</span></span></div>`).join('')}</div>`
            : `<div class="ok-box">${icon('i-check')}Todos tus productos están en verde.</div>`}
        </div>
      </div>
    </section>`;
  };

  // ---------- Stock ----------
  R_.stock = (R, st) => {
    const S = R.stock;
    const head = `<div class="section-h"><div><h2 id="h-stock">Stock y reposición</h2><p>Cuántos días te dura cada producto al ritmo de venta de este período, y cómo armar el pedido.</p></div></div>`;
    if (!S) {
      const enClaude = RV.app && RV.app.puedeDrive && RV.app.puedeDrive();
      return `<section class="section wrap" id="stock" aria-labelledby="h-stock">${head}
        <div class="empty"><h3>Falta el stock</h3>
          <p>El stock sale de la pestaña «Consulta stock» de ANALISIS DE PRODUCTOS, y la planilla que se está usando no la trae.</p>
          <p>${enClaude ? '<b>Acá en Claude:</b> tocá «Leer ANALISIS DE PRODUCTOS desde Drive» en la carga de archivos.' : '<b>En vivo:</b> tocá «Conectar en vivo» en la carga de archivos (se hace una sola vez y lee toda la planilla, stock incluido).'}</p>
          <p><b>A mano:</b> bajá ANALISIS DE PRODUCTOS como Excel (Archivo → Descargar → Microsoft Excel) y soltala junto con tus reportes: queda guardada para la próxima.</p>
        </div></section>`;
    }
    const res = RV.pedido.armar(R, st && st.pedido);
    const tiles = [
      { l: 'Unidades en stock', v: U.fmtInt(S.unidades), s: S.ultimaAct ? `según la planilla al ${S.ultimaAct}` : `según ${S.fuente}` },
      { l: 'Valor a costo', v: $(S.valorARS), s: S.valorUSD ? `≈ ${U.fmtUSD(S.valorUSD)} en Paraguay` : '' },
      { l: 'Para reponer ya', v: U.fmtInt(S.sinStock + S.pedirYa), s: `${S.sinStock} sin stock · ${S.pedirYa} con menos de ${U.fmtDec(C.STOCK_PEDIR_YA_DIAS, 1)} días`, cls: (S.sinStock + S.pedirYa) ? 'is-crit' : '' },
    ];
    const maxCob = 45;
    const venta = (f) => {
      const pl = f.ventaMesPlanilla > 0 ? `${U.fmtDec(f.ventaMesPlanilla, 0)}/mes` : 'sin dato';
      return `planilla: ${pl} · reporte: ${U.fmtDec(f.ventaMesReal, 0)}/mes`;
    };
    const rows = S.filas.map(f => {
      const cob = f.cobertura;
      const w = cob == null ? 0 : U.clamp(cob / maxCob, 0, 1) * 100;
      const tone = f.estado === 'OK' ? '' : f.estado === 'REVISAR' ? 'warn' : 'crit';
      return `<tr class="${f.vendidas ? 'is-link' : ''}" ${f.vendidas ? `data-action="producto" data-key="${esc(f.key)}" tabindex="0"` : ''}>
        <td class="t-name"><div class="t-name-main">${esc(f.nombre)}</div><div class="small muted">${esc(venta(f))}</div><div class="only-sm">${pillStock(f.estado)}</div></td>
        <td>${f.total != null ? U.fmtInt(f.total) : '—'}${f.camino ? `<div class="small muted">${U.fmtInt(f.camino)} en camino</div>` : ''}</td>
        <td class="hide-sm">${U.fmtInt(f.vendidas)}</td>
        <td class="hide-md">${U.fmtDec(f.ventaDia * 7, 1)}</td>
        <td><span class="cov"><span class="cov-track"><span class="cov-fill ${tone}" style="width:${w.toFixed(0)}%"></span><span class="cov-mark" style="left:${(C.STOCK_PEDIR_YA_DIAS / maxCob * 100).toFixed(1)}%"></span><span class="cov-mark" style="left:${(C.STOCK_REVISAR_DIAS / maxCob * 100).toFixed(1)}%"></span></span><span>${cob == null ? (f.vendidas ? '0' : '—') : cob > 365 ? '+1 año' : U.fmtDec(cob, 0) + ' d'}</span></span></td>
        <td class="hide-sm">${pillStock(f.estado)}</td>
      </tr>`;
    }).join('');
    return `<section class="section wrap" id="stock" aria-labelledby="h-stock">${head}
      <div class="stats" style="margin-bottom:16px">${tiles.map(t => `<div class="stat ${t.cls || ''}"><div class="stat-l">${esc(t.l)}</div><div class="stat-v">${esc(t.v)}</div><div class="stat-s">${esc(t.s)}</div></div>`).join('')}
        <div class="stat is-link" data-go="pedido" id="ped-tile" role="link" tabindex="0" title="Ir a «Armá el pedido»">${R_.pedidoTile(res)}</div></div>
      <div class="card">
        <div class="card-h"><div><h3>Tus productos</h3><div class="sub">Cobertura = stock ÷ venta diaria del período (lo que da este reporte). Marcas en ${U.fmtDec(C.STOCK_PEDIR_YA_DIAS, 1)} y ${C.STOCK_REVISAR_DIAS} días (mismo criterio que «Consulta stock»).</div></div></div>
        ${S.cuentasFuera && S.cuentasFuera.length ? `<p class="note-warn">${icon('i-alert')}<span>La venta diaria sale solo de las cuentas de este reporte. Si también vendés estos productos en ${esc(RV.app.listaY(S.cuentasFuera))}, la cobertura real es menor: sumá esas cuentas para verla completa.</span></p>` : ''}
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Producto</th><th>Stock</th><th class="hide-sm">Vendidas</th><th class="hide-md">Por semana</th><th>Cobertura</th><th class="hide-sm">Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>
      ${R_.pedidoCard(R, st, res)}
    </section>`;
  };

  // ---------- Pedido: tarjeta con los controles + resultado ----------
  R_.pedidoTile = (res) => {
    const o = res.opciones, M = RV.pedido.MODOS[o.modo];
    return `<div class="stat-l">Pedido ${esc(M.corto)} (${o.dias} días)</div><div class="stat-v">${res.faltaTope ? '—' : res.usd ? esc(U.fmtUSD(res.usd)) : res.unidades ? esc(U.plural(res.unidades, 'unidad', 'unidades')) : 'Nada'}</div><div class="stat-s">${res.faltaTope ? 'cargá cuánto querés gastar' : res.unidades ? `${esc(U.plural(res.unidades, 'unidad', 'unidades'))} · armalo abajo ↓` : 'no hace falta pedir · armalo abajo ↓'}</div>`;
  };
  R_.pedidoCard = (R, st, res) => {
    const o = res.opciones;
    const dolar = res.dolar;
    const boton = (k) => {
      const M = RV.pedido.MODOS[k], rm = res.resumenModos[k];
      const sub = k === 'tope' ? 'vos ponés el máximo' : rm.usd ? U.fmtUSD(rm.usd) : rm.unidades ? U.plural(rm.unidades, 'unidad', 'unidades') : 'nada';
      return `<button type="button" data-action="ped-modo" data-k="${k}" id="ped-m-${k}" aria-pressed="${o.modo === k}"><b>${esc(M.nombre)}</b><span class="ped-m-sub">${esc(sub)}</span></button>`;
    };
    return `<div class="card ped" id="pedido">
      <div class="card-h"><div><h3>Armá el pedido</h3><div class="sub">La venta mensual de cada producto sale de un balance entre la de la planilla («Consulta stock») y la de este reporte. Elegí cómo lo querés armar.</div></div></div>
      <div class="segc ped-modos" role="group" aria-label="Tipo de pedido">${RV.pedido.ORDEN_MODOS.map(boton).join('')}</div>
      <p class="ped-desc" id="ped-desc">${esc(RV.pedido.descripcion(o, res.diasMin))}</p>
      <div class="ped-fields">
        <label class="ped-f ped-peso"><span>Venta mensual a usar</span>
          <span class="ped-range"><span class="small muted">Reporte</span><input type="range" id="ped-peso" min="0" max="100" step="10" value="${Math.round(o.peso * 100)}" aria-describedby="ped-peso-txt"><span class="small muted">Planilla</span></span>
          <span class="small" id="ped-peso-txt">${esc(RV.pedido.pesoTxt(o.peso))}</span></label>
        <label class="ped-f ped-dias"><span>Días a cubrir</span><input class="field" type="number" id="ped-dias" inputmode="numeric" min="7" max="180" step="1" value="${o.dias}"></label>
        <label class="ped-f ped-tope" ${o.modo === 'tope' ? '' : 'hidden'}><span>Máximo a gastar</span>
          <span class="ped-tope-in"><input class="field" type="number" id="ped-tope" inputmode="decimal" min="0" step="10" placeholder="${o.moneda === 'ARS' ? 'en pesos' : 'en dólares'}" value="${o.tope != null ? o.tope : ''}">
          <select class="field" id="ped-moneda" aria-label="Moneda del tope"><option value="USD" ${o.moneda === 'USD' ? 'selected' : ''}>US$</option>${dolar ? `<option value="ARS" ${o.moneda === 'ARS' ? 'selected' : ''}>$ (pesos)</option>` : ''}</select></span></label>
      </div>
      <div id="ped-res" aria-live="polite">${R_.pedidoRes(R, res)}</div>
    </div>`;
  };
  R_.pedidoRes = (R, res) => {
    const o = res.opciones;
    if (res.faltaTope) return `<div class="ok-box ped-vacio">${icon('i-info')}Cargá arriba cuánto querés gastar como máximo y la página arma el mejor pedido posible con esa plata.${!res.dolar && o.moneda === 'ARS' ? ' (Sin dólar en la planilla, el tope va en US$.)' : ''}</div>`;
    const cobTxt = c => c == null ? '—' : c > 365 ? '+1 año' : U.fmtDec(c, 0) + ' d';
    const ventaTxt = l => l.fuente === 'balance' ? `planilla ${U.fmtDec(l.mesPlanilla, 0)} · reporte ${U.fmtDec(l.mesReporte, 0)}` : l.fuente === 'planilla' ? 'solo planilla' : l.fuente === 'reporte' ? 'solo reporte' : 'sin ventas';
    const fila = (l) => `<tr class="${l.qty ? '' : 'is-dim'}">
        <td class="t-name"><div class="t-name-main">${esc(l.nombre)}</div>${(() => {
          const n = [l.nota, l.faltaOptimo ? (l.qty ? `faltan ${U.plural(l.faltaOptimo, 'unidad', 'unidades')} para el óptimo` : `no entró en el tope (el óptimo pedía ${U.plural(l.faltaOptimo, 'unidad', 'unidades')})`) : ''].filter(Boolean);
          return n.length ? `<div class="small muted">${esc(n.join(' · '))}</div>` : ''; })()}</td>
        <td class="hide-sm">${l.stock != null ? U.fmtInt(l.stock) : '—'}</td>
        <td class="hide-sm">${U.fmtDec(l.mes, 1)}<div class="small muted">${esc(ventaTxt(l))}</div></td>
        <td class="hide-md">${cobTxt(l.cobertura)}</td>
        <td class="ped-q">${l.qty ? U.fmtInt(l.qty) : '—'}</td>
        <td>${l.costoUSD ? U.fmtUSD(l.costoUSD) : l.qty ? '<span class="small muted">sin costo</span>' : '—'}</td>
        <td class="hide-sm">${l.qty ? cobTxt(l.coberturaDespues) : '—'}</td>
        ${res.hayPlanilla ? `<td class="hide-md ped-pl">${l.planilla ? U.fmtInt(l.planilla) : '—'}</td>` : ''}
      </tr>`;
    const tabla = (lineas) => `<div class="tbl-wrap"><table class="tbl ped-tbl"><thead><tr><th>Producto</th><th class="hide-sm">Stock</th><th class="hide-sm">Venta por mes</th><th class="hide-md">Cubre hoy</th><th>Pedir</th><th>Costo</th><th class="hide-sm">Cubre después</th>${res.hayPlanilla ? '<th class="hide-md ped-pl" title="«Cantidad a Comprar» de la pestaña Consulta stock">En la planilla</th>' : ''}</tr></thead><tbody>${lineas.map(fila).join('')}</tbody></table></div>`;
    const msgs = [];
    if (o.modo === 'tope') {
      msgs.push(`Tope <b>${U.fmtUSD(res.topeUSD)}</b>${o.moneda === 'ARS' ? ` (${$(o.tope)})` : ''}: usás <b>${U.fmtUSD(res.usd)}</b> y sobran ${U.fmtUSD(res.sobrante || 0)}.`);
      const rm = res.resumenModos, faltan = `Para el óptimo harían falta ${U.fmtUSD(rm.optimo.usd)} y para el completo ${U.fmtUSD(rm.completo.usd)}.`;
      msgs.push({
        nada: `<span class="err-txt">No alcanza ni para lo urgente: faltan unos ${U.fmtUSD(res.falto || 0)}.</span> ${faltan}`,
        urgente: `Alcanza para lo urgente (lo que se queda sin stock en menos de ${U.fmtDec(res.diasUrg, 1)} días), pero no para el mínimo de todos. ${faltan}`,
        minimo: `Alcanza para el mínimo de todos (${res.diasMin} días), pero no para el óptimo. ${faltan}`,
        optimo: `Alcanza para el óptimo, pero no para el completo (${U.fmtUSD(rm.completo.usd)}).`,
        todo: `Alcanza para el pedido completo de ${o.dias} días.`,
      }[res.alcanza] || '');
    }
    if (res.cortos.length && res.conPedido.length) msgs.push(`${U.plural(res.cortos.length, 'producto queda', 'productos quedan')} con menos de ${res.diasMin} días después del pedido.`);
    if (res.sinCosto.length) msgs.push(`${U.plural(res.sinCosto.length, 'producto no tiene', 'productos no tienen')} costo en dólares (precio PY en la planilla) y no ${o.modo === 'tope' ? 'entran en el tope' : 'suman en el total'}: ${esc(res.sinCosto.map(l => l.nombre).join(', '))}.`);
    if (res.sinDato.length) msgs.push(`No figuran en la hoja de stock: ${esc(res.sinDato.map(l => l.nombre).join(', '))}.`);
    if (res.cuentasFuera.length) msgs.push(`La venta del reporte sale solo de ${esc(R.cuentas.map(c => c.cuenta).join(' + '))}; no incluye ${esc(RV.app.listaY(res.cuentasFuera))}.`);
    const resumen = `<div class="ped-sum">
        <div><span class="small muted">Unidades</span><b>${U.fmtInt(res.unidades)}</b></div>
        <div><span class="small muted">Inversión</span><b>${res.usd ? U.fmtUSD(res.usd) : '—'}</b>${res.ars ? `<span class="small muted">≈ ${$(res.ars)}</span>` : ''}</div>
        <div><span class="small muted">Productos</span><b>${U.fmtInt(res.conPedido.length)}</b></div>
        <div class="ped-acc"><button class="btn btn-sm" type="button" data-action="pedido" ${res.conPedido.length ? '' : 'disabled'}>${icon('i-share')}Copiar para WhatsApp</button></div>
      </div>`;
    const resto = res.sinPedido.filter(l => l.mes > 0 || l.stock > 0);
    const lineas = res.conPedido.concat(res.afuera);
    return `${resumen}
      ${msgs.length ? `<ul class="ped-msgs">${msgs.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
      ${lineas.length ? tabla(lineas) : `<div class="ok-box">${icon('i-check')}Con estas opciones no hace falta pedir nada: todo llega a los días pedidos.</div>`}
      ${resto.length ? `<details class="ped-mas"><summary>${U.plural(resto.length, 'producto que no hace falta pedir', 'productos que no hace falta pedir')}</summary>${tabla(resto)}</details>` : ''}
      <p class="small muted ped-pie">Costo = precio en Paraguay + ${U.fmtPct(C.RECARGO_SERGIO_PY, 0)} de Sergio PY${res.dolar ? `, en pesos al dólar de la planilla (${$(res.dolar)})` : ''}. Venta por mes usada = ${esc(RV.pedido.pesoTxt(o.peso))}; con eso se calculan los días que cubre cada producto, por eso pueden diferir un poco de la tabla de arriba (que usa solo el reporte). Lo que viene en camino ya cuenta como stock.${res.hayPlanilla ? ' «En la planilla» es la «Cantidad a Comprar» de Consulta stock, para comparar.' : ''}</p>`;
  };

  // ---------- Envíos ----------
  R_.envios = (R) => {
    const E = R.envios;
    const tot = E.flex.ventas + E.correo.ventas || 1;
    const nEnv = E.flex.envios || E.flex.ventas; // los que viajaron juntos pagan un solo flex
    const flexNeto = nEnv ? (E.flex.costo - E.flex.bonif) / nEnv : null;
    const stats = [
      { l: 'Envíos por flex', v: U.fmtInt(nEnv), s: `${pct(E.flex.ventas / tot, 0)} de las ventas${E.flex.compartidos ? ` · ${U.plural(E.flex.compartidos, 'venta viajó', 'ventas viajaron')} con otra` : ''}` },
      { l: 'Costo flex por envío', v: flexNeto != null ? $(flexNeto) : '—', s: nEnv ? `${$(E.flex.prom)} menos ${$(E.flex.bonif / nEnv)} de bonificación` : '' },
      { l: 'Envíos por correo (Meli)', v: U.fmtInt(E.correo.ventas), s: E.correo.prom != null ? `${$(E.correo.prom)} promedio que cobra Meli` : '' },
      { l: 'Tiempo de entrega (mediana)', v: E.flex.horasMediana != null ? `${U.fmtDec(E.flex.horasMediana, 0)} h flex` : '—', s: E.correo.horasMediana != null ? `${U.fmtDec(E.correo.horasMediana, 0)} h por correo` : '' },
    ];
    const prov = E.porProvincia.slice(0, 10);
    return `<section class="section wrap" id="envios" aria-labelledby="h-env">
      <div class="section-h"><div><h2 id="h-env">Envíos</h2><p>Flex lo pagás aparte (por zona); el correo te lo descuenta Meli en la venta.</p></div></div>
      <div class="stats" style="margin-bottom:16px">${stats.map(t => `<div class="stat"><div class="stat-l">${esc(t.l)}</div><div class="stat-v">${esc(t.v)}</div><div class="stat-s">${esc(t.s)}</div></div>`).join('')}</div>
      <div class="grid g-12">
        <div class="card span-6"><div class="card-h"><div><h3>A dónde vendiste</h3><div class="sub">Ventas por provincia</div></div></div>
          ${CH.hbars(prov.map(p => ({ label: p.provincia, value: p.ventas, valueLabel: U.plural(p.ventas, 'venta', 'ventas'), sub: $c(p.facturacion) })))}</div>
        <div class="card span-6"><div class="card-h"><div><h3>Flex por zona</h3><div class="sub">Tarifario por código postal de la página${R.model.tarifaAgregados && R.model.tarifaAgregados.length ? ` + ${U.plural(R.model.tarifaAgregados.length, 'CP', 'CP')} de «CPs a AGREGAR»` : ''}</div></div></div>
          ${E.porZona.length ? CH.hbars(E.porZona.map(z => ({ label: z.zona, value: z.envios, valueLabel: `${U.plural(z.envios, 'envío', 'envíos')} · ${$c(z.costo)}`, title: `${z.zona}: ${U.plural(z.envios, 'envío', 'envíos')} (${U.plural(z.ventas, 'venta', 'ventas')}) · ${$(z.costo)}` }))) : '<p class="muted">No hubo envíos por flex.</p>'}
          <div style="margin-top:16px">${CH.segbar([{ label: 'Flex', value: E.flex.ventas, color: 'var(--series-1)' }, { label: 'Correo', value: E.correo.ventas, color: 'var(--series-2)' }], { aria: 'Flex contra correo' })}
          <div class="chart-legend"><span><i class="k-bar"></i>Flex ${pct(E.flex.ventas / tot, 0)}</span><span><i class="k-bar" style="background:var(--series-2)"></i>Correo ${pct(E.correo.ventas / tot, 0)}</span></div></div>
          ${E.sinTarifaCPs.length ? `<p class="small" style="margin-top:12px;color:var(--warn-ink)">${icon('i-alert')} CP de flex sin tarifa (se usó el promedio): ${E.sinTarifaCPs.map(esc).join(', ')}</p>` : `<p class="small muted" style="margin-top:12px">${icon('i-check')} Todos los envíos flex tienen su tarifa por código postal.</p>`}
        </div>
      </div>
    </section>`;
  };

  // ---------- Cobros ----------
  R_.cobros = (R) => {
    const Cb = R.cobros;
    const head = `<div class="section-h"><div><h2 id="h-cob">Cobros en Mercado Pago</h2><p>${Cb ? `Foto del reporte de Mercado Pago${Cb.generado ? ' al ' + esc(U.fmtDateTime(Cb.generado)) : ''}: qué ya se liberó, qué falta y de quién es.` : 'Qué plata ya está liberada y cuál falta.'}</p></div></div>`;
    if (!Cb) return `<section class="section wrap" id="cobros" aria-labelledby="h-cob">${head}<div class="empty"><h3>Sumá el reporte de Mercado Pago</h3><p>Soltá el <span class="mono">settlement_v2-…xlsx</span> del mismo período junto con las ventas y vas a ver lo liberado, lo que falta (con fechas), los cupones que pagaste, las retenciones de IIBB por provincia y cómo te pagan los compradores.</p></div></section>`;
    const venc = U.sum(Cb.vencidas, x => x.monto);
    const stats = [
      { l: 'Ya liberado', v: $(Cb.liberado.total), s: `de ventas de este período` },
      { l: 'Por liberar', v: $(Cb.pendiente.total), s: `${U.plural(Cb.calendarioLista.length, 'fecha', 'fechas')} de liberación` },
      { l: 'Vencido sin liberar', v: $(venc), s: Cb.vencidas.length ? U.plural(Cb.vencidas.length, 'venta', 'ventas') : 'nada trabado', cls: venc ? 'is-warn' : '' },
      { l: 'Bonificación flex', v: $(Cb.cashbackFlex.liberado + Cb.cashbackFlex.pendiente), s: Cb.cashbackFlex.pendiente ? `${$(Cb.cashbackFlex.pendiente)} todavía por liberar` : 'todo liberado' },
    ];
    const maxCal = Math.max(1, ...Cb.calendarioLista.map(e => e.monto));
    const cal = Cb.calendarioLista.map(e => `<div class="cal-day ${e.vencida ? 'is-late' : ''}" tabindex="0" data-tip="${esc(U.fmtDateLong(e.fecha))}: ${esc($(e.monto))} de ${e.ventas} ${e.ventas === 1 ? 'venta' : 'ventas'}${e.vencida ? ' (fecha vencida)' : ''}">
      <div class="cal-v">${esc($c(e.monto))}</div><div class="cal-bar" style="height:${Math.max(4, e.monto / maxCal * 90).toFixed(0)}px"></div><div class="cal-d">${e.vencida ? '⚠ ' : ''}${esc(U.fmtWeekday(e.fecha))} ${esc(U.fmtDate(e.fecha))}</div></div>`).join('');
    const quien = (b) => [[R.perfil.nombre + ' (vos)', b.mio], ...Object.entries(b.terceros).map(([d, v]) => [RV.engine.perfilDe(d).nombre, v])];
    return `<section class="section wrap" id="cobros" aria-labelledby="h-cob">${head}
      <div class="stats" style="margin-bottom:16px">${stats.map(t => `<div class="stat ${t.cls || ''}"><div class="stat-l">${esc(t.l)}</div><div class="stat-v">${esc(t.v)}</div><div class="stat-s">${esc(t.s)}</div></div>`).join('')}</div>
      <div class="grid g-12">
        <div class="card span-8"><div class="card-h"><div><h3>Calendario de liberaciones</h3><div class="sub">Plata de ventas de este período que todavía no está disponible${Cb.vencidas.length ? '. En amarillo: la fecha ya pasó y sigue sin liquidar.' : ''}</div></div></div>
          ${cal ? `<div class="cal">${cal}</div>${(() => {
            const fut = Cb.calendarioLista.filter(e => !e.vencida), prox = fut[0], ult = fut[fut.length - 1];
            const dia = e => `${esc(U.fmtWeekday(e.fecha))} ${esc(U.fmtDate(e.fecha))}`;
            return `<div class="cal-foot"><span>Por liberar <b>${$(Cb.pendiente.total)}</b></span>${venc ? `<span>de eso, vencido <b>${$(venc)}</b></span>` : ''}${prox ? `<span>próxima: <b>${dia(prox)}</b> · ${$c(prox.monto)}</span>` : ''}${ult && ult !== prox ? `<span>última: <b>${dia(ult)}</b></span>` : ''}</div>`;
          })()}` : `<div class="ok-box">${icon('i-check')}No queda nada por liberar.</div>`}</div>
        <div class="card span-4"><div class="card-h"><div><h3>De quién es la plata</h3><div class="sub">Neto de Meli, antes del flex</div></div></div>
          <div class="rows">
            <div><span class="ink2 small" style="font-weight:700">Liberado</span><span></span></div>
            ${quien(Cb.liberado).map(([n, v]) => `<div><span>${esc(n)}</span><span class="r-v">${$(v)}</span></div>`).join('')}
            <div><span class="ink2 small" style="font-weight:700">Por liberar</span><span></span></div>
            ${quien(Cb.pendiente).map(([n, v]) => `<div><span>${esc(n)}</span><span class="r-v">${$(v)}</span></div>`).join('')}
            <div><span>Flex de este período (se paga aparte)</span><span class="r-v" style="color:var(--crit-ink)">${U.fmtMoneySigned(-R.kpis.flexTodas)}</span></div>
          </div></div>
        <div class="card span-4"><div class="card-h"><div><h3>Cómo te pagan</h3><div class="sub">Medio de pago de los compradores</div></div></div>
          ${CH.hbars(Cb.mediosLista.slice(0, 6).map(m => ({ label: String(m.medio).replace(/^tarjeta de (d[ée]bito|cr[ée]dito)\s*/i, (x, t) => U.capitalize(t.toLowerCase()) + ' ').trim(), title: m.medio, value: m.n, valueLabel: String(m.n) })))}</div>
        <div class="card span-4"><div class="card-h"><div><h3>En cuántas cuotas</h3><div class="sub">Las cuotas las financia Meli; vos cobrás igual</div></div></div>
          ${CH.hbars(Cb.cuotasLista.map(c => ({ label: c.cuotas === 1 ? 'En un pago' : `${c.cuotas} cuotas`, value: c.n, valueLabel: String(c.n) })))}</div>
        <div class="card span-4"><div class="card-h"><div><h3>Retenciones de IIBB</h3><div class="sub">Por provincia, de todas las ventas cobradas (también las de terceros) · total ${$(Math.abs(U.sum(Cb.iibbLista, x => x.monto)))}</div></div></div>
          ${Cb.iibbLista.length ? CH.hbars(Cb.iibbLista.slice(0, 8).map(x => ({ label: x.provincia, value: Math.abs(x.monto), valueLabel: $(Math.abs(x.monto)), tone: 'muted' }))) : '<p class="muted">Sin retenciones.</p>'}</div>
        ${Cb.otrosLista.length ? `<div class="card span-12"><div class="card-h"><div><h3>Otros movimientos de la cuenta</h3><div class="sub">Lo que no son ventas de Meli: retiros, transferencias y pagos. Solo totales.</div></div></div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tipo</th><th>Movimientos</th><th class="hide-sm">Entró</th><th class="hide-sm">Salió</th><th>Neto</th></tr></thead><tbody>
          ${Cb.otrosLista.map(o => `<tr><td>${esc(o.nombre)}</td><td>${U.fmtInt(o.n)}</td><td class="hide-sm">${o.entra ? $(o.entra) : '—'}</td><td class="hide-sm">${o.sale ? $(o.sale) : '—'}</td><td>${$(o.neto)}</td></tr>`).join('')}
          ${Cb.cashbackOtros ? `<tr><td>Bonificaciones de Meli (no flex)</td><td>—</td><td class="hide-sm">${$(Cb.cashbackOtros)}</td><td class="hide-sm">—</td><td>${$(Cb.cashbackOtros)}</td></tr>` : ''}
          </tbody></table></div></div>` : ''}
      </div>
    </section>`;
  };

  // ---------- Terceros, gastos y devoluciones ----------
  R_.tercerosGastos = (R, st) => {
    const g = R.gastos;
    const terc = R.terceros.length ? R.terceros.map(t => `<div style="margin-bottom:16px">
        <div class="person">${R_.avatar(t.dueño, t.nombre)}<div><div style="font-weight:700">${esc(t.nombre)}</div><div class="small muted">${U.plural(t.unidades, 'unidad', 'unidades')} · facturado ${$(t.facturacion)}</div></div><span style="flex:1"></span><div style="text-align:right"><div class="small muted">a transferir</div><div class="person-big">${$(t.transferir)}</div></div></div>
        <div class="rows" style="margin-top:8px">${t.productos.map(p => `<div><span>${esc(p.nombre)} <span class="small muted">· ${U.plural(p.unidades, 'u', 'u')}</span></span><span class="r-v">${$(p.transferir)}</span></div>`).join('')}</div>
      </div>`).join('') : `<div class="ok-box">${icon('i-check')}No vendiste productos de otros en tus cuentas.</div>`;
    const gas = g ? `<div class="rows">
        ${g.items.map(i => `<div><span>${esc(i.categoria)}</span><span class="r-v">${$(i.monto)}</span></div>`).join('')}
        <div><span class="r-total">Total</span><span class="r-v r-total">${$(g.total)}</span></div></div>
        <p class="small muted" style="margin-top:10px">${g.meses.map(m => `${U.capitalize(m.nombre)}: ${m.estimado ? 'sin datos cargados, se usó el promedio de los meses con datos' : (m.proporcion < 0.999 ? `${m.diasCubiertos} de ${m.diasEnMes} días (${pct(m.proporcion, 0)})` : 'mes completo')}`).map(esc).join(' · ')}</p>
        ${R.periodo.parcial ? `<div class="segc" role="group" aria-label="Gastos grupales" style="margin-top:10px"><button type="button" data-action="gastos" data-modo="proporcional" aria-pressed="${R.opciones.gastosModo !== 'completo'}">Proporcional</button><button type="button" data-action="gastos" data-modo="completo" aria-pressed="${R.opciones.gastosModo === 'completo'}">Mes completo</button></div>` : ''}`
      : `<p class="muted">No hay gastos grupales cargados para ${esc(R.perfil.nombre)}${R.perfil.cuentas.length > 1 ? ' en las columnas de las cuentas de este reporte' : ' en la planilla'}.</p>`;
    // Qué columnas (C1, C2…) entraron y cuáles no, según las cuentas marcadas
    const cols = R.perfil.cuentas.map((c, i) => ({ c, col: 'C' + (i + 1), dentro: R.cuentas.some(k => k.cuenta === c) }));
    const colsGastos = R.perfil.cuentas.length > 1 ? `<p class="small muted" style="margin-top:10px">Entran: ${cols.filter(x => x.dentro).map(x => `${esc(x.c)} (${x.col})`).join(' · ') || '—'}${cols.some(x => !x.dentro) ? `. Quedan afuera: ${cols.filter(x => !x.dentro).map(x => `${esc(x.c)} (${x.col})`).join(' · ')}` : ''}.</p>` : '';
    const dev = R.devoluciones;
    const pillDev = v => v.tipoEstado === 'cancelada' ? '<span class="pill neu"><i>–</i>Cancelada</span>' : v.tipoEstado === 'devolucion_curso' ? '<span class="pill warn"><i>!</i>Devolución en curso</span>' : '<span class="pill crit"><i>↩</i>Devolución</span>';
    const devRows = dev.lista.map(v => {
      const ajena = !v.esMia && v.dueño; // producto de otro: no toca tu ganancia
      return `<tr><td>${esc(U.fmtDate(v.fecha))}</td><td class="t-name l"><div class="t-name-main">${esc(v.productoNombre || v.titulo)}${ajena ? ` <span class="tag">de ${esc(RV.engine.perfilDe(v.dueño).nombre)}</span>` : ''}${R.cuentas.length > 1 ? ` <span class="tag">${esc(v.cuenta)}</span>` : ''}</div><div class="small muted">${esc(v.estadoDesc || '')}</div><div class="only-sm">${pillDev(v)}</div></td><td class="l hide-sm">${pillDev(v)}</td><td class="hide-sm">${$(v.total)}</td><td class="hide-tab">${v.flex ? U.fmtMoneySigned(-v.flex) : '—'}</td><td>${ajena ? '<span class="muted">no es tuyo</span>' : v.tipoEstado === 'devolucion_curso' ? `<span class="muted">en suspenso</span>` : U.fmtMoneySigned(v.total - v.flex)}</td></tr>`;
    }).join('');
    return `<section class="section wrap" id="terceros" aria-labelledby="h-ter">
      <div class="section-h"><div><h2 id="h-ter">Terceros, gastos y devoluciones</h2><p>Lo que no es tuyo, lo que se paga entre todos y lo que volvió.</p></div></div>
      <div class="grid g-12">
        <div class="card span-6"><div class="card-h"><div><h3>Plata de otros vendedores</h3><div class="sub">Productos de otros que se vendieron en tus cuentas, ya descontado Meli y flex</div></div></div>${terc}</div>
        <div class="card span-6"><div class="card-h"><div><h3>Gastos grupales${g && g.esPromedio ? ' (estimado)' : ''}</h3><div class="sub">De la pestaña GASTOS GRUPALES, solo las columnas de las cuentas de este reporte</div></div></div>${gas}${colsGastos}</div>
        <div class="card span-12"><div class="card-h"><div><h3>Devoluciones y cancelaciones</h3><div class="sub">Impacto en tu ganancia: ${U.fmtMoneySigned(dev.impacto)}${dev.enSuspenso ? ` · ${$(dev.enSuspenso)} en suspenso por devoluciones en curso (no se suman)` : ''}</div></div></div>
          ${dev.lista.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th class="l">Producto</th><th class="l hide-sm">Estado</th><th class="hide-sm">Meli te dejó</th><th class="hide-tab">Flex</th><th>Impacto</th></tr></thead><tbody>${devRows}</tbody></table></div>` : `<div class="ok-box">${icon('i-check')}Sin devoluciones ni cancelaciones.</div>`}
          ${dev.devueltasCobradas.length ? `<p class="small muted" style="margin-top:10px">${U.plural(dev.devueltasCobradas.length, 'venta figura', 'ventas figuran')} como devuelta pero cobrada (Meli te pagó igual): se cuentan como venta normal.</p>` : ''}
        </div>
      </div>
    </section>`;
  };

  // ---------- Alertas ----------
  R_.alertas = (R) => {
    const A = R.alertas;
    const ic = { critico: '!', atencion: '!', info: 'i' };
    const item = it => `<li><span>${esc(it.titulo)}</span>${it.extra ? `<span class="muted">${esc(it.extra)}</span>` : ''}${it.sugerido ? `<span class="sug">¿es «${esc(it.sugerido)}»?</span>` : ''}${it.ventas ? `<span class="muted">${U.plural(it.ventas, 'venta', 'ventas')} · ${$(it.facturacion)}</span>` : ''}</li>`;
    return `<section class="section wrap" id="alertas" aria-labelledby="h-al">
      <div class="section-h"><div><h2 id="h-al">Alertas y datos a revisar</h2><p>Lo que conviene corregir en la planilla o mirar en Meli / Mercado Pago.</p></div></div>
      ${A.length ? `<div class="alerts">${A.map(a => `<div class="alert ${a.nivel}"><span class="alert-ic">${ic[a.nivel]}</span><div><div class="alert-t">${esc(a.titulo)}</div>${a.detalle ? `<div class="alert-d">${esc(a.detalle)}</div>` : ''}
        ${a.items && a.items.length ? (a.items.length > 6 ? `<details><summary>Ver ${a.items.length}</summary><ul class="alert-items">${a.items.map(item).join('')}</ul></details>` : `<ul class="alert-items">${a.items.map(item).join('')}</ul>`) : ''}</div></div>`).join('')}</div>`
        : `<div class="ok-box">${icon('i-check')}Todo en orden: no hay nada para revisar.</div>`}
    </section>`;
  };

  // ---------- Cómo se calcula ----------
  R_.metodo = (R) => `<section class="section wrap" id="metodo" aria-labelledby="h-met">
    <div class="section-h"><div><h2 id="h-met">Cómo se calcula</h2><p>Para que cualquiera pueda chequear los números contra los Excel.</p></div></div>
    <div class="card method">
      <p><b>De dónde salen los datos</b>: las ventas, de los Excel de Meli y Mercado Pago que soltás (se procesan en tu navegador, no se suben a ningún lado). Costos, dueños, gastos y stock, de ANALISIS DE PRODUCTOS, que la página <b>solo lee</b>: en Claude por Google Drive, en la web por la conexión en vivo o subiendo el .xlsx; la última lectura queda guardada en este navegador. El tarifario de flex es propio de la página.</p>
      <p><b>Período</b>: de la primera a la última venta de los archivos. Si bajaste el mes entero pero los últimos días no hubo ventas, el período termina en la última venta (para los gastos grupales podés elegir «Mes completo»).</p>
      <p><b>Facturación</b>: «Ingresos por productos» del Excel de Meli, sin canceladas ni devoluciones (palabras: cancelad, devoluc, devuelto, devolveremos).</p>
      <p><b>Te deposita Meli</b>: la columna «Total (ARS)», que ya descuenta comisión, envío por correo, impuestos retenidos, cupones y suma la bonificación de flex.</p>
      <p><b>Cupones</b>: Meli los descuenta del total pero no los muestra en una columna; salen de la diferencia. Con el reporte de Mercado Pago se confirman venta por venta («CUPÓN DE DESCUENTO»).</p>
      <p><b>Flex</b>: solo a las ventas con forma de entrega «Mercado Envíos Flex» que salieron a reparto, según el código postal en el tarifario de la página, más los CP que se carguen en la pestaña «CPs a AGREGAR» de ANALISIS (antes del 14/8/2026 con la tarifa vieja). Se paga una vez por envío: si dos ventas viajaron juntas (mismo número de seguimiento), el flex se cobra una sola vez. Si el CP no está, se usa el promedio del tarifario y se avisa.</p>
      <p><b>Paquetes</b>: si Meli trae una fila «Paquete de N productos» con el detalle abajo, cuenta cada producto (con la plata repartida si hace falta); si no trae el detalle, la venta entra en la plata pero no en ningún producto, y se avisa.</p>
      <p><b>Costo</b>: el último pedido de PEDIDOS anterior o igual a la fecha de cada venta; si no hay, «COSTO PESOS TOTAL» de TITULARES.</p>

        const tables = P.workbookToTables(wb);
        const det = P.detect(tables, file.name);
        f.kind = det.kind;
        if (det.kind === 'ml') f.parsed = P.mlVentas(tables[Object.keys(tables)[0]], file.name);
        else if (det.kind === 'mp') f.parsed = P.mpMovimientos(tables[Object.keys(tables)[0]], file.name);
        else if (['analisis', 'auxiliar', 'logistica'].includes(det.kind)) f.tables = tables;
        else throw new Error('no parece un reporte de Meli, de Mercado Pago ni la planilla');
        if (det.kind === 'ml' || det.kind === 'mp') {
          f.sellerId = det.sellerId || (f.parsed && f.parsed.sellerId) || null;
          const reg = registro();
          f.cuenta = (f.sellerId && reg[f.sellerId]) || null;
          if (!f.cuenta) { // misma cuenta que otro archivo ya cargado
            const par = st.files.find(o => o !== f && o.sellerId && o.sellerId === f.sellerId && o.cuenta);
            if (par) f.cuenta = par.cuenta;
          }
          if (!f.cuenta && st.cuentaDestino) { // se eligió el archivo tocando la tarjeta de esa cuenta
            f.cuenta = st.cuentaDestino;
            if (f.sellerId) { const r = U.store.get(K.cuentas, {}); r[f.sellerId] = f.cuenta; U.store.set(K.cuentas, r); }
          }
          if (!f.cuenta && st.perfil) {
            const usadas = st.files.filter(o => o !== f && o.kind === 'ml').map(o => o.cuenta);
            const perfil = RV.engine.perfilDe(st.perfil);
            if (perfil.cuentas.length === 1 && det.kind === 'ml' && !usadas.includes(perfil.cuentas[0])) f.cuenta = perfil.cuentas[0];
          }
        }
        if (f.kind === 'ml' && f.cuenta) st.excluidas.delete(f.cuenta); // si la cargaste, va al reporte
        // si ya había un archivo de la misma clase y cuenta con el mismo nombre, reemplazar
        const dup = st.files.find(o => o !== f && o.name === f.name);
        if (dup) st.files.splice(st.files.indexOf(dup), 1);
      } catch (e) { f.error = e.message || String(e); }
      f.loading = false;
      renderLoader();
    }
    st.cuentaDestino = null;
    if (st.files.some(f => (f.kind === 'analisis' || f.kind === 'auxiliar' || f.kind === 'logistica') && !f.error)) usarPlanillaSubida();
    if (pendientes().length) { renderLoader(); return; } // primero hay que decir de qué cuenta es cada archivo
    if (st.report && !st.demo) regenerar(); else app.generar(true);
  };

  app.quitar = (id) => {
    const f = st.files.find(x => x.id === id); if (!f) return;
    st.files.splice(st.files.indexOf(f), 1);
    if (['analisis', 'auxiliar', 'logistica'].includes(f.kind)) app.cargarPlanilla();
    if (st.report && !st.demo && (f.kind === 'ml' || f.kind === 'mp') && armarCuentas().cuentas.length) regenerar();
    else renderLoader();
  };

  app.setCuenta = (id, cuenta) => {
    const f = st.files.find(x => x.id === id); if (!f) return;
    f.cuenta = cuenta || null;
    if (f.kind === 'ml' && cuenta) { st.excluidas.delete(cuenta); st.sumadas.add(cuenta); } // elegida a mano: entra
    if (f.sellerId && cuenta) {
      const reg = U.store.get(K.cuentas, {}); reg[f.sellerId] = cuenta; U.store.set(K.cuentas, reg);
      for (const o of st.files) if (o !== f && o.sellerId === f.sellerId) o.cuenta = cuenta; // el de MP de la misma cuenta, también
    }
    if (pendientes().length || !cuenta) { renderLoader(); return; }
    if (st.report && !st.demo) regenerar(); else app.generar(true);
  };

  // ============================================================
  //  Cuentas: cuáles tiene el perfil, qué archivos tiene cada una y cuáles entran
  // ============================================================
  const listaY = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1] : (arr[0] || '');
  app.listaY = listaY;
  // Metas mensuales de ganancia neta, por perfil (en este navegador)
  const KM = 'rv2.metas';
  app.metaDe = (perfil) => { const m = U.store.get(KM, {}) || {}; return m[perfil] > 0 ? m[perfil] : null; };
  const guardarMeta = (perfil, valor) => { const m = U.store.get(KM, {}) || {}; if (valor > 0) m[perfil] = valor; else delete m[perfil]; U.store.set(KM, m); };
  const cuentasEstado = () => {
    const perfil = st.perfil ? RV.engine.perfilDe(st.perfil) : null;
    const nombres = perfil ? [...perfil.cuentas] : [];
    for (const f of st.files) if ((f.kind === 'ml' || f.kind === 'mp') && f.cuenta && !f.error && !nombres.includes(f.cuenta)) nombres.push(f.cuenta);
    return nombres.map(cuenta => {
      const ml = st.files.filter(f => f.kind === 'ml' && f.cuenta === cuenta && !f.error && f.parsed);
      const mp = st.files.filter(f => f.kind === 'mp' && f.cuenta === cuenta && !f.error && f.parsed);
      const enPerfil = !!perfil && perfil.cuentas.includes(cuenta);
      const desdes = ml.map(f => f.parsed.desde).filter(Boolean), hastas = ml.map(f => f.parsed.hasta).filter(Boolean);
      return {
        cuenta, enPerfil, col: enPerfil ? 'C' + (perfil.cuentas.indexOf(cuenta) + 1) : null,
        extra: enPerfil && !!(perfil.extra && perfil.extra.includes(cuenta)),
        compartida: enPerfil ? RV.engine.compartidaCon(cuenta, perfil.id) : [],
        ml, mp, ventas: U.sum(ml, f => f.parsed.ventas.length),
        desde: desdes.length ? new Date(Math.min(...desdes)) : null, hasta: hastas.length ? new Date(Math.max(...hastas)) : null,
        tieneVentas: ml.length > 0,
        incluida: ml.length > 0 && (enPerfil ? !st.excluidas.has(cuenta) : st.sumadas.has(cuenta)),
      };
    });
  };
  app.cuentasEstado = cuentasEstado;
  // Archivos de Meli / MP que todavía no tienen cuenta asignada
  const pendientes = () => st.files.filter(f => (f.kind === 'ml' || f.kind === 'mp') && !f.cuenta && !f.error && f.parsed);
  app.pendientes = pendientes;

  app.toggleCuenta = (cuenta) => {
    const est = cuentasEstado();
    const c = est.find(x => x.cuenta === cuenta);
    if (!c || !c.tieneVentas) { // tarjeta vacía: elegir su archivo
      st.cuentaDestino = cuenta;
      const inp = $id('file-input');
      if (inp && (!st.report || st.demo || st.loaderOpen)) inp.click();
      else { st.loaderOpen = true; renderLoader(); $id('cargar').scrollIntoView({ behavior: 'smooth' }); }
      return;
    }
    if (c.incluida) {
      if (!est.some(x => x.incluida && x.cuenta !== cuenta)) { toast('Tiene que quedar al menos una cuenta en el reporte.'); return; }
      if (c.enPerfil) st.excluidas.add(cuenta); else st.sumadas.delete(cuenta);
    } else if (c.enPerfil) st.excluidas.delete(cuenta); else st.sumadas.add(cuenta);
    if (st.report && !st.demo) regenerar(); else renderLoader();
  };

  app.agregarCuenta = (nombre) => {
    const perfil = st.perfil ? RV.engine.perfilDe(st.perfil) : null;
    if (!perfil) return 'Elegí tu perfil primero.';
    const n = String(nombre || '').replace(/\s+/g, ' ').trim().toUpperCase();
    if (!n) return 'Escribí el nombre de la cuenta.';
    if (n.length > 24) return 'Usá un nombre más corto (hasta 24 letras).';
    if (perfil.cuentas.includes(n)) return `${n} ya es una cuenta de ${perfil.nombre}.`;
    if (perfil.cuentas.length >= C.MAX_CUENTAS) return `Hasta ${C.MAX_CUENTAS} cuentas por perfil.`;
    const ex = C.CUENTAS_EXTRA[perfil.id] || [];
    C.CUENTAS_EXTRA[perfil.id] = ex.concat([n]);
    U.store.set(K.extra, C.CUENTAS_EXTRA);
    st.agregando = false;
    toast(`Cuenta ${n} agregada a ${perfil.nombre}`);
    if (st.report && !st.demo) regenerar(); else renderLoader();
    return null;
  };
  app.borrarCuenta = (cuenta) => {
    const perfil = st.perfil ? RV.engine.perfilDe(st.perfil) : null;
    if (!perfil) return;
    C.CUENTAS_EXTRA[perfil.id] = (C.CUENTAS_EXTRA[perfil.id] || []).filter(c => c !== cuenta);
    if (!C.CUENTAS_EXTRA[perfil.id].length) delete C.CUENTAS_EXTRA[perfil.id];
    U.store.set(K.extra, C.CUENTAS_EXTRA);
    st.excluidas.delete(cuenta);
    if (st.report && !st.demo) regenerar(); else renderLoader();
  };

  // ============================================================
  //  Generar el reporte
  // ============================================================
  const armarCuentas = () => {
    const incluidas = new Set(cuentasEstado().filter(c => c.incluida).map(c => c.cuenta));
    const ml = st.files.filter(f => f.kind === 'ml' && f.cuenta && !f.error && incluidas.has(f.cuenta));
    const mp = st.files.filter(f => f.kind === 'mp' && f.cuenta && !f.error && (incluidas.has(f.cuenta) || !st.files.some(o => o.kind === 'ml' && o.cuenta === f.cuenta && !o.error)));
    const porCuenta = new Map();
    for (const f of ml) {
      const c = porCuenta.get(f.cuenta) || { cuenta: f.cuenta, sellerId: f.sellerId, ventas: [], ids: new Set(), tieneFormaEntrega: true, generado: null, mp: null, avisos: [] };
      for (const v of f.parsed.ventas) if (!c.ids.has(v.id)) { c.ids.add(v.id); c.ventas.push(v); }
      for (const a of f.parsed.avisos || []) if (!c.avisos.some(x => x.id === a.id)) c.avisos.push(a);
      c.tieneFormaEntrega = c.tieneFormaEntrega && f.parsed.tieneFormaEntrega;
      if (!c.generado || (f.parsed.generado && f.parsed.generado > c.generado)) c.generado = f.parsed.generado;
      porCuenta.set(f.cuenta, c);
    }
    const sinVentas = [];
    for (const f of mp) {
      const c = porCuenta.get(f.cuenta);
      if (!c) { sinVentas.push(f.cuenta); continue; }
      if (!c.mp) c.mp = { movs: [], formato: f.parsed.formato, generado: f.parsed.generado, sellerId: f.parsed.sellerId };
      c.mp.movs.push(...f.parsed.movs);
      if (f.parsed.generado && (!c.mp.generado || f.parsed.generado > c.mp.generado)) c.mp.generado = f.parsed.generado;
    }
    return { cuentas: [...porCuenta.values()], sinVentas };
  };

  app.generar = (silencioso) => {
    st.error = null;
    if (!st.perfil) { if (!silencioso) { st.error = 'Elegí tu perfil.'; renderLoader(); } return; }
    const { cuentas, sinVentas } = armarCuentas();
    if (!cuentas.length) {
      if (!silencioso) {
        const sinCuenta = pendientes().some(f => f.kind === 'ml');
        const conVentas = cuentasEstado().some(c => c.tieneVentas);
        st.error = sinCuenta ? 'Elegí de qué cuenta es cada Excel de ventas.' : conVentas ? 'Marcá al menos una cuenta para el reporte.' : 'Falta el Excel de ventas de Meli.';
        renderLoader();
      }
      return;
    }
    if (!st.model) { if (!silencioso) { st.error = st.modelStatus === 'loading' ? 'Esperá a que termine de leer la planilla de costos…' : 'Sin la planilla de costos no se puede calcular la ganancia. ' + (st.modelMsg || ''); renderLoader(); } return; }
    try {
      st.report = construir(cuentas, sinVentas);
      st.demo = false; st.loaderOpen = false;
      U.store.set(K.visto, true);
      renderAll();
      if (!silencioso) document.getElementById('resumen')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      console.error(e);
      st.error = 'No se pudo armar el reporte: ' + (e.message || e);
      renderLoader();
    }
  };
  const construir = (cuentas, sinVentas) => {
    const R = RV.engine.build({ perfil: st.perfil, cuentas, model: st.model, opciones: st.opciones });
    if (sinVentas && sinVentas.length) R.alertas.unshift({ nivel: 'atencion', id: 'mpsinventas', titulo: 'Cobros sin ventas', detalle: `Cargaste el reporte de Mercado Pago de ${listaY(sinVentas)} pero no sus ventas de Meli: no se usó.` });
    try { RV.historial.guardar(R); } catch (e) { /* sin almacenamiento: no pasa nada */ }
    return R;
  };
  const regenerar = () => {
    if (st.report && !st.demo) {
      const { cuentas, sinVentas } = armarCuentas();
      if (!cuentas.length) { st.report = null; renderAll(); return; } // no quedó ninguna cuenta marcada
      if (!st.model) return;
      try { st.report = construir(cuentas, sinVentas); st.error = null; }
      catch (e) { console.error(e); st.error = 'No se pudo armar el reporte: ' + (e.message || e); }
      renderAll();
    } else if (st.files.some(f => f.kind === 'ml')) app.generar(true);
  };
  const reconstruir = () => {
    if (st.demo) { mostrarDemo(); return; }
    regenerar();
  };

  // ============================================================
  //  Demo
  // ============================================================
  const mostrarDemo = () => {
    if (!RV.demo) return;
    const d = RV.demo.build();
    st.report = RV.engine.build({ perfil: d.perfil, cuentas: d.cuentas, model: d.model, opciones: Object.assign({}, st.opciones) });
    st.report.historialDemo = d.historial || null;
    st.demo = true;
    renderAll();
  };

  // ============================================================
  //  Render
  // ============================================================
  const renderChip = () => {
    const chip = $id('sheet-chip'), txt = $id('sheet-chip-txt');
    if (!chip) return;
    chip.className = 'status-chip ' + (st.modelStatus === 'ok' ? (st.model && (st.model.restaurado || st.model.tarifaFuente === 'copia') ? 'is-warn' : 'is-ok') : st.modelStatus === 'loading' ? 'is-loading' : st.modelStatus === 'idle' ? 'is-warn' : 'is-err');
    const corto = st.modelStatus === 'idle' ? 'Planilla sin conectar' : st.modelStatus === 'error' ? 'Planilla: no se pudo leer' : null;
    txt.textContent = st.modelStatus === 'ok' && st.model ? `Planilla: ${RV.render.origenTxt(st.model)} · ${U.relTime(st.model.fetchedAt)}` : (corto || st.modelMsg || 'Planilla');
    chip.title = (st.modelStatus === 'ok' ? txt.textContent : (st.modelMsg || txt.textContent)) + ' · tocá para ver la carga de archivos';
    // La conexión en vivo falló: el chip lo dice y lleva directo a cómo arreglarla
    if (vivoFallo() && st.modelStatus !== 'loading') {
      chip.className = 'status-chip ' + (st.modelStatus === 'ok' ? 'is-warn' : 'is-err');
      txt.textContent = st.modelStatus === 'ok' ? 'Planilla: copia guardada · la conexión en vivo falló' : 'Planilla: la conexión en vivo falló';
      chip.title = st.vivoError.msg + ' · tocá para ver cómo arreglarla';
    }
  };
  const vivoFallo = () => !!(st.vivoError && st.conexion && !IN_CLAUDE);
  app.vivoFallo = vivoFallo;
  const renderLoader = () => {
    const el = $id('cargar'); if (!el) return;
    el.innerHTML = RV.render.loader(st);
    const inp = $id('file-input');
    if (inp) inp.addEventListener('change', ev => { app.agregarArchivos(ev.target.files); ev.target.value = ''; });
  };
  const renderDemoBanner = () => {
    const el = $id('demo-slot');
    el.innerHTML = st.demo ? `<div class="demo-banner" role="note"><b>EJEMPLO</b><span>Datos inventados para mostrar cómo se ve el reporte. Elegí tu perfil y cargá tus Excel arriba para ver el tuyo.</span></div>` : '';
  };
  const renderAll = () => {
    renderLoader(); renderDemoBanner(); renderChip();
    const R = st.report;
    const rep = $id('report');
    if (!R) { rep.innerHTML = ''; $id('secnav').hidden = true; $id('btn-excel').hidden = true; return; }
    rep.innerHTML = RV.render.report(R, st);
    $id('secnav-in').innerHTML = RV.render.secnav(R);
    $id('secnav').hidden = false;
    $id('btn-excel').hidden = false;
    if (!IN_CLAUDE) $id('btn-print').hidden = false;
    montarGraficos(R);
    spy();
  };
  const renderSeccion = (id, html) => {
    const old = $id(id); if (!old) return;
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    old.replaceWith(tmp.firstElementChild);
  };

  const montarGraficos = (R) => {
    const met = st.metrica;
    const fmtAx = met === 'unidades' ? (v => U.fmtInt(v)) : (v => U.fmtMoneyCompact(v));
    const vals = R.diario.map(d => met === 'unidades' ? d.unidades : met === 'ganancia' ? d.ganancia : d.facturacion);
    const avg = vals.map((_, i) => i < 6 ? null : U.sum(vals.slice(i - 6, i + 1)) / 7);
    const elD = $id('ch-diario');
    if (elD) CH.columns(elD, {
      height: 250, aria: 'Ventas por día', fmtAxis: fmtAx, avg,
      data: R.diario.map((d, i) => ({ v: vals[i], xl: d.fecha.getDate() === 1 || i === 0 ? `${d.fecha.getDate()} ${U.MESES_CORTO[d.fecha.getMonth()]}` : String(d.fecha.getDate()), weekend: d.fecha.getDay() === 0 || d.fecha.getDay() === 6, d })),
      tooltip: (x, i) => `<div class="tt-h">${U.esc(U.capitalize(U.DIAS_LARGO[x.d.fecha.getDay()]))} ${U.esc(U.fmtDate(x.d.fecha))}</div>
        ${CH.tipRow(met === 'unidades' ? 'unidades' : met === 'ganancia' ? 'ganancia (tus productos)' : 'facturación', met === 'unidades' ? U.fmtInt(x.v) : U.fmtMoney(x.v), 'var(--series-1)')}
        ${avg[i] != null ? CH.tipRow('promedio 7 días', met === 'unidades' ? U.fmtDec(avg[i], 1) : U.fmtMoney(avg[i]), 'var(--ink-2)') : ''}
        ${CH.tipRow('pedidos', U.fmtInt(x.d.pedidos))}${x.d.cancel ? CH.tipRow('cancelados o devueltos', U.fmtInt(x.d.cancel)) : ''}`,
    });
    const elA = $id('ch-acum');
    if (elA && R.diario.length) {
      const P0 = R.kpis.proyeccion;
      const totalDays = P0 ? P0.diasEnMes - (R.periodo.desde.getDate() - 1) : R.diario.length;
      CH.cumulative(elA, {
        height: 230, aria: 'Facturación acumulada', fmtAxis: v => U.fmtMoneyCompact(v), totalDays,
        points: R.diario.map(d => ({ v: d.acumFact, d })),
        proj: P0 ? { v: P0.facturacion, label: `${U.capitalize(P0.mes)}: ~${U.fmtMoneyCompact(P0.facturacion)}` } : null,
        xLabel: i => String(U.addDays(R.periodo.desde, i).getDate()),
        tooltip: (p) => `<div class="tt-h">Hasta el ${U.esc(U.fmtDate(p.d.fecha))}</div>${CH.tipRow('facturación acumulada', U.fmtMoney(p.v), 'var(--series-1)')}${CH.tipRow('ganancia acumulada (tus productos)', U.fmtMoney(p.d.acumGan))}`,
      });
    }
    const elH = $id('heat');
    if (elH) {
      const bloques = [[0, 6, '0–6'], [6, 9, '6–9'], [9, 12, '9–12'], [12, 15, '12–15'], [15, 18, '15–18'], [18, 21, '18–21'], [21, 24, '21–24']];
      const orden = [1, 2, 3, 4, 5, 6, 0];
      const mat = orden.map(d => bloques.map(([a, b]) => U.sum(R.heat[d].slice(a, b))));
      elH.innerHTML = CH.heatmap(mat, { rows: orden.map(d => U.capitalize(U.DIAS_CORTO[d])), cols: bloques.map(b => b[2]), aria: 'Ventas por día y franja horaria' }) + '<div class="chart-legend"><span>Franjas en horas. Más oscuro = más ventas.</span></div>';
    }
    const elMes = $id('ch-meses');
    if (elMes) {
      const lista = RV.historial.paraReporte(R).slice(-12);
      CH.columns(elMes, {
        height: 190, aria: 'Ganancia neta por día en cada período', fmtAxis: v => U.fmtMoneyCompact(v),
        data: lista.map(e => ({ v: Math.max(0, e.neta / (e.dias || 1)), xl: RV.historial.etiqueta(e), dim: !e.actual, e })),
        tooltip: (x) => `<div class="tt-h">${U.esc(RV.historial.etiqueta(x.e))}${x.e.actual ? ' (este)' : ''}</div>
          ${CH.tipRow('ganancia neta por día', U.fmtMoney(x.e.neta / (x.e.dias || 1)), 'var(--series-1)')}${CH.tipRow('ganancia neta', U.fmtMoney(x.e.neta))}
          ${CH.tipRow('facturación', U.fmtMoney(x.e.facturacion))}${CH.tipRow('margen', U.fmtPct(x.e.margen))}${CH.tipRow('días', U.fmtInt(x.e.dias))}`,
      });
    }
    const elM = $id('ch-matriz');
    if (elM) {
      const op = R.opciones;
      const tono = m => m < op.rojo ? 'crit' : m < op.verde ? 'warn' : 'ok';
      const pts = R.productos.filter(p => p.esMio && p.margen != null).map(p => ({ x: p.unidades, y: p.margen, r: Math.max(0, p.ganancia), label: p.nombre, short: corto(p.nombre), tone: tono(p.margen), p }));
      if (pts.length) CH.scatter(elM, {
        height: 330, points: pts, yRef: R.opciones.objetivo, xRef: U.median(pts.map(p => p.x)) || 1, aria: 'Demanda contra margen por producto',
        tooltip: q => `<div class="tt-h">${U.esc(q.label)}</div>${CH.tipRow('margen', U.fmtPct(q.y))}${CH.tipRow('unidades', U.fmtInt(q.x))}${CH.tipRow('ganancia', U.fmtMoney(q.p.ganancia))}`,
        onClick: q => app.abrirProducto(q.p.key, q.p.dueño),
      });
      else elM.innerHTML = '<p class="muted">Sin productos tuyos con costo.</p>';
    }
  };
  // Nombre corto para etiquetas de gráfico: "Dolce & Gabbana The One For Men EDT 100ML" → "D&G The One"
  const corto = (n) => {
    const orig = String(n || '');
    let s = orig
      .replace(/^perfume\s+/i, '')
      .replace(/\bdolce\s*(&|y|and)\s*gabbana\b/ig, 'D&G')
      .replace(/\bcalvin\s+klein\b/ig, 'CK')
      .replace(/\b(eau\s+de\s+(toilette|parfum|cologne)|edt|edp|edc)\b/ig, ' ')
      .replace(/\b\d+([.,]\d+)?\s*(ml|mls|cc|oz)\b/ig, ' ')
      .replace(/\b(fem|femenino|feminino|femme|mujer|masc|masculino|hombre|unisex|unissex|for\s+(men|women|him|her)|pour\s+(homme|femme))\b/ig, ' ')
      .replace(/\s+/g, ' ').trim();
    s = s.split(' ').filter((w, i, a) => i === 0 || w.toLowerCase() !== a[i - 1].toLowerCase()).join(' ');
    if (!s) s = orig;
    let out = '';
    for (const w of s.split(' ')) { if (out && (out + ' ' + w).length > 24) break; out = out ? out + ' ' + w : w; }
    return out;
  };

  // Navegación activa según scroll

    spyObs = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) {
        links.forEach(a => a.classList.toggle('is-active', a.dataset.sec === e.target.id));
        const act = links.find(a => a.dataset.sec === e.target.id);
        if (act && act.scrollIntoView) { const nav = $id('secnav-in'); nav.scrollTo({ left: act.offsetLeft - 24, behavior: 'smooth' }); }

  // ============================================================

  let pedTipeo = null;

    const desc = $id('ped-desc'); if (desc) desc.textContent = RV.pedido.descripcion(st.pedido, res.diasMin);
